  - id: ministerio-de-energia-y-ambiente
    nombre: "Ministerio de Energía y Ambiente"
    sigla: "MEyA"
    tipo: ministerio
    depende_de: gobernacion
    que_hace: "Diseña y ejecuta la política hidrocarburífera, minera y energética de la Provincia, con un plan de transición energética. También planifica y ejecuta las políticas ambientales, como regulador y fiscalizador del uso de la tierra y los recursos naturales (Ley 9501, art. 20)."
    puntos:
      - "Es autoridad de aplicación para permisos y concesiones de exploración, explotación y transporte de hidrocarburos (art. 20 inc. 1 e)."
      - "Ejerce el control técnico, operativo y económico de la producción de petróleo y gas en las áreas concesionadas (inc. 1 h)."
      - "Planifica la política minera y las políticas electro-energéticas, y otorga concesiones de infraestructura hidroeléctrica provincial (inc. 1 k, l y m)."
      - "Ejecuta y controla las normas de impacto ambiental y es autoridad de aplicación del Sistema Provincial de Áreas Naturales Protegidas (inc. 2 a y e)."
      - "Administra los Parques y Paseos Públicos provinciales y la gestión de residuos patogénicos y peligrosos (inc. 2 l y n)."
    norma: "Ley 9501, arts. 20, 21 y 31"
    fuente_url: "https://boe.mendoza.gov.ar/publico/pdf_pedido/a856ae518df4edffc94596381277e75e8f07923179"
    sitio_url: "https://www.mendoza.gob.ar/energiayambiente/"
    antes:
      - "Secretaría de Ambiente y Ordenamiento Territorial (2015-2023, Ley 9206, art. 26; rango de ministerio)"
      - "Subsecretaría de Energía y Minería (dentro de Economía y Energía, 2015-2023)"
    nota: "La Ley 9206 tenía una Secretaría de Ambiente y un Ministerio de Economía y Energía; Energía y Ambiente como ministerio es nuevo en la Ley 9501. Ojo: la Dirección de Hidráulica figura en el presupuesto 2026 dentro de Energía y Ambiente (23-05) aunque la ley asigna la política hídrica a Gobierno e Infraestructura."
