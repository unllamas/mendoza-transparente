      - "Representa a la Provincia en organismos regionales, nacionales e internacionales de agro, industria, comercio exterior e inversiones."
      - "Participa en negociaciones con otros países para que los productos mendocinos lleguen a sus mercados en condiciones favorables y de reciprocidad."
