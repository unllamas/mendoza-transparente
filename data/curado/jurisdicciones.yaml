  - id: ministerio-de-gobierno-infraestructura-y-desarrollo-territorial
    nombre: "Ministerio de Gobierno, Infraestructura y Desarrollo Territorial"
    sigla: "MGIyDT"
    tipo: ministerio
    depende_de: gobernacion
    que_hace: "Coordina las relaciones del Ejecutivo con otros poderes, municipios y Nación, y las políticas de trabajo, derechos humanos, género y diversidad. También planifica y ejecuta la obra pública y la infraestructura social, y fiscaliza el transporte, el agua potable y el saneamiento. Despacha todos los asuntos del Gobernador (Ley 9501, art. 10)."
    puntos:
      - "Aplica las leyes laborales, ejerce la policía del trabajo y concilia conflictos individuales y colectivos (art. 10 incs. 1-3)."
      - "Organiza las elecciones nacionales, provinciales y municipales y administra el Registro del Estado Civil y la registración de personas jurídicas (incs. 9, 10 y 12)."
      - "Administra el Boletín Oficial y coordina informática, gobierno electrónico y modernización del Estado (incs. 15, 18 y 19)."
      - "Planifica, programa y ejecuta la obra pública, la vivienda y la política hídrica provincial (incs. 23, 35, 37 y 38)."
      - "Elabora la política de transporte público de pasajeros y fiscaliza agua potable y saneamiento (incs. 30 y 31)."
    norma: "Ley 9501, arts. 10 y 11"
    fuente_url: "https://boe.mendoza.gov.ar/publico/pdf_pedido/a856ae518df4edffc94596381277e75e8f07923179"
    sitio_url: "https://www.mendoza.gob.ar/gobiernoinfraestructura/"
