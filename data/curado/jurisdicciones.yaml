      - "Administra el Sistema Penitenciario Provincial, los establecimientos de encausados y penados y la Dirección de Promoción de Liberados (inc. 17)."
      - "Habilita y controla a las empresas privadas de vigilancia (inc. 11)."
      - "Propone al Ejecutivo indultos, conmutaciones y rebajas de penas (inc. 15)."
      - "Se vincula con el Poder Judicial, el Ministerio Público Fiscal y el Ministerio Público de la Defensa (inc. 23)."
