      - "Propone el régimen de compras y ventas común y obligatorio para la Administración (inc. 8)."
      - "Aplica la Ley de Administración Financiera 8706 y coordina los Servicios Administrativos Financieros (incs. 9 y 30)."
      - "Interviene en el régimen de participación municipal de impuestos y representa a la Provincia en organismos federales de impuestos (incs. 4 y 6)."
