# Organismos del Poder Ejecutivo de Mendoza (gestión Cornejo 2023-2027) y equivalencias de nombres y códigos entre fuentes.
# Relevamiento del 12/10/2026. Contenido editorial: se revisa a mano.
#
# Para qué sirve: cada fuente nombra distinto a un mismo organismo ("Ministerio de Salud y Deportes" en Ética Pública,
# "1-08-75 - Subsecretaría de Salud" en compras, jurisdicción 08 en el presupuesto). Esta tabla une todos esos nombres y
# códigos, incluidos los de gestiones anteriores (campo `antes`), para cruzar fuentes en la página de cada organismo.
#
# Fuentes (todas oficiales):
#   - Ley de Ministerios 9501 (sancionada 06/12/2023, Boletín Oficial 09/12/2023, Nº 32004), promulgada por Decreto 3047/2023.
#     Copia archivada en data/raw/jurisdicciones/2026-10-12/. Vigente; no se encontró ninguna ley que la modifique (ver `no_publicado`
#     en el informe del relevamiento). Los ministerios actuales (art. 1) son los siete listados abajo; los organismos que "se
#     relacionan con el Ejecutivo" a través de cada ministerio están en los arts. 11, 14, 16, 19 y 21.
#   - Ley de Ministerios 9206 (2019-2023) y 8830 (2015-2019), para los nombres anteriores. 9206 archivada en data/raw/jurisdicciones/.
#   - Ley de Presupuesto 2026 Nº 9681 y sus planillas (https://sitios.mendoza.gob.ar/haciendayfinanzas/2026/01/presupuesto-2026/),
#     planilla 8.2 (cargos por carácter, jurisdicción y unidad organizativa) para los códigos.
#   - data/processed/etica-publica/funcionarios.csv (columna reparticion), compras-ocds/procesos.csv (columna comprador) y
#     autoridades/autoridades.csv (columna organismo).
#
# Cómo se leen los códigos. El presupuesto y COMPR.AR usan CARÁCTER-JURISDICCIÓN-UNIDAD (por ejemplo "1-08-75"):
#   - Carácter: 1 administración central, 2 organismos descentralizados, 3 cuentas especiales, 5 otras entidades (entes autárquicos
#     y obra social), 9 sociedades/otros (en compras).
#   - Jurisdicción 2026: 01 Legislativo, 02 Judicial, 03 Tribunal de Cuentas, 05 Gobierno, Infraestructura y Desarrollo Territorial,
#     06 Hacienda y Finanzas, 07 Producción, 08 Salud y Deportes, 14 Educación, Cultura, Infancias y DGE, 15 Fiscalía de Estado,
#     16 Seguridad y Justicia, 23 Energía y Ambiente.
#   - Códigos históricos que todavía aparecen en compras (2019-2023): 09 Planificación e Infraestructura Pública (hoy en 05),
#     22 Secretaría/Ministerio de Cultura y Turismo (hoy en 14 y EMETUR), 26 Secretaría de Servicios Públicos (hoy en 05),
#     07 Economía (Infraestructura) y Energía (la energía hoy está en 23).
#   - `prefijos_compras`: el comprador de COMPR.AR empieza con ese prefijo ("1-08-" cubre todo el 08 de administración central).
#     Si dos prefijos coinciden gana el más largo (el más específico).
#   - `codigos_presupuesto`: jurisdicción ("08") o unidad completa ("2-05-02").
#   - `etica_publica_reparticion`: los valores exactos de la columna `reparticion` ya asignados a este organismo.
#   - `antes`: predecesores claros (leyes 8830 y 9206).
#
# Campos por organismo: id, nombre, sigla, tipo (ministerio | secretaria | organismo_control | ente_descentralizado | empresa | otro),
# depende_de (id o null), que_hace y puntos (lenguaje simple, solo lo que dicen la ley o el decreto), norma, fuente_url, sitio_url,
# antes, nota (dudas o conflictos entre fuentes) y alias.
#
# Límites: la Ley 9501 describe las competencias de los ministerios; de los entes solo dice de qué ministerio dependen. Para las
# direcciones y subsecretarías hay unidades del presupuesto 2026 (`unidades_presupuesto_2026`) pero no hay organigrama ni decretos
# de estructura publicados con sus funciones.

organismos:
  - id: gobernacion
    nombre: "Gobernación de Mendoza"
    tipo: otro
    depende_de: null
    que_hace: "Es la cabeza del Poder Ejecutivo provincial: el Gobernador conduce la administración con siete ministerios. La Ley de Ministerios 9501 fija cuáles son los ministerios y cómo se reparten los asuntos de gobierno, y prevé que los decretos puedan salir de un acuerdo de ministros."
    puntos:
      - "Ministerios del Poder Ejecutivo: Gobierno, Infraestructura y Desarrollo Territorial; Seguridad y Justicia; Hacienda y Finanzas; Producción; Salud y Deportes; Energía y Ambiente; Educación, Cultura, Infancias y DGE (art. 1)."
      - "Convoca al acuerdo de ministros en los casos que la Constitución o las leyes prevén (art. 3)."
      - "Decide en caso de duda sobre qué ministerio es competente en un asunto (art. 4)."
      - "Tiene vinculada en forma directa a la Unidad ProMendoza (art. 17)."
    norma: "Ley 9501 (arts. 1, 3, 4 y 17); Constitución de Mendoza, art. 131 (citado por el art. 1 de la ley)"
    fuente_url: "https://boe.mendoza.gov.ar/publico/pdf_pedido/a856ae518df4edffc94596381277e75e8f07923179"
    sitio_url: "https://www.mendoza.gob.ar/"
    antes:
      - "Gobernación (gestión 2019-2023), Ley 9206"
    alias:
