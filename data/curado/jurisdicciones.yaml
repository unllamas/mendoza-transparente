  - id: ministerio-de-salud-y-deportes
    nombre: "Ministerio de Salud y Deportes"
    sigla: "MSyD"
    tipo: ministerio
    depende_de: gobernacion
    que_hace: "Crea las condiciones para promover, proteger y recuperar la salud de los habitantes de la Provincia, y fomenta, apoya y controla la práctica deportiva con criterios de inclusión y equidad (Ley 9501, art. 18)."
    puntos:
      - "Propone y aplica la política sanitaria provincial y ejerce la policía sanitaria en todo el territorio (art. 18 incs. 1 y 7)."
      - "Administra los establecimientos de salud del Gobierno provincial y organiza los niveles de atención (incs. 8 y 14)."
      - "Regula y fiscaliza las profesiones de la salud, los medicamentos, los alimentos y la cadena de venta de productos farmacéuticos (incs. 6 y 13)."
      - "Desarrolla políticas de salud mental, consumos problemáticos, personas adultas mayores y personas con discapacidad (incs. 19, 20 y 22)."
      - "Fomenta y organiza la actividad deportiva, los eventos masivos y el alto rendimiento (incs. 28, 31 y 40)."
    norma: "Ley 9501, arts. 18 y 19"
    fuente_url: "https://boe.mendoza.gov.ar/publico/pdf_pedido/a856ae518df4edffc94596381277e75e8f07923179"
    sitio_url: "https://www.mendoza.gob.ar/saludydeportes/"
