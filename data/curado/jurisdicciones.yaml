    nota: "Las unidades de Desarrollo Social del código 1-08 (80, 83, 85-89) hoy dependen de otros ministerios: Economía Social, Género y Diversidad y Contingencia figuran en Gobierno (5-33, 5-35, 5-38, 5-39 del presupuesto 2026); FIDES en Educación según la ley (art. 36). Los compradores históricos con código 1-08 se asignan a Salud y Deportes por su prefijo; el cruce por organigrama actual requiere revisar esas unidades."
