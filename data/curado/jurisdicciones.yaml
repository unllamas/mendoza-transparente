  - id: ministerio-de-produccion
    nombre: "Ministerio de Producción"
    sigla: "MP"
    tipo: ministerio
    depende_de: gobernacion
    que_hace: "Formula las políticas y ejecuta las acciones de gobierno para industrializar y diversificar la producción de la Provincia, y para promover y controlar las actividades productivas. También busca mercados y financiamiento para los distintos sectores y regiones (Ley 9501, art. 15)."
    puntos:
      - "Fija la política de defensa, promoción, desarrollo y control de las actividades agrícolas, ganaderas, industriales, comerciales y de servicios (art. 15 inc. 1)."
      - "Controla la calidad, sanidad y genuinidad de la producción (inc. 6)."
      - "Desarrolla un programa de prevención y reparación de daños por factores climáticos o fitosanitarios (inc. 9)."
      - "Es autoridad de aplicación de las leyes 5846 (innovación tecnológica) y 7728 (industria del software) (inc. 13)."
      - "Facilita la radicación de inversiones y el acceso a mercados locales e internacionales (inc. 4)."
    norma: "Ley 9501, arts. 15 y 16"
