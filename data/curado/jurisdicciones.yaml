      - "Ministerio de Planificación e Infraestructura Pública (2019-2023, Ley 9206, art. 17): obra pública"
      - "Secretaría de Servicios Públicos (2015-2023, Ley 9206, art. 27): transporte, agua y saneamiento"
    nota: "Hereda tres jurisdicciones previas. En el presupuesto las dos últimas aparecen con los códigos 09 (Infraestructura) y 26 (Servicios Públicos)."
