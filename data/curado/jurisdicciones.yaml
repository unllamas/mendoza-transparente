  - id: ministerio-de-seguridad-y-justicia
    nombre: "Ministerio de Seguridad y Justicia"
    sigla: "MSyJ"
    tipo: ministerio
    depende_de: gobernacion
    que_hace: "Planifica, coordina y controla la política de seguridad pública para proteger la vida, la libertad y los bienes de los habitantes. También maneja la relación institucional del Poder Ejecutivo con el Poder Judicial (Ley 9501, art. 12)."
