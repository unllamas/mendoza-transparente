  - id: unidad-promendoza
    nombre: "Unidad ProMendoza"
    tipo: otro
    depende_de: gobernacion
    que_hace: "La Ley 9501 crea la Unidad ProMendoza, que se vincula en forma directa con la Gobernación. Representa a la Provincia en el Consejo de Administración de la Fundación ProMendoza y en organismos regionales, nacionales e internacionales sobre temas agropecuarios, industriales, de comercio exterior e inversiones."
