    nota: "El Ministerio de Cultura y Turismo (2019-2023) se reparte hoy: cultura va a este ministerio y turismo a EMETUR (bajo Producción). Los valores 'MINISTERIO DE CULTURA Y TURISMO' de Ética Pública se asignan a este ministerio; revisar los de turismo."
