  - id: ministerio-de-educacion-cultura-infancias-y-dge
    nombre: "Ministerio de Educación, Cultura, Infancias y Dirección General de Escuelas"
    sigla: "MECIDGE"
    tipo: ministerio
    depende_de: gobernacion
    que_hace: "Planifica, ejecuta y evalúa la política educativa y cultural de la Provincia y se ocupa de la protección integral de niños, niñas y adolescentes. También prevé la infraestructura de los servicios educativos, de cultura e infancias (Ley 9501, art. 22)."
    puntos:
      - "Diseña políticas y programas para preservar el acervo cultural, el patrimonio y las industrias culturales (art. 22 inc. 1)."
      - "Propone y ejecuta políticas de protección de derechos de niñez, adolescencia y juventudes y de Responsabilidad Penal Juvenil (inc. 2)."
      - "Programa y ejecuta el mantenimiento y renovación de los inmuebles educativos, culturales y de infancias (inc. 3)."
      - "El Director General de Escuelas ejerce las atribuciones que le fija el art. 132 de la Ley 6970 sobre la educación pública (art. 22)."
      - "Es autoridad de aplicación de la Ley 9139 de protección de personas menores de edad (art. 32)."
    norma: "Ley 9501, arts. 22, 32 a 36"
    fuente_url: "https://boe.mendoza.gov.ar/publico/pdf_pedido/a856ae518df4edffc94596381277e75e8f07923179"
