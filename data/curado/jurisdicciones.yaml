  - id: ministerio-de-hacienda-y-finanzas
    nombre: "Ministerio de Hacienda y Finanzas"
    sigla: "MHyF"
    tipo: ministerio
    depende_de: gobernacion
    que_hace: "Se ocupa de la administración financiera y tributaria del Estado provincial. Formula la política fiscal, prepara y controla la ejecución del presupuesto, gestiona la deuda pública y supervisa el régimen de compras de la Administración (Ley 9501, art. 13)."
