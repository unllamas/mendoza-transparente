# Partidos, frentes y bloques: las formas en que las fuentes oficiales escriben un mismo nombre.
#
# Criterios (docs/procesos/metodologia.md, «Partidos, frentes y bloques»):
# - Solo se unen formas de escribir EL MISMO nombre: prefijo legal («Partido», «Alianza», «Frente»), sigla,
#   artículo o errata. Nunca partidos distintos (La Libertad Avanza y PRO quedan separados) ni un frente con
#   los partidos que lo forman.
# - Cada alias dice por qué se une. Sin motivo escrito, no se une.
# - Las mayúsculas, las tildes y los signos ya se ignoran solos («Frente De Todos» = «Frente de Todos»):
#   no hace falta cargarlos como alias.
# - Lo que no figura acá queda como entidad propia, con el nombre tal como lo dice la fuente.
#
# Campos:
#   slug        la URL: /partidos/<slug>
#   nombre      el nombre que se muestra
#   sigla       opcional; va en el título y en el buscador (la insignia de la cara nunca lleva letras: logo o color)
#   alias       las otras formas en que lo escriben las fuentes, cada una con su motivo
#   logo        archivo en apps/web/public/partidos/ (null mientras no haya uno de fuente oficial)
#   logo_fuente URL oficial de donde salió el logo (el original queda en data/raw/partidos/)
#   color       color propio del partido en hexadecimal, tomado de su logo oficial; pinta la insignia cuando no hay logo.
#               Si falta, se usa el de colores-partidos.yaml (boleta oficial) para el mismo nombre o alias.
#   wikidata    id de Wikidata (Q…), si existe con certeza

- slug: cambia-mendoza
  nombre: Cambia Mendoza
  logo: cambia-mendoza.png
  logo_fuente: https://cambiamendoza.com/wp-content/uploads/2023/08/cropped-Cambia-Mendoza-marca-transparente.png
  color: "#951b81"
  alias:
    - nombre: Alianza Cambia Mendoza
      motivo: Mismo nombre con el prefijo legal «Alianza» (actas de 2015 y 2017).
    - nombre: Frente Cambia Mendoza
      motivo: Mismo nombre con el prefijo legal «Frente» (actas de 2019 y lista de autoridades).

- slug: ucr
  nombre: Unión Cívica Radical
  sigla: UCR
  logo: ucr.png
  logo_fuente: https://ucrmendoza.org.ar/wp-content/uploads/2020/05/cropped-Ucr_modern_logo-1.png
  color: "#e10019"
  alias:
    - nombre: UCR - Unión Cívica Radical
      motivo: Sigla y nombre completo juntos (bloque en el Congreso).
    - nombre: Partido Union Civica Radical
      motivo: Mismo nombre con el prefijo legal «Partido» y sin tildes (acta de 2015).
    - nombre: UCR-Cambia Mendoza
      motivo: Bloque legislativo cuyo nombre empieza con la sigla de la UCR. En la ficha de cada persona se muestra el nombre del bloque tal como lo publica la Legislatura.

- slug: partido-justicialista
  nombre: Partido Justicialista
  sigla: PJ
  logo: partido-justicialista.png
  logo_fuente: https://pjmendoza.org/wp-content/uploads/2020/10/cropped-cropped-logo-pj1.png
  color: "#3c77af"
  alias:
    - nombre: Justicialista
      motivo: Mismo nombre sin el prefijo legal «Partido».

- slug: la-libertad-avanza
  nombre: La Libertad Avanza
  sigla: LLA
  # Su sitio (lalibertadavanza.com.ar) no tiene contenido: el logo es la imagen de su cuenta oficial en X (@LLibertadAvanza).
  logo: la-libertad-avanza.png
  logo_fuente: https://pbs.twimg.com/profile_images/1955653235940761605/5cwFh2XI_400x400.jpg
  color: "#371959"
  alias: []

- slug: pro
  nombre: PRO
  sigla: PRO
  logo: pro.png
  logo_fuente: https://pro.com.ar/assets/img/favicon-180.png
  color: "#f7cb5b"
  alias:
    - nombre: PRO Propuesta Republicana
      motivo: Sigla y nombre completo juntos.

- slug: la-union-mendocina
  nombre: La Unión Mendocina
  alias:
    - nombre: Unión Mendocina
      motivo: Mismo nombre sin el artículo.

- slug: frente-de-izquierda
  nombre: Frente de Izquierda y de los Trabajadores
  sigla: FIT
  # Color de la bandera de su logo oficial (https://www.frentedeizquierda.org.ar/landing/img/favicon.svg). El logo es una bandera sin texto: con la sigla se reconoce mejor.
  color: "#e84040"
  alias:
    - nombre: Alianza Frente de Izquierda y de los Trabajadores
      motivo: Mismo nombre con el prefijo legal «Alianza» (acta de 2015, en la misma elección que la forma sin prefijo).

- slug: frente-para-la-victoria-2
  nombre: Frente para la Victoria 2
  alias:
    - nombre: Alianza Frente para la Victoria 2
      motivo: Mismo nombre con el prefijo legal «Alianza» (acta de junio de 2015, en la misma elección que la forma sin prefijo).
  # «Alianza Frente para la Victoria» (sin el 2, noviembre de 2015) queda aparte: es otra elección y el acta no dice si es la misma alianza.

- slug: encuentro-por-san-carlos
  nombre: Encuentro por San Carlos
  alias:
    - nombre: Alianza Encuentro por San Carlos
      motivo: Mismo nombre con el prefijo legal «Alianza» (acta de 2015).
    - nombre: Frente Encuentro por San Carlos
      motivo: Mismo nombre con el prefijo legal «Frente» (acta de 2023 y lista de autoridades).

- slug: nuevos-rumbos
  nombre: Nuevos Rumbos
  alias:
    - nombre: Partido Nuevos Rumbos
      motivo: Mismo nombre con el prefijo legal «Partido» (acta de 2019).
  # «Cambia Mendoza - Nuevos Rumbos» (2023) queda aparte: es una lista que combina dos nombres (sus partidos, en frentes.yaml).

- slug: frente-libertario-democrata-y-jubilados
  nombre: Frente Libertario, Demócrata y Jubilados
  alias:
    - nombre: Frente Libertario, Demócratas y Jubilados
      motivo: Errata en el acta de 2023 («Demócratas»), en la misma elección.

- slug: elegi-mendoza
  nombre: Elegí Mendoza
  alias:
    - nombre: Alianza Elegí Mendoza Frente Político y Social
      motivo: Mismo nombre con el prefijo legal «Alianza» y el subtítulo «Frente Político y Social» (acta de 2019).
  # «Frente Elegí» (2019) queda aparte: figura en la misma elección como otra lista.
  # Los «Elegí» de cada municipio (Elegí Gestión Lavalle, Elegí Santa Rosa…) son frentes distintos.

- slug: partido-democrata
  nombre: Partido Demócrata
  alias: []
