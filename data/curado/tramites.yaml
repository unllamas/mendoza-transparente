  pasos:
    - nivel: nacion
      organismo: ARCA
      titulo: CUIT y alta en el monotributo
      detalle: En línea y gratis, con DNI y clave fiscal. El alta toma unos 15 minutos.
      url: https://www.argentina.gob.ar/servicio/inscribirme-como-monotributista
      cuando: siempre
    - nivel: provincia
      organismo: ATM
      titulo: Ingresos Brutos
      detalle: Automática si sos monotributista (hasta 72 horas hábiles). Si no, alta en Mis Trámites Online de la ATM.
      url: https://atm.mendoza.gov.ar/preguntas-frecuentes/impuesto-sobre-los-ingresos-brutos-2/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Rivadavia
      titulo: Zona permitida del local
      detalle: Antes de alquilar, mirá en el mapa de zonificación (Código de Uso) si el rubro está permitido en esa dirección. El personal de Comercio e Industria lo verifica en el asesoramiento previo.
      url: https://rivadaviamendoza.gob.ar/new/wp-content/uploads/2024/04/Codigo-de-Uso.pdf
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Rivadavia
      titulo: Habilitación de comercio
      detalle: En el Departamento de Comercio e Industria, de lunes a viernes de 7 a 13 (263-4444548, interno 262). Te asesoran y te dan el formulario; lo completás con la documentación y lo firma el personal del Departamento. Pagás el boleto en Rentas o en Rentas Online y presentás todo en Mesa de Entrada para iniciar el expediente. Se pide DNI, CUIT o CUIL, constancia de AFIP, facturas de servicios, libre deuda del inmueble y del solicitante, dos constancias del derecho sobre el local y el plano aprobado. La habilitación sale por resolución del Intendente; iniciar el trámite no es estar habilitado.
      url: https://rivadaviamendoza.gob.ar/new/rentas/comercio-industria/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Rivadavia
      titulo: Curso de manipulación de alimentos
      detalle: Curso presencial de 7 horas con examen, en el Teatro Bianchi, según el calendario del año. El carnet vale 3 años en todo el país. Se paga en Rentas Online (Curso de Manipulación de Alimentos). Para la habilitación alcanza con el certificado o el boleto de pago de la inscripción.
      url: https://rivadaviamendoza.gob.ar/new/ciudadania/bromatologia/
      cuando: alimentos
    - nivel: municipio
      organismo: Municipalidad de Rivadavia
      titulo: Condiciones del local que elabora alimentos
      detalle: Bromatología pide pisos y paredes lavables, aberturas con protección antiinsectos, agua potable, desagüe, bacha, mesada impermeable, sanitarios con lavamanos y personal con curso y vestimenta adecuada. Se inspecciona en la habilitación.
      url: https://rivadaviamendoza.gob.ar/new/rentas/comercio-industria/
      cuando: alimentos
  costos:
    - concepto: Derecho de inspección de seguridad e higiene (tasa de comercio)
      detalle: Se paga una vez al año, en UTM, según el rubro y la categoría (1.ª a 4.ª) que asigna el municipio. Con el pago de todo el año de contado hay 10 % de descuento. La UTM vale $119,60.
      norma: Ordenanza tarifaria 5303 (2026), arts. 33 a 35 y Anexo III
      url: https://boe.mendoza.gov.ar/publico/pdf_pedido/82695f47ae36dd2044331ba47daab62acc90af9d47
    - concepto: Habilitación de un comercio nuevo
      detalle: Se cobra al habilitarse según la categoría del comercio, 1.ª 82 UTM, 2.ª 66 UTM, 3.ª 42 UTM y 4.ª 32 UTM (art. 36). Con la UTM a $119,60 son $9.807,20, $7.893,60, $5.023,20 y $3.827,20.
      norma: Ordenanza tarifaria 5303 (2026), art. 36
      url: https://boe.mendoza.gov.ar/publico/pdf_pedido/82695f47ae36dd2044331ba47daab62acc90af9d47
    - concepto: Sellado de inicio de expediente
      detalle: La página de Comercio e Industria dice 26 UTM; la tarifaria 2026 fija 18 UTM para iniciar un expediente y 26 UTM por la habilitación, el traslado o la baja de un comercio (art. 140).
      norma: Ordenanza tarifaria 5303 (2026), art. 140
      url: https://rivadaviamendoza.gob.ar/new/rentas/comercio-industria/
    - concepto: Curso de manipulación de alimentos
      detalle: 100 UTM ($11.960), con dictado, evaluación y certificado.
      norma: Ordenanza tarifaria 5303 (2026), art. 89
      url: https://boe.mendoza.gov.ar/publico/pdf_pedido/82695f47ae36dd2044331ba47daab62acc90af9d47
  tasa_comercio:
    periodo: año
    unidad: UTM
    valor_unidad: 119.6
    norma_unidad: Ordenanza tarifaria 5303, art. 2 ($119,60); no encontramos un decreto posterior
    norma: Ordenanza tarifaria 5303 (2026), Anexo III
    url: https://boe.mendoza.gov.ar/publico/pdf_pedido/82695f47ae36dd2044331ba47daab62acc90af9d47
    nota: El Anexo III da un monto anual por actividad y categoría. La categoría la asigna el municipio según la superficie, la ubicación, la cantidad de empleados y la importancia del comercio frente a otros del ramo (art. 35); no publica cómo se ponderan. Los bares, heladerías y multirrubros en la zona peatonal pagan el doble (art. 41).
  no_publica:
    - que: Cuánto tarda la habilitación
      organismo: Municipalidad de Rivadavia
      detalle: La página solo dice que sale por resolución del Intendente.
    - que: Qué categoría de la tasa de comercio te toca
      organismo: Municipalidad de Rivadavia
      detalle: Publica los criterios, no cómo se ponderan.
    - que: Qué comercios necesitan certificado CEMEPASI y seguro contra terceros
      organismo: Municipalidad de Rivadavia
      detalle: La página dice que se pide «dependiendo el comercio».
    - que: Los requisitos y el costo del permiso para poner un cartel
      organismo: Municipalidad de Rivadavia
      detalle: Se pide declarar los carteles en la habilitación, pero no hay una página con el trámite.
    - que: Cuánto tarda el alta en Ingresos Brutos por el régimen general
      organismo: ATM
  promocion:
    norma: Ordenanza tarifaria 5303 (2026), arts. 43 y 44
    detalle: Los pequeños emprendedores no pagan la tasa de comercio el primer y el segundo año desde el inicio de la actividad (art. 44); la Coordinación de Recursos y Finanzas Públicas debe reglamentarlo y no encontramos esa reglamentación. Las industrias nuevas no pagan los dos primeros años y la mitad el tercero (art. 43).
    url: https://boe.mendoza.gov.ar/publico/pdf_pedido/82695f47ae36dd2044331ba47daab62acc90af9d47

