  pasos:
    - nivel: nacion
      organismo: ARCA
      titulo: CUIT y alta en el monotributo
      detalle: En línea y gratis, con DNI y clave fiscal. El alta toma unos 15 minutos.
      url: https://www.argentina.gob.ar/servicio/inscribirme-como-monotributista
      cuando: siempre
    - nivel: provincia
      organismo: ATM
      titulo: Ingresos Brutos
      detalle: Automática si sos monotributista (hasta 72 horas hábiles). Si no, alta en Mis Trámites Online de la ATM.
      url: https://atm.mendoza.gov.ar/preguntas-frecuentes/impuesto-sobre-los-ingresos-brutos-2/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Las Heras
      titulo: Factibilidad del local
      detalle: Consulta previa de viabilidad. Se pide con el DNI, una memoria descriptiva de la actividad y un croquis a mano alzada. Se hace en la oficina de San Miguel y Rivadavia (lunes a viernes de 8 a 14) o por el expediente electrónico.
      url: https://lasheras.gob.ar/tramites-a-distacia/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Las Heras
      titulo: Habilitación comercial
      detalle: Con el DNI, la constancia de inscripción en ARCA, la prueba de que sos dueño del local o el contrato de alquiler sellado por la ATM, un garante propietario y un cuaderno de inspección de tapa dura.
      url: https://lasheras.gob.ar/tramites-a-distacia/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Las Heras
      titulo: Curso de manipulación de alimentos
      detalle: La tarifaria fija un arancel de 50 UT por persona. No se publica dónde se hace ni si es obligatorio para el comercio.
      url: https://lasheras.gob.ar/wp-content/uploads/2026/03/ordenanza_tarifaria_-_2026-2.pdf
      cuando: alimentos
  costos:
    - concepto: Derecho de comercio
      detalle: Lo cobra el municipio por año según el rubro y la superficie (hasta 60 m², de 60 a 200 o más de 200), en unidades tributarias (UT). La UT vale $170 desde septiembre de 2026 y se ajusta cada dos o tres meses. Un almacén de hasta 60 m² paga 420 UT por año ($71.400). Si sos monotributista pagás un monto fijo por mes (el 70 % del importe de Ingresos Brutos de tu categoría), y en categoría A no pagás el año en que te das de alta (art. 128).
      norma: Ordenanza tarifaria 54/25 (2026), arts. 27 y 128
      url: https://lasheras.gob.ar/wp-content/uploads/2026/03/ordenanza_tarifaria_-_2026-2.pdf
    - concepto: Habilitación
      detalle: Se paga una vez, según la superficie. Hasta 60 m² son 200 UT ($34.000 con la UT a $170); de 60 a 200 m², 500 UT; más de 200 m², 1.000 UT. Más 15 UT por foliar el cuaderno de inspección.
      norma: Ordenanza tarifaria 54/25 (2026), arts. 21 y 22
      url: https://lasheras.gob.ar/wp-content/uploads/2026/03/ordenanza_tarifaria_-_2026-2.pdf
    - concepto: Valor de la UT
      detalle: $170 desde septiembre de 2026.
      url: https://lasheras.gob.ar/rentas/
  tasa_comercio:
    periodo: año
    unidad: UT
    valor_unidad: 170
    norma_unidad: UT de $ 170 desde septiembre de 2026, según el portal de Rentas
    norma: Ordenanza tarifaria 54/25 (2026), art. 27
    url: https://boe.mendoza.gov.ar/publico/pdf_pedido/6cfef2fd7adb8932d8462ccc87766a112172689043
    nota: Las categorías A, B y C van por superficie del local (más de 200 m², de 60 a 200 m² y hasta 60 m², art. 21).
  no_publica:
    - que: Cuánto tarda la habilitación
      organismo: Municipalidad de Las Heras
      detalle: Ni la página de trámites ni la tarifaria dan un plazo.
    - que: Los requisitos y el costo de la ficha ambiental
      organismo: Municipalidad de Las Heras
    - que: Los requisitos de seguridad contra incendios de un comercio chico
      organismo: Municipalidad de Las Heras
      detalle: Solo se publica el arancel del estudio de planos y una multa por falta de tarjeta en el matafuego.
    - que: Los requisitos y el costo del permiso para poner un cartel
      organismo: Municipalidad de Las Heras
      detalle: Se publica el arancel por metro cuadrado, no el trámite.
    - que: Dónde se tramita la libreta sanitaria y si el carnet de manipulación es obligatorio
      organismo: Municipalidad de Las Heras
    - que: Cuántas cuotas tiene el derecho de comercio y cuándo vencen
      organismo: Municipalidad de Las Heras
  promocion:
    norma: Ordenanza tarifaria 54/25, arts. 128 a 132
    detalle: No hay un régimen para comercios chicos nuevos. Los monotributistas de categoría A que se dan de alta en el año no pagan el derecho de comercio ese año. El régimen de promoción es para negocios que amplían 200 m² o más y toman personal (descuento de 25 % a 100 % por dos años).
    url: https://lasheras.gob.ar/wp-content/uploads/2026/03/ordenanza_tarifaria_-_2026-2.pdf

