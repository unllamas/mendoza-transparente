  pasos:
    - nivel: municipio
      organismo: Municipalidad de Guaymallén
      titulo: Uso de suelo del local (factibilidad)
      detalle: Se inicia un expediente en la Mesa Única de Habilitación de Comercio (Libertad 720, Villa Nueva), con la memoria descriptiva. El certificado vale 180 días. Es obligatorio antes de la habilitación. Hay un informe de viabilidad previo y opcional.
      url: https://www.guaymallen.gob.ar/tramite-expres-comercio/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Guaymallén
      titulo: Habilitación de comercio (exprés para Tipo 1)
      detalle: Presencial en la Mesa Única, de lunes a viernes de 8 a 14. Si llevás todo, salís el mismo día con la habilitación provisoria y el libro de inspección. Después hay una inspección. Se pide vínculo con el local, declaración jurada del estado del local, domicilio fiscal electrónico, memoria descriptiva y libre deuda.
      url: https://www.guaymallen.gob.ar/tramite-expres-comercio/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Guaymallén
      titulo: Evaluación ambiental
      detalle: Solo si la autoridad categoriza la actividad. Se completa el formulario de categorización con la memoria descriptiva y se paga 120 UTM. Si hace falta un estudio, se paga 1 por mil de la inversión.
      url: https://www.guaymallen.gob.ar/evaluaciones-ambientales/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Guaymallén
      titulo: Plan contra incendios
      detalle: En comercios chicos no hay requisito escrito. El municipio puede pedir un plan de contingencias o un sistema contra incendios con fundamento, antes de la habilitación definitiva.
      url: https://boe.mendoza.gov.ar/publico/verpdf/82205393ee59ab28e12570417587310c469454b681/anexo
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Guaymallén
      titulo: Carnet de manipulador y libreta sanitaria
      detalle: Todo el personal que trabaje con alimentos. El carnet es un curso de 6 horas con examen (180 UTM); la libreta se saca en persona los martes y jueves de 7 a 8.
      url: https://www.guaymallen.gob.ar/manipulacion-de-alimentos/
      cuando: alimentos
    - nivel: municipio
      organismo: Municipalidad de Guaymallén
      titulo: Cartel del comercio
      detalle: Hace falta permiso antes de instalarlo. Se paga por metro cuadrado al año y, si el frente anuncia el local, un 15 % más sobre la tasa de comercio.
      url: https://www.guaymallen.gob.ar/aforo-cero/
      cuando: siempre
  costos:
    - concepto: Derecho de inspección y control de seguridad e higiene (tasa de comercio)
      detalle: Se paga por bimestre según el rubro y la categoría (1ª a 4ª) que asigna la Dirección de Comercio. Se mide en UTM; la UTM vale $130 según la ordenanza (puede subir hasta 60 % desde abril de 2026, sin decreto publicado). Se cobra desde que pedís la apertura o desde que inspeccionan, lo que ocurra primero.
      norma: Ordenanza tarifaria 10298 (2026), arts. 44 a 48 y Anexo B
      url: https://www.guaymallen.gob.ar/guia-de-tramites/
    - concepto: Habilitación y factibilidad
      detalle: Según el programa Aforo cero del municipio no tienen costo, desde la factibilidad hasta la habilitación. La tarifaria 2026 no fija un monto para pedirlas.
      url: https://www.guaymallen.gob.ar/aforo-cero/
    - concepto: Libreta sanitaria y carnet de manipulador
      detalle: Carnet 180 UTM y libreta 200 UTM según la tarifaria (la ficha de la libreta dice 180).
      norma: Ordenanza tarifaria 10298 (2026), art. 78
      url: https://www.guaymallen.gob.ar/libreta-sanitaria/
  tasa_comercio:
    periodo: bimestre
    unidad: UTM
    valor_unidad: 130
    norma_unidad: Ordenanza 10298, art. 1; no encontramos un decreto que la haya subido en 2026
    norma: Ordenanza tarifaria 10298 (2026), Anexo B
    url: https://boe.mendoza.gov.ar/publico/pdf_pedido/6244472050f5ed156d88113a6e7319a6b87b2e5467
    nota: La categoría (1.ª a 4.ª) la asigna el municipio.
  no_publica:
    - que: Cuánto tarda la factibilidad de uso
      organismo: Municipalidad de Guaymallén
      detalle: Solo se publica que el certificado vale 180 días.
    - que: Si un comercio chico necesita evaluación ambiental o plan contra incendios
      organismo: Municipalidad de Guaymallén
      detalle: Lo decide el municipio caso por caso; no publica el criterio.
    - que: Los requisitos, el costo y el plazo del permiso para poner un cartel
      organismo: Municipalidad de Guaymallén
    - que: Si la UTM subió después de abril de 2026
      organismo: Municipalidad de Guaymallén
  promocion:
    norma: Programa Aforo cero y programa Guaymallén invierte con vos
    detalle: Los comercios nuevos no pagan aforos de factibilidad ni de habilitación. Además, el programa Guaymallén invierte con vos devolvía el 40 % de la inversión en el local (mitad en efectivo, mitad en crédito fiscal), con tope de $10.000.000 según una página y de $4.000.000 según otra. No se confirmó si sigue abierto en 2026.
    url: https://www.guaymallen.gob.ar/guaymallen-invierte-con-vos/

