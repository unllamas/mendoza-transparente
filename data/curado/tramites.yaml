      organismo: Municipalidad de General Alvear
      titulo: Habilitación de comercio
      detalle: Toda actividad comercial, industrial o de servicios tiene que estar habilitada antes por la Dirección de Inspección General. Con fotocopia del DNI, constancia de inscripción en ARCA y escritura, contrato de alquiler o comodato del local. Si sos sociedad, también el contrato social y el CUIT. Rentas pide además libre deuda, sellados y el anticipo del derecho de comercio (ficha de Rentas con nombre «2018»). Las oficinas técnicas pueden pedir requisitos propios de la actividad. Los rubros de alimentos inician el expediente en Rentas.
      url: http://alvearmendoza.gob.ar/tramites/inspeccion/inspeccion-general-habilitaciones-en-general.pdf
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de General Alvear
      titulo: Libreta sanitaria y curso de manipulación de alimentos
      detalle: La libreta se pide en Rentas, se paga en caja y se tramita en Enfermería de lunes a viernes de 7 a 9 hs. El curso de manipulación de alimentos es de 2 horas y media, el primer miércoles de cada mes a las 9 hs en el Concejo Deliberante, y da certificado. Son datos de la ficha de Inspección, con fechas de 2018; la tarifaria 2026 cobra libreta, curso y carnet.
      url: http://alvearmendoza.gob.ar/tramites/inspeccion/inspeccion-general-habilitaciones-alimenticias.pdf
      cuando: alimentos
  costos:
    - concepto: Derecho de comercio
      detalle: Se paga por año, en boletos bimestrales. Los montos están en UTM, y la ordenanza fija la UTM en $ 1 y la ajusta por IPC cada semestre. El boleto bimestral no puede ser menor a 10.305,54 UTM.
      norma: Ordenanza tarifaria 2026 (2.º semestre), art. 5 (COD. 8)
      url: https://alvearmendoza.gob.ar/wp-content/uploads/2026/08/IIIV-ORDENANZA-TARIFARIA-2026-2do.sem_.pdf
    - concepto: Apertura de comercio (solicitud)
      detalle: 6.130 UTM por apertura o ampliación de comercios e industrias, y lo mismo por la instalación de un kiosco. La ordenanza reglamentaria declara el trámite gratuito para quien accede a la exención de nuevos comercios.
      norma: Ordenanza tarifaria 2026 (2.º semestre), art. 34, incisos 1 y 2
      url: https://alvearmendoza.gob.ar/wp-content/uploads/2026/08/IIIV-ORDENANZA-TARIFARIA-2026-2do.sem_.pdf
    - concepto: Certificado de uso de suelo
      detalle: 5.200 UTM. La tarifaria lo cobra, pero el sitio no dice dónde se pide ni si es un paso de la habilitación.
      norma: Ordenanza tarifaria 2026 (2.º semestre), art. 34, inciso 47
      url: https://alvearmendoza.gob.ar/wp-content/uploads/2026/08/IIIV-ORDENANZA-TARIFARIA-2026-2do.sem_.pdf
    - concepto: Libreta sanitaria
      detalle: 8.200 UTM por libreta.
      norma: Ordenanza tarifaria 2026 (2.º semestre), art. 35, inciso 2
      url: https://alvearmendoza.gob.ar/wp-content/uploads/2026/08/IIIV-ORDENANZA-TARIFARIA-2026-2do.sem_.pdf
    - concepto: Curso y carnet de manipulación de alimentos
      detalle: Curso de 4.000 UTM y carnet de 10.000 UTM (2.500 UTM el curso para eventos y con tarifa social). La ficha de Inspección, con fechas de 2018, dice que el curso es gratuito.
      norma: Ordenanza tarifaria 2026 (2.º semestre), art. 34, incisos 38 a 41
      url: https://alvearmendoza.gob.ar/wp-content/uploads/2026/08/IIIV-ORDENANZA-TARIFARIA-2026-2do.sem_.pdf
  tasa_comercio:
    periodo: año
    unidad: UTM
    valor_unidad: 1
    norma_unidad: UTM de $ 1 (art. 51 de la tarifaria 2026), ajustada por IPC cada semestre por resolución del Organismo Fiscal; no encontramos la resolución vigente
    norma: Ordenanza tarifaria 2026 (2.º semestre), art. 5 (COD. 8)
    url: https://alvearmendoza.gob.ar/wp-content/uploads/2026/08/IIIV-ORDENANZA-TARIFARIA-2026-2do.sem_.pdf
    nota: La ordenanza lista las categorías de cada rubro (1 a 5, a veces más) sin decir qué significa cada una ni quién la asigna. Los montos son los del texto del segundo semestre de 2026.
  no_publica:
    - que: Qué categoría de la tasa de comercio te toca
      organismo: Municipalidad de General Alvear
      detalle: La tarifaria lista los montos por categoría y no publica el criterio.
    - que: Cuánto tarda la habilitación
      organismo: Municipalidad de General Alvear
    - que: Si la habilitación se puede iniciar en línea y dónde se presenta el expediente
      organismo: Municipalidad de General Alvear
      detalle: La ficha de requisitos no dice la oficina ni la modalidad.
    - que: Cómo se pide el certificado de uso de suelo y si hace falta antes de habilitar
      organismo: Municipalidad de General Alvear
    - que: El valor de la UTM vigente en el semestre
      organismo: Municipalidad de General Alvear
      detalle: La tarifaria dice que se ajusta por IPC por resolución y la resolución no está publicada.
    - que: Los requisitos y el costo del permiso para poner un cartel
      organismo: Municipalidad de General Alvear
    - que: Cuánto tarda el alta en Ingresos Brutos por el régimen general
      organismo: ATM
  promocion:
    norma: Ordenanza reglamentaria 2026 (2.º semestre), art. 319 (Ord. 4748)
    detalle: Los comercios, industrias y empresas de servicios nuevos no pagan los derechos de comercio, el inmueble, la publicidad ni las tasas de habilitación durante 2 años, 3 si están en un distrito o paraje. Si contratan de 1 a 5 personas en relación de dependencia suman un año, y más de 5, dos años. Para acceder se inscriben en Rentas con el formulario de aportes patronales de ARCA, que se actualiza cada semestre. Un comercio es nuevo si no existió con otra titularidad en los 2 años anteriores a la ordenanza.
    url: https://alvearmendoza.gob.ar/wp-content/uploads/2026/08/III-ORDENANZA-REGLAM.-2026-2do.sem_.pdf

