    - concepto: Derecho de comercio
      detalle: Se paga por bimestre, o dividido por mes, según el rubro y la categoría. Se calcula en UTM; la UTM vale $130 desde el 1 de septiembre de 2026. Mientras no tenés habilitación se paga 1,5 veces el valor (art. 15).
      norma: Ordenanza tarifaria 4222 (2026), Capítulo III
      url: https://ciudaddemendoza.gob.ar/wp-content/uploads/2025/12/Ordenanza-Tarifaria-4222.pdf
    - concepto: Habilitación
      detalle: La ficha oficial dice «sin costo» pero pide abonar un sellado; un PDF de requisitos de 2024 menciona 231 UTM y la tarifaria 2026 no lo fija.
      url: https://www.ciudaddemendoza.gob.ar/tramites/habilitacion-de-comercios-industrias-servicios-y-actividades-civiles/
    - concepto: Curso de manipulación de alimentos
      detalle: 150 UTM (la ficha dice $19.500).
      norma: Ordenanza tarifaria 4222 (2026), art. 61
      url: https://ciudaddemendoza.gob.ar/tramites/inscripcion-para-curso-de-manipulacion-de-alimentos/
