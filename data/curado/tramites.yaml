      detalle: Automática si sos monotributista (hasta 72 horas hábiles). Si no, alta en Mis Trámites Online de la ATM.
      url: https://atm.mendoza.gov.ar/preguntas-frecuentes/impuesto-sobre-los-ingresos-brutos-2/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Junín
      titulo: Solicitud de habilitación y sellado
      detalle: Se inicia en la Mesa de Entradas (Román Cano e Hipólito Yrigoyen, de lunes a viernes de 7 a 13), para un comercio con lugar fijo o ambulante. Hay que pagar antes un sellado en Rentas. El sitio no publica la lista de documentos a presentar.
      url: https://www.juninmendoza.gov.ar/mesa-de-entradas/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Junín
      titulo: Inspección y habilitación de industria y comercio
      detalle: Con el expediente iniciado y el sellado pagado, Industria y Comercio sigue el trámite. Bromatología, Planificación Urbana y Obras Privadas verifican la infraestructura, la seguridad y la higiene. Una vez otorgado el permiso se paga por única vez un derecho de habilitación, que depende de la actividad y de la categoría que indica el inspector.
      url: https://www.juninmendoza.gov.ar/industria-y-comercio/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Junín
      titulo: Curso de manipulación de alimentos
      detalle: Es requisito para habilitar un comercio de alimentos. Se dicta en Bromatología (Salvador González 525, de lunes a viernes de 7 a 13) y cuesta $12.000 según la página de aranceles.
