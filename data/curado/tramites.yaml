# Catálogo de trámites: recorridos que encadenan los pasos de Nación, Provincia y municipio.
# Lo usa el asistente de la guía de trámites (packages/assistant) y, más adelante, las páginas /tramites.
# Proceso: docs/procesos/tramites-y-tributos.md. Plan: docs/planes/guia-de-tramites.md.
#
# Reglas:
# - Cada paso sale de una página o norma oficial (url) y el recorrido lleva la fecha en que se verificó.
# - Lo que el organismo no publica va en `no_publica`, no se completa con suposiciones.
# - `cuando` dice si el paso aplica siempre o solo a ciertos rubros (`alimentos`).
# - Los rubros apuntan al código del anexo de la ordenanza tarifaria (data/processed/tributos/rubros_comercio.csv),
#   con `nombre_ordenanza` tal cual figura, porque algunos anexos repiten un código para actividades distintas.
#   Un rubro sin `nombre` ni `alimentos` los toma de data/curado/rubros.yaml.
# - `variantes`: otras actividades del mismo anexo que puede ser alguien con ese rubro y que pagan distinto (un kiosco
#   puede ser QUIOSCO INTERIOR o MAXI KIOSCO). El asistente las muestra por separado, cada una con su monto.
# - Solo se cargan los rubros que se mapearon a mano: el asistente no busca por palabras en el anexo. Lo que alguien
#   pide y no está queda en la tabla `assistant_gaps` para sumarlo después.
# - `tasa_comercio.ejercicio`: año de los montos cargados a mano (`manual`).

