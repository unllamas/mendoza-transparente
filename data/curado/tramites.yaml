  pasos:
    - nivel: nacion
      organismo: ARCA
      titulo: CUIT y alta en el monotributo
      detalle: En línea y gratis, con DNI y clave fiscal. El alta toma unos 15 minutos.
      url: https://www.argentina.gob.ar/servicio/inscribirme-como-monotributista
      cuando: siempre
    - nivel: provincia
      organismo: ATM
      titulo: Ingresos Brutos
      detalle: Automática si sos monotributista (hasta 72 horas hábiles). Si no, alta en Mis Trámites Online de la ATM.
      url: https://atm.mendoza.gov.ar/preguntas-frecuentes/impuesto-sobre-los-ingresos-brutos-2/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Luján de Cuyo
      titulo: Factibilidad de uso de suelo
      detalle: Si el rubro o la zona lo requieren, se pide en Ordenamiento Territorial, en persona (Boedo 505), con el formulario, el DNI y la dirección exacta. Sellado de 41 UT.
      url: https://lujandecuyo.gob.ar/tramites-ordenamientoterritorial/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Luján de Cuyo
      titulo: Habilitación de comercio
      detalle: En línea con la Habilitación Comercial Digital Express (Mi Luján Digital) o en persona en Boedo 505, con turno. Pide libre deuda de la propiedad, contrato de alquiler sellado o autorización del dueño, matafuegos, luces de emergencia y disyuntor. Sin habilitación previa, los derechos de comercio suben un 30 %.
      url: https://lujandecuyo.gob.ar/tramites-industriaycomercio/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Luján de Cuyo
      titulo: Categorización ambiental
      detalle: La Unidad de Evaluación Ambiental categoriza el proyecto (bajo, medio o alto impacto) con un formulario enviado por correo. La ficha oficial hoy no abre.
      url: https://lujandecuyo.gob.ar/tramites-ordenamientoterritorial/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Luján de Cuyo
      titulo: Libreta sanitaria y curso de manipulación de alimentos
      detalle: La habilitación las pide si el comercio vende o elabora alimentos.
      url: https://lujandecuyo.gob.ar/habilitacion-digital/
      cuando: alimentos
  costos:
    - concepto: Derecho de comercio
      detalle: Derecho anual en unidades tributarias (UT) según el rubro, la superficie cubierta y el área del departamento, en 6 cuotas bimestrales. La UT vale $235 en 2026. El rubro anexo paga el 20 %, 50 % o 100 % según la superficie (art. 38).
      norma: Ordenanza tarifaria 15095 (2026), arts. 37, 38 y 54 y planilla del Capítulo V
      url: https://boe.mendoza.gov.ar/ (norma 300050, Boletín Oficial 32499 del 19/12/2025)
    - concepto: Habilitación (sellado y aforo)
      detalle: Sellado de 11 UT ($2.585) según la ficha. El aforo por superficie (art. 32) es de 1,5 UT por m² cubierto, y está exceptuado el comercio de cercanía de menos de 100 m². La ficha dice $30 por m².
      norma: Ordenanza tarifaria 15095 (2026), art. 32
      url: https://lujandecuyo.gob.ar/tramites-industriaycomercio/
    - concepto: Curso de manipulación de alimentos
      detalle: 60 UT ($14.100) según la tarifaria 2026; la ficha dice 30 UT.
      norma: Ordenanza tarifaria 15095 (2026), Cap. XI
      url: https://lujandecuyo.gob.ar/tramites-industriaycomercio/
  tasa_comercio:
    periodo: año
    ejercicio: 2026
    unidad: UT
    valor_unidad: 235
    norma_unidad: Ordenanza 15095, art. 54
    norma: Ordenanza tarifaria 15095 (2026), planilla del Capítulo V
    url: https://boe.mendoza.gov.ar/publico/pdf_pedido/80753c9d78a1abdf791fdb3e933cec71a25fb03e86
    nota: Montos del área 1; el valor cambia con los metros cuadrados cubiertos y se paga en 6 cuotas bimestrales.
    manual:
      - rubro: almacen
        min: 500
        max: 2000
      - rubro: kiosco
        min: 500
        max: 2500
      - rubro: ropa
        min: 1000
        max: 6000
      - rubro: rotiseria
        min: 1000
        max: 2500
      - rubro: carniceria
        min: 2000
        max: 6000
  no_publica:
    - que: Cuánto tarda la habilitación
      organismo: Municipalidad de Luján de Cuyo
      detalle: Ninguna ficha publica un plazo.
    - que: Dónde se saca la libreta sanitaria y cuánto cuesta
      organismo: Municipalidad de Luján de Cuyo
      detalle: La habilitación la pide, pero la guía no dice dónde se tramita ni su costo.
    - que: Seguridad contra incendios
      organismo: Municipalidad de Luján de Cuyo
      detalle: No hay ficha ni trámite en Bomberos publicado para un comercio común; solo se piden matafuegos y luces de emergencia.
    - que: Permiso de cartel
      organismo: Municipalidad de Luján de Cuyo
      detalle: La tarifaria cobra un derecho por letreros y exige autorización previa, pero la guía solo tiene un canal para denunciar carteles.
    - que: Qué comercios pagan la categorización ambiental
      organismo: Municipalidad de Luján de Cuyo
      detalle: La tarifaria fija 1000 UT para el bajo impacto, y no dice qué rubros alcanza.
  promocion:
    norma: Ordenanza tarifaria 15095 (2026), arts. 39, 53 bis y 61
    detalle: A pedido, hay seis meses de gracia para comercios de cercanía de hasta 50 m² de un programa municipal, 50 % durante 12 meses para jóvenes de 18 a 29 años en el monotributo A, B o C, y 50 % en zonas turísticas en desarrollo (El Carrizal, Las Compuertas, Cacheuta y Potrerillos).
    url: https://boe.mendoza.gov.ar/publico/pdf_pedido/80753c9d78a1abdf791fdb3e933cec71a25fb03e86

- id: abrir-un-comercio
  titulo: Abrir un comercio
  municipio: Maipú
  verificado: 2026-10-27
  rubros:
    - id: almacen
      nombre: Almacén
      codigo: "7.3.2.1"
      alimentos: true
    - id: kiosco
      nombre: Kiosco
      codigo: "7.3.2.21"
      alimentos: true
    - id: ropa
      nombre: Ropa
      codigo: "7.3.2.37"
      alimentos: false
    - id: rotiseria
      nombre: Comida para llevar
      codigo: "7.4.2.12"
      alimentos: true
    - id: carniceria
      nombre: Carnicería
      codigo: "7.3.2.11"
      alimentos: true
  pasos:
    - nivel: nacion
      organismo: ARCA
      titulo: CUIT y alta en el monotributo
      detalle: En línea y gratis, con DNI y clave fiscal. El alta toma unos 15 minutos.
      url: https://www.argentina.gob.ar/servicio/inscribirme-como-monotributista
      cuando: siempre
    - nivel: provincia
      organismo: ATM
      titulo: Ingresos Brutos
      detalle: Automática si sos monotributista (hasta 72 horas hábiles). Si no, alta en Mis Trámites Online de la ATM.
      url: https://atm.mendoza.gov.ar/preguntas-frecuentes/impuesto-sobre-los-ingresos-brutos-2/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Maipú
      titulo: Factibilidad de uso del suelo
      detalle: Con el padrón, plano, mensura y memoria de la actividad. La piden los comercios que elaboran alimentos, los de más de 50 m2 y los que tienen depósito; en los demás, el trámite empieza directo en la habilitación. Incluye la evaluación ambiental y la de higiene y seguridad.
      url: https://www.maipu.gob.ar/plan-territorial/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Maipú
      titulo: Habilitación e inscripción de comercio
      detalle: Se inicia en la Dirección de Rentas (con turno) o con el formulario de la guía de trámites. Piden DNI o CUIT, contrato de locación o autorización del dueño, cuaderno de habilitación y el certificado de factibilidad si corresponde. Después hay una inspección (matafuego, luz de emergencia, higiene). No hay habilitación provisoria.
      url: https://www.maipu.gob.ar/guia-de-tramites/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Maipú
      titulo: Carnet de manipulación de alimentos
      detalle: Curso presencial de un día, con turno en línea. Cuesta $15.000 y vale 3 años. Es obligatorio para quien manipula alimentos.
      url: https://www.maipu.gob.ar/maipu-mas-de-2-000-vecinos-obtuvieron-su-certificacion-en-manipulacion-de-alimentos/
      cuando: alimentos
    - nivel: municipio
      organismo: Municipalidad de Maipú
      titulo: Permiso de cartel en la vía pública
      detalle: Solo si vas a poner un cartel. Hay que presentar croquis de ubicación y cálculo estructural con un profesional.
      url: https://www.maipu.gob.ar/wp-content/uploads/2023/09/FO-DPT-34-Requisitos-para-Carteleria-en-Vias-Publica-combinado.pdf
      cuando: siempre
  costos:
    - concepto: Derechos de inspección y control de seguridad e higiene
      detalle: Importe fijo por bimestre según el rubro y la categoría (1ª, 2ª o 3ª) que asigna el municipio. Se suma un 10 % para Bomberos Voluntarios y $250 de gasto administrativo por boleta. Pagando todo el año hay un 15 % de descuento.
      norma: Ordenanza tarifaria 7831 (2026), Anexo, art. 7
      url: https://boe.mendoza.gov.ar/default/public/publico/verpdf/d5a21295d434830ab5b54708252039fa3378485c38/anexo
    - concepto: Habilitación
      detalle: Desde 2026 no se cobra el cuaderno de inspección, y la tarifaria exime el derecho de actuación de la habilitación a pequeños contribuyentes y emprendedores en locales chicos y a los trámites hechos por web o correo. La solicitud de actuación cuesta $4.500 (art. 9).
      norma: Ordenanza 7831 (2026), art. 6 y Anexo, art. 9
      url: https://boe.mendoza.gov.ar/publico/pdf_pedido/d5a21295d434830ab5b54708252039fa3378485c84
    - concepto: Curso de manipulación de alimentos
      detalle: $15.000, incluye el certificado.
      norma: Ordenanza 7831 (2026), Anexo, art. 16 inc. 4 ítem 7
      url: https://boe.mendoza.gov.ar/default/public/publico/verpdf/d5a21295d434830ab5b54708252039fa3378485c38/anexo
  tasa_comercio:
    periodo: bimestre
    ejercicio: 2026
    unidad: pesos
    norma: Ordenanza tarifaria 7831 (2026), art. 7 del Anexo
    url: https://boe.mendoza.gov.ar/publico/pdf_pedido/d5a21295d434830ab5b54708252039fa3378485c24
    nota: Se suma un 10 % para Bomberos y $ 250 por boleta. Montos del primer cuatrimestre de 2026; la categoría (1.ª a 3.ª) la asigna el municipio.
    manual:
      - rubro: almacen
        min: 8996.52
        max: 14937.63
        pagina: 33
      - rubro: kiosco
        min: 6704.96
        max: 10778.85
        pagina: 35
      - rubro: ropa
        min: 10778.85
        max: 17908.18
        pagina: 36
      - rubro: rotiseria
        min: 12730.93
        max: 21218.22
        pagina: 42
      - rubro: carniceria
        min: 12730.93
        max: 21218.22
        pagina: 34
  no_publica:
    - que: Cuánto tarda la habilitación y cuánto cuesta hoy el trámite
      organismo: Municipalidad de Maipú
      detalle: La guía de trámites cita un sellado de 2021 y no da plazo; una nota de 2022 habla de 10 días hábiles después de la inspección.
    - que: Qué categoría (1ª, 2ª o 3ª) le toca a cada comercio
      organismo: Municipalidad de Maipú
      detalle: La ordenanza da criterios generales; la asigna Rentas.
    - que: El valor actualizado de los derechos de comercio después del primer cuatrimestre de 2026
      organismo: Municipalidad de Maipú
      detalle: El anexo de la tarifaria dice «1er cuatrimestre 2026» y no se encontró una actualización.
    - que: Los requisitos y el costo del permiso para poner un cartel
      organismo: Municipalidad de Maipú
    - que: Ficha ambiental y verificación contra incendios
      organismo: Municipalidad de Maipú
      detalle: Se evalúan dentro de la factibilidad, «según cada proyecto»; no se publica costo ni plazo.
  promocion:
    norma: Programa de Regularización de Actividades Comerciales (nota municipal del 12/11/2025) y Ordenanza 7831, arts. 34 y 37
    detalle: Los emprendedores de hasta 35 años, o los comercios que contraten menores de 35, pueden pedir la exención de los derechos de habilitación y un 50 % de descuento en tasas y derechos de comercio por un año. La tarifaria también permite eximir el 50 % del derecho de inspección por un año a emprendedores de la Incubadora de Empresas. No se encontró la norma del programa ni se confirmó su vigencia en 2026.
    url: https://www.maipu.gob.ar/maipu-lanza-nuevos-beneficios-para-jovenes-emprendedores/

- id: abrir-un-comercio
  titulo: Abrir un comercio
  municipio: San Rafael
  verificado: 2026-10-27
  rubros:
    - id: almacen
      nombre: Almacén
      codigo: "D"   # rubro de la Tarifaria 2026, art. 29: D hasta 60 m2; B si es mayor o tiene mesas
      alimentos: true
    - id: kiosco
      nombre: Kiosco
      codigo: "D"   # B si tiene anexo permanente de revistas, juguetes, librería o fotocopias
      alimentos: true
    - id: ropa
      nombre: Ropa
      codigo: "A"
      alimentos: false
    - id: rotiseria
      nombre: Comida para llevar
      codigo: "A"
      alimentos: true
    - id: carniceria
      nombre: Carnicería
      codigo: "B"   # no figura por nombre; se clasifica por analogía (sin confirmar)
      alimentos: true
  pasos:
    - nivel: nacion
      organismo: ARCA
      titulo: CUIT y alta en el monotributo
      detalle: En línea y gratis, con DNI y clave fiscal. El alta toma unos 15 minutos.
      url: https://www.argentina.gob.ar/servicio/inscribirme-como-monotributista
      cuando: siempre
    - nivel: provincia
      organismo: ATM
      titulo: Ingresos Brutos
      detalle: Automática si sos monotributista (hasta 72 horas hábiles). Si no, alta en Mis Trámites Online de la ATM.
      url: https://atm.mendoza.gov.ar/preguntas-frecuentes/impuesto-sobre-los-ingresos-brutos-2/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de San Rafael
      titulo: Uso de suelo del local
      detalle: Se consulta en Ordenamiento Territorial. El cuadro de usos por zona (formulario 5741) dice si el rubro está permitido en la zona del local. La consulta no tiene ficha con requisitos ni plazo.
      url: https://www.sanrafael.gov.ar/ordenamientoterritorial/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de San Rafael
      titulo: Habilitación de comercio
      detalle: Se inicia en la Dirección de Recaudación (Comandante Salas y Belgrano) con turno, con fotocopias por duplicado del DNI, el CUIT, el contrato de alquiler o la escritura sellados, el libre deuda de la propiedad y el final de obra. Mientras se tramita se paga el 100 % de la tasa.
      url: https://www.sanrafael.gov.ar/archivos-muni/formularios/apertura-de-comercio.pdf
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de San Rafael
      titulo: Seguridad contra incendios
      detalle: Bomberos solo interviene si el local supera las 100 personas o los 300 m2 (o si el municipio lo pide). Para el resto alcanza con la habilitación municipal.
      url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de San Rafael
      titulo: Curso y carnet de manipulación de alimentos
      detalle: Cuesta $ 15.000 (gratis para jubilados, pensionados y personas con discapacidad). Dónde se hace y cuánto dura no se publica.
      url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
      cuando: alimentos
    - nivel: municipio
      organismo: Municipalidad de San Rafael
      titulo: Permiso de cartel
      detalle: Se pide a la Dirección de Recaudación antes de colocarlo. Hay que cumplir la Ordenanza 13.918 y la Resolución 132; los carteles tipo bandera y monoposte están prohibidos.
      url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
      cuando: siempre
  costos:
    - concepto: Tasa de comercio (inspección, seguridad, higiene)
      detalle: Anual, se paga por bimestre. Es la suma de puntos por zona, rubro, personal y superficie por un valor que depende del rubro y la categoría que asigna Recaudación. No depende de lo que se factura. 15 % de descuento por pago anual.
      norma: Ordenanza tarifaria 15539 (2026), art. 28, 29 y 31
      url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
    - concepto: Inicio del trámite y apertura de comercio
      detalle: $ 5.900 el formulario de inicio y $ 5.900 la apertura. No se pagan si el trámite se inicia por la página web.
      norma: Ordenanza tarifaria 15539 (2026), art. 42
      url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
    - concepto: Certificados de factibilidad y uso de suelo
      detalle: Los certificados de factibilidad son sin cargo en la tarifaria general (art. 35). La tarifaria de Ordenamiento Territorial fija $ 10.000 por certificado emitido (art. 72).
      norma: Ordenanza tarifaria 15539 (2026), art. 35; tarifaria de Ordenamiento Territorial 2026, art. 72
      url: https://www.sanrafael.gov.ar/archivos-muni/ordenamiento-territorial/2026/tarifaria/tarifaria-odenamiento-2026.docx
    - concepto: Cartelería
      detalle: Cartel propio pintado o adosado, $ 3.200 por m2 por año; toldo o saliente, $ 4.420 por m2 por cara por año.
      norma: Ordenanza tarifaria 15539 (2026), art. 141
      url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
  tasa_comercio:
    disponible: false
    norma: Ordenanza tarifaria 15539 (2026), art. 28
    url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
    nota: San Rafael calcula la tasa con puntos por zona, rubro, personal y superficie, y la fórmula publicada está incompleta, así que no se puede dar un monto. Se consulta en la Dirección de Recaudación.
  no_publica:
    - que: Cuánto tarda la habilitación
      organismo: Municipalidad de San Rafael
    - que: Los requisitos y el plazo de la consulta de uso de suelo
      organismo: Municipalidad de San Rafael
    - que: Cómo se asigna la categoría (1ra a 5ta) que fija la tasa de comercio
      organismo: Municipalidad de San Rafael
    - que: Los requisitos del permiso de cartel
      organismo: Municipalidad de San Rafael
    - que: Dónde se tramita la libreta sanitaria y cuánto cuesta
      organismo: Municipalidad de San Rafael
    - que: Si el trámite se puede hacer completo en línea (Ordenanza 15179)
      organismo: Municipalidad de San Rafael
  promocion:
    norma: Ordenanza tarifaria 15539 (2026), art. 29
    detalle: Solo hay exención para industrias nuevas (100 % el primer año y 50 % el segundo). Para un comercio minorista nuevo no encontré un régimen de promoción.
    url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
