    - id: kiosco
      nombre: Kiosco
      codigo: "109"
      alimentos: true
    - id: ropa
      nombre: Ropa
      codigo: "193"
      alimentos: false
    - id: rotiseria
      nombre: Comida para llevar (rotisería)
      codigo: "145"
