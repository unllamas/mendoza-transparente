      detalle: Se inicia un expediente en la Mesa Única de Habilitación de Comercio (Libertad 720, Villa Nueva), con la memoria descriptiva. El certificado vale 180 días. Es obligatorio antes de la habilitación. Hay un informe de viabilidad previo y opcional.
