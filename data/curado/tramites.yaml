      detalle: $12.000 según la página de aranceles del sitio municipal, sin fecha. Otra página de Bromatología dice «veinte pesos», una cifra vieja.
      norma: Página de aranceles de la Dirección de Veterinaria, Bromatología e Inspección de Industria y Comercio
      url: https://www.juninmendoza.gov.ar/aranceles/
  tasa_comercio:
    periodo: año
    ejercicio: 2026
    unidad: pesos
    norma: Ordenanza tarifaria 1020/2025 (ejercicio 2026), Cap. 9, art. 3
    url: https://boe.mendoza.gov.ar/default/public/publico/verpdf/b91c99ea6a74320bc251a97cfe878cf56dd8bdee88/anexo
    nota: Derechos de inspección y control de seguridad e higiene, «anualmente». El anexo es una imagen y los montos se leyeron a mano; trae un valor para la zona 1 y otro para la zona 2, y no define qué calles son de cada zona. El kiosco es el de hasta 12 m2 (con diarios, anexos o café-bar paga más). Para la ropa se tomó «Casas de modas»; «Tiendas» paga más (zona 1, $256.284; zona 2, $197.120).
    manual:
      - rubro: almacen
        min: 58600
        max: 78800
        pagina: 13
      - rubro: kiosco
        min: 51742
        max: 60394
        pagina: 27
      - rubro: ropa
        min: 103484
        max: 124172
        pagina: 15
      - rubro: rotiseria
        min: 215532
        max: 287920
        pagina: 31
      - rubro: carniceria
        min: 198000
        max: 240000
        pagina: 15
  no_publica:
    - que: La lista de documentos para habilitar un comercio
      organismo: Municipalidad de Junín
      detalle: La página «Trámites de habilitación» del sitio no abre y la de Mesa de Entradas solo habla de «documentación a presentar» sin detallarla.
    - que: Cuánto tarda la habilitación y cuánto cuesta el sellado de inicio
      organismo: Municipalidad de Junín
      detalle: La página de sellados lista los trámites que lo requieren, pero no sus montos ni plazos.
    - que: Qué calles son de la zona 1 y de la zona 2
      organismo: Municipalidad de Junín
      detalle: La tarifaria cobra distinto por zona y el anexo no las define.
    - que: Qué categoría (1, 2 o 3) le toca a cada comercio
      organismo: Municipalidad de Junín
      detalle: La asigna el inspector; la ordenanza no da el criterio.
    - que: Ficha ambiental, seguridad contra incendios y permiso de cartel
      organismo: Municipalidad de Junín
      detalle: No se encontró ficha ni requisito publicado para un comercio común.
  promocion:
    norma: Ordenanza tarifaria 1020/2025, considerandos
    detalle: Los considerandos mencionan una propuesta de 30 % de descuento para quien está al día y paga la tasa en forma anual; el articulado publicado no la fija. No se encontró un régimen de promoción para comercios nuevos.
    url: https://boe.mendoza.gov.ar/publico/pdf_pedido/b91c99ea6a74320bc251a97cfe878cf56dd8bdee34

