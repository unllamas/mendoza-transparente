      url: https://tupungato.gov.ar/?p=33907
      cuando: alimentos
  costos:
    - concepto: Tasa de inspección y control de seguridad e higiene
      detalle: Mensual. Se calcula con el índice del rubro, la raíz de los metros cuadrados del local (con un mínimo y, en algunos rubros, un máximo), un coeficiente de 1,25 y el valor de la UT ($ 40).
      norma: Ordenanza tarifaria 11/2026, arts. 35 y 36 y Anexo I
      url: https://tupungato.gov.ar/wp-content/uploads/2026/08/Tarifaria-2026-1.pdf
    - concepto: Inicio de la habilitación
      detalle: Se paga una vez, con la fórmula raíz de los metros cuadrados por el índice por 3 UT. Mientras no tengas la habilitación definitiva se cobra un 50 % más de tasa (art. 34, inc. 4).
      norma: Ordenanza tarifaria 11/2026, art. 34
      url: https://tupungato.gov.ar/wp-content/uploads/2026/08/Tarifaria-2026-1.pdf
    - concepto: Inspección final
      detalle: 600 UT ($ 24.000) para comercios de menos de 200 m2 y 1.500 UT ($ 60.000) para los de más. Si hay que repetirla por algo ajeno al municipio, se cobra otra vez.
      norma: Ordenanza tarifaria 11/2026, art. 34, inc. 7
      url: https://tupungato.gov.ar/wp-content/uploads/2026/08/Tarifaria-2026-1.pdf
  tasa_comercio:
    periodo: mes
    ejercicio: 2026
    unidad: UT
    valor_unidad: 40
    norma_unidad: Ordenanza tarifaria 11/2026, art. 1 (UT = $ 40)
    norma: Ordenanza tarifaria 11/2026, art. 36 y Anexo I
    url: https://tupungato.gov.ar/wp-content/uploads/2026/08/Tarifaria-2026-1.pdf
    nota: La ordenanza no fija un monto por rubro, sino una fórmula (índice x raíz de los m2 x 1,25 x UT). El monto de abajo es el del mínimo de superficie que el anexo manda aforar (20 m2; 30 m2 en comida para llevar), y sube con la raíz de los metros cuadrados reales; el anexo no publica un máximo para estos rubros. Leído a mano del anexo escaneado.
    manual:
      - rubro: almacen
        min: 296.279
        max: 296.279
        pagina: 32
      - rubro: kiosco
        min: 296.279
        max: 296.279
        pagina: 32
      - rubro: ropa
        min: 279.5085
        max: 279.5085
        pagina: 32
      - rubro: rotiseria
        min: 410.7919
        max: 410.7919
        pagina: 30
      - rubro: carniceria
        min: 296.279
        max: 296.279
        pagina: 32
  no_publica:
    - que: Cuánto tarda la factibilidad y la habilitación
      organismo: Municipalidad de Tupungato
      detalle: Los documentos de cada trámite describen las etapas y no dan plazos.
    - que: Cuánto cuesta hoy el carnet de manipulación de alimentos y cuándo es el próximo curso
      organismo: Municipalidad de Tupungato
      detalle: El aviso más reciente que encontramos es de enero de 2024 y remite al boleto de Rentas.
    - que: Qué rubro de la tarifaria le toca a un almacén, un kiosco o una carnicería
      organismo: Municipalidad de Tupungato
      detalle: El Anexo I no los nombra; los agrupa en «venta de artículos alimenticios». La clasificación es nuestra y falta confirmarla.
    - que: Los requisitos y el costo del permiso para poner un cartel
      organismo: Municipalidad de Tupungato
    - que: Si hay ficha ambiental o verificación de bomberos para un comercio chico
      organismo: Municipalidad de Tupungato
      detalle: Los requisitos del trámite no los mencionan.
    - que: La tarifaria en un formato que se pueda leer y copiar
      organismo: Municipalidad de Tupungato
      detalle: La Ordenanza 11/2026 está publicada como imágenes escaneadas, sin texto.
  promocion:
    norma: Ordenanza tarifaria 11/2026, art. 34, inc. 5
    detalle: Los comercios de los rubros 3300, 3400 y 3500 (venta de artículos alimenticios, no alimenticios y conjunta) no pagan la tasa de inspección y control los primeros 3 bimestres desde el inicio del registro, si no superan los 20 m2.
    url: https://tupungato.gov.ar/wp-content/uploads/2026/08/Tarifaria-2026-1.pdf

- id: abrir-un-comercio
  titulo: Abrir un comercio
  municipio: Lavalle
  verificado: 2026-10-27
  rubros:
    - id: almacen
      nombre: Almacén (rubro «Despensas»)
      codigo: "60"   # Art. 16, inc. 60; la ordenanza no tiene un rubro «Almacén»: se mapeó a Despensas (sin confirmar)
      alimentos: true
    - id: kiosco
      nombre: Kiosco
      codigo: "103"
      alimentos: true
    - id: ropa
      nombre: Ropa (rubro «Tienda de ropa»)
      codigo: "28"
      alimentos: false
    - id: rotiseria
      nombre: Comida para llevar (rotisería)
      codigo: "143"
      alimentos: true
    - id: carniceria
      nombre: Carnicería
      codigo: "36"
      alimentos: true
  pasos:
    - nivel: nacion
      organismo: ARCA
      titulo: CUIT y alta en el monotributo
      detalle: En línea y gratis, con DNI y clave fiscal. El alta toma unos 15 minutos.
      url: https://www.argentina.gob.ar/servicio/inscribirme-como-monotributista
      cuando: siempre
    - nivel: provincia
      organismo: ATM
      titulo: Ingresos Brutos
      detalle: Automática si sos monotributista (hasta 72 horas hábiles). Si no, alta en Mis Trámites Online de la ATM.
      url: https://atm.mendoza.gov.ar/preguntas-frecuentes/impuesto-sobre-los-ingresos-brutos-2/
      cuando: siempre
  costos:
    - concepto: Derecho de inspección y control de seguridad e higiene (tasa de comercio)
      detalle: Se paga por bimestre, en Unidades Tributarias Municipales (UTM), según el rubro y su categoría. Si hay una actividad principal y anexas, la principal paga el 100 % y cada anexa el 50 %. La ordenanza prevé ponderar el monto por zona, superficie del local y tipo de actividad, pero no dice si ya se aplica. Los clubes sociales y asociaciones civiles sin fines de lucro están exentos.
      norma: Ordenanza tarifaria 1284 (2026), art. 16, 18 y 20
      url: https://boe.mendoza.gov.ar/publico/pdf_pedido/1a1cdff7a8e3204f3be7614698a5f17f9a8900e878
  tasa_comercio:
    periodo: bimestre
    ejercicio: 2026
    unidad: UTM
    valor_unidad: 85
    norma_unidad: Ordenanza 1284 (2026), art. 2, promulgada por el Decreto 4/2026
    norma: Ordenanza tarifaria 1284 (2026), art. 16
    url: https://boe.mendoza.gov.ar/publico/pdf_pedido/1a1cdff7a8e3204f3be7614698a5f17f9a8900e878
    nota: El anexo del Boletín es una imagen sin texto y los montos se leyeron a mano. El rango va de la categoría más baja a la más alta del rubro, y Lavalle no publica cómo asigna la categoría. El valor de la UTM puede ajustarse cada cuatrimestre según el IPC de Mendoza.
    manual:
      - rubro: almacen
        min: 116
        max: 184
        pagina: 6
      - rubro: kiosco
        min: 85
        max: 180
        pagina: 8
      - rubro: ropa
        min: 120
        max: 212
        pagina: 5
      - rubro: rotiseria
        min: 90
        max: 170
        pagina: 9
      - rubro: carniceria
        min: 152
        max: 336
        pagina: 5
  no_publica:
    - que: Cómo se hace la habilitación de un comercio (requisitos, dónde, cuánto tarda y cuánto cuesta)
      organismo: Municipalidad de Lavalle
      detalle: No se encontró un sitio oficial del municipio. El Boletín solo trae la tarifaria y ordenanzas sueltas.
    - que: La consulta de uso de suelo del local
      organismo: Municipalidad de Lavalle
    - que: Qué categoría (A, B, C o D) le toca a cada comercio
      organismo: Municipalidad de Lavalle
      detalle: La tarifaria fija un monto por categoría, pero no dice con qué criterio se asigna.
    - que: Si ya se aplica la ponderación por zona, superficie y tipo de actividad del art. 20
      organismo: Municipalidad de Lavalle
    - que: Curso o libreta de manipulación de alimentos, seguridad contra incendios y permiso de cartel
      organismo: Municipalidad de Lavalle
    - que: El valor actualizado de la UTM después del primer cuatrimestre de 2026
      organismo: Municipalidad de Lavalle
      detalle: La ordenanza permite ajustarlo por IPC cada cuatrimestre; no se encontró un acto que lo haga.
