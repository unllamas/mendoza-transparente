      titulo: Habilitación de comercio
      detalle: Se inicia en la Dirección de Recaudación (Comandante Salas y Belgrano) con turno, con fotocopias por duplicado del DNI, el CUIT, el contrato de alquiler o la escritura sellados, el libre deuda de la propiedad y el final de obra. Mientras se tramita se paga el 100 % de la tasa.
      url: https://www.sanrafael.gov.ar/archivos-muni/formularios/apertura-de-comercio.pdf
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de San Rafael
      titulo: Seguridad contra incendios
      detalle: Bomberos solo interviene si el local supera las 100 personas o los 300 m2 (o si el municipio lo pide). Para el resto alcanza con la habilitación municipal.
      url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de San Rafael
      titulo: Curso y carnet de manipulación de alimentos
      detalle: Cuesta $ 15.000 (gratis para jubilados, pensionados y personas con discapacidad). Dónde se hace y cuánto dura no se publica.
      url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
      cuando: alimentos
    - nivel: municipio
      organismo: Municipalidad de San Rafael
      titulo: Permiso de cartel
      detalle: Se pide a la Dirección de Recaudación antes de colocarlo. Hay que cumplir la Ordenanza 13.918 y la Resolución 132; los carteles tipo bandera y monoposte están prohibidos.
      url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
      cuando: siempre
  costos:
    - concepto: Tasa de comercio (inspección, seguridad, higiene)
      detalle: Anual, se paga por bimestre. Es la suma de puntos por zona, rubro, personal y superficie por un valor que depende del rubro y la categoría que asigna Recaudación. No depende de lo que se factura. 15 % de descuento por pago anual.
      norma: Ordenanza tarifaria 15539 (2026), art. 28, 29 y 31
      url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
    - concepto: Inicio del trámite y apertura de comercio
      detalle: $ 5.900 el formulario de inicio y $ 5.900 la apertura. No se pagan si el trámite se inicia por la página web.
      norma: Ordenanza tarifaria 15539 (2026), art. 42
      url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
    - concepto: Certificados de factibilidad y uso de suelo
      detalle: Los certificados de factibilidad son sin cargo en la tarifaria general (art. 35). La tarifaria de Ordenamiento Territorial fija $ 10.000 por certificado emitido (art. 72).
      norma: Ordenanza tarifaria 15539 (2026), art. 35; tarifaria de Ordenamiento Territorial 2026, art. 72
      url: https://www.sanrafael.gov.ar/archivos-muni/ordenamiento-territorial/2026/tarifaria/tarifaria-odenamiento-2026.docx
    - concepto: Cartelería
      detalle: Cartel propio pintado o adosado, $ 3.200 por m2 por año; toldo o saliente, $ 4.420 por m2 por cara por año.
      norma: Ordenanza tarifaria 15539 (2026), art. 141
      url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
  tasa_comercio:
    disponible: false
    norma: Ordenanza tarifaria 15539 (2026), art. 28
    url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf
    nota: San Rafael calcula la tasa con puntos por zona, rubro, personal y superficie, y la fórmula publicada está incompleta, así que no se puede dar un monto. Se consulta en la Dirección de Recaudación.
  no_publica:
    - que: Cuánto tarda la habilitación
      organismo: Municipalidad de San Rafael
    - que: Los requisitos y el plazo de la consulta de uso de suelo
      organismo: Municipalidad de San Rafael
    - que: Cómo se asigna la categoría (1ra a 5ta) que fija la tasa de comercio
      organismo: Municipalidad de San Rafael
    - que: Los requisitos del permiso de cartel
      organismo: Municipalidad de San Rafael
    - que: Dónde se tramita la libreta sanitaria y cuánto cuesta
      organismo: Municipalidad de San Rafael
    - que: Si el trámite se puede hacer completo en línea (Ordenanza 15179)
      organismo: Municipalidad de San Rafael
  promocion:
    norma: Ordenanza tarifaria 15539 (2026), art. 29
    detalle: Solo hay exención para industrias nuevas (100 % el primer año y 50 % el segundo). Para un comercio minorista nuevo no encontré un régimen de promoción.
    url: https://www.sanrafael.gov.ar/archivos-muni/tarifaria/tarifaria-2026.pdf

- id: abrir-un-comercio
  titulo: Abrir un comercio
  municipio: San Martín
  verificado: 2026-10-27
  rubros:
    - id: almacen
      nombre: Almacén
      codigo: "82.5.4.1"
      nombre_ordenanza: "Local con venta de artículos varios sin carnes."
      alimentos: true
    - id: kiosco
      nombre: Kiosco
      codigo: "82.5.6"
      nombre_ordenanza: "Kioscos (incluye golosinas, galletitas, bebidas, cerveza, cigarrillos, y sus afines)."
      alimentos: true
    - id: ropa
      nombre: Ropa
      codigo: "83.2.3"
      nombre_ordenanza: "Venta de prendas de vestir y elementos personales en general sin calzado."
      alimentos: false
    - id: rotiseria
      nombre: Comida para llevar
      codigo: "82.6.1"
      nombre_ordenanza: "Rotisería, pizzería y cocina en general (sólo para llevar)."
      alimentos: true
    - id: carniceria
      nombre: Carnicería
      codigo: "82.5.4.3"
      nombre_ordenanza: "Venta de carnes rojas y/o blancas exclusivamente (pescado, pollo, mariscos)."
      alimentos: true
  pasos:
    - nivel: nacion
      organismo: ARCA
      titulo: CUIT y alta en el monotributo
      detalle: En línea y gratis, con DNI y clave fiscal. El alta toma unos 15 minutos.
      url: https://www.argentina.gob.ar/servicio/inscribirme-como-monotributista
      cuando: siempre
    - nivel: provincia
      organismo: ATM
      titulo: Ingresos Brutos
      detalle: Automática si sos monotributista (hasta 72 horas hábiles). Si no, alta en Mis Trámites Online de la ATM.
      url: https://atm.mendoza.gov.ar/preguntas-frecuentes/impuesto-sobre-los-ingresos-brutos-2/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de General San Martín
      titulo: Habilitación de comercio
      detalle: El municipio no publica la guía del trámite. La tarifaria dice que se parte de un acta de preclasificación, que la habilitación queda registrada en un acta y que, para cualquier trámite, hay que tener regularizadas las deudas con el municipio (certificado libre de deuda o plan de pago vigente).
      url: https://boe.mendoza.gov.ar/default/public/publico/verpdf/bd8bb8364c30e32a8d19dfdcc18d30f15f9bffa862/anexo
      cuando: siempre
  costos:
    - concepto: Derechos de inspección y control de seguridad e higiene en comercios e industrias
      detalle: Importe en Unidades Tributarias según el rubro y la categoría (1.ª, 2.ª o 3.ª) que asigna el municipio. Cambia según la zona del local (art. 115). Se paga en seis cuotas bimestrales o en un pago anual anticipado, con hasta 10 % de descuento.
      norma: Ordenanza tarifaria 3189/2024, Título 15 y arts. 113 y 115; UT 2026 fijada por la Ordenanza 3229
      url: https://boe.mendoza.gov.ar/default/public/publico/verpdf/bd8bb8364c30e32a8d19dfdcc18d30f15f9bffa862/anexo
  tasa_comercio:
    periodo: año
    ejercicio: 2026
    unidad: UT
    valor_unidad: 83
    norma_unidad: Ordenanza 3229, art. 4 (modifica el art. 112 de la 3189/2024)
    norma: Ordenanza tarifaria 3189/2024, Título 15 (art. 82 y siguientes), modificada por la 3229
    url: https://boe.mendoza.gov.ar/default/public/publico/verpdf/bd8bb8364c30e32a8d19dfdcc18d30f15f9bffa862/anexo
    nota: El rango va de la categoría 3.ª a la 1.ª, en la zona 2. La ordenanza suma un 5 % en la zona 1 y resta un 5 % en las zonas 3, 4 y 5 (más un 5 % en ciertas calles céntricas). Para los comercios que todavía no fueron reclasificados, la UT es de $ 156,60. La ordenanza no dice si el importe del cuadro es por año o por bimestre; la tomamos como anual porque permite pagarla en seis cuotas o en un pago anual anticipado.
    manual:
      - rubro: almacen
        min: 1000
        max: 2333
        pagina: 33
      - rubro: kiosco
        min: 1000
        max: 2000
        pagina: 34
      - rubro: ropa
        min: 1466
        max: 2333
        pagina: 36
      - rubro: rotiseria
        min: 1500
        max: 2333
        pagina: 34
      - rubro: carniceria
        min: 1800
        max: 3500
        pagina: 33
  no_publica:
    - que: Cómo se tramita la habilitación y cuánto tarda
      organismo: Municipalidad de General San Martín
      detalle: El sitio no tiene una guía de trámites ni una ficha de habilitación comercial; no hay requisitos, canal ni plazo publicados.
    - que: Qué categoría (1.ª, 2.ª o 3.ª) le toca a cada comercio
      organismo: Municipalidad de General San Martín
      detalle: La ordenanza da criterios generales (superficie, calidad del local, personal, competencia) y faculta al Ejecutivo a reglamentarlos; no hay una tabla.
    - que: Si el importe de los derechos de comercio es anual o bimestral
      organismo: Municipalidad de General San Martín
      detalle: El cuadro no lo dice; solo la bodega aclara «tasa fija anual».
    - que: Cuál UT se aplica a un comercio nuevo ($ 83 o $ 156,60)
      organismo: Municipalidad de General San Martín
      detalle: La ordenanza distingue comercios «reclasificados por la nueva ordenanza» de los que no, y no explica quién es cuál.
    - que: Dónde se hace el curso de manipulación de alimentos y cuánto cuesta
      organismo: Municipalidad de General San Martín
    - que: Cartel, ficha ambiental y Bomberos
      organismo: Municipalidad de General San Martín
      detalle: La tarifaria cobra derechos de publicidad, pero no hay trámite ni requisitos publicados para un comercio común.
  promocion:
    norma: Ordenanza tarifaria 3189/2024, art. 113.6, en la redacción de la Ordenanza 3229
    detalle: Los comercios que inicien el trámite de habilitación durante 2026 quedan exentos de los derechos de inspección y control durante seis bimestres, contados desde el acta de preclasificación o desde la inscripción en ATM o ARCA. Además, el Ejecutivo puede reducir hasta 50 % a los emprendimientos de centros comerciales que agrupan actividades.
    url: https://boe.mendoza.gov.ar/default/public/publico/verpdf/9b6b8be67945ee877a71746c01cb0888e3cc230066/anexo
- id: abrir-un-comercio
