      codigo: "20.1.b"
      alimentos: true
    - id: kiosco
      nombre: Kiosco (en la propiedad privada)
      codigo: "20.81.b"
      alimentos: true
    - id: ropa
      nombre: Ropa (rubro «Roperías, venta de ropa varia»)
      codigo: "20.125.a"
      alimentos: false
    - id: rotiseria
      nombre: Comida para llevar (rubro «Rotiserías»)
      codigo: "20.121.a"
      alimentos: true
    - id: carniceria
      nombre: Carnicería (rubro «Puesto fijo»)
      codigo: "20.33.a"
      alimentos: true
  pasos:
    - nivel: nacion
      organismo: ARCA
      titulo: CUIT y alta en el monotributo
      detalle: En línea y gratis, con DNI y clave fiscal. El alta toma unos 15 minutos.
      url: https://www.argentina.gob.ar/servicio/inscribirme-como-monotributista
      cuando: siempre
    - nivel: provincia
      organismo: ATM
      titulo: Ingresos Brutos
      detalle: Automática si sos monotributista (hasta 72 horas hábiles). Si no, alta en Mis Trámites Online de la ATM.
      url: https://atm.mendoza.gov.ar/preguntas-frecuentes/impuesto-sobre-los-ingresos-brutos-2/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Tunuyán
      titulo: Habilitación comercial
      detalle: La Dirección de Desarrollo Económico orienta y acompaña los procesos de habilitación, inscripción y formalización. El sitio municipal no publica los requisitos, el formulario ni el lugar donde se presenta.
      url: https://www.tunuyan.gov.ar/site/direccion-de-desarrollo-economico/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Tunuyán
      titulo: Curso y carnet de manipulación de alimentos
      detalle: La Dirección de Inspección General y Desarrollo Económico dictan el curso, que da el Carnet Nacional de Manipulación de Alimentos, con validez de tres años. El sitio no dice si la habilitación lo pide ni cuánto cuesta.
      url: https://www.tunuyan.gov.ar/site/curso-de-manipulacion-de-alimentos-para-galpones-de-empaque/
      cuando: alimentos
  costos:
    - concepto: Derecho de inspección de seguridad e higiene
      detalle: Importe anual según el rubro (Capítulo III, art. 20), con tasa mínima de $ 1.000 por establecimiento. La ordenanza tiene dos categorías de comercio (Cat. N° 1 y Cat. N° 2) y una categoría única, y no dice en lo leído cuál le toca a cada comercio.
      norma: Ordenanza tarifaria 3351 (2026), anexo del decreto 7, Capítulo III, art. 20
      url: https://boe.mendoza.gov.ar/default/public/publico/verpdf/7d3813d85832eccc93b10b7ff77d0ab6010b71eb42/anexo
  tasa_comercio:
    periodo: año
    ejercicio: 2026
    unidad: pesos
    norma: Ordenanza tarifaria 3351 (2026), anexo del decreto 7, Capítulo III, art. 20
    url: https://boe.mendoza.gov.ar/default/public/publico/verpdf/7d3813d85832eccc93b10b7ff77d0ab6010b71eb42/anexo
    nota: Anexo escaneado, leído a mano. El rango va de la Cat. N° 2 a la Cat. N° 1; la ordenanza no dice cuál le toca a cada comercio. Además se paga la tasa por servicios a la propiedad (Capítulo I). Para el kiosco se tomó el de la propiedad privada; el súper kiosco o drugstore paga de $ 3.000 a $ 5.500 y el minimarket de $ 6.000 a $ 8.000.
    manual:
      - rubro: almacen
        min: 6000
        max: 8000
        pagina: 4
      - rubro: kiosco
        min: 2000
        max: 2800
        pagina: 16
      - rubro: ropa
        min: 1500
        max: 2500
        pagina: 18
      - rubro: rotiseria
        min: 4000
        max: 6500
        pagina: 18
      - rubro: carniceria
        min: 4000
        max: 7500
        pagina: 8
  no_publica:
    - que: Requisitos, formulario y costo de la habilitación comercial
      organismo: Municipalidad de Tunuyán
      detalle: El sitio solo dice que Desarrollo Económico acompaña el proceso. La Oficina Virtual es una aplicación que no se puede leer sin entrar.
    - que: Cuánto tarda la habilitación
      organismo: Municipalidad de Tunuyán
      detalle: Ninguna página oficial publica un plazo.
    - que: Qué categoría (N° 1 o N° 2) le toca a cada comercio
      organismo: Municipalidad de Tunuyán
      detalle: La ordenanza tiene dos columnas de montos y una única, y en lo leído no define cuál corresponde.
    - que: Valor de la Unidad Tributaria Municipal (UTM)
      organismo: Municipalidad de Tunuyán
      detalle: La ordenanza usa la UTM para los vehículos gastronómicos (200 UTM por día y 500 por mes) y no se encontró el decreto que fija su valor.
    - que: Seguridad contra incendios
      organismo: Municipalidad de Tunuyán
      detalle: No hay ficha ni trámite en Bomberos publicado en el sitio municipal para un comercio común.
    - que: Permiso de cartel
      organismo: Municipalidad de Tunuyán
      detalle: El sitio no publica el trámite ni el costo; la ordenanza cobra un derecho por letreros luminosos.

