  promocion:
    norma: Programa Aforo cero y programa Guaymallén invierte con vos
    detalle: Los comercios nuevos no pagan aforos de factibilidad ni de habilitación. Además, el programa Guaymallén invierte con vos devolvía el 40 % de la inversión en el local (mitad en efectivo, mitad en crédito fiscal), con tope de $10.000.000 según una página y de $4.000.000 según otra. No se confirmó si sigue abierto en 2026.
    url: https://www.guaymallen.gob.ar/guaymallen-invierte-con-vos/

- id: abrir-un-comercio
  titulo: Abrir un comercio
  municipio: Luján de Cuyo
  verificado: 2026-10-27
  rubros:
    - id: almacen
      nombre: Almacén (rubro «Despensas»)
      codigo: "45"
      alimentos: true
    - id: kiosco
      nombre: Kiosco
      codigo: "109"
      alimentos: true
    - id: ropa
      nombre: Ropa
      codigo: "193"
      alimentos: false
    - id: rotiseria
      nombre: Comida para llevar (rotisería)
      codigo: "145"
      alimentos: true
    - id: carniceria
      nombre: Carnicería
      codigo: "28"
      alimentos: true
  pasos:
    - nivel: nacion
      organismo: ARCA
      titulo: CUIT y alta en el monotributo
      detalle: En línea y gratis, con DNI y clave fiscal. El alta toma unos 15 minutos.
      url: https://www.argentina.gob.ar/servicio/inscribirme-como-monotributista
      cuando: siempre
    - nivel: provincia
      organismo: ATM
      titulo: Ingresos Brutos
      detalle: Automática si sos monotributista (hasta 72 horas hábiles). Si no, alta en Mis Trámites Online de la ATM.
      url: https://atm.mendoza.gov.ar/preguntas-frecuentes/impuesto-sobre-los-ingresos-brutos-2/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Luján de Cuyo
      titulo: Factibilidad de uso de suelo
      detalle: Si el rubro o la zona lo requieren, se pide en Ordenamiento Territorial, en persona (Boedo 505), con el formulario, el DNI y la dirección exacta. Sellado de 41 UT.
      url: https://lujandecuyo.gob.ar/tramites-ordenamientoterritorial/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Luján de Cuyo
      titulo: Habilitación de comercio
      detalle: En línea con la Habilitación Comercial Digital Express (Mi Luján Digital) o en persona en Boedo 505, con turno. Pide libre deuda de la propiedad, contrato de alquiler sellado o autorización del dueño, matafuegos, luces de emergencia y disyuntor. Sin habilitación previa, los derechos de comercio suben un 30 %.
      url: https://lujandecuyo.gob.ar/tramites-industriaycomercio/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Luján de Cuyo
      titulo: Categorización ambiental
      detalle: La Unidad de Evaluación Ambiental categoriza el proyecto (bajo, medio o alto impacto) con un formulario enviado por correo. La ficha oficial hoy no abre.
      url: https://lujandecuyo.gob.ar/tramites-ordenamientoterritorial/
      cuando: siempre
    - nivel: municipio
      organismo: Municipalidad de Luján de Cuyo
      titulo: Libreta sanitaria y curso de manipulación de alimentos
      detalle: La habilitación las pide si el comercio vende o elabora alimentos.
      url: https://lujandecuyo.gob.ar/habilitacion-digital/
      cuando: alimentos
  costos:
    - concepto: Derecho de comercio
      detalle: Derecho anual en unidades tributarias (UT) según el rubro, la superficie cubierta y el área del departamento, en 6 cuotas bimestrales. La UT vale $235 en 2026. El rubro anexo paga el 20 %, 50 % o 100 % según la superficie (art. 38).
      norma: Ordenanza tarifaria 15095 (2026), arts. 37, 38 y 54 y planilla del Capítulo V
      url: https://boe.mendoza.gov.ar/ (norma 300050, Boletín Oficial 32499 del 19/12/2025)
    - concepto: Habilitación (sellado y aforo)
      detalle: Sellado de 11 UT ($2.585) según la ficha. El aforo por superficie (art. 32) es de 1,5 UT por m² cubierto, y está exceptuado el comercio de cercanía de menos de 100 m². La ficha dice $30 por m².
      norma: Ordenanza tarifaria 15095 (2026), art. 32
      url: https://lujandecuyo.gob.ar/tramites-industriaycomercio/
    - concepto: Curso de manipulación de alimentos
      detalle: 60 UT ($14.100) según la tarifaria 2026; la ficha dice 30 UT.
      norma: Ordenanza tarifaria 15095 (2026), Cap. XI
      url: https://lujandecuyo.gob.ar/tramites-industriaycomercio/
  tasa_comercio:
    periodo: año
    ejercicio: 2026
    unidad: UT
    valor_unidad: 235
    norma_unidad: Ordenanza 15095, art. 54
    norma: Ordenanza tarifaria 15095 (2026), planilla del Capítulo V
    url: https://boe.mendoza.gov.ar/publico/pdf_pedido/80753c9d78a1abdf791fdb3e933cec71a25fb03e86
    nota: Montos del área 1; el valor cambia con los metros cuadrados cubiertos y se paga en 6 cuotas bimestrales.
    manual:
      - rubro: almacen
        min: 500
        max: 2000
      - rubro: kiosco
        min: 500
        max: 2500
      - rubro: ropa
        min: 1000
        max: 6000
      - rubro: rotiseria
        min: 1000
        max: 2500
      - rubro: carniceria
        min: 2000
        max: 6000
  no_publica:
    - que: Cuánto tarda la habilitación
      organismo: Municipalidad de Luján de Cuyo
      detalle: Ninguna ficha publica un plazo.
    - que: Dónde se saca la libreta sanitaria y cuánto cuesta
      organismo: Municipalidad de Luján de Cuyo
      detalle: La habilitación la pide, pero la guía no dice dónde se tramita ni su costo.
    - que: Seguridad contra incendios
      organismo: Municipalidad de Luján de Cuyo
      detalle: No hay ficha ni trámite en Bomberos publicado para un comercio común; solo se piden matafuegos y luces de emergencia.
    - que: Permiso de cartel
      organismo: Municipalidad de Luján de Cuyo
      detalle: La tarifaria cobra un derecho por letreros y exige autorización previa, pero la guía solo tiene un canal para denunciar carteles.
    - que: Qué comercios pagan la categorización ambiental
      organismo: Municipalidad de Luján de Cuyo
      detalle: La tarifaria fija 1000 UT para el bajo impacto, y no dice qué rubros alcanza.
  promocion:
    norma: Ordenanza tarifaria 15095 (2026), arts. 39, 53 bis y 61
    detalle: A pedido, hay seis meses de gracia para comercios de cercanía de hasta 50 m² de un programa municipal, 50 % durante 12 meses para jóvenes de 18 a 29 años en el monotributo A, B o C, y 50 % en zonas turísticas en desarrollo (El Carrizal, Las Compuertas, Cacheuta y Potrerillos).
    url: https://boe.mendoza.gov.ar/publico/pdf_pedido/80753c9d78a1abdf791fdb3e933cec71a25fb03e86

