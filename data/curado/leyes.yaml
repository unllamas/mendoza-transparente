  titulo: Agente encubierto digital y pedido de datos en investigaciones
  tema: Seguridad y justicia
  resumen: "Agrega al Código Procesal Penal herramientas para investigar delitos por medios digitales: agente encubierto digital, órdenes para entregar o conservar datos informáticos y registro de dispositivos."
  a_quien: Personas investigadas, empresas de internet y telecomunicaciones, fiscales
  municipios: []
  puntos:
    - El fiscal puede pedir al juez un agente encubierto digital hasta 180 días en delitos graves por medios informáticos. No puede usar fotos de personas reales.
    - El fiscal puede ordenar a personas y empresas, incluidos proveedores de internet, entregar datos de identificación o ubicación de un usuario, en secreto.
    - Puede ordenar conservar datos informáticos concretos hasta 90 días, prorrogables por otros 90 si siguen los motivos.
    - Con orden del juez se puede registrar y secuestrar un dispositivo informático. Al terminar el proceso se devuelve, salvo lo decomisado.
  no_dice:
