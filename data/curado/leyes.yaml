- numero: "9599"
  titulo: El sistema digital de gestión educativa pasa a ser obligatorio
  tema: Educación
  resumen: Las escuelas de la Dirección General de Escuelas deberán usar el sistema Gestión Educativa Integral (G.E.I.) como registro oficial de alumnos, notas y asistencia, y como canal digital oficial con las familias.
  a_quien: Escuelas estatales, docentes, familias y estudiantes de Mendoza
  municipios: []
  puntos:
    - Alumnos, asistencia, calificaciones, sanciones, certificados y títulos cargados en el sistema tienen carácter de información oficial.
    - Es el canal oficial y directo de comunicación digital con las familias, según el perfil de acceso de cada persona.
    - Cada escuela debe designar un responsable de carga, que responde por la veracidad de los datos y puede ser sancionado si los omite o los carga incompletos.
    - También se sanciona usar los perfiles de acceso para otros fines o intercambiar información sin respetar el procedimiento fijado.
  no_dice: []
