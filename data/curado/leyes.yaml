  titulo: Aprueba donaciones de terrenos en Lavalle y San Carlos para AySAM
  tema: Ambiente y agua
  resumen: La Legislatura ratifica dos decretos que aceptan donaciones de las municipalidades de Lavalle, un inmueble, y de San Carlos, dos fracciones, a la Provincia, para que las use AySAM, la empresa de agua y saneamiento. Las donaciones son con cargo.
  a_quien: Usuarios del servicio de agua y cloacas en Lavalle y San Carlos
  municipios:
    - Lavalle
    - San Carlos
  puntos:
