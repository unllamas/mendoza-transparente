  titulo: Los centros de primera infancia pasan a depender de la DGE
  tema: Educación
  resumen: Los centros de desarrollo infantil y de primera infancia pasan a la Dirección General de Escuelas, y atienden a niños desde 45 días hasta 17 años con educación, comida y acompañamiento familiar. Se mantiene un equipo de guardia de protección de niños las 24 horas.
