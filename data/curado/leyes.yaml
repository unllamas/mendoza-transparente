  puntos:
    - Son los polígonos 3, 4 y 6 del Plano de Mensura 03-39565, en Uspallata, con 6 ha 8.774,21 m2 en total.
    - La Provincia expropia y los destina a actividades turísticas, deportivas y comerciales de montaña y descanso, sola o con terceros.
    - Puede compensar las deudas que tenga el expropiado con el precio de la expropiación.
    - Puede ceder sin cargo tierras para calles y obras, y dar a concesionarios opción de compra donde se construyan alojamientos turísticos.
  no_dice:
    - "Cuánto se pagará por la expropiación: los gastos salen del Presupuesto, pero la ley no da monto."
