# Resúmenes en lenguaje simple de las leyes, hechos con IA a partir del texto oficial (scripts/resumir-leyes.ts).
# Se pueden corregir a mano: al revisar uno, agregar "revisado: AAAA-MM-DD". Criterios en docs/procesos/metodologia.md.

- numero: "9736"
  titulo: Irrigación expropia un terreno en Corralitos para tratar efluentes
  tema: Ambiente y agua
  resumen: Declara de utilidad pública, es decir, expropiable, un terreno rural cultivado de unas 9 hectáreas en Los Corralitos, Guaymallén. Ahí se armarán humedales artificiales para tratar los efluentes industriales del Colector Pescara. Expropia el Departamento General de Irrigación, que paga los gastos.
  a_quien: Vecinos de Los Corralitos, industrias que vuelcan al Colector Pescara y el dueño del terreno
  municipios:
    - Guaymallén
  puntos:
    - El terreno está sobre calle Godoy Cruz, en Los Corralitos, y mide 9,56 ha según el título y 9,30 ha según la mensura.
    - Se usará para humedales artificiales, es decir, lagunas con plantas que limpian el agua, para tratar los efluentes de las industrias que administra la Inspección Desagües Industriales Colector Pescara.
    - Quien expropia es el Departamento General de Irrigación, que también paga todos los gastos.
  no_dice:
    - Cuánto se pagará al dueño por el terreno.
    - Cuándo empiezan las obras y cuánto costarán.
  hecho_con: claude-opus
  fecha: 2026-10-15
- numero: "9732"
  titulo: Las empresas de turismo aventura podrán usar vehículos de apoyo
  tema: Producción
  resumen: Las empresas de turismo aventura inscriptas en el registro provincial podrán usar vehículos de apoyo para llevar a sus clientes, el equipo y la logística, pero solo dentro de las zonas habilitadas por el Ente de Turismo (EMETUR).
  a_quien: Empresas de turismo aventura y quienes contratan sus excursiones
  municipios: []
  puntos:
    - Los vehículos pueden llevar a los clientes, transportar equipos, hacer abastecimiento, asistencia y otras tareas de la actividad.
    - Solo pueden circular en las zonas o circuitos que habilite el EMETUR; fuera de ellos está prohibido usarlos para la actividad.
    - Tienen que estar registrados ante la autoridad, con cédula, seguro y revisión técnica al día, y no pueden tener más de 20 años de antigüedad.
  no_dice:
    - Qué zonas o circuitos quedan habilitados.
    - Qué requisitos extra fijará la autoridad para cada tipo de turismo aventura.
  hecho_con: claude-opus
  fecha: 2026-10-15
- numero: "9735"
  titulo: Nuevas reglas para juzgar a adolescentes acusados de delitos
  tema: Seguridad y justicia
  resumen: Mendoza adapta a la nueva ley nacional (27.801) la forma de juzgar a adolescentes acusados de delitos y define cómo cumplen lo que decide el juez, encerrados o en su barrio.
  a_quien: Adolescentes acusados de delitos y sus familias
  municipios: []
  puntos:
    - Cuando el juez no ordena encierro, el adolescente cumple en su comunidad con un acompañante que lo visita e informa al juez si cumple o no.
    - Hay una guardia las 24 horas, los 365 días, y hogares abiertos donde el adolescente vive y va a la escuela, al trabajo o al deporte en la comunidad.
    - En los centros de encierro, la escuela es obligatoria y nunca se puede suspender como castigo.
    - Prohíbe castigos físicos, celdas de aislamiento, cortar las visitas de la familia y quitar comida o higiene. Toda sanción se puede apelar ante el juez.
  no_dice:
    - "Desde qué edad se aplica y qué penas hay: lo fijan la Ley Nacional 27.801 y el Código Procesal Penal Juvenil, un anexo que no se publicó junto con la ley."
    - Cuánta plata y cuánto personal tendrá la nueva Dirección de Responsabilidad Penal Juvenil.
  hecho_con: a mano
  fecha: 2026-10-12
  revisado: 2026-10-12
- numero: "9733"
  titulo: Junín expropia terrenos para conservar el Molino Orfila
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública, es decir, expropiables, dos terrenos de unos 3.782 m2 en Orfila y Chileno Herrera, Junín. El destino es conservar y poner en valor el Solar Histórico Molino Orfila. Expropia la Municipalidad y paga los gastos.
  a_quien: Vecinos de Junín y dueños de los terrenos expropiados
  municipios:
    - Junín
  puntos:
    - El terreno suma unos 3.782 m2, entre la Fracción A (854,55 m2) y una parte de la Fracción B (2.927,45 m2).
    - El Estado puede quedarse con los inmuebles para mantener, conservar y difundir el valor histórico y social del Molino Orfila.
    - Quien expropia es la Municipalidad de Junín, que además paga todos los gastos.
    - La Municipalidad debe hacer el plano de actualización y mensura para fijar la superficie exacta afectada.
  no_dice:
    - Cuánto se pagará a los dueños por los terrenos y quiénes son.
    - Qué obras o usos concretos tendrá el Molino Orfila después de la expropiación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9730"
  titulo: Menos impuestos a los créditos que refinancian deudas
  tema: Impuestos
  resumen: Los bancos y otras entidades que refinancian deudas de personas y empresas no pagan Sellos y pagan Ingresos Brutos del 5% si la tasa anual no pasa el 40% y el plazo es de 24 meses o más. Rige hasta el 31 de diciembre de 2026.
  a_quien: Personas y empresas con deudas, y entidades que prestan dinero
  municipios: []
  puntos:
    - Refinanciar es cambiar plazos, cuotas, tasas o garantías de una deuda. También cuenta si una entidad presta para cancelar deudas en otras.
    - Vender o ceder la cartera de deudores a terceros no cuenta como refinanciación.
    - Las operaciones quedan exentas del Impuesto de Sellos y tributan Ingresos Brutos al 5% si cumplen el tope de tasa y plazo.
    - Cada mes las entidades informan a ATM lo refinanciado. Si falsean datos, pagan lo omitido más intereses y multas.
  no_dice:
    - Cuánto pagaba antes de esta ley el deudor o la entidad, y cuánto dejará de recaudar la Provincia.
    - "Qué deudas se consideran esenciales: lo define el Poder Ejecutivo al reglamentar la ley."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9728"
  titulo: Aprueba un convenio entre Mendoza y la Nación
  tema: Convenios y ratificaciones
  resumen: La Legislatura aprueba un decreto del Gobernador que a su vez aprueba un convenio firmado el 27 de julio de 2026 entre la Provincia y el Ministerio de Economía de la Nación. El convenio está en un anexo que no se publicó.
  a_quien: Toda la provincia
  municipios: []
  puntos:
    - El convenio lo firmaron el Gobernador de Mendoza y el Ministro de Economía de la Nación el 27 de julio de 2026.
    - La ley aprueba el decreto provincial del 18 de agosto de 2026 que había aprobado ese convenio.
  no_dice:
    - "De qué trata el convenio, qué se comprometen a hacer la Provincia y la Nación y si hay plata de por medio: está en un anexo que no se publicó con la ley."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9727"
  titulo: Provincia podrá cerrar o demoler inmuebles que son un riesgo
  tema: Seguridad y justicia
  resumen: El Ministerio de Seguridad y Justicia podrá sellar, cerrar o demoler en forma controlada inmuebles usados para delitos, abandonados o en ruina. Es preventivo y temporal, no una sanción. No rige para inmuebles ocupados de forma permanente.
  a_quien: Dueños de inmuebles abandonados o usados para delitos, y sus vecinos
  municipios: []
  puntos:
    - Alcanza a inmuebles usados para guardar o vender drogas o planear delitos, y a los abandonados, en ruina o con riesgo de incendio o derrumbe.
    - El pedido lo puede hacer cualquier vecino, un municipio, un organismo o la Justicia, o lo inicia el Ministerio de oficio.
    - Se avisa al dueño y tiene 5 días para presentarse. Después puede oponerse en 5 días hábiles a la medida concreta.
    - Con riesgo grave o inminente actúa de urgencia y dentro de 48 horas hábiles dicta la resolución. Cada medida se revisa una vez por año.
  no_dice:
    - "Si los municipios cobrarán al dueño los gastos de la intervención: la ley solo dice que podrán reclamarlos."
    - "Qué canales habrá para denunciar un inmueble: los indicará el Ministerio."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9726"
  titulo: Mendoza crea un sistema de ciberseguridad para el Estado
  tema: Otros
  resumen: Crea un comité que fija reglas obligatorias de ciberseguridad para el Poder Ejecutivo y sus proveedores tecnológicos, un centro de respuesta a incidentes informáticos y sanciones por incumplir. Cualquier persona puede reportar fallas de seguridad.
  a_quien: Organismos del Ejecutivo, empresas que les dan servicios digitales y vecinos que usan trámites online
  municipios: []
  puntos:
    - El Comité de Conducción Estratégica de Ciberseguridad dicta el plan provincial y estándares obligatorios, y controla que se cumplan.
    - Los organismos deben reportar incidentes, designar un responsable de ciberseguridad y cuidar los datos desde que se cargan hasta que se borran.
    - Quien detecte una falla de seguridad puede reportarla por un canal oficial gratuito. No se inician acciones legales contra quien reporta de buena fe.
    - Sanciones progresivas, desde advertencia hasta suspender la conexión con la red provincial. Los informes técnicos y planes de seguridad son reservados.
  no_dice:
    - "Cuánta plata costará y quién ejecutará las tareas técnicas: lo decide el Poder Ejecutivo y puede ser un privado."
    - "Los plazos de reporte de incidentes y montos de sanciones: los fijará la reglamentación, que debe salir en 90 días."
    - "Cómo se tratarán las compras de ciberseguridad: la ley las equipara al inciso a) de la Ley de Administración Financiera, que no se detalla."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9725"
  titulo: El Fondo Escolar Permanente podrá usarse como garantía de créditos
  tema: Educación
  resumen: Suma al Fondo Escolar Permanente lo que se recaude de vender o subastar bienes de Educación, permite usar parte del fondo como garantía de operaciones financieras, incluidas viviendas para docentes, y evita que el saldo no gastado pase a rentas generales.
  a_quien: Escuelas, docentes y la Dirección General de Escuelas
  municipios: []
  puntos:
    - Ingresa al fondo lo recaudado por venta, subasta, alquiler o indemnización de bienes de la DGE y del Ministerio de Educación sin otro destino fijado.
    - El fondo genera rentas para comprar terrenos, construir, reparar y equipar escuelas.
    - La DGE puede dejar parte del fondo como garantía de créditos o fideicomisos, incluso para programas de vivienda docente. Siempre debe quedar un saldo mínimo.
    - Los saldos no usados del fondo al cierre del año se arrastran al año siguiente en vez de pasar a rentas generales.
  no_dice:
    - "Qué porcentaje máximo del fondo se puede dejar en garantía y cuál será el saldo mínimo: lo fijará la reglamentación."
    - Cuánto dinero tiene hoy el fondo y qué créditos o viviendas se harán.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
