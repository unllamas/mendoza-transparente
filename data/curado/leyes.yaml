- numero: "9524"
  titulo: Reglas para reducir la mortalidad de madres y recién nacidos
  tema: Salud
  resumen: Obliga a las maternidades públicas y privadas a cumplir condiciones esenciales de atención y crea una unidad que coordina el traslado rápido de embarazadas y recién nacidos al establecimiento adecuado.
  a_quien: Embarazadas, recién nacidos y maternidades públicas y privadas
  municipios: []
  puntos:
    - Todo establecimiento público o privado que atienda partos o recién nacidos debe cumplir las Condiciones Obstétricas y Neonatales Esenciales para funcionar.
    - Se crea la Unidad Coordinadora de Derivaciones Perinatales, que coordina derivar rápido a la persona gestante al establecimiento que corresponde.
    - Se debe procurar el traslado con el bebé por nacer, salvo riesgo, y con móvil de alta complejidad si el nacimiento es prematuro.
    - El Ministerio categoriza las maternidades según el riesgo y lo que pueden atender.
  no_dice:
