- numero: "9612"
  titulo: Nueva escala del adicional por mayor responsabilidad penitenciaria
  tema: Trabajo y empleo público
  resumen: "Cambia cuánto cobra de adicional el personal penitenciario que conduce: va del 23% al 100% del sueldo de clase del Jefe de la Policía según el cargo. También fija qué cobra el personal retirado que es convocado."
  a_quien: Personal del Servicio Penitenciario con cargos de conducción
  municipios: []
  puntos:
    - Lo cobran oficiales jefes y superiores y el Encargado General del Servicio que conducen de forma normal, habitual y permanente.
    - "La escala sube con el cargo: Dirección General 100%, Subdirección General 93%, Direcciones Principales 85%, Direcciones Regionales 80%."
    - Más abajo van 76,35% (complejos penitenciarios), 66,40%, 46% (jefaturas de departamento) y 23% (jefaturas de división).
    - El personal retirado y convocado cobra el haber de retiro más la mitad de la asignación de su grado al retirarse y los adicionales de la función asignada.
  no_dice:
