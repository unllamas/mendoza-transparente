- numero: "9666"
  titulo: "Juicios penales: audiencias en 2 días, agenda pública y sanciones"
  tema: Seguridad y justicia
  resumen: "Cambia cómo funcionan las audiencias penales: se fijan a los 2 días del pedido, la agenda se publica en la web del Poder Judicial y los jueces que hagan fracasar audiencias sin causa pueden ser sancionados."
  a_quien: Personas imputadas, víctimas, abogados y jueces del fuero penal
  municipios: []
  puntos:
    - Las audiencias orales se fijan dentro de los 2 días de pedidas, son públicas y continuas. Si se suspenden, se reprograman dentro de los 5 días siguientes.
    - Un juez o fiscal que haga fracasar sin justificación una audiencia más de 3 veces en un año, o 6 en distintos años, puede ser acusado de mal desempeño.
    - La agenda de audiencias penales se publica en la web del Poder Judicial, con juez, fiscal, defensor, delito investigado y motivo de cada suspensión.
    - Los fiscales deben anunciar quién va a la audiencia. Hay jueces de turno las 24 horas para allanamientos, detenciones y control de las cárceles.
  no_dice:
    - Cuánto personal o presupuesto requieren las nuevas oficinas de gestión de audiencias.
    - "Cuándo se aplican en la práctica algunos cambios: dependen de un sistema de sorteos que debe reglamentar la Suprema Corte."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9665"
  titulo: "Cambios al estatuto de empleados públicos: despidos e interinos"
  tema: Trabajo y empleo público
  resumen: "Modifica el estatuto de los empleados públicos provinciales: define qué es personal interino, limita lo que cobra quien es reincorporado tras un despido anulado y marca qué antigüedad cuenta."
  a_quien: Empleados de la administración pública provincial
  municipios: []
  puntos:
    - El personal interino, designado en un cargo vacante sin concurso, no tiene estabilidad y puede ser reemplazado cuando se cubra el cargo por concurso.
    - Si se anula un despido, el empleado vuelve a su cargo pero no cobra los sueldos del período en que no trabajó.
    - Puede pedir una indemnización por daños de hasta el 50% de su sueldo mensual, con tope de 24 meses.
    - Para la antigüedad solo cuentan servicios en relación de dependencia; no cuentan los contratos de locación de servicios pagados con factura.
  no_dice:
    - "Cómo se calcula la indemnización en los demás casos: el texto publicado solo transcribe el primero, 100% del sueldo por año de antigüedad."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9664"
  titulo: "9 de octubre: Día de la Enfermedad Cardiovascular en la Mujer"
  tema: Salud
  resumen: Se instituye el 9 de octubre de cada año como Día Provincial de la Concientización de la Enfermedad Cardiovascular en la Mujer. El Ministerio de Salud debe hacer campañas el mes anterior.
  a_quien: Mujeres de toda la provincia
  municipios: []
  puntos:
    - Cada 9 de octubre es el Día Provincial de la Concientización de la Enfermedad Cardiovascular en la Mujer.
    - El Ministerio de Salud y Deportes debe promover prevención, información, investigación y estudios estadísticos sobre esta enfermedad.
    - En el mes previo a la fecha se hacen campañas en eventos, medios gráficos, digitales, radiales y audiovisuales.
  no_dice:
    - Cuánto dinero se destina a las campañas.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9663"
  titulo: Programa escolar de compromiso ambiental con voluntariado y juramento
  tema: Educación
  resumen: Crea un programa en las escuelas con voluntariados ambientales, un juramento ambiental voluntario de estudiantes de 6° grado y 3° año, y una bandera del compromiso ambiental.
  a_quien: Estudiantes y docentes de escuelas de toda la provincia
  municipios: []
  puntos:
    - El juramento ambiental es voluntario, para estudiantes de 6° grado de primaria y 3° año de secundaria, y se hace en el Día Mundial del Ambiente.
    - Quienes juran se comprometen a cuidar el agua, los espacios verdes y el piedemonte, reducir y separar residuos, y usar la energía con responsabilidad.
    - Las escuelas que participen pueden sumar a sus estandartes la Bandera del Compromiso Ambiental.
    - Los docentes que participen pueden recibir reconocimiento, incluso un sistema de créditos por carga horaria.
  no_dice:
    - "Cómo funcionará cada parte: el Ministerio de Educación debe definirlo por decreto, con plazo de 180 días."
    - Cuánto dinero se destina al programa.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
