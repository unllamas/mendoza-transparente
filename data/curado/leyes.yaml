    - Debe informarse que hay cámaras (carteles o medios digitales) sin decir la ubicación exacta. El titular puede pedir acceso o cancelar grabaciones.
    - Cualquiera puede instalar cámaras en sus bienes o sumarlas por convenio. Las grabaciones de delitos pasan a la Justicia en 24 horas del pedido.
