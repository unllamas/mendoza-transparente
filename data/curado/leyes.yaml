- numero: "9715"
  titulo: El IPV podrá desalojar por juicio rápido a viviendas desadjudicadas
  tema: Derechos y sociedad
  resumen: Cuando el Instituto Provincial de la Vivienda quita una vivienda a un adjudicatario, podrá pedir el desalojo en un juicio monitorio, un trámite rápido. Presentar un recurso administrativo no frena el desalojo salvo orden expresa. Rige a los 30 días de publicada.
  a_quien: Adjudicatarios de viviendas del IPV a quienes se les quitó la adjudicación
  municipios: []
  puntos:
    - Si el IPV resolvió la desadjudicación (quitar la vivienda a quien la tenía asignada), puede iniciar juicio de desalojo.
    - El IPV presenta la resolución firmada y con constancia de notificación al desadjudicado.
    - Recurrir la decisión en sede administrativa no suspende el juicio, salvo que la autoridad o la Suprema Corte lo ordene.
    - El desalojo se tramita por el proceso monitorio del Código Procesal Civil.
  no_dice:
    - "Cuántos días tiene el desadjudicado para responder en el juicio: no lo dice esta ley."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9714"
  titulo: Expropiación urgente de 90 hectáreas para el Polo Logístico del Este
  tema: Tierras y expropiaciones
  resumen: Declara de interés público el Polo Logístico del Este en San Martín y expropia de urgencia 14 inmuebles, 90 hectáreas al norte de la Ruta 7, dentro del PASIP. Los terrenos dejan el destino que tenían y el Ejecutivo podrá entregarlos en fideicomiso.
  a_quien: Dueños de los 14 inmuebles y vecinos de San Martín
  municipios:
    - San Martín
  puntos:
