  tema: Derechos y sociedad
  resumen: "Cambia el trámite judicial de los reclamos de consumo: el trámite especial queda para los de hasta 5 JUS que inicia el consumidor por su cuenta. Los demás reclamos de consumo van por el trámite ordinario."
  a_quien: Consumidores y usuarios que reclaman en la Justicia civil
  municipios: []
  puntos:
    - Un reclamo de consumo de hasta 5 JUS, iniciado por el consumidor o usuario en forma individual, tiene un trámite propio previsto en el Código Procesal.
