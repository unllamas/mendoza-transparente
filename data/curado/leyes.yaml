- numero: "9602"
  titulo: Regularización de títulos de la casa propia más amplia y gratuita
  tema: Tierras y expropiaciones
  resumen: Cambia el régimen que permite escriturar viviendas ocupadas sin título. Amplía quiénes pueden pedirlo, fija un tope de 1.000 m2 y aclara qué es gratuito y qué trámites hace el notario.
  a_quien: Familias que ocupan una vivienda única sin escritura
  municipios: []
  puntos:
    - Puede pedirlo quien ocupe en forma pública, pacífica y continua su casa única y permanente, o la vivienda y chacra de un agricultor familiar.
    - Se piden argentinos o extranjeros nacionalizados con al menos 5 años de residencia en el país antes del plazo de ocupación.
    - El inmueble no puede pasar de 1.000 m2, salvo que el plan de ordenamiento municipal fije otra medida o sea rural de agricultor familiar.
    - Los trámites son gratuitos, el notario asesora sin cargo y las deudas de impuestos o tasas no impiden la escritura, aunque las asume el solicitante.
  no_dice:
    - "Cuánto es la contribución única que se paga por la escritura: depende de la ley nacional 24.374 y del Impuesto de Sellos."
