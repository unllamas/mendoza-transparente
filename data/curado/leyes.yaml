  titulo: Aprueba el acuerdo con Belgrano Cargas para un tren de cercanías
  tema: Transporte
  resumen: La Legislatura ratifica el acuerdo del 12 de agosto de 2025 entre Mendoza y Belgrano Cargas y Logística S.A. para un Tren de Cercanías en Mendoza. La concesión que resulte queda exceptuada de dos normas anteriores sobre concesiones.
