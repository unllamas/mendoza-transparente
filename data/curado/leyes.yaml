- numero: "9676"
  titulo: Más control a las apps de transporte tipo Uber y a sus choferes
  tema: Transporte
  resumen: Cambia la ley de transporte por aplicaciones. Cada chofer necesita permiso de explotación, solo para personas, uno por persona y con el auto a su nombre. Las plataformas pueden ser suspendidas hasta 2 años o inhabilitadas. Las multas dependen del Ente de la Movilidad.
  a_quien: Choferes y empresas de aplicaciones de transporte, y pasajeros
  municipios: []
  puntos:
    - Cada permisionario debe ser persona humana y dueño del auto. Solo puede tener un permiso, salvo con autos eléctricos. El permiso es precario y revocable.
    - Las plataformas no pueden asignar viajes a choferes sin permiso ni a autos no habilitados, ni hacer publicidad que incite a incumplir la normativa.
    - El Ente de la Movilidad puede suspender la plataforma hasta 2 años y multarla. La inhabilitación definitiva la decide la Autoridad de Aplicación.
    - Las multas se discuten primero ante el Ente y hay que pagarlas para poder ir a la Justicia. El Ente puede cobrarlas por apremio.
  no_dice:
    - "De cuánto son las multas a las plataformas: remite a otra ley, sin detalle."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9675"
  titulo: Licencia de conducir digital vale igual y no se actualiza por mudanza
  tema: Transporte
  resumen: En un control de tránsito vale la licencia de conducir física o digital, y el comprobante del seguro de cualquier formato. Si te mudás dentro de Mendoza no hace falta actualizar la licencia. Los municipios emiten las licencias por convenio.
  a_quien: Conductores de Mendoza y municipios
  municipios: []
  puntos:
    - La licencia física o digital valen igual, al igual que las cédulas del vehículo físicas o digitales, y el seguro puede mostrarse en cualquier formato.
    - "Quien cambie de domicilio dentro de la provincia no necesita actualizar la licencia: sigue vigente hasta su renovación."
    - Los municipios emiten la Licencia Nacional de Conducir por convenio. La Unidad Ejecutiva de Seguridad Vial audita los centros e informa a la Agencia Nacional.
  no_dice:
    - Qué municipios ya firmaron convenio para emitir licencias.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
