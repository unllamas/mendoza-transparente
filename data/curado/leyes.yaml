- numero: "9721"
  titulo: Guaymallén expropia 38 inmuebles para abrir el Callejón Martínez
  tema: Tierras y expropiaciones
  resumen: Declara expropiables 38 inmuebles, o partes de ellos, para abrir el Callejón Martínez en Rodeo de la Cruz, Guaymallén. En casi todos se toma solo una fracción del terreno. Expropia y paga la Municipalidad.
  a_quien: Dueños de los 38 inmuebles y vecinos de Rodeo de la Cruz, Guaymallén
  municipios:
    - Guaymallén
  puntos:
    - Son 38 parcelas en el distrito Rodeo de la Cruz; en cada una se afecta solo parte del terreno, que es de mayor tamaño.
    - La superficie por parcela va de unos 6 m2 hasta unos 3.799 m2.
    - Algunas parcelas también pierden superficie por la calle Tomás Godoy Cruz y la ochava (esquina cortada).
    - La Municipalidad de Guaymallén es quien expropia y atiende todos los gastos.
  no_dice:
    - Cuánto se pagará a cada dueño y cuándo se abrirá el callejón.
    - Qué trazado tendrá el Callejón Martínez.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9720"
  titulo: La Ruta del Vitimigrante es Patrimonio Cultural Inmaterial
  tema: Derechos y sociedad
  resumen: Declara Patrimonio Cultural Inmaterial de Mendoza a la Ruta del Vitimigrante, un recorrido histórico y cultural por cinco departamentos del Este, donde se asentaron inmigrantes entre 1870 y 1960 ligados a la vitivinicultura.
  a_quien: Vecinos del Este mendocino y descendientes de inmigrantes
  municipios:
    - Rivadavia
    - San Martín
    - Junín
    - Santa Rosa
    - La Paz
  puntos:
    - La ruta recorre Rivadavia, San Martín, Junín, Santa Rosa y La Paz.
    - Reconoce a los inmigrantes que llegaron entre 1870 y 1960 y transformaron el paisaje del Este y su identidad ligada al vino.
    - La declaración se hace según la Convención de la UNESCO para proteger el patrimonio cultural inmaterial.
  no_dice:
    - "Si habrá fondos, señalización u obras para la ruta: la ley solo la declara patrimonio."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
