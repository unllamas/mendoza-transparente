- numero: "9559"
  titulo: "Contravenciones: alcohol al volante, acoso callejero y niños en autos"
  tema: Seguridad y justicia
  resumen: Reforma el Código de Contravenciones. Conducir con 1 g/l o más de alcohol se castiga con multa o arresto y 90 a 545 días sin manejar. También regula el acoso sexual callejero y dejar a un menor de 8 años solo en un auto.
  a_quien: Conductores, padres y quienes circulan o trabajan en espacios públicos
  municipios: []
  puntos:
    - "Alcohol de 1 g/l o más al volante: multa de 4.000 a 11.000 U.F. o arresto hasta 120 días, retención del auto y 90 a 545 días sin manejar."
    - El acoso sexual callejero se castiga con multa de 200 a 2.000 U.F. o 8 a 20 días de trabajo comunitario; el doble si la víctima es menor o tiene discapacidad.
    - Si el acosador es cliente de un bar, restaurante o boliche y la víctima trabaja ahí, la multa es de 500 a 2.500 U.F. o 15 a 30 días de trabajo comunitario.
    - "Dejar a un menor de 8 años solo en un vehículo: multa de 600 a 2.000 U.F., arresto o trabajo comunitario; el doble con el auto encendido."
  no_dice:
    - "Cuánto vale en pesos una U.F. (unidad fija): este texto no lo dice."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
