- numero: "9525"
  titulo: Ley de promoción de la salud y hábitos saludables
  tema: Salud
  resumen: El Ministerio de Salud destinará un porcentaje creciente de su presupuesto a prevención y promoción de la salud, y en escuelas no se podrán vender ni publicitar ciertos alimentos.
  a_quien: Toda la provincia, en especial estudiantes y escuelas
  municipios: []
  puntos:
    - El Ministerio destina al menos 3% de su presupuesto a promoción y prevención durante 5 años, 5% del año 5 al 9 y 8% desde el año 10.
    - En escuelas no se pueden vender ni publicitar alimentos con nutrientes críticos o calorías por encima del límite de la ley nacional de etiquetado frontal.
    - El Estado prioriza comprar, para chicos en edad escolar, alimentos y bebidas sin sellos de advertencia.
    - Se promueve que los locales de comida elaborada informen la composición nutricional de lo que venden. Habrá campañas sobre actividad física y alimentación.
  no_dice:
    - "Qué pasa con quien venda alimentos prohibidos en una escuela: no hay sanción en el texto."
