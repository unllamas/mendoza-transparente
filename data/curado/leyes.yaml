    - Los alumnos por debajo del nivel esperado tienen seguimiento trimestral, con apoyo individual y recursos como jornada extendida y Centros de Apoyo Escolar.
    - El plan es obligatorio en toda la provincia y entra en la formación docente. La formación continua se hace preferentemente antes del inicio de clases.
    - Se destina cada año al menos el 2% del Fondo de Financiamiento Educativo nacional, y el plan debe elaborarse en 60 días.
  no_dice:
    - "Cuáles son los niveles mínimos de lectura y matemática por año: los fijará el plan."
