    - Una vez expropiados, el Ejecutivo puede transferir los bienes en fideicomiso (los administra un tercero) para construir el polo.
    - Aprueba el Plan de Directrices del polo y saca a los terrenos el destino que les daba la ley del PASIP.
  no_dice:
    - "Qué empresas o obras tendrá el polo y qué dice el Plan de Directrices: está en un anexo que no se publicó."
