  a_quien: Usuarios del servicio eléctrico, empresas concesionarias
  municipios: []
  puntos:
    - Emergencia del Sistema Hidroeléctrico Los Nihuiles por 14 meses desde la promulgación.
    - Hidroeléctrica Los Nihuiles (HINISA) y Hidroeléctrica Diamante (HIDISA) siguen operando hasta que se cumpla el contrato.
    - El Ejecutivo puede licitar los dos sistemas junto con el Estado nacional y concesionar Diamante por hasta 30 años.
    - Puede contratar directo, sin el régimen de compras del Estado, para operar y reparar Los Nihuiles. Debe informar a la Legislatura cada 90 días.
  no_dice:
    - "Cuánto dinero se destinará: el texto autoriza reasignar partidas sin fijar montos."
