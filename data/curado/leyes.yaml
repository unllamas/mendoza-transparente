- numero: "9703"
  titulo: Juicio rápido para delitos con el acusado detenido en el acto
  tema: Seguridad y justicia
  resumen: Cambia el procedimiento de flagrancia, cuando detienen a alguien en el momento del delito. Las audiencias y la sentencia se hacen en plazos cortos, de pocos días hábiles, para delitos dolosos con pena de hasta 20 años. Rige a los 30 días hábiles de publicada.
  a_quien: Personas detenidas en flagrancia, víctimas, fiscales y jueces
  municipios: []
  puntos:
    - Vale para delitos dolosos (con intención) con pena máxima de 20 años. Quedan afuera los casos de juicio por jurado popular.
    - El fiscal tiene 10 días hábiles desde la detención para pedir la audiencia inicial, y 10 más si necesita pruebas. Si el acusado está preso, pide la preventiva.
    - 'Sin acuerdo anticipado, sigue el "directísimo": audiencia final en 4 días hábiles (detenido) u 8 (libre) y nunca después de 30 días hábiles de la inicial.'
    - El juez dicta sentencia en la misma audiencia final y puede dejar los fundamentos hasta 3 días hábiles. Pasarse de un plazo no anula lo hecho.
  no_dice:
    - "Qué penas puede aplicar el juez: no cambia el Código Penal ni lo menciona esta ley."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9702"
  titulo: Cambios en la ley de arbolado público
  tema: Ambiente y agua
  resumen: Cada municipio manda sobre el arbolado de sus calles y debe presentar un plan de manejo cada 4 años y un informe anual antes del 31 de marzo. La Provincia pone criterios técnicos y debe autorizar talas y podas. Las calles no pueden llevar nombres de personas vivas.
  a_quien: Municipios, entes viales y vecinos con árboles en la vereda
  municipios: []
  puntos:
    - Los municipios mandan sobre el arbolado municipal. Presentan un Plan de Manejo Integral cada 4 años y un informe anual antes del 31 de marzo.
    - Para talar, podar, rebajar o desbrotar árboles públicos hace falta autorización de la autoridad de aplicación de cada jurisdicción.
    - La Provincia recomienda especies por zona, con árboles más bajos y variedad de especies en lugar de una sola, para evitar plagas como la del olmo.
    - Las municipalidades solo pueden poner a calles o plazas nombres que no homenajeen a personas vivas.
  no_dice:
    - Qué multas hay por talar sin autorización.
    - "Qué especies se recomendarán en cada zona: la autoridad provincial armará el listado."
