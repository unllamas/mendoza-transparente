- numero: "9526"
  titulo: Nueva ley de residencias para profesionales de la salud
  tema: Salud
  resumen: "Regula las residencias, la formación de posgrado en servicio de los profesionales de la salud: beca, horarios, guardias, vacaciones, derechos, sanciones y cómo se abren y cierran. Rige desde su reglamentación."
  a_quien: Residentes y jefes de residentes de la salud, y los hospitales sede
  municipios: []
  puntos:
    - Reciben una beca, no un sueldo. Se mide en Unidades Formativas; cada una equivale al 35% del sueldo bruto del Ministro de Salud.
    - "Trabajan de 35 a 45 horas de lunes a viernes más 4 horas el sábado. Guardias: hasta 8 por mes el primer año, 6 el segundo y 4 después."
    - Tienen 30 días corridos de vacaciones, almuerzo, descanso de al menos 6 horas tras cada guardia, cobertura de salud y seguros pagos por quien financia la beca.
    - Las sanciones van de apercibimiento a suspensión de hasta 30 días o separación definitiva de la residencia.
  no_dice:
    - "Cuántas Unidades Formativas cobra cada especialidad: depende del tipo de residencia."
