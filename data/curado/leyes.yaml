- numero: "9606"
  titulo: Docentes condenados por delitos graves quedan inhabilitados
  tema: Educación
  resumen: Quien tenga condena penal, aunque sea en primera instancia o en suspenso, por delitos contra las personas, la integridad sexual y otros, no puede ingresar a la docencia. Los docentes condenados quedan exonerados y vetados para siempre.
  a_quien: Docentes, celadores y personal administrativo de escuelas
  municipios: []
  puntos:
    - Quien tenga condena a prisión por delitos contra las personas o la integridad sexual no puede ingresar como docente, celador ni administrativo.
    - Los docentes condenados por esos delitos son exonerados e inhabilitados para siempre, y las escuelas deben impedir su reingreso.
    - La cesantía inhabilita por 3 años y la exoneración por 10 años, salvo los casos anteriores, que son permanentes.
    - Se crea el Registro único de sumarios, sanciones e inhabilitaciones (RUSSI) de la Dirección General de Escuelas.
