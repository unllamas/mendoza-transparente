- numero: "9659"
  titulo: "Nueva ley de residuos: planes municipales, prohibición de basurales"
  tema: Ambiente y agua
  resumen: Crea un sistema provincial de gestión de residuos. Cada municipio debe hacer su plan, queda prohibido tirar o quemar residuos a cielo abierto y se fijan multas de 1.000 a 1.000.000 de Unidades Fiscales.
  a_quien: "Toda la provincia: municipios, empresas y vecinos"
  municipios: []
  puntos:
    - Los municipios deben presentar un plan de residuos al Ministerio de Energía y Ambiente. Una vez aprobado, tienen hasta 1 año para aplicarlo.
    - Se prohíbe descargar o quemar residuos a cielo abierto, hacer basurales y volcar residuos en cauces de agua. Hay que cerrar y remediar los basurales.
    - "La provincia se divide en 4 zonas: Metropolitana, Este, Centro y Sur. Los municipios pueden unirse en consorcios."
    - Las sanciones van del apercibimiento a multas de 1.000 a 1.000.000 de Unidades Fiscales, suspensión de hasta 1 año, clausura y decomiso de vehículos.
  no_dice:
    - "Cuánto valen hoy las Unidades Fiscales y cuánto pagará cada vecino: la tasa se fija en la Ley Impositiva."
    - "Desde cuándo rigen los plazos: dependen de la reglamentación, que tiene 180 días."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9658"
  titulo: "Beneficio de litigar sin gastos: consulta automática en un sistema"
  tema: Seguridad y justicia
  resumen: Quien no puede pagar los gastos de un juicio podrá pedir el beneficio de litigar sin gastos y el juzgado lo consulta en un sistema informático. Si lo deniega, queda el trámite tradicional por incidente.
  a_quien: Personas que inician o enfrentan un juicio civil sin poder pagar las tasas
  municipios: []
  puntos:
    - Se avisa en la primera presentación judicial. El juzgado consulta un sistema, y si se cumplen los parámetros, concede el beneficio en el primer decreto.
    - Si el sistema lo rechaza, el juzgado emplaza a pagar las tasas de justicia. La persona puede iniciar igual el trámite por incidente.
    - En el trámite por incidente hay que presentar informes sobre bienes inmuebles y autos, situación fiscal y previsional, y constancia de sueldo si trabaja.
    - Si el pedido lo hace el demandado y se lo niegan, paga todas las costas del proceso. El juez resuelve por auto inapelable.
  no_dice:
    - "Cuáles son los parámetros, por ejemplo ingresos, que usará el sistema: los fija cada año la Suprema Corte."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
