- numero: "9511"
  titulo: Nuevas reglas para escribanos y registros notariales
  tema: Seguridad y justicia
  resumen: "Cambia cuántos registros notariales hay y cómo se llega a ser notario: requisitos de ingreso, concurso para ser titular y un máximo de dos adscriptos por registro."
  a_quien: Escribanos, aspirantes a notario y quienes hacen escrituras
  municipios: []
  puntos:
    - Habrá un registro notarial por cada 5.000 habitantes o fracción no menor de 2.500. Cada registro tiene una sola sede y puede actuar en toda la provincia.
    - Un notario debe vivir a menos de 60 km de su registro y tener 2 años de residencia en Mendoza si nació acá, o 5 si no.
    - Se pide título, buena conducta, no estar concursado ni fallido y un examen psicofísico que se renueva cada 10 años, cada 5 desde los 60 y cada año desde los 75.
    - Se llega a titular por concurso o con 10 años de adscripto. Cada registro puede tener hasta 2 adscriptos, propuestos por un titular con 10 años de ejercicio.
