  resumen: "Modifica la ley anterior que aceptó la donación con cargo del terreno donde funciona la Policía Rural en Los Compartos, General Alvear. El texto describe el terreno: 499,80 m2 en calle 10 y G."
  a_quien: Vecinos de Los Compartos, General Alvear
  municipios:
    - General Alvear
