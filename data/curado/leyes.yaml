# Resúmenes en lenguaje simple de las leyes, hechos con IA a partir del texto oficial (scripts/resumir-leyes.ts).
# Se pueden corregir a mano: al revisar uno, agregar "revisado: AAAA-MM-DD". Criterios en docs/procesos/metodologia.md.

- numero: "9735"
  titulo: Régimen penal juvenil y su organización administrativa
  tema: Seguridad y justicia
  resumen: Establece el régimen especial penal juvenil para adolescentes en conflicto con la ley penal, de acuerdo con la Ley Nacional 27.801. Aprueba el Código Procesal Penal Juvenil, que está en el anexo, y organiza la Dirección de Responsabilidad Penal Juvenil.
  puntos:
    - Aprueba el Código Procesal Penal Juvenil (el texto está en el anexo).
    - La Dirección de Responsabilidad Penal Juvenil aplica las medidas y programas que ordene la Justicia.
    - La Dirección tiene una unidad de privación de libertad y una de medidas alternativas.
    - Crea la función de Supervisor Especializado y un registro de supervisores y facilitadores.
    - Modifica los artículos 47 y 103 del Código Procesal Penal y deroga la Ley 6354.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9733"
  titulo: Expropiación en Junín del solar histórico Molino Orfila
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujetos a expropiación unos inmuebles de unos 3.782 m2 en Orfila y Chileno Herrera, Junín. El fin es mantener, conservar y poner en valor el Solar Histórico Molino Orfila. La Municipalidad de Junín expropia y paga los gastos.
  puntos:
    - Terreno de aproximadamente 3.782 m2, formado por la Fracción A y una parte de la Fracción B.
    - "Destino: mantenimiento, conservación y puesta en valor del Solar Histórico Molino Orfila."
    - La Municipalidad de Junín es quien expropia, según el Decreto-Ley 1.447/75.
    - Los gastos, incluido el plano de mensura, los paga la Municipalidad.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9730"
  titulo: "Alivio financiero: beneficios impositivos por refinanciar deudas"
  tema: Impuestos
  resumen: Promueve la refinanciación de deudas de personas y empresas en Mendoza. Las operaciones de refinanciación quedan exentas de Sellos y pagan Ingresos Brutos con alícuota reducida del 5% si cumplen ciertas condiciones. Rige hasta el 31 de diciembre de 2026.
  puntos:
    - Refinanciar es cambiar las condiciones de una deuda (plazos, cuotas, tasas o garantías). Ceder o vender la cartera no cuenta.
    - Exención del Impuesto de Sellos para esas operaciones.
    - Ingresos Brutos del 5% si la tasa nominal anual no pasa el 40% y el plazo es de al menos 24 meses.
    - Las entidades presentan cada mes una declaración jurada ante Administración Tributaria Mendoza.
    - Vigencia hasta el 31/12/2026, con posible prórroga de hasta 6 meses por el Poder Ejecutivo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9728"
  titulo: Aprueba un convenio entre Mendoza y la Nación
  tema: Convenios y ratificaciones
  resumen: "Aprueba el Decreto 1691 del 18 de agosto de 2026, que aprueba un convenio firmado el 27 de julio de 2026 entre la Provincia y el Estado Nacional, representado por el Ministerio de Economía. El texto de la ley no dice de qué trata el convenio: el detalle está en el anexo."
  puntos:
    - Aprueba el Decreto 1691 de fecha 18 de agosto de 2026.
    - El convenio es entre la Provincia de Mendoza y el Estado Nacional, y se firmó el 27 de julio de 2026.
    - El contenido del convenio está en el anexo de la ley.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9727"
  titulo: Intervención preventiva de inmuebles por seguridad pública
  tema: Seguridad y justicia
  resumen: Crea un régimen para que el Ministerio de Seguridad y Justicia tome medidas preventivas y temporales sobre inmuebles que, por su uso o estado, representen un riesgo para la seguridad. Las medidas pueden ser sellar, cerrar o demoler en forma controlada. No se aplica a inmuebles ocupados de forma permanente.
  puntos:
    - Alcanza a inmuebles usados para delitos o venta de estupefacientes, o en ruina o abandono con riesgo.
    - Se puede pedir de oficio, por vecinos, municipios, organismos o la Justicia.
    - El propietario es citado por 5 días y puede oponerse en 5 días hábiles a la medida concreta.
    - En riesgo grave o inminente se puede actuar de urgencia. Las medidas se revisan una vez por año.
    - Crea el Registro Provincial de Inmuebles Intervenidos. Los municipios pueden reclamar los gastos al titular.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9726"
  titulo: Marco provincial de ciberseguridad
  tema: Seguridad y justicia
  resumen: Establece cómo se organiza y controla la ciberseguridad del Estado provincial. Crea el Comité de Conducción Estratégica de Ciberseguridad, que elabora un plan provincial con reglas obligatorias, y una Autoridad de Ejecución Operativa que lo aplica. Prevé sanciones por incumplimiento.
  puntos:
    - El Comité de Conducción Estratégica de Ciberseguridad es la autoridad de aplicación y elabora el Plan Provincial.
    - El Poder Ejecutivo designa una Autoridad de Ejecución Operativa; la fiscalización queda separada de la ejecución.
    - Alcanza al Poder Ejecutivo y a terceros que presten servicios digitales o tecnológicos.
    - Crea un Registro Provincial de Incidentes de Ciberseguridad y un esquema de reporte de incidentes.
    - Invita a los municipios a adherir y convoca al Poder Judicial y al Legislativo a sumar representantes. Reglamentación en 90 días.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9725"
  titulo: Cambios al Fondo Escolar Permanente
  tema: Educación
  resumen: Modifica la Ley 9545 del Fondo Escolar Permanente. Suma al fondo lo que se obtenga de la venta o alquiler de bienes de la DGE y del Ministerio de Educación. Autoriza a usar recursos del fondo como garantía de operaciones financieras, y evita que sus saldos pasen a rentas generales.
  puntos:
    - Se suman al fondo los ingresos por venta, subasta o alquiler de bienes de la DGE y del Ministerio de Educación.
    - Las rentas se usan para comprar terrenos y construir, reparar y equipar edificios escolares.
    - La DGE puede usar recursos del fondo como garantía de operaciones de crédito, incluidas las de vivienda para docentes.
    - "No se pueden dar en garantía inmuebles ni la totalidad de los recursos líquidos: debe quedar un saldo mínimo."
    - Los saldos del fondo no se transforman en rentas generales al cierre del ejercicio.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9724"
  titulo: Venta en subasta de un departamento provincial en Capital
  tema: Economía y finanzas
  resumen: Autoriza al Poder Ejecutivo a vender en subasta un departamento de la Provincia en calle Coronel Plaza 572, piso 1, depto. E, Ciudad de Mendoza. Lo recaudado va al destino que fija el artículo 69 de la Ley de Presupuesto 9681 (Fondo Di.Ge.Bi.R.E.).
  puntos:
    - Inmueble en Coronel Plaza 572, piso 1, depto. E, Capital, a nombre de la Provincia.
    - Superficie cubierta total de 66,99 m2 y patio de uso exclusivo de 10,20 m2.
    - Los fondos se destinan según el artículo 69 de la Ley 9681 (Fondo Di.Ge.Bi.R.E.).
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9723"
  titulo: Aprobación de los decretos 1471/25 y 1250/26
  tema: Convenios y ratificaciones
  resumen: Aprueba los Decretos 1471/25 y 1250/26. El texto de la ley no dice de qué tratan; los decretos forman parte de la ley como anexos.
  puntos:
    - Decretos 1471/25 y 1250/26.
    - El contenido está en los anexos de la ley.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9722"
  titulo: Derogación de leyes y restablecimiento de la Ley 1118
  tema: Otros
  resumen: Deroga las leyes del Anexo I, con sus modificatorias y las leyes que ellas derogaban. Deja sin efecto la inclusión de la Ley 1118 en el Anexo I de la Ley 9653 y restablece la vigencia de la Ley 1118.
  puntos:
    - La lista de leyes derogadas está en el anexo.
    - La Ley 1118 vuelve a regir con el texto que tenía antes de ser derogada por la Ley 9653.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9721"
  titulo: Expropiación de 38 inmuebles para abrir el Callejón Martínez
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujetos a expropiación 38 inmuebles para abrir el Callejón Martínez, en Rodeo de la Cruz, Guaymallén. La Municipalidad de Guaymallén expropia y paga los gastos.
  puntos:
    - Son 38 inmuebles detallados en la ley.
    - La Municipalidad de Guaymallén expropia según el Decreto-Ley 1447/75.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9720"
  titulo: La Ruta del Vitimigrante es Patrimonio Cultural Inmaterial
  tema: Derechos y sociedad
  resumen: Declara Patrimonio Cultural Inmaterial de Mendoza a la Ruta del Vitimigrante, un itinerario histórico, simbólico y cultural por Rivadavia, San Martín, Junín, Santa Rosa y La Paz. Allí se asentaron inmigrantes entre 1870 y 1960.
  puntos:
    - Recorre cinco departamentos del Este mendocino.
    - La declaración se hace en el marco de la Convención de la UNESCO sobre patrimonio cultural inmaterial y la Ley provincial 6.034.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9719"
  titulo: Expropiación para ensanchar calle Urquiza en Guaymallén
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujetas a expropiación parcelas afectadas por el ensanche de calle General Justo José de Urquiza, en el tramo Pedro del Castillo - Bandera de los Andes, Guaymallén. La Municipalidad de Guaymallén expropia y paga los gastos.
  puntos:
    - La ley detalla cada parcela con su nomenclatura catastral, padrones y superficie afectada.
    - La Municipalidad de Guaymallén expropia según el Decreto-Ley 1447/75.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9718"
  titulo: Adhesión al RIMI, cierre de la Administradora del Fondo y reformas
  tema: Economía y finanzas
  resumen: Adhiere Mendoza al Régimen de Incentivo para Medianas Inversiones (RIMI) y suma beneficios provinciales por diez años. Disuelve la Administradora Provincial del Fondo para la Transformación y el Crecimiento, reorganiza el Instituto de Juegos y Casinos y da de baja deudas incobrables de ex bancos oficiales.
  puntos:
    - Las empresas del RIMI con inversiones en Mendoza tienen estabilidad impositiva por diez años y necesitan certificado de cumplimiento fiscal de ATM.
    - La Administradora del Fondo se liquida; sus acciones en Mendoza Fiduciaria S.A. pasan al Gobierno, que la reemplaza como fiduciaria.
    - El Instituto de Juegos y Casinos puede por un año suprimir o modificar estructuras y puestos para equilibrar sus cuentas.
    - Retiro voluntario con 120% de la indemnización del artículo 17 del Decreto-Ley 560/73, y continuidad en OSEP.
    - Exime de Sellos las refinanciaciones de deudas contraídas entre el 30/6/2025 y el 31/3/2026, firmadas antes del 31/12/2026.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9717"
  titulo: Aprobación del impacto ambiental del proyecto Don Luis y otro
  tema: Energía y minería
  resumen: Aprueba la Declaración de Impacto Ambiental del proyecto Don Luis y otro, en San Rafael y Malargüe. La declaración fue emitida por la Resolución Conjunta 194/26 de la Dirección de Minería y 32/26 de Gestión y Fiscalización Ambiental. Rige desde el día siguiente a su publicación.
  puntos:
    - Lo dispuesto por la Declaración de Impacto Ambiental es de cumplimiento obligatorio.
    - El proyecto se desarrolla en los departamentos de San Rafael y Malargüe.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9716"
  titulo: Comisión Bicameral de Futuro en la Legislatura
  tema: Otros
  resumen: Crea la Comisión Bicameral de Futuro, permanente y consultiva, en la Legislatura. Explora escenarios futuros, identifica riesgos y oportunidades y propone políticas públicas. La integran 16 legisladores.
  puntos:
    - Se compone de 8 senadores y 8 diputados, procurando representar a las minorías.
    - Elabora Informes Provinciales de Futuro con un horizonte mínimo de 15 años.
    - Crea un Consejo Consultivo Académico Permanente con universidades y el sector científico.
    - Sus informes y documentos son públicos y se publican en el sitio de la Legislatura.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9715"
  titulo: Desadjudicación de viviendas del IPV y desalojo más ágil
  tema: Derechos y sociedad
  resumen: Modifica el artículo 14 de la Ley 4203 y el Código Procesal Civil, Comercial y Tributario. Prevé el trámite para recuperar inmuebles cuando el Instituto Provincial de la Vivienda desadjudica una vivienda mediante acto administrativo. Rige a los 30 días de su publicación.
  puntos:
    - El Directorio del IPV dicta, con aprobación del Poder Ejecutivo, un reglamento sobre precio, reajustes, pago, adjudicaciones y desadjudicaciones.
    - Agrega al artículo 232 del Código Procesal la restitución de inmuebles por desadjudicaciones del IPV.
    - Modifica los artículos 5 y 237 del Código Procesal sobre el proceso de desalojo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9714"
  titulo: "Polo Logístico del Este en San Martín: expropiación de 90 ha"
  tema: Tierras y expropiaciones
  resumen: Declara de interés público el desarrollo del Polo Logístico del Este, en San Martín. Declara de utilidad pública y sujetas a expropiación de urgencia 90 hectáreas al norte de la Ruta 7, en el PASIP. El Poder Ejecutivo expropia y paga los gastos.
  puntos:
    - Aprueba el Plan de Directrices para el Polo Logístico del Este, que está en el anexo.
    - Autoriza a transferir el dominio fiduciario de los bienes, una vez expropiados, para ejecutar el desarrollo.
    - Los inmuebles dejan el destino fijado por la Ley 6658.
    - El Poder Ejecutivo expropia según el Decreto-Ley 1447/75.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9713"
  titulo: Donación al IPV de 11 hectáreas en Capital para viviendas
  tema: Obras e infraestructura
  resumen: Autoriza al Poder Ejecutivo a donar con cargo al Instituto Provincial de la Vivienda una fracción de 11 ha 7.077,54 m2 en Ciudad, Capital. El IPV debe destinarla a construir viviendas, y se deja sin efecto cualquier destino anterior.
  puntos:
    - "La fracción tiene dos títulos: uno de 5 ha 9.354,16 m2 y otro de 5 ha 7.723,38 m2."
    - El cargo es construir viviendas, desafectando el predio de cualquier otro destino previo.
    - Escribanía General de Gobierno hace la inscripción registral a nombre del IPV.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9712"
  titulo: Aprobación de dos decretos del Poder Ejecutivo
  tema: Convenios y ratificaciones
  resumen: Aprueba los Decretos 2728, del 17 de diciembre de 2024, y 2615, del 27 de noviembre de 2025. El texto de la ley no dice de qué tratan; los decretos están en el anexo.
  puntos:
    - Decreto 2728, del 17 de diciembre de 2024.
    - Decreto 2615, del 27 de noviembre de 2025.
    - El contenido está en el anexo de la ley.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9711"
  titulo: Terreno de 117 hectáreas en Capital para actividades deportivas
  tema: Tierras y expropiaciones
  resumen: Destina una fracción de 117 ha 9.857 m2 a proyectos deportivos, recreativos y afines. El Poder Ejecutivo, mediante Di.Ge.Bi.R.E., puede dar parcelas en concesión por 10 a 30 años a instituciones deportivas inscriptas. Deroga la Ley 2536 y artículos de la Ley 3608.
  puntos:
    - La concesión es por un mínimo de 10 años y un máximo de 30, con posible prórroga de hasta 10 años.
    - Se otorga a instituciones deportivas inscriptas según la Ley 6457.
    - Las concesionarias proveen a su costa las instalaciones; al terminar dejan las obras y mejoras al Estado provincial.
    - Si incumplen el plan de inversión o el plan de trabajo, caduca la concesión y el terreno vuelve al Estado.
    - El Ministerio de Gobierno, Infraestructura y Desarrollo Territorial hace la mensura, el deslinde y la planificación de la zona.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9710"
  titulo: Aprobación de decretos de aumentos salariales a estatales
  tema: Trabajo y empleo público
  resumen: Aprueba cuatro decretos, fechados entre diciembre de 2025 y marzo de 2026. Esos decretos homologan actas acuerdo firmadas en la Subsecretaría de Trabajo y Empleo entre el Poder Ejecutivo y gremios de distintos sectores de la Administración Pública, y otorgan aumentos.
  puntos:
    - Los decretos son los números 2730, 08, 628 y 636.
    - Homologan actas acuerdo con entidades sindicales de distintos sectores de la Administración Pública.
    - El detalle de los aumentos está en el anexo de la ley.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9709"
  titulo: Reforma constitucional sobre autonomía municipal
  tema: Municipios
  resumen: Declara la necesidad de reformar el artículo 197 de la Constitución provincial para dar autonomía institucional, política, administrativa y económica financiera a los municipios. La reforma se vota en la próxima elección de diputados.
  puntos:
    - Los municipios podrán dictar sus Cartas Orgánicas; donde no lo hagan, sigue rigiendo la Ley Orgánica de Municipalidades.
    - Los miembros de los Departamentos Ejecutivo y Deliberativo duran cuatro años.
    - El pueblo vota a favor o en contra en la próxima elección de diputados.
    - Si se ratifica, el Poder Ejecutivo promulga la reforma y la incorpora al texto constitucional.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9708"
  titulo: Cambios en la ley apícola y creación del Mapa Apícola Provincial
  tema: Producción
  resumen: Modifica los artículos 2, 3, 4 y 9 de la Ley apícola 6.817 y crea el Mapa Apícola Provincial. El mapa identifica la ubicación de los apiarios con un sistema informático. La autoridad tiene 180 días desde la reglamentación para crear ese sistema.
  puntos:
    - "Objetivos: fomentar la actividad apícola, ordenar el territorio con criterios técnicos y sanitarios, y proteger la sanidad de las abejas."
    - El sistema registra y renueva apiarios con georreferenciación.
    - Plazo de 180 días desde la reglamentación para crear y adecuar el sistema informático.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9707"
  titulo: Registro Provincial obligatorio de Guardavidas
  tema: Salud
  resumen: Crea el Registro Obligatorio de Guardavidas de la provincia. Los titulares de instalaciones acuáticas y los organismos públicos que necesiten guardavidas deben contratar a personas inscriptas. La autoridad de aplicación es el Ministerio de Salud y Deportes.
  puntos:
    - "Requisitos: ser mayor de edad, tener título de guardavidas reconocido, no tener sanciones inhabilitantes y presentar certificado de antecedentes penales."
    - El Ministerio puede firmar convenios con los municipios para cumplir la ley.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9706"
  titulo: Control del transporte de efluentes cloacales e industriales
  tema: Ambiente y agua
  resumen: Regula la recolección, el transporte, la descarga y la disposición final de efluentes cloacales e industriales. El Departamento General de Irrigación es la autoridad de aplicación y crea un registro de transportistas.
  puntos:
    - Los transportistas con camiones atmosféricos se inscriben en un registro público y pagan un canon para el control del recurso hídrico.
    - Antes de cada vuelco se presenta un Manifiesto de Carga electrónico con carácter de declaración jurada.
    - Está prohibido mezclar efluentes, almacenar la carga más de 48 horas y descargar fuera de los lugares autorizados.
    - Los operadores en actividad tienen 180 días desde la reglamentación para declarar sus puntos de descarga.
    - La autoridad reglamenta la ley en 90 días desde la promulgación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9705"
  titulo: Cambios en el régimen de jardines maternales de gestión privada
  tema: Educación
  resumen: Modifica varios artículos de la Ley 9201 sobre jardines maternales de gestión privada, que atienden a niños y niñas desde 45 días hasta 3 años. La Dirección General de Escuelas los inspecciona y supervisa, y se crea un registro único.
  puntos:
    - Alcanza a instituciones privadas, cooperativas y sociales no incorporadas a la enseñanza oficial de la DGE.
    - La DGE tiene la inspección y supervisión pedagógica y técnica; el control administrativo y comercial lo ejerce la autoridad municipal o provincial.
    - Crea en la DGE el Registro Único de Jardines Maternales de Gestión Privada, de inscripción obligatoria.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9704"
  titulo: Lista de animales silvestres declarados Monumento Natural Provincial
  tema: Ambiente y agua
  resumen: Modifica el artículo 1 de la Ley 6599 y declara Monumento Natural Provincial a 14 especies de animales silvestres y sus hábitats naturales.
  puntos:
    - Incluye al cóndor, el guanaco, el choique o suri, la liebre mara y el gato andino.
    - También al pichiciego, el piche, el cardenal amarillo, el águila coronada y la lagartija del Nihuil.
    - Suma la tortuga del macizo extracordillerano del Nevado, el siete cuchillos, la ranita del Pehuenche y el bagre otuno.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9703"
  titulo: Nuevo procedimiento de flagrancia en el Código Procesal Penal
  tema: Seguridad y justicia
  resumen: Cambia los artículos 348 y 439 bis a quáter del Código Procesal Penal, sobre prisión preventiva y el procedimiento de flagrancia, e incorpora el 439 quinquies. Rige a los 30 días hábiles de su publicación.
  puntos:
    - El fiscal debe pedir la prisión preventiva en 10 días desde la imputación formal; en flagrancia con procedimiento directísimo, en la audiencia inicial.
    - El vencimiento de un plazo en flagrancia no anula ni retrotrae el trámite por sí mismo.
    - La Suprema Corte y las OGAP adecuan protocolos y turnos en 30 días hábiles.
    - La Procuración General organiza la especialización funcional para los casos de flagrancia.
    - Deroga el inciso 5 del artículo 295.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9702"
  titulo: Cambios en la Ley de Arbolado Público
  tema: Ambiente y agua
  resumen: Modifica seis artículos de la Ley de Arbolado Público 7874 y el artículo 78 de la Ley Orgánica de Municipalidades 1079. Aclara qué arbolado está bajo jurisdicción provincial y cuál bajo jurisdicción municipal exclusiva.
  puntos:
    - La Provincia tiene jurisdicción sobre el arbolado de Vialidad, Irrigación, Inspecciones de Cauce y Nación; los municipios, sobre el municipal.
    - Los municipios presentan a la autoridad provincial un Plan de Manejo Integral del Arbolado cada cuatro años.
    - Las municipalidades pueden disponer por ordenanza monumentos conmemorativos y nombres de calles y paseos.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9701"
  titulo: Videos ciudadanos de infracciones viales por canales digitales
  tema: Transporte
  resumen: Incorpora el artículo 120 bis a la Ley de Tránsito 9024. Cualquier persona puede enviar a los municipios o al Ministerio de Seguridad y Justicia material audiovisual de posibles infracciones viales, por canales digitales oficiales como WhatsApp. No es una denuncia formal.
  puntos:
    - El material recibido es una comunicación ciudadana y no da fe pública de su autenticidad.
    - La autoridad puede eximir de publicar lo que no parezca de su jurisdicción o tenga indicios vehementes de falsedad.
    - Si hay datos suficientes, lo remite al Juzgado Vial con un informe preliminar.
    - Los Juzgados Viales analizan la información y deciden cómo validarla.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9700"
  titulo: Nuevas funciones y reglas de uso de armas en la Ley 6722
  tema: Seguridad y justicia
  resumen: Agrega funciones al artículo 2 de la Ley 6722 y cambia el artículo 9 sobre el uso de armas de fuego. También agrega el artículo 322 bis, sobre un pago para personal convocado con tareas directivas.
  puntos:
    - "Nuevas funciones: asegurar personas y bienes ante peligro inminente, defender bienes del Estado y mantener el orden en espacios públicos."
    - Permite usar armas de fuego en estado de necesidad, defensa propia o de terceros, o ante peligro inminente de muerte o lesiones graves.
    - El personal convocado con tareas directivas y disponibilidad horaria permanente cobra hasta el 100% de la asignación de clase del grado.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9699"
  titulo: Semana de concientización del cáncer de colon y recto
  tema: Salud
  resumen: Instituye la última semana de marzo de cada año como semana de concientización, difusión y detección del cáncer de colon y recto. Se hacen actividades para visibilizar esta enfermedad en la provincia.
  puntos:
    - La autoridad de aplicación es el Ministerio de Salud, Desarrollo Social y Deportes.
    - Se invita a los municipios a adherir y a replicar las actividades.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9698"
  titulo: Cambios en la Dirección de Protección y Restitución de Derechos
  tema: Derechos y sociedad
  resumen: Modifica seis artículos de la Ley 9139 y deroga los artículos 27 y 28. Redefine la Dirección de Protección y Restitución de Derechos de niños, niñas y adolescentes y sus Equipos Técnicos Interdisciplinarios, que deben atender las 24 horas.
  puntos:
    - La Dirección está a cargo de un director o directora con conocimiento en niñez, adolescencia y familia.
    - Los Equipos Técnicos Interdisciplinarios atienden por turnos rotativos las 24 horas, los 365 días del año.
    - La Dirección articula con Cuidados Alternativos y con instituciones educativas, sociales, de salud y deportivas.
    - La autoridad de aplicación puede hacer los ajustes administrativos y presupuestarios necesarios.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9697"
  titulo: Derogación de leyes provinciales listadas en un anexo
  tema: Otros
  resumen: Deroga las leyes que se detallan en el Anexo I, junto con sus modificatorias. El texto publicado no incluye la lista, que está en el anexo.
  puntos:
    - El artículo único deroga las leyes del Anexo I y sus modificatorias.
    - La lista de leyes derogadas está en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9696"
  titulo: Expropiación en Chapanay (San Martín) de cinco calles públicas
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujetas a expropiación cinco parcelas para calles públicas, que forman parte de un inmueble en calle Bonanno s/n, Chapanay, San Martín. La Municipalidad de San Martín expropia y paga los gastos.
  puntos:
    - Calles 1 a 5, de entre 1.696,39 m2 y 2.525,60 m2 cada una según mensura.
    - Pertenecen a un inmueble de 6 ha 5.081,91 m2 según mensura.
    - La Municipalidad de San Martín es la expropiante, según el Decreto-Ley 1447/75.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9695"
  titulo: Plazo hasta fines de 2027 para Tunuyán en la Ley 9509
  tema: Municipios
  resumen: Incorpora el artículo 2 bis a la Ley 9509. Fija hasta el 31 de diciembre de 2027 el plazo para que la Municipalidad de Tunuyán haga las gestiones para cumplir el objeto de esa ley.
  puntos:
    - "Plazo: hasta el 31 de diciembre de 2027."
    - Corresponde a las gestiones de la Municipalidad de Tunuyán.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9694"
  titulo: Donación de un inmueble en San Martín para un hospital veterinario
  tema: Tierras y expropiaciones
  resumen: Autoriza a la Provincia a donar a la Municipalidad de General San Martín un inmueble urbano de 246 m2, en calle Perrupato esquina Diego Paroissien. Debe destinarse a construir un Hospital Veterinario.
  puntos:
    - Inmueble de 246,00 m2 en el distrito Ciudad, General San Martín.
    - El cargo es afectarlo a la construcción de un Hospital Veterinario.
    - Los gastos de la transferencia del dominio los paga la Municipalidad.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9693"
  titulo: Suspensión de procesos ampliada hasta el 31 de diciembre de 2026
  tema: Seguridad y justicia
  resumen: Modifica el artículo 1 de la Ley 9297. A los efectos del artículo 39 de la Ley 6.086, amplía hasta el 31 de diciembre de 2026 la suspensión de los procesos iniciados, cualquiera sea su estado, incluidos los que están en ejecución de sentencia.
  puntos:
    - "Nuevo plazo de la suspensión: hasta el 31 de diciembre de 2026."
    - Alcanza a procesos iniciados en cualquier estado, incluso en ejecución de sentencia.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9692"
  titulo: Adicional Asesoría de Gobierno para agentes del organismo
  tema: Trabajo y empleo público
  resumen: Crea el Adicional Asesoría de Gobierno para los agentes profesionales y administrativos que prestan funciones en forma normal, habitual y permanente en ese organismo. Rige desde la publicación en el Boletín Oficial.
  puntos:
    - "Para abogados: el doble de lo que cobra un agente del Régimen Salarial 05, Clase 13 (Ley 5126), por clase, título y responsabilidad."
    - "Para agentes administrativos: la mitad de ese adicional."
    - El Asesor de Gobierno puede subirlo o bajarlo por resolución fundada y con disponibilidad presupuestaria.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9691"
  titulo: Donación de la calle Los Pozos a la Provincia
  tema: Tierras y expropiaciones
  resumen: Aprueba el Decreto 2453, del 17 de noviembre de 2023, y su aclaratorio, el Decreto 2072, del 29 de septiembre de 2025. Aceptan la donación a la Provincia de una fracción de 14 ha 1.230,05 m2 de la calle Los Pozos, con cargo de custodia, mantenimiento y conservación.
  puntos:
    - "Superficie donada: 14 ha 1.230,05 m2 de la calle Los Pozos."
    - El cargo es la custodia, el mantenimiento y la conservación en toda su extensión.
    - Los decretos forman parte de la ley como anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9690"
  titulo: Coexistencia de cultivos para proteger la calidad de las semillas
  tema: Producción
  resumen: Regula la coexistencia entre cultivos agrícolas para garantizar la calidad genética de las semillas y evitar su contaminación genética. La autoridad de aplicación es el ISCAMEN. Quien produzca, multiplique o comercialice semillas debe inscribir los inmuebles en el Registro de Uso de la Tierra.
  puntos:
    - La inscripción en el RUT es anual e incluye ubicación georreferenciada, especie y programas de siembra.
    - "Sanciones: multas de 100 a 100.000 UF e inhabilitación temporal para registrar lotes semilleros."
    - Responde por el daño el productor que introduzca o mantenga un cultivo que genere riesgo comprobado sobre lotes registrados, con responsabilidad objetiva.
    - El Poder Ejecutivo la reglamenta dentro de los 60 días de la promulgación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9689"
  titulo: 2026 será el Año del 90° Aniversario de la Fiesta de la Vendimia
  tema: Derechos y sociedad
  resumen: Declara el año 2026 como Año del 90° Aniversario de la Fiesta Nacional de la Vendimia. Durante 2026 la documentación oficial gráfica y digital de la Administración Pública provincial debe llevar esa leyenda.
  puntos:
    - Alcanza a la administración centralizada y descentralizada y a los entes autárquicos.
    - Se invita a los municipios a adherir.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9688"
  titulo: "Certificado de protección contra incendios: quién lo emite"
  tema: Seguridad y justicia
  resumen: Modifica la Ley 7499 sobre el Certificado de Medidas de Protección Aptas Contra Incendios (Ce.Me.P.A.C.I.). Define qué edificios y locales requieren el certificado y que, donde el municipio tiene un área técnica en seguridad contra incendios, lo emite el propio municipio.
  puntos:
    - Alcanza a edificios públicos y a locales y actividades privadas de más de 450 m2 en municipios sin área técnica específica.
    - Donde hay área técnica, el municipio emite el certificado sobre informes de un profesional idóneo.
    - Los municipios pueden pedir colaboración y asesoramiento a la Dirección de Bomberos.
    - El Poder Ejecutivo registra y habilita las actividades que obtengan el certificado, independientemente de la habilitación municipal.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9687"
  titulo: Régimen de regalías mineras y fondo de desarrollo socioambiental
  tema: Energía y minería
  resumen: Establece el régimen de las regalías mineras por la explotación de minerales de primera y segunda categoría en Mendoza. La alícuota general es del 3% del valor boca mina. Crea el Fondo de Desarrollo Económico y Socioambiental y fija cómo se reparte lo recaudado.
  puntos:
    - Alícuota del 3%; para proyectos que no empezaron la etapa de explotación, un porcentaje progresivo y móvil de hasta 5%, que fija la reglamentación.
    - "Reparto: 88% a Rentas Generales, con 15% de ese monto para el Fondo, y 12% a municipios donde se extrae y que adhieran."
    - Declaración jurada trimestral y pago dentro de los 15 días posteriores al fin de cada trimestre.
    - Multas del 50% al 100% de la regalía omitida o inexacta, y suspensión del Certificado de Productor Minero.
    - Los municipios deben renunciar a todo tipo de imposición a la actividad minera para acceder al reparto.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9686"
  titulo: Fondo de Compensación Ambiental de Mendoza
  tema: Ambiente y agua
  resumen: Crea el Fondo de Compensación Ambiental, que administra el Ministerio de Energía y Ambiente. Sirve para obras y acciones de cese, restauración o mitigación de un daño ambiental colectivo cuando los responsables no pueden pagar todo. El Poder Ejecutivo la reglamenta en 180 días corridos.
  puntos:
    - "Recursos: multas, tasas y otros tributos de la normativa ambiental, y montos por daño ambiental fijados junto con las multas."
    - Está prohibido usarlo para proyectos de terceros, consultorías o gastos corrientes, bajo pena de nulidad.
    - La autoridad puede reclamar después a los responsables del daño que el Fondo cubrió (acción de repetición).
    - Queda exento de impuestos y tasas provinciales; se invita a los municipios a adherir.
    - La autoridad elabora un informe anual sobre la gestión, los ingresos y los destinos del Fondo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9685"
  titulo: Aprobación de 27 declaraciones de impacto ambiental en Malargüe
  tema: Energía y minería
  resumen: Aprueba 27 Declaraciones de Impacto Ambiental emitidas por resoluciones conjuntas de la Dirección de Minería y la Dirección de Gestión y Fiscalización Ambiental. Corresponden al proyecto El Destino y otros, llamado Malargüe Distrito Minero Occidental 2, en Malargüe.
  puntos:
    - Son las resoluciones conjuntas 408/25 a 434/25 de Minería, con sus números 74/25 a 100/25 de Gestión y Fiscalización Ambiental.
    - Lo dispuesto por esas declaraciones es de cumplimiento obligatorio y forman parte de la ley como anexo.
    - Rige desde el día siguiente a su publicación en el Boletín Oficial.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9684"
  titulo: Aprobación del impacto ambiental del proyecto PSJ Cobre Mendocino
  tema: Energía y minería
  resumen: Aprueba la Declaración de Impacto Ambiental del proyecto PSJ Cobre Mendocino, en Uspallata, Las Heras. La declaración fue emitida por la Resolución Conjunta 405/25 de la Dirección de Minería y 71/25 de Gestión y Fiscalización Ambiental. Rige desde el día siguiente a su publicación.
  puntos:
    - Todo lo dispuesto por la Declaración de Impacto Ambiental es de cumplimiento obligatorio.
    - La declaración forma parte de la ley como anexo.
    - El proyecto se desarrolla en el distrito de Uspallata, departamento de Las Heras.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9683"
  titulo: Las Verbenas Españolas son Fiesta de la Hispanidad en Mendoza
  tema: Derechos y sociedad
  resumen: Declara Fiesta de la Hispanidad en Mendoza a las Verbenas Españolas, que cada octubre organiza la Agrupación de Entidades Españolas de Mendoza, con sede principal en Guaymallén. La Subsecretaría de Cultura la difunde y EMETUR colabora en su promoción turística.
  puntos:
    - La Subsecretaría de Cultura adopta medidas para difundir y fortalecer la fiesta en toda la provincia.
    - El Ente Mendoza Turismo (EMETUR) colabora en la promoción turística.
    - La entidad organizadora comunica a Cultura la fecha de cada edición antes del 30 de junio.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9682"
  titulo: Sanciones a madres y padres por el bullying de sus hijos
  tema: Seguridad y justicia
  resumen: Incorpora al Código de Contravenciones los artículos 100 bis, ter y quater sobre acoso escolar. Sanciona a madres, padres o tutores que, ya notificados, no actúen para evitar que el bullying se repita o repare el daño.
  puntos:
    - "Sanción: multa de 1.500 a 3.000 UF o tareas educativas o comunitarias de hasta 30 días, según la gravedad."
    - Las multas van al Fondo Provincial de la Ley 9545 para prevenir y asistir a víctimas de acoso escolar, y a Bibliotecas Populares.
    - La escuela actúa primero con el Protocolo de Actuación en Casos de Bullying (Resolución 5679 de la DGE).
    - Si el intento falla, la escuela remite las actuaciones al Juzgado Contravencional competente.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9681"
  titulo: Presupuesto de la Provincia para 2026
  tema: Economía y finanzas
  resumen: "Es la Ley de Presupuesto 2026 de Mendoza. El Boletín Oficial no publicó el texto: solo una nota que remite al expediente EX-2025-09615520-GDEMZA-HCS y a un anexo. El texto y sus planillas están en el sitio del Ministerio de Hacienda."
  puntos:
    - Fija los gastos y recursos del Estado provincial para 2026.
    - Sus planillas incluyen la planta de cargos de cada organismo, que usamos en Gobierno por dentro.
    - Se publicó el 16 de diciembre de 2025 con una nota en lugar del texto.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
  revisado: 2026-10-12
- numero: "9680"
  titulo: Ley cuyo texto completo está en un anexo (expediente 09570988)
  tema: Otros
  resumen: El Boletín Oficial publicó solo una nota que indica que el texto de la ley se puede consultar completo en el expediente EX-2025-09570988-GDEMZA-HCS o en su anexo. El contenido no está en el texto publicado.
  puntos:
    - La ley se publicó el 16 de diciembre de 2025 con una nota en lugar del texto.
    - El texto íntegro está en el expediente EX-2025-09570988-GDEMZA-HCS o en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9679"
  titulo: Ley cuyo texto completo está en un anexo (expediente 09570180)
  tema: Otros
  resumen: El Boletín Oficial publicó solo una nota que indica que el texto de la ley se puede consultar completo en el expediente EX-2025-09570180-GDEMZA-HCS o en su anexo. El contenido no está en el texto publicado.
  puntos:
    - La ley se publicó el 16 de diciembre de 2025 con una nota en lugar del texto.
    - El texto íntegro está en el expediente EX-2025-09570180-GDEMZA-HCS o en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9678"
  titulo: Acta acuerdo del Tren de Cercanías Mendoza con Belgrano Cargas
  tema: Transporte
  resumen: Aprueba el Decreto 2268, del 21 de octubre de 2025, que aprobó el Acta Acuerdo Tren de Cercanías - Mendoza entre el Gobierno de Mendoza y Belgrano Cargas y Logística S.A., firmada el 12 de agosto de 2025. El detalle está en el anexo.
  puntos:
    - Las partes son el Gobierno de Mendoza y Belgrano Cargas y Logística S.A.
    - El acta se firmó el 12 de agosto de 2025 y forma parte de la ley como anexo.
    - La concesión que resulte del acta queda exceptuada del artículo 10, inciso g, de la Ley 5507 y del artículo 15 de la Ley 9086.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9677"
  titulo: Facturas con el teléfono de denuncias de Defensa del Consumidor
  tema: Derechos y sociedad
  resumen: Modifica los artículos 1 y 2 de la Ley 7538. Las facturas y tickets a consumidor final emitidos en Mendoza deben llevar impreso, de forma legible y destacada, el teléfono gratuito o canal digital de denuncias de la Dirección de Defensa del Consumidor.
  puntos:
    - Alcanza a facturas y tickets a consumidor final emitidos en la provincia.
    - La impresión sigue el texto que indique la Dirección de Defensa del Consumidor, con los canales de contacto actualizados.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9676"
  titulo: Cambios en las reglas del transporte por plataformas
  tema: Transporte
  resumen: Modifica artículos de la Ley 9086 y de la Ley 7412. Cambia los permisos de explotación de los vehículos, las sanciones a las empresas de plataformas y las controversias, que van primero ante el Ente de la Movilidad Provincial.
  puntos:
    - El permiso de explotación es precario y revocable, solo para personas humanas, y nadie puede tener más de uno, salvo vehículos eléctricos.
    - "Sanciones a las plataformas: suspensión temporal de hasta dos años, multas o inhabilitación definitiva."
    - Las plataformas no pueden asignar viajes a conductores sin permiso ni a vehículos sin registrar.
    - Las controversias del servicio se someten primero y de forma obligatoria al Ente de la Movilidad Provincial.
    - Rige desde su publicación en el Boletín Oficial.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9675"
  titulo: Licencia de conducir digital y seguro en cualquier formato
  tema: Transporte
  resumen: Modifica los artículos 21, 40 y 43 de la Ley de Tránsito 9.024. La licencia nacional de conducir física o digital valen por igual, y el comprobante del seguro obligatorio puede presentarse en cualquier formato.
  puntos:
    - Ante la autoridad se puede mostrar la licencia física o digital, indistintamente.
    - El comprobante de pago del seguro de responsabilidad civil se acredita en cualquier formato.
    - La Provincia delega en los municipios, mediante convenios, la emisión de la Licencia Nacional de Conducir.
    - La Unidad Ejecutiva de Seguridad Vial audita los centros de emisión e informa a la Agencia Nacional de Seguridad Vial.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9674"
  titulo: Donaciones de terrenos de Lavalle y San Carlos para AySAM
  tema: Ambiente y agua
  resumen: Aprueba dos decretos que aceptan donaciones con cargo a la Provincia, para que se usen en la prestación del servicio de la empresa AySAM S.A. Son un inmueble de la Municipalidad de Lavalle y dos fracciones de terreno de la Municipalidad de San Carlos.
  puntos:
    - "Decreto 1734, del 12 de agosto de 2025: acepta un inmueble de la Municipalidad de Lavalle."
    - "Decreto 1876, del 29 de agosto de 2025: acepta dos fracciones de terreno de la Municipalidad de San Carlos."
    - El detalle de los inmuebles está en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9673"
  titulo: Reestructuración de los servicios sanitarios extrahospitalarios
  tema: Salud
  resumen: Establece la modernización y reestructuración de los servicios sanitarios extrahospitalarios de la provincia, para mejorar y homogeneizar la respuesta en traslados, urgencias, emergencias, catástrofes y atención domiciliaria. La autoridad de aplicación es el Ministerio de Salud y Deportes.
  puntos:
    - Alcanza a los sectores público y privado, que deben acudir ante el requerimiento del Organismo Coordinador de la Red.
    - Los servicios se habilitan y categorizan según las unidades móviles, el equipamiento, los recursos físicos y humanos y su capacitación.
    - Los prestadores deben registrar por escrito todas las acciones de cada evento.
    - Los equipos son médicos, enfermeros-choferes, técnicos de salud, técnicos en emergentología y choferes.
    - Los ciudadanos deben usar con responsabilidad los medios y la línea telefónica gratuita, y dar información veraz.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9672"
  titulo: Régimen legal del Técnico Superior en Emergentología
  tema: Salud
  resumen: Regula el ejercicio del Técnico Superior en Emergentología en servicios de salud públicos y privados, bajo la supervisión del profesional médico. Define sus competencias en emergencias y catástrofes. El Poder Ejecutivo reglamenta la ley en 180 días corridos.
  puntos:
    - Es un profesional de la salud con título de nivel superior, entrenado para tareas extrahospitalarias de soporte sanitario.
    - Sus competencias abarcan antes, durante y después de emergencias y catástrofes, incluida la prevención del daño.
    - Si se aprueba la Licenciatura en Emergentología, el Poder Ejecutivo puede aplicarle la ley por reglamentación.
    - El Poder Ejecutivo fija las condiciones para reconocer la especialidad en profesiones de salud de grado universitario.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9671"
  titulo: El buceo en altura es actividad de interés provincial
  tema: Producción
  resumen: Declara al buceo en altura como actividad de interés provincial. El objetivo es contribuir al desarrollo, crecimiento y posicionamiento de la provincia en esa actividad, como atractivo turístico y deportivo.
  puntos:
    - Es una declaración de interés provincial.
    - Se enfoca en su valor como atractivo turístico y deportivo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9670"
  titulo: Expropiación en Lavalle para calles, servicios y viviendas
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujeta a expropiación una fracción de unos 7 ha en Ruta Provincial 34 al 4355, Barrio El Palmeral, Villa Tulumaya, Lavalle. Se destina a abrir calles, obras de servicios públicos, regularizar el dominio de las familias que viven allí y dar soluciones habitacionales.
  puntos:
    - "Superficie: 7 ha 997,36 m2, fracción 23 del plano de mensura 13-15527."
    - La Municipalidad de Lavalle expropia, según el Decreto-Ley 1.447/75.
    - La Municipalidad paga los gastos que demande la ley.
    - El destino puede cumplirse por sí o en asocio con terceros.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9669"
  titulo: Donación de un terreno en Godoy Cruz para viviendas sociales
  tema: Tierras y expropiaciones
  resumen: Autoriza al Instituto Provincial de la Vivienda a aceptar la donación con cargo de un inmueble de 2.412,87 m2 en Godoy Cruz, entre las calles José Manuel Estrada, Cruz del Eje y General Paz. Debe usarse para viviendas de interés social. También cambia la afectación de fracciones municipales.
  puntos:
    - El cargo es construir viviendas de interés social, urbanizar y adjudicarlas mediante los programas del Instituto.
    - Pasa del dominio público al privado de la Municipalidad de Godoy Cruz la fracción de 2.412,87 m2 destinada a viviendas sociales.
    - Pasa del dominio privado al público municipal otra fracción, el polígono 1-2-3-4-5-6, de 3.942,36 m2.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9668"
  titulo: Convenio específico de colaboración entre Mendoza y San Juan
  tema: Convenios y ratificaciones
  resumen: Aprueba el Decreto 1927, del 8 de septiembre de 2025, que aprobó un convenio específico de colaboración interjurisdiccional entre Mendoza y San Juan. Se firmó el 30 de mayo de 2025 y el detalle está en el anexo.
  puntos:
    - Participan los gobiernos de Mendoza y San Juan.
    - El convenio se firmó el 30 de mayo de 2025.
    - El contenido del convenio y su anexo forman parte de la ley.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9667"
  titulo: Convenio interjurisdiccional entre Mendoza, San Juan y San Luis
  tema: Convenios y ratificaciones
  resumen: Aprueba el Decreto 754, del 14 de abril de 2025, que aprobó un convenio de colaboración interjurisdiccional entre las provincias de Mendoza, San Juan y San Luis. El convenio se firmó el 31 de mayo de 2024 y el detalle está en el anexo.
  puntos:
    - Participan los gobiernos de Mendoza, San Juan y San Luis.
    - El convenio se firmó el 31 de mayo de 2024.
    - El contenido del convenio está en el anexo de la ley.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9666"
  titulo: Reforma de artículos del Código Procesal Penal
  tema: Seguridad y justicia
  resumen: Modifica doce artículos del Código Procesal Penal (Ley 6.730) e incorpora nuevos. Los cambios tocan el Tribunal Penal Colegiado, los jueces y fiscales, las actas, las resoluciones, las audiencias orales y la audiencia de acusación.
  puntos:
    - El Tribunal Penal Colegiado actúa en Salas Unipersonales o en Colegio de tres jueces si lo piden las partes al apelar o al citar a juicio.
    - Las decisiones sobre criterios de oportunidad, juicio abreviado y otros trámites se resuelven en audiencia oral.
    - La audiencia de acusación se fija dentro de los cinco días.
    - Las actas son nulas si les falta la fecha, la hora o la firma, entre otros requisitos.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9665"
  titulo: Cambios en el estatuto del empleado público (Decreto-Ley 560/73)
  tema: Trabajo y empleo público
  resumen: Modifica varios artículos del estatuto general del empleo público de Mendoza, el Decreto-Ley 560/73. Cambia, entre otros temas, la estabilidad, las indemnizaciones, la reincorporación tras una baja anulada y los recursos de los agentes.
  puntos:
    - Todo nombramiento que cumple los requisitos de ingreso o ascenso es efectivo y permanente, salvo que el acto de designación diga lo contrario.
    - Las indemnizaciones se pagan dentro de los 30 días de producido el hecho que las genera.
    - Si se anula una baja o cesantía, el agente vuelve a su cargo, pero no se reconocen salarios caídos.
    - Tras agotar la vía administrativa, el agente puede demandar mediante la acción procesal administrativa de la Ley 3918.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9664"
  titulo: Día de la Concientización de la Enfermedad Cardiovascular en la Mujer
  tema: Salud
  resumen: Instituye el 9 de octubre de cada año como Día Provincial de la Concientización de la Enfermedad Cardiovascular en la Mujer. Busca prevenir, informar y promover la detección temprana de esta enfermedad.
  puntos:
    - El Ministerio de Salud y Deportes promueve acciones de prevención, investigación y estudios epidemiológicos.
    - En el mes previo a la fecha se promueven campañas en medios gráficos, digitales, radiofónicos y audiovisuales.
    - Las campañas se hacen con la colaboración de instituciones especializadas.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9663"
  titulo: Programa de Compromiso Ambiental Educativo en escuelas
  tema: Educación
  resumen: Crea el Programa de Compromiso Ambiental Educativo en instituciones educativas de la provincia. Incluye voluntariados ambientales, un Juramento Ambiental y la Bandera del Compromiso Ambiental.
  puntos:
    - El Juramento Ambiental es voluntario, para estudiantes de sexto grado de primaria y tercer año de secundaria, en torno al Día Mundial del Ambiente.
    - La autoridad de aplicación puede convocar a estudiantes a voluntariados de acción climática.
    - Puede reconocer la participación de docentes, incluso con un sistema de créditos.
    - La autoridad de aplicación es el Ministerio de Educación, Cultura, Infancias y Dirección General de Escuelas.
    - El Poder Ejecutivo la reglamenta dentro de los 180 días de la promulgación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9662"
  titulo: Aprobación de decretos de aumentos salariales a estatales
  tema: Trabajo y empleo público
  resumen: Aprueba once decretos, fechados entre octubre de 2024 y agosto de 2025. Esos decretos homologan actas acuerdo firmadas en la Subsecretaría de Trabajo y Empleo entre el Poder Ejecutivo y gremios de distintos sectores de la Administración Pública, y otorgan aumentos.
  puntos:
    - Los decretos son los números 2139, 1396, 1602, 1611, 1612, 1613, 1635, 1778, 1779, 1803 y 1815.
    - Homologan actas acuerdo con entidades sindicales de distintos sectores de la Administración Pública.
    - El detalle de los aumentos está en el anexo de la ley.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9661"
  titulo: Nuevo monto de la pensión honorífica de la Ley 6.772
  tema: Trabajo y empleo público
  resumen: Modifica el artículo 4 de la Ley 6.772 y fija el monto de la pensión honorífica mensual en tres veces la asignación de la clase 013 del Escalafón General de la Ley 5.126.
  puntos:
    - "Monto: tres veces la asignación de la clase 013 del Escalafón General."
    - La pensión es mensual, inembargable y vitalicia.
    - Es compatible con cualquier otro beneficio previsional, pensión nacional o empleo.
    - No requiere contraprestación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9660"
  titulo: "Reclamos de consumo de menor cuantía: tope de 5 JUS"
  tema: Derechos y sociedad
  resumen: Modifica el artículo 218 del Código Procesal Civil, Comercial y Tributario sobre reclamos de consumo de menor cuantía. El procedimiento especial rige cuando el reclamo no supera 5 JUS y lo inicia el consumidor o usuario en forma individual.
  puntos:
    - El tope es el equivalente a cinco (5) JUS.
    - Vale cuando la acción la ejerce el consumidor o usuario de manera individual.
    - En los demás procesos de consumo de menor cuantía se aplica el procedimiento de conocimiento de los artículos 204 y siguientes.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9659"
  titulo: Sistema provincial de gestión integral de residuos sólidos urbanos
  tema: Ambiente y agua
  resumen: Establece un Sistema de Gestión Integral de Residuos Sólidos Urbanos para la provincia, respetando las competencias de los municipios. El Ministerio de Energía y Ambiente es la autoridad de aplicación. Deroga la Ley 5.970.
  puntos:
    - La autoridad de aplicación elabora el Plan Provincial de Residuos Sólidos Urbanos.
    - Divide la provincia en zonas para la gestión de residuos, como la Zona Metropolitana y la Zona Este.
    - Los municipios pueden formar consorcios entre sí y deben hacer su plan municipal o interjurisdiccional de gestión de residuos.
    - La ley tiene títulos sobre recolección diferenciada, tratamiento y disposición final, recuperadores urbanos y educación.
    - El Poder Ejecutivo la reglamenta en 180 días corridos desde la promulgación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9658"
  titulo: Trámite automatizado del beneficio de litigar sin gastos
  tema: Seguridad y justicia
  resumen: Modifica el artículo 96 del Código Procesal Civil, Comercial y Tributario. Crea un trámite automatizado para el beneficio de litigar sin gastos, que consiste en una consulta web a un sistema informático de la Suprema Corte.
  puntos:
    - Quien quiera litigar sin gastos lo indica en su primera presentación judicial y el Juzgado consulta el sistema.
    - La Sala Administrativa de la Suprema Corte fija, al menos una vez al año, los parámetros objetivos para dar el beneficio.
    - Si el sistema indica que se cumplen, el Juzgado lo comunica en el primer decreto con una constancia con firma digital.
    - Si no se cumplen, el Juzgado se lo informa y lo emplaza a pagar las tasas de juicio.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9657"
  titulo: Cámaras de la Primera Circunscripción revisan apelaciones de otras
  tema: Seguridad y justicia
  resumen: Las Cámaras de apelaciones civiles, comerciales y de minas de la Primera Circunscripción también resuelven apelaciones de causas de paz y tributarias de la Tercera y Cuarta Circunscripción. Modifica la Ley 5384 sobre las Cámaras del Trabajo y deroga el artículo 5 de la Ley 2775.
  puntos:
    - Se suma esa competencia a la que ya tienen.
    - "Tercera Circunscripción: la Segunda Cámara del Trabajo tiene asiento en San Martín."
    - "Cuarta Circunscripción: la Primera Cámara del Trabajo tiene asiento en Tunuyán."
    - Deroga el artículo 5 de la Ley 2775 y lo que se oponga.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9656"
  titulo: Expropiaciones para prolongar calle Alsina en Guaymallén
  tema: Tierras y expropiaciones
  resumen: Modifica los artículos 1 y 2 de la Ley 9303 y deroga los artículos 3 y 4. Detalla los inmuebles sujetos a expropiación para prolongar la calle Alsina, entre Las Cañas y Estrada y la rotonda de Elpidio González y Estrada, en Las Cañas, Guaymallén.
  puntos:
    - Declara de utilidad pública y sujetos a expropiación inmuebles identificados como parcelas A, B, C y D, entre otras.
    - "Destino: prolongación de calle Alsina, distrito Las Cañas."
    - Deroga los artículos 3 y 4 de la Ley 9303.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9655"
  titulo: "Transparencia fiscal: las facturas deben mostrar Ingresos Brutos"
  tema: Impuestos
  resumen: Mendoza adhiere al Régimen de Transparencia Fiscal al Consumidor de la Ley Nacional 27.743. Las facturas, tickets y similares deben detallar la alícuota de Ingresos Brutos de la actividad de quien los emite. Controla Administración Tributaria Mendoza y rige desde el 1 de enero de 2026.
  puntos:
    - Adhiere al Título VII de la Ley Nacional 27.743.
    - Los comprobantes fiscales indican la alícuota de Ingresos Brutos del emisor.
    - Administración Tributaria Mendoza supervisa y controla.
    - Vigencia desde el 1 de enero de 2026.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9654"
  titulo: Terreno en La Consulta para la Escuela 4-234 Lanati
  tema: Educación
  resumen: Deja sin efecto el uso fijado por la Resolución 122/78 a un terreno de unas 6 ha en La Consulta, San Carlos. Autoriza a donarlo a la Dirección General de Escuelas para construir el edificio de la Escuela Nº 4-234 "Ing. Silvio José Lanati".
  puntos:
    - Fracción II del plano 16/14720, frente a calle San Martín s/n, en La Consulta.
    - La donación a la DGE tiene el cargo de construir ahí el edificio de la escuela.
    - La Escribanía General de Gobierno formaliza la donación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9653"
  titulo: Deroga un listado de leyes detalladas en un anexo
  tema: Otros
  resumen: Deroga las leyes y sus modificatorias que figuran en el Anexo I. El texto de la ley no dice cuáles son; el listado está en el anexo.
  puntos:
    - Deroga las leyes del Anexo I y sus modificatorias.
    - El listado de leyes está en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9652"
  titulo: Límite al número de máquinas tragamonedas
  tema: Derechos y sociedad
  resumen: Prohíbe ampliar la cantidad de máquinas tragamonedas en las salas de juego de la provincia, tomando como límite el mayor número histórico autorizado. Exige programas de juego responsable y fija multas y suspensiones por incumplir.
  puntos:
    - No se puede ampliar el número de máquinas; el tope es el mayor número histórico autorizado de cada sala.
    - El Instituto Provincial de Juegos y Casinos puede reducir las máquinas de los contratos del Casino de Mendoza.
    - Las salas deben informar sobre riesgos, ofrecer líneas de asistencia gratuita y capacitar al personal.
    - Multas del 1% al 20% de la recaudación mensual promedio y suspensiones de hasta 30 días.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9651"
  titulo: Aprueba nuevas condiciones del transporte contratado y por plataformas
  tema: Transporte
  resumen: "Aprueba el Decreto 2731 del 18 de diciembre de 2024, que revisa las condiciones de varios servicios de transporte de pasajeros: contratado general, turístico, por comitente determinado, para personas con discapacidad, escolar, institucional y privado por plataformas electrónicas. El detalle está en el anexo."
  puntos:
    - Aprueba el Decreto 2731/2024.
    - Alcanza al servicio escolar, turístico, para personas con discapacidad y al transporte privado por plataformas electrónicas, entre otros.
    - Las nuevas condiciones están en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9650"
  titulo: Endeudamiento de hasta USD 160 millones para salud y educación digital
  tema: Economía y finanzas
  resumen: "Autoriza al Poder Ejecutivo a tomar crédito con organismos multilaterales: hasta USD 85 millones para la transformación digital del sistema de salud y hasta USD 75 millones para el programa EDUTEC. Ambas autorizaciones rigen hasta el 31 de diciembre de 2026."
  puntos:
    - "Salud: USD 85 millones para infraestructura, equipamiento tecnológico y sistemas de atención."
    - "Educación: USD 75 millones para conectividad, equipamiento, plataformas y capacitación en el programa EDUTEC."
    - Permite modificar el Presupuesto vigente por estos créditos.
    - El Ejecutivo envía a la Legislatura la documentación firmada en 10 días hábiles.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9649"
  titulo: Expropiación de tres fracciones para ensanchar calle Antonelli
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujetas a expropiación tres fracciones de terreno para ensanchar la calle Antonelli, desde Los Guindos hasta Juan Martínez de Rosas, en Capilla del Rosario, Guaymallén. La Municipalidad de Guaymallén expropia y paga los gastos.
  puntos:
    - Tres fracciones afectadas de unos 398, 94 y 130 m2.
    - "Destino: ensanche de calle Antonelli, en Capilla del Rosario."
    - Expropia la Municipalidad de Guaymallén según el Decreto-Ley 1447/75.
    - La Municipalidad paga los gastos.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9648"
  titulo: "Compras de municipios: nuevo inciso en el Código Fiscal"
  tema: Impuestos
  resumen: Agrega el inciso 42 al artículo 238 del Código Fiscal. Alcanza a las contrataciones de bienes y servicios de los municipios, siempre que el monto no supere el que se fija cada año para la Licitación Pública en su monto mayor, según el artículo 140 de la Ley 8706.
  puntos:
    - Alcanza a contrataciones de bienes y servicios de los municipios de la Provincia.
    - El tope es el monto anual de Licitación Pública en su monto mayor (artículo 140 de la Ley 8706 y su decreto).
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9647"
  titulo: Expropiación en Guaymallén para ensanchar calle Alem
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujeta a expropiación una fracción de 17,10 m2 en Vélez Sarsfield 1012 esquina Alem, distrito Dorrego, Guaymallén. Se destina al ensanche de calle Alem. La Municipalidad de Guaymallén expropia y paga los gastos.
  puntos:
    - Fracción de 17,10 m2, parte de una parcela mayor.
    - "Destino: ensanche de calle Alem."
    - Expropia la Municipalidad de Guaymallén según el Decreto-Ley 1447/75.
    - La Municipalidad paga los gastos.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9646"
  titulo: Expropiación en Rivadavia para calles del Barrio Confraternidad
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujeta a expropiación una fracción de 1.049,10 m2 en calle Sur del loteo Barrio Confraternidad, Rivadavia, para ensanche y trazado de calles. La Municipalidad de Rivadavia expropia y paga los gastos.
  puntos:
    - Fracción de 1.049,10 m2, entre calles Arenales y Corrientes.
    - Es un acceso comunero de indivisión forzosa, según el plano 10-7481.
    - "Destino: ensanche y trazado de calles."
    - Expropia la Municipalidad de Rivadavia según el Decreto-Ley 1447/75 y paga los gastos.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9645"
  titulo: Cambios al plan de alfabetización y habilidades matemáticas
  tema: Educación
  resumen: Modifica la Ley 9438. Declara política educativa prioritaria la alfabetización y las habilidades matemáticas, con un plan estratégico (PEAMM) obligatorio en toda la provincia. Destina al menos el 2% del Fondo de Financiamiento Educativo y da 60 días para elaborarlo.
  puntos:
    - El PEAMM es de aplicación obligatoria y parte de la formación docente.
    - Usa jornada extendida, Centros de Apoyo Escolar y bibliotecas para estudiantes por debajo del nivel esperado.
    - Afecta al menos el 2% anual del Fondo de Financiamiento Educativo (Ley 26.075).
    - La autoridad lo elabora en 60 días, prorrogables 30 más.
    - El Director General de Escuelas puede determinar unidades pedagógicas.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9644"
  titulo: Terreno de 38 ha en Luján de Cuyo pasa a administración municipal
  tema: Tierras y expropiaciones
  resumen: Deja sin efecto el destino que tenía un inmueble de unas 38 ha en La Puntilla, Luján de Cuyo, fijado por el Decreto-Ley 463/73. Se lo asigna a la Municipalidad de Luján de Cuyo, que lo administra y usa según el ordenamiento territorial del departamento.
  puntos:
    - Inmueble de 38 ha 7.961,60 m2 en el distrito La Puntilla.
    - Se desafecta el destino del artículo 1 del Decreto-Ley 463/73.
    - La Municipalidad de Luján de Cuyo lo administra con uso exclusivo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9643"
  titulo: Se suspenden las PASO provinciales en 2025 y 2026
  tema: Derechos y sociedad
  resumen: Suspende en 2025 y 2026 las elecciones primarias abiertas, simultáneas y obligatorias (PASO) de la Ley 8619. La Junta Electoral Provincial debe adecuar y publicar los nuevos plazos del cronograma electoral en 10 días corridos.
  puntos:
    - Suspende las PASO y las obligaciones sobre su organización durante 2025 y 2026.
    - La Junta Electoral Provincial publica el nuevo cronograma en 10 días corridos desde las convocatorias.
    - Los plazos se compatibilizan con la Ley Nacional 27.781, modificada por la 27.783.
    - Rige desde el día siguiente a su publicación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9642"
  titulo: Amparo por mora contra demoras de la Administración
  tema: Derechos y sociedad
  resumen: Modifica el artículo 219 de la Ley 9001. Se puede hacer un amparo contra la Administración provincial o municipal que no resuelve las peticiones en los plazos legales, si la demora es excesiva y perjudica derechos. El informe lo da el órgano o agente competente.
  puntos:
    - Procede contra la Administración provincial o municipal que no resuelve en término.
    - La demora debe ser excesiva y perjudicar los derechos de quien reclama.
    - El informe lo debe presentar el órgano o agente que tenga la competencia de resolver, según la Ley 9003.
    - Eso define quién responde por las costas si el amparo prospera.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9641"
  titulo: El tribunal identifica al funcionario responsable de la demora
  tema: Derechos y sociedad
  resumen: Agrega el artículo 38 bis a la Ley 3918. Cuando se admite una acción por denegación tácita, el tribunal debe identificar al agente o funcionario responsable de la demora y pedir al organismo que le aplique la sanción disciplinaria del artículo 2 de la Ley 9003.
  puntos:
    - Rige cuando la acción se admite por denegación tácita (artículo 6 de la Ley 3918).
    - El tribunal nombra al agente o funcionario responsable de la mora en el auto de admisión formal.
    - Pide al organismo aplicar la falta disciplinaria prevista en la Ley 9003.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9640"
  titulo: Aprueba convenio con Vialidad Nacional para obras y mantenimiento
  tema: Convenios y ratificaciones
  resumen: Aprueba el Decreto 1165 del 29 de mayo de 2025, que aprobó el convenio entre la Provincia de Mendoza y la Dirección Nacional de Vialidad para ejecución de obras, conservación y mantenimiento. Se firmó el 14 de mayo de 2025 y su texto está en el anexo.
  puntos:
    - Aprueba el Decreto 1165/2025.
    - Convenio entre Mendoza y la Dirección Nacional de Vialidad, firmado el 14 de mayo de 2025.
    - Trata de ejecución de obras, conservación y mantenimiento; el detalle está en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9639"
