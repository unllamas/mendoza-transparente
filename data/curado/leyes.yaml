  titulo: "Ley de videocámaras: dónde, cuánto se guardan y quién accede"
  tema: Seguridad y justicia
  resumen: Regula las cámaras de seguridad, con o sin inteligencia artificial. Las grabaciones se guardan al menos 30 días, son confidenciales y no pueden filmar el interior de casas sin permiso. Los particulares pueden instalar cámaras propias.
