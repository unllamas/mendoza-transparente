- numero: "9709"
  titulo: Reforma de la Constitución para dar autonomía a los municipios
  tema: Municipios
  resumen: Declara necesario reformar el artículo de la Constitución sobre municipios para darles autonomía y permitir que dicten su propia Carta Orgánica. La reforma se vota en la próxima elección de diputados y solo rige si el pueblo la aprueba.
  a_quien: Todos los municipios y votantes de la provincia
  municipios: []
  puntos:
    - Cada municipalidad tendría autonomía institucional, política, administrativa y económica. Intendente y concejales durarían 4 años.
    - Los municipios podrán dictar su Carta Orgánica con una convención. Quienes no la dicten siguen con la Ley Orgánica de Municipalidades.
    - Los municipios pueden crear tasas, contribuciones de mejoras y cánones por servicios y licencias, pero no cobrar impuestos.
    - La Legislatura hará una ley marco para formar regiones entre municipios.
  no_dice:
