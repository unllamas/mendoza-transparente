- numero: "9637"
  titulo: Municipios pueden crear cuerpos de seguridad ciudadana sin armas
  tema: Seguridad y justicia
  resumen: Fija las reglas para que los municipios que quieran armen cuerpos de seguridad ciudadana. Previenen y auxilian, pueden labrar actas y aprehender en flagrancia, pero no son policía ni usan armas de fuego.
  a_quien: Vecinos de los municipios que creen estos cuerpos y su personal
  municipios: []
  puntos:
    - Solo rige para los municipios que decidan crear su cuerpo. Su tarea es preventiva y auxiliar.
    - Pueden labrar actas, tomar denuncias, pedir documentos e inspeccionar vehículos. Pueden aprehender a quien sorprendan en un delito y entregarlo a la policía.
    - Nunca portan armas de fuego. Con autorización del Ministerio de Seguridad pueden usar bastón, spray de pimienta, pistolas de aire comprimido, perros y drones.
    - Queda prohibido llamarse policía o usar uniformes y escudos parecidos a los de las Fuerzas Armadas y de Seguridad.
  no_dice:
    - Qué municipios van a crear sus cuerpos ni cuánto costará.
  hecho_con: claude-sonnet
