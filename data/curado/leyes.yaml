- numero: "9631"
  titulo: Nueva ley para adjudicar tierras fiscales a proyectos productivos
  tema: Producción
  resumen: Establece cómo el Estado vende o adjudica tierras fiscales para proyectos agropecuarios, industriales, comerciales, turísticos, deportivos y sociales. Deroga la ley de Planes de Colonización (Ley 4711).
  a_quien: Productores, empresas y familias que quieran acceder a tierra fiscal
  municipios: []
  puntos:
    - Se adjudica por licitación pública, concurso de antecedentes (con o sin precio) o adjudicación directa para resolver problemas socio-rurales.
    - Pueden postularse mayores de edad, argentinos o extranjeros radicados, sin condena por delito doloso en 5 años. Funcionarios y sus parientes cercanos no pueden.
    - En algunos casos hay que residir y trabajar el predio. No se puede dividir por 15 años ni transferir por 10, salvo autorización.
    - Quien deba 2 cuotas puede perder la adjudicación. Si pagó más del 50% y pasaron 5 años, se lo intima 60 días antes.
  no_dice:
    - "Qué tierras se ofrecerán ni dónde: los proyectos se definen después."
    - "Cuánto costarán: el precio lo fijan órganos de tasación y no puede ser menor al 75% de la valuación cuando se resuelven problemas socio-rurales."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
