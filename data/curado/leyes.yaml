  titulo: Jueces y abogados jubilados podrán cubrir reemplazos en la Justicia
  tema: Seguridad y justicia
  resumen: "Cambia quiénes integran los cuerpos de magistrados subrogantes y de conjueces especiales: jueces y abogados jubilados en los últimos 10 años que se inscriben en la Suprema Corte."
  a_quien: Magistrados y abogados jubilados, y la Justicia de Mendoza
  municipios: []
  puntos:
    - Pueden ser magistrados subrogantes quienes se jubilaron como magistrados en los últimos 10 años, salvo por incapacidad.
    - Se inscriben en la Suprema Corte e indican en qué circunscripciones judiciales pueden trabajar.
    - La Suprema Corte arma listas por fuero y por circunscripción, según la materia que tenían al jubilarse.
    - Los conjueces especiales son abogados jubilados en los últimos 10 años que no ejerzan otra actividad profesional, salvo la docencia.
