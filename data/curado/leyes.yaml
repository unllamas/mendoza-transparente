- numero: "9498"
  titulo: Irrigación dona un terreno a inspecciones de cauce del Río Diamante
  tema: Tierras y expropiaciones
  resumen: Autoriza donar a la Asociación de Inspecciones de Cauce del Río Diamante un terreno de 34 hectáreas en La Llave. Debe venderlo en 3 años para construir o comprar su sede.
  a_quien: Asociación de Inspecciones de Cauce del Río Diamante
  municipios:
    - San Rafael
  puntos:
    - El terreno está en La Llave, en las calles Sboccia y Candel, mide unas 34 ha y es del Departamento General de Irrigación.
    - Tiene derecho de riego definitivo de unas 24 ha y eventual de unas 10 ha, y una perforación.
    - "La donación tiene un cargo: la asociación debe vender el inmueble para obtener fondos para construir o comprar su sede social."
    - El plazo para cumplir el cargo es de 3 años desde que acepte, y los gastos de escrituración los paga la asociación.
  no_dice:
    - Cuánto se espera obtener por la venta.
  hecho_con: claude-sonnet
