- numero: "9598"
  titulo: Nuevos adicionales para docentes por dedicación y especialización
  tema: Trabajo y empleo público
  resumen: "Crea adicionales salariales para docentes: por dedicación en una misma escuela (hasta 60%), por posgrado (hasta 40%) y por especialidades prioritarias (hasta 30%). También cambia las reglas de acumulación de cargos."
  a_quien: Docentes y directivos de escuelas públicas de Mendoza
  municipios: []
  puntos:
    - "Incentivo Dedicación: hasta 60% más para docentes y directivos titulares con 2 años o más seguidos en la misma escuela. Se pierde con sanciones."
    - Incentivo Especialización por posgrado, de hasta 40%, por un máximo de 5 años, salvo que se acredite seguir formándose.
    - Los docentes en especialidades prioritarias pueden cobrar hasta 30% más y se pueden dar becas con compromiso de 2 años en la escuela pública.
    - Se puede acumular hasta 48 horas cátedra semanales o dos cargos de 44 horas reloj; los directivos no pueden acumular cargos directivos.
  no_dice:
    - "Cuáles son las especialidades prioritarias y cuánto se cobra exactamente: lo define cada año la Dirección General de Escuelas y la reglamentación."
    - "Qué tabla de equivalencia se usa para horas de trabajo privado: está en un anexo que no se publicó."
