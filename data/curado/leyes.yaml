- numero: "9582"
  titulo: Se ratifican decretos de aumentos a estatales, policías y docentes
  tema: Trabajo y empleo público
  resumen: La Legislatura ratifica ocho decretos de 2024 que homologan acuerdos con sindicatos, entre ellos el gremio docente SUTE, y dan aumentos a policías y penitenciarios y a los empleados públicos.
  a_quien: Empleados públicos, docentes, policías y penitenciarios
  municipios: []
  puntos:
    - Ratifica el decreto que homologa el acta acuerdo con el sindicato docente SUTE.
    - Ratifica el aumento a policías y penitenciarios de noviembre y diciembre de 2023 y enero, febrero y marzo de 2024, y otro aumento en agosto de 2024.
    - Ratifica el aumento del tercer trimestre de 2024, acordado con la gran mayoría de los agentes públicos.
    - Ratifica decretos de julio y agosto de 2024 que homologan otros acuerdos con sindicatos del sector público.
  no_dice:
    - "De cuánto fueron los aumentos: la ley menciona los decretos pero no los porcentajes ni los montos."
