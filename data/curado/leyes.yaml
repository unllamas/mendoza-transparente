- numero: "9629"
  titulo: Adicional del 50% para cuidadores de niños en penal juvenil
  tema: Trabajo y empleo público
  resumen: Crea un adicional del 50% del sueldo para quienes cuidan directamente a niños y adolescentes en responsabilidad penal juvenil y protección de derechos. Se suspende si no prestan efectivamente la tarea.
