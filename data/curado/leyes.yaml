  titulo: Reglas para que cultivos vecinos no contaminen las semillas
  tema: Producción
  resumen: Quien produzca, multiplique o venda semillas en Mendoza debe inscribir cada año sus terrenos en el Registro de Uso de la Tierra, con ubicación, especie y fechas de siembra y floración. El ISCAMEN controla y puede multar de 100 a 100.000 UF.
  a_quien: Productores y comercializadores de semillas, y chacareros vecinos
  municipios: []
  puntos:
    - Cada año hay que inscribir en el Registro de Uso de la Tierra la ubicación, especie, variedad, hectáreas y fechas estimadas de siembra y floración.
    - Si no se puede evitar la influencia entre cultivos vecinos, el ISCAMEN propone alternativas productivas o mitigación, como cortinas vegetales.
    - Quien ponga un cultivo que genere riesgo comprobado sobre lotes registrados responde por el daño de contaminación genética, sin importar si tuvo culpa.
    - "Sanciones: multas de 100 a 100.000 UF e inhabilitación temporal para registrar lotes semilleros."
  no_dice:
    - "Cuánto vale la UF en pesos, y la escala exacta de multas: la fija la reglamentación."
    - Qué distancias mínimas entre cultivos habrá.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9689"
  titulo: 2026 es el Año del 90° Aniversario de la Fiesta de la Vendimia
  tema: Otros
  resumen: Declara 2026 como Año del 90° Aniversario de la Fiesta Nacional de la Vendimia. Todos los documentos oficiales impresos y digitales de la administración pública provincial deben llevar esa leyenda durante 2026.
  a_quien: Organismos públicos provinciales; se invita a los municipios
  municipios: []
  puntos:
    - Durante 2026, los documentos oficiales impresos y digitales de la Provincia llevan la leyenda "Año del 90° Aniversario de la Fiesta Nacional de la Vendimia".
    - Alcanza a organismos centralizados, descentralizados y entes autárquicos.
    - Se invita a los municipios, sin obligarlos, a adherir.
  no_dice: []
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9688"
  titulo: Quién da el certificado contra incendios, Provincia o municipio
  tema: Seguridad y justicia
  resumen: Cambia la ley del certificado de medidas contra incendios (Ce.Me.P.A.C.I.). En municipios con área técnica propia lo da el municipio. Donde no la hay, lo da Bomberos de la Provincia para locales de más de 450 m2 y otros rubros.
  a_quien: Dueños de comercios, industrias, hoteles, cines y edificios; municipios
  municipios: []
  puntos:
    - Si el municipio tiene área técnica en seguridad contra incendios, tramita y otorga el certificado él mismo, con informes de un profesional idóneo.
    - Sin esa área, Bomberos lo da para edificios públicos y para industrias, estaciones de servicio, supermercados, cines, hoteles y restaurantes de más de 450 m2.
    - El certificado vale mientras no cambien el uso, la superficie, el riesgo o la cantidad de personas. El sistema contra incendios se inspecciona cada año.
    - Particulares y municipios pueden pedir el certificado a Bomberos en casos no previstos en la ley, según el riesgo.
  no_dice:
    - "De cuánto son las multas por no tener el certificado: las fijará la reglamentación."
    - Cuánto cuesta tramitarlo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9687"
  titulo: Nuevo régimen de regalías mineras en Mendoza
  tema: Energía y minería
  resumen: Fija que las empresas mineras paguen regalías del 3% del valor del mineral en boca de mina, o hasta 5% en proyectos nuevos. El 88% va a la Provincia y el 12% a los municipios donde se extrae, si adhieren. Crea un fondo socioambiental.
  a_quien: Empresas mineras, municipios mineros y toda la provincia
  municipios: []
  puntos:
    - Alícuota del 3% sobre el valor del mineral. Los proyectos que no hayan empezado a construir pagarán un porcentaje progresivo de hasta 5%.
    - Declaración jurada trimestral y pago dentro de los 15 días del cierre del trimestre. Multas del 50% al 100% de lo omitido y suspensión del certificado minero.
    - "Reparto: 88% a Rentas Generales (15% de eso a un Fondo de Desarrollo Socioambiental) y 12% a los municipios mineros que adhieran, para infraestructura."
    - Para cobrar, el municipio debe adherir y renunciar a toda imposición a la actividad minera. Las microempresas y la investigación científica quedan exentas.
  no_dice:
    - "Qué rebajas tendrán los proyectos con tecnologías limpias o aporte social: las fijará la reglamentación."
    - Qué municipios cobrarían hoy y cuánta plata sería.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9686"
  titulo: Mendoza crea un fondo para reparar daños ambientales
  tema: Ambiente y agua
  resumen: Crea el Fondo de Compensación Ambiental, que paga la reparación de daños ambientales colectivos cuando los responsables no pueden pagar. Se nutre de multas e indemnizaciones por daño ambiental y lo administra el Ministerio de Energía y Ambiente.
  a_quien: Toda la provincia y quienes causen daños ambientales
  municipios: []
  puntos:
    - Paga obras para frenar, restaurar o mitigar un daño ambiental colectivo cuando los responsables no pueden costearlo, no se los identifica o hay una emergencia.
    - Se financia con multas ambientales, indemnizaciones judiciales por daño ambiental, donaciones, créditos y aportes de municipios.
    - No puede usarse para gastos corrientes, consultorías ni proyectos de terceros.
    - Si usa el fondo, el Estado puede reclamarle el gasto a los responsables del daño. El ministerio publica un informe anual.
  no_dice:
    - Cuánta plata tendrá el fondo al empezar.
    - "Cómo se maneja el dinero en cuentas y controles: lo fijará la reglamentación, que debe salir en 180 días."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9685"
  titulo: Aprueba 27 declaraciones ambientales mineras en Malargüe
  tema: Energía y minería
  resumen: Aprueba las 27 Declaraciones de Impacto Ambiental del proyecto minero "El Destino y otros", también llamado Malargüe Distrito Minero Occidental 2, en Malargüe. Obliga a cumplir todo lo que dispongan. Rige desde el día siguiente a su publicación.
