- numero: "9580"
  titulo: "Defensa del Consumidor: las multas se cobran aunque se apelen"
  tema: Derechos y sociedad
  resumen: Si un comercio apela una multa de Defensa del Consumidor, igual tiene que pagarla. Las multas impagas van a juicio de apremio. La mitad de lo recaudado va a los municipios que iniciaron los reclamos.
  a_quien: Consumidores, comercios multados y municipios
  municipios: []
  puntos:
    - Apelar una multa no suspende su ejecución.
    - Las multas impagas se cobran por juicio de apremio, con una boleta de deuda.
    - El 50% de lo recaudado va a los municipios que iniciaron las actuaciones, para tecnología, personal, difusión y capacitación sobre derechos del consumidor.
    - El otro 50% lo usa la Dirección para personal, equipos, difusión, ayudas a asociaciones de consumidores y honorarios de peritos.
  no_dice: []
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9579"
  titulo: Los productores deben recibir un recibo al entregar materia prima
  tema: Producción
  resumen: Quien reciba materia prima para industrializar, acopiar o transportar tiene que darle al productor un recibo con cantidades, calidad, precio pactado y forma de pago. El Ministerio de Producción difunde datos agropecuarios gratis.
  a_quien: Productores primarios, industrias, acopiadores y transportistas
  municipios: []
  puntos:
    - Al recibir la materia prima se entrega al productor un recibo con cantidades, calidades, precio pactado y forma de pago.
    - La Dirección de Agricultura debe difundir información de las principales actividades agropecuarias, de acceso general y gratuito.
    - Deroga la Ley 9133, que regulaba antes este tema.
  no_dice:
    - "Qué sanción tiene quien no entregue el recibo: la ley no la menciona."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9578"
  titulo: "Nueva ley de seguridad privada: registro, requisitos y sanciones"
  tema: Seguridad y justicia
  resumen: Regula a las empresas de vigilancia, alarmas y cámaras en Mendoza. Deben habilitarse y renovar cada año, y los vigiladores deben tener secundario completo y credencial. Las cooperativas y asociaciones no pueden prestar el servicio.
  a_quien: Empresas y vigiladores de seguridad privada, y quienes los contratan
  municipios: []
  puntos:
    - Alcanza vigilancia, custodias, boliches, eventos masivos, seguridad propia, alarmas y cámaras. Excluye caudales y seguridad estatal.
    - "Vigiladores: mayores de 18, secundario completo, residir en Mendoza, aptitud psicofísica, sin antecedentes penales y credencial de 2 años."
    - Uniformes y vehículos dicen "SEGURIDAD PRIVADA", sin "Policía" ni escudos oficiales. La habilitación se renueva cada año, de enero al 10 de marzo.
    - "Quien contrate una empresa no habilitada puede responder solidariamente. Sanciones: de apercibimiento y multa a inhabilitación definitiva."
  no_dice:
    - "De cuánto son las multas y las tasas: las fija la reglamentación."
    - "Cuánto vale el seguro de caución que deben presentar las empresas: lo determina la Autoridad de Aplicación."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9577"
  titulo: "Nueva ley de Personas Jurídicas: registro y control de sociedades"
  tema: Economía y finanzas
  resumen: Fija las reglas de la Dirección de Personas Jurídicas, que registra y controla sociedades, asociaciones civiles y fundaciones. Permite registrar con modelos oficiales o dictamen profesional y exige reempadronarse en forma digital.
  a_quien: Sociedades, asociaciones civiles, fundaciones y quienes las constituyen
  municipios: []
  puntos:
    - Para constituir una sociedad se usa un modelo oficial, un dictamen de abogado, contador o escribano, o el control de los asesores de la Dirección.
    - Las observaciones a un trámite deben hacerse todas juntas, no se admiten observaciones sucesivas.
    - "Deberán reempadronarse en forma digital: 1 año sin tasa desde el decreto que lo active; sin hacerlo, la Dirección no tramita pedidos societarios."
    - Solo el Gobernador puede intervenir una asociación o fundación, hasta 6 meses con una prórroga de 3. A las sociedades no se las puede intervenir.
  no_dice:
    - "Cuándo empieza a regir el reempadronamiento: depende de un decreto posterior del Poder Ejecutivo."
    - "Cuánto cuestan las tasas por los trámites: las fija la ley impositiva."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9576"
  titulo: Se autoriza a la Provincia a vender sus acciones de IMPSA
  tema: Economía y finanzas
  resumen: Autoriza al Poder Ejecutivo a transferir las 454.300.000 acciones Clase C que la Provincia tiene en IMPSA S.A. El proceso debe garantizar concurrencia, publicidad, igualdad y transparencia.
  a_quien: Toda la provincia, como dueña de las acciones
  municipios: []
  puntos:
    - Son 454.300.000 acciones ordinarias nominativas Clase C de IMPSA S.A. que hoy son de la Provincia.
    - El Ejecutivo puede hacer todos los actos necesarios para transferirlas.
    - El proceso debe asegurar concurrencia (que se puedan presentar varios interesados), publicidad, igualdad y transparencia.
  no_dice:
    - "A quién se transfieren, a qué precio y bajo qué forma: la ley no lo fija."
