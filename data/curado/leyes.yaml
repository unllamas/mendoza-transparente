- numero: "9614"
  titulo: "Centro Cívico de Mendoza: qué hace la Ciudad y qué la Provincia"
  tema: Municipios
  resumen: "Reordena quién se ocupa de qué en el Centro Cívico: la Municipalidad maneja tránsito y estacionamiento medido, y la Provincia árboles, espacios verdes, alumbrado y limpieza. Prohíbe vender bienes públicos provinciales."
  a_quien: Vecinos y visitantes del Centro Cívico, Ciudad de Mendoza
  municipios:
    - Capital
  puntos:
    - La Municipalidad controla el tránsito y labra actas de infracción, y se queda con lo recaudado por el estacionamiento medido.
    - La Provincia mantiene árboles, espacios verdes, acequias, alumbrado, fuentes ornamentales, limpieza de calles y veredas exteriores y recolección de residuos.
    - Se prohíbe toda venta, temporaria o definitiva, de bienes públicos provinciales en el Centro Cívico, salvo para instalar oficinas oficiales.
    - Se permiten espectáculos deportivos, culturales y artísticos con autorización del Ejecutivo. Las obras del Estado necesitan aprobación municipal.
  no_dice:
    - "Cuáles son los límites exactos del Centro Cívico: están en otro artículo de la Ley 3401, que no se transcribe."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
