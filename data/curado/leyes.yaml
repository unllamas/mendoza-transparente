  titulo: Descuentos para cancelar de una vez la deuda de viviendas del IPV
  tema: Obras e infraestructura
  resumen: Quien deba una vivienda o crédito del IPV puede cancelarlo con quita de 40% a 60% si paga todo junto. Las deudas chicas pueden darse por canceladas. El plazo para acogerse llega hasta el 31 de agosto de 2026.
  a_quien: Adjudicatarios de viviendas y créditos del Instituto Provincial de la Vivienda
  municipios: []
  puntos:
