- numero: "9704"
  titulo: Se amplía la lista de animales silvestres protegidos
  tema: Ambiente y agua
  resumen: Declara Monumento Natural Provincial, junto con su hábitat, a 14 especies de animales silvestres de Mendoza, entre ellas el cóndor, el guanaco, el choique, el gato andino y el águila coronada.
  a_quien: Toda la provincia
  municipios: []
  puntos:
    - Quedan protegidas 14 especies, entre ellas el cóndor, el choique o suri, el guanaco, la liebre mara, el pichiciego, el piche y el gato andino.
    - También el cardenal amarillo, el siete cuchillos, el águila coronada, la tortuga del Nevado, la ranita del Pehuenche, el bagre otuno y la lagartija del Nihuil.
    - La protección alcanza a los hábitats naturales de cada especie.
  no_dice:
