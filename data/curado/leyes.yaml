  fecha: 2026-10-12
- numero: "9673"
  titulo: Nuevo marco para ambulancias, emergencias y traslados de pacientes
  tema: Salud
  resumen: "Reorganiza los servicios de salud fuera de los hospitales: emergencias, traslados programados, atención domiciliaria y catástrofes, públicos y privados. Exige teléfono único de emergencias gratuito las 24 horas, registro de cada intervención y habilitación de los prestadores."
  a_quien: Pacientes y familias, empresas de ambulancias y personal de emergencias
  municipios: []
  puntos:
    - Prestadores públicos y privados deben tener un teléfono de emergencias único, libre y gratuito las 24 horas, y acudir cuando lo pida el organismo coordinador.
    - Los servicios son emergencias y urgencias, traslados programados, atención domiciliaria y cuidados paliativos, y respuesta a catástrofes.
    - Cada prestador debe registrar por escrito todo lo hecho en cada evento y tener bases, vehículos sanitarios y personal capacitado según su categoría.
    - Las y los ciudadanos deben usar con responsabilidad la línea gratuita y dar datos veraces. Deroga la Ley 6993.
  no_dice:
    - "Qué categorías y requisitos de habilitación tendrán las empresas de ambulancias: lo fijará la reglamentación, que debe salir en 180 días."
    - Cuánto costarán los traslados o si habrá sanciones por mal uso de la línea.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9672"
  titulo: Se regula la profesión de Técnico Superior en Emergentología
  tema: Salud
  resumen: Regula quién puede trabajar como técnico en emergentología, el personal de ambulancias y centrales de emergencia que asiste bajo supervisión médica. Hay que tener título y matrícula del Ministerio de Salud. Quien ya trabaja sin título tiene 4 años para obtenerlo.
  a_quien: Técnicos y personal de ambulancias, centros de salud públicos y privados y pacientes
  municipios: []
  puntos:
    - Solo puede ejercer quien tenga título reconocido y matrícula del Ministerio de Salud. Sin eso es ejercicio ilegal y los centros de salud no pueden contratarlo.
    - Da soporte vital básico y, con indicación médica, avanzado. Estabiliza y traslada pacientes, atiende víctimas múltiples y opera centrales como el 911.
    - Quien ya trabaja sin título debe inscribirse en un registro especial dentro de 180 días y tiene hasta 4 años para titularse.
    - "Sanciones disciplinarias: apercibimiento, suspensión o cancelación de la matrícula, con derecho de defensa."
  no_dice:
    - Cuánto dura la carrera y en qué institutos se dictará.
    - "Cómo se acreditan los saberes de quienes no tienen título: lo definirá la reglamentación, que debe salir en 180 días."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
