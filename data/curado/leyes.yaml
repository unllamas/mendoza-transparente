  fecha: 2026-10-12
- numero: "9584"
  titulo: Beneficios impositivos para invertir en Uspallata, montañas y Payunia
  tema: Producción
  resumen: Crea un régimen que exime del Impuesto Inmobiliario y de Ingresos Brutos por 5 años a quienes inviertan en turismo, comercio y logística en Uspallata, las montañas, la Payunia y otras zonas. Proyectos presentados hasta el 31/12/2025.
  a_quien: Inversores con proyectos en Uspallata, montañas, precordillera norte y Payunia
  municipios: []
  puntos:
    - "Proyectos aprobados: sin Inmobiliario ni Ingresos Brutos de la inversión por hasta 5 años y sin aumentos de la carga impositiva en ese lapso."
    - Deben estar inscriptos como contribuyentes en Mendoza y poner en marcha la actividad dentro de los 2 años de aprobado el proyecto.
    - Un fondo con hasta el 1% de lo recaudado por Ingresos Brutos da aportes no reembolsables y reembolsables, hasta el 50% cada uno.
    - El Poder Ejecutivo puede dar tierras fiscales en concesión por hasta 50 años. Los permisos de agua para uso recreativo pagan una carga para obras hídricas.
  no_dice:
    - "Cuáles son exactamente las zonas y a qué departamentos corresponden: la ley las nombra con códigos del Plan de Ordenamiento Territorial, que no se detallan."
    - "Cuánto es el valor llave inicial que pagan los permisos de agua: lo fija Irrigación por reglamentación."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9583"
  titulo: Expropiación de terrenos de Los Penitentes para un polo de montaña
  tema: Tierras y expropiaciones
  resumen: Se expropian tres polígonos de Los Penitentes Centro de Esquí S.A. en Uspallata, Las Heras, con 6 ha 8.774,21 m2 en total. La Provincia los destinará a un polo turístico, deportivo y comercial de montaña.
  a_quien: Los Penitentes Centro de Esquí S.A. y vecinos de Uspallata
  municipios:
