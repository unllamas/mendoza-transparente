- numero: "9600"
  titulo: Docentes con problemas de salud pasan a ser tutores escolares
  tema: Educación
  resumen: Crea un sistema para docentes titulares que cambian de funciones por razones de salud. Si aceptan, pueden ser Tutores de Apoyo Escolar con grupos de hasta 5 alumnos, conservando sus derechos laborales y salariales.
  a_quien: Docentes titulares de escuelas estatales en cambio de funciones por salud
  municipios: []
  puntos:
    - Es optativo y no incluye a quienes cambian de funciones por enfermedades psiquiátricas.
    - Se inscribe cada año; la Dirección responde en hasta 30 días hábiles y el docente asume sus funciones en los 30 días siguientes.
    - El tutor da apoyo personalizado a grupos de no más de 5 alumnos, en hogares de niños, centros de primera infancia o centros de apoyo escolar.
    - Para perfiles críticos puede haber incentivos como menos horas de trabajo o cambio a una zona con mejores condiciones laborales.
  no_dice:
