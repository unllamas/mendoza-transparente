- numero: "9637"
  titulo: Cuerpos municipales de seguridad ciudadana
  tema: Seguridad y justicia
  resumen: Fija las bases para que los municipios que quieran creen cuerpos de seguridad ciudadana, con función preventiva y auxiliar. Pueden labrar actas, tomar denuncias y aprehender en flagrancia, pero no tienen estado policial ni pueden portar armas de fuego.
  puntos:
    - Es obligatorio solo para los municipios que decidan formar estos cuerpos.
    - Pueden usar armas de baja letalidad, como bastón PR-24 o spray de pimienta.
    - No pueden usar la palabra "policía" en su nombre.
    - Deben tener estructura jerárquica, capacitación continua y coordinarse con la policía y la Justicia.
    - Modifica la Ley 1079 sobre organización del cuerpo municipal.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9636"
  titulo: Aprueba acuerdos paritarios con gremios estatales
  tema: Trabajo y empleo público
  resumen: Aprueba el Decreto 896 del 30 de abril de 2025, que homologó actas acuerdo firmadas en la Subsecretaría de Trabajo y Empleo entre el Poder Ejecutivo y gremios de la Administración Pública. El contenido está en el anexo.
  puntos:
    - Aprueba el Decreto 896/2025.
    - Las actas se firmaron entre el Poder Ejecutivo y entidades sindicales.
    - El detalle está en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9635"
  titulo: Aprueba una excepción a la Ley 8727 para una médica del Schestakow
  tema: Salud
  resumen: Aprueba el Decreto 722 del 10 de abril de 2025, que exceptúa de la aplicación de la Ley 8727 a la doctora Natalia Emilce Bustos, de la Terapia Intensiva Pediátrica del Hospital Teodoro J. Schestakow. El decreto está en el anexo.
  puntos:
    - Aprueba el Decreto 722/2025.
    - Exceptúa a una profesional de la Terapia Intensiva Pediátrica del Hospital Schestakow.
    - El motivo y el detalle están en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9634"
  titulo: Aprueba emergencia aluvional en el sur y del servicio eléctrico
  tema: Ambiente y agua
  resumen: Aprueba el Decreto 792/2025, que declara la Emergencia Aluvional en el sur de la Provincia por un año y la Emergencia del Servicio Eléctrico por 14 meses. El decreto está en el anexo.
  puntos:
    - "Emergencia Aluvional en el sur de Mendoza: 1 año."
    - "Emergencia del Servicio Eléctrico: 14 meses."
    - El decreto forma parte de la ley como anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9633"
  titulo: Donación de terrenos para la calle Santa Bernardette
  tema: Obras e infraestructura
  resumen: "Autoriza al Poder Ejecutivo a donar un inmueble de la Ruta Provincial 99, en dos polígonos: el I a la Municipalidad de la Ciudad de Mendoza y el II a la de Las Heras. Deben destinarlo a la extensión y traza de la calle Santa Bernardette."
  puntos:
    - Polígono I para la Ciudad de Mendoza y Polígono II para Las Heras.
    - "Cargo: extensión y traza de la calle pública Santa Bernardette."
    - Los dos municipios pagan los gastos en forma proporcional y hacen las mensuras.
    - La Escribanía General de Gobierno hace las escrituras.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9632"
  titulo: Programa Mi Escritura para escriturar viviendas
  tema: Derechos y sociedad
  resumen: Crea el Programa Mi Escritura para facilitar las escrituras de inmuebles que cumplan la Ley 8475 y su modificatoria 9602, entre otros casos. Las escrituras quedan exentas de dos tasas y los beneficiarios pueden pagar el financiamiento con un acuerdo.
  puntos:
    - "Autoridad: el Ministerio de Gobierno, Infraestructura y Desarrollo Territorial junto al IPV."
    - Exime el Certificado Libre Deuda y la Inscripción Registral.
    - El IPV define cómo se repaga el financiamiento; si hay mora, lo recupera Administración Tributaria Mendoza.
    - Se pueden levantar inhibiciones o embargos solo para escriturar, si el beneficiario reconoce la deuda.
    - Invita a AySAM, Irrigación y municipios a eximir derechos de transferencia.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9631"
  titulo: Régimen de proyectos de desarrollo productivo en tierras del Estado
  tema: Producción
  resumen: Establece cómo se adjudican y venden tierras privadas del Estado para proyectos agropecuarios, industriales, comerciales, turísticos, deportivos y sociales. Regula quiénes pueden recibirlas, los precios y las causas de extinción. Deroga la Ley 4711.
  puntos:
    - Se usa tierra privada del Estado sin otro destino, y la que adquiera la Provincia.
    - Pueden recibir tierra personas humanas y, si hay obras de infraestructura, personas jurídicas.
    - Las personas humanas deben ser mayores y no tener condena por delito doloso en los últimos 5 años, entre otros requisitos.
    - La falta de pago de 2 cuotas da derecho a resolver el contrato.
    - Deroga la Ley 4711 de Planes de Colonización.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9630"
  titulo: Emergencia del sistema hidroeléctrico Los Nihuiles
  tema: Energía y minería
  resumen: Declara por 14 meses la emergencia del Sistema Hidroeléctrico Los Nihuiles. Permite contratar de forma directa para operarlo, seguir con las empresas HINISA e HIDISA hasta cumplir los contratos, y licitar los sistemas Los Nihuiles y Diamante.
  puntos:
    - La emergencia dura 14 meses desde la promulgación.
    - HINISA sigue en transición y HIDISA sigue usando el agua del Río Diamante hasta cumplir sus contratos.
    - El Poder Ejecutivo puede concesionar el sistema Diamante por hasta 30 años.
    - Puede contratar de manera directa, sin el régimen general de contrataciones, y reasignar partidas.
    - Debe informar a la Legislatura cada 90 días.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9629"
  titulo: Adicional del 50% para personal de cuidado directo de menores
  tema: Trabajo y empleo público
  resumen: Crea el Adicional Cuidado Directo y Permanente para personal de Responsabilidad Penal Juvenil y de Protección de Derechos de Niñas, Niños y Adolescentes con contacto directo en el cuidado. Equivale al 50% de los haberes y puede implementarse de forma gradual.
  puntos:
    - Equivale al 50% del total de haberes, sin contar el ítem Paritaria 2022 Régimen 15; es remunerativo y no bonificable.
    - Se cobra solo mientras se presta el cuidado directo.
    - Cada mes, entre el 1 y el 10, la Dirección envía a Contaduría el listado de agentes.
    - Puede aplicarse gradualmente, según el presupuesto del Ministerio de Educación y la DGE.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9628"
  titulo: Terrenos en General Alvear para la Dirección General de Escuelas
  tema: Educación
  resumen: Modifica el artículo 1 de la Ley 8480. Transfiere por donación a la Dirección General de Escuelas dos lotes del Gobierno de Mendoza en San Pedro del Atuel, General Alvear, de unas 23 y 24 hectáreas.
  puntos:
    - "Lote 11: 23 ha 6.357 m2. Lote 10: 24 ha 549 m2."
    - Están sobre la Ruta Nacional 143, distrito San Pedro del Atuel.
    - Los terrenos son del Gobierno de Mendoza y pasan a la DGE por donación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9627"
  titulo: La IV Brigada Aérea es declarada "Brigada Heroica"
  tema: Derechos y sociedad
  resumen: Declara a la IV Brigada Aérea, con sede en Mendoza, como "Brigada Heroica". Es un homenaje y reconocimiento a la formación de los pilotos que combatieron en la guerra de Malvinas.
  puntos:
    - Se declara "Brigada Heroica" a la IV Brigada Aérea con asiento en Mendoza.
    - El motivo es la formación de pilotos que combatieron en Malvinas.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9626"
  titulo: Nombre "Sonia Santillán" para el Centro de Salud 132 de Malargüe
  tema: Salud
  resumen: Pone el nombre de Sonia Santillán al Centro de Salud Nº 132, en el paraje Bardas Blancas, departamento de Malargüe.
  puntos:
    - Centro de Salud Nº 132.
    - Ubicado en el Paraje de Bardas Blancas, Malargüe.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9625"
  titulo: Sistema de Administración Pública Digital de Mendoza
  tema: Otros
  resumen: Crea el Sistema de Administración Pública Digital para los trámites del Estado provincial. Establece un ecosistema para intercambiar datos entre organismos, la plataforma Mendoza por Mí con identidad digital y reglas para contrataciones por internet.
  puntos:
    - Obliga a ministerios, entes, empresas estatales y a los poderes Legislativo y Judicial.
    - Crea el Ecosistema Digital de Integrabilidad (EDI Mza) para compartir datos entre organismos.
    - Los organismos deben sumarse al EDI Mza en 12 meses, con una prórroga excepcional de 12.
    - Mendoza por Mí reúne identidad digital y portadocumento digital con un único usuario.
    - Invita a los municipios a adherir.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9624"
  titulo: "Billeteras virtuales de menores: control de los padres"
  tema: Derechos y sociedad
  resumen: Agrega el artículo 44 quinquies a la Ley de Defensa del Consumidor (5547). Si un menor tiene una billetera electrónica y sus padres o tutores son responsables de la cuenta, el proveedor debe darles acceso total a la información y permitirles cerrar la cuenta.
  puntos:
    - Los padres o tutores acceden sin restricción a consumos, movimientos y transferencias de la cuenta.
    - También ven las inversiones de la cuenta.
    - Pueden cerrar la cuenta en cualquier momento, sin intervención del menor.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9623"
  titulo: Aprueba aumentos salariales de policías y penitenciarios
  tema: Trabajo y empleo público
  resumen: Aprueba el Decreto 615 de 2025, que otorga incrementos salariales al personal policial y penitenciario, y los decretos 619 y 649 de 2025, que homologan actas acuerdo con gremios de la Administración Pública. Los montos no figuran en el texto de la ley.
  puntos:
    - Aprueba el Decreto 615/2025, de incrementos salariales para policías y penitenciarios.
    - Aprueba los decretos 619/2025 y 649/2025, que homologan actas acuerdo con gremios.
    - Las actas se firmaron en la Subsecretaría de Trabajo y Empleo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9622"
  titulo: Aprueba acuerdos salariales de técnicos en Rayos X y bioimágenes
  tema: Trabajo y empleo público
  resumen: Aprueba el Decreto 427 del 6 de marzo de 2025, que homologó las actas acuerdo de Técnicos en Rayos X y Licenciados en Bioimágenes firmadas por ATE y ATSA. Las actas están en el anexo.
  puntos:
    - Aprueba el Decreto 427/2025.
    - Las actas fueron firmadas por los gremios ATE y ATSA.
    - El contenido de los acuerdos está en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9621"
  titulo: Aprueba una adenda al fideicomiso de infraestructura eléctrica
  tema: Energía y minería
  resumen: Aprueba el Decreto 330/2025, que aprobó la adenda al Fideicomiso de Administración del Fondo Fiduciario del Plan de Infraestructura Eléctrica de Alta Tensión, Zonas Aisladas y Zonas a Desarrollar (FOPIATZAD). El detalle de la adenda está en el anexo.
  puntos:
    - Aprueba el Decreto 330/2025.
    - La adenda modifica el fideicomiso FOPIATZAD; su texto está en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9620"
  titulo: Guardianes de las rutas contra la trata de personas
  tema: Seguridad y justicia
  resumen: "Crea la figura de Guardianes de las rutas contra la trata de personas: personas capacitadas que alertan a las autoridades ante posibles casos. Los cursos están dirigidos sobre todo a personal de vialidad, taxistas, choferes y transportistas."
  puntos:
    - Cursos para personal de vialidad, taxistas, conductores de micros y transportistas, camioneros e ISCAMEN, entre otros.
    - Los dictan ONG sin fines de lucro con más de 2 años de experiencia, bajo supervisión del Estado.
    - Quien quiera ser guardián no puede tener antecedentes penales.
    - Aplica la Dirección de Derechos Humanos del Ministerio de Gobierno, Infraestructura y Desarrollo Territorial.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9619"
  titulo: Expropiación en General San Martín para una escombrera municipal
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujeto a expropiación un inmueble de unos 474.543 m2 en Alto Salvador, General San Martín, para instalar la Escombrera Municipal. La Municipalidad expropia y paga los gastos.
  puntos:
    - Inmueble en calle Oratorio s/n, distrito Alto Salvador, de 474.543,31 m2 según mensura.
    - "Destino: emplazar la Escombrera Municipal."
    - Expropia la Municipalidad de General San Martín según el Decreto-Ley 1447/75.
    - La Municipalidad paga los gastos.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9618"
  titulo: Amplía los datos del Registro de Huellas Genéticas
  tema: Seguridad y justicia
  resumen: Agrega dos incisos al artículo 6 de la Ley 8611. Se podrán registrar huellas genéticas tomadas en aprehensiones policiales e investigaciones penales, y las tomadas en trámites administrativos con consentimiento de la persona.
  puntos:
    - Se incluyen huellas extraídas en aprehensiones policiales legales y en medidas de una investigación penal.
    - En esos casos la persona debe ser informada antes sobre los alcances de la ley.
    - También las de trámites ante entidades provinciales o nacionales según convenio, con consentimiento informado.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9617"
  titulo: Registro Provincial del Cannabis y Cáñamo Industrial
  tema: Producción
  resumen: Crea el Registro Provincial del Cannabis y Cáñamo Industrial, que autoriza y controla la producción, distribución y venta de cannabis medicinal y cáñamo industrial. Crea un Consejo Asesor y tasas por los trámites. La reglamentación debe salir en 90 días.
  puntos:
    - "Autoridad de aplicación: el Ministerio de Gobierno, Infraestructura y Desarrollo Territorial, junto con otros organismos."
    - Personas y asociaciones civiles, fundaciones y ONG pueden cultivar con fines medicinales si cumplen los requisitos.
    - Quienes ya tienen autorización nacional tienen un régimen simplificado.
    - Crea un Consejo Asesor no vinculante de 7 miembros ad honorem y tasas por trámites.
    - Deroga los artículos 2 a 6 de la Ley 9298.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9616"
  titulo: Expropiaciones en Guaymallén para ensanchar calle Antonelli
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujetas a expropiación varias parcelas pequeñas afectadas al ensanche de calle Antonelli, en Guaymallén. La Municipalidad de Guaymallén expropia y paga los gastos.
  puntos:
    - Son varias parcelas, con superficies afectadas de entre unos 64 y 327 m2 cada una.
    - "Destino: ensanche de calle Antonelli, Guaymallén."
    - Expropia la Municipalidad de Guaymallén según el Decreto-Ley 1447/75.
    - La Municipalidad paga los gastos.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9615"
  titulo: Dos nuevas Salas Unipersonales en las Cámaras del Trabajo
  tema: Seguridad y justicia
  resumen: Crea dos Salas Unipersonales en las Cámaras del Trabajo de la Primera Circunscripción Judicial. Se pagan con el crédito de la Acordada 29.411. El Consejo de la Magistratura inicia el proceso para nombrar a los jueces.
  puntos:
    - Dos cargos nuevos, a cubrir con el crédito presupuestario de la Acordada 29.411.
    - El Consejo de la Magistratura inicia el procedimiento del artículo 150 de la Constitución.
    - La Suprema Corte fija cómo terminan su tarea los conjueces actuales.
    - La Corte reasigna al personal de los conjueces a otras Cámaras, con igual carga de trabajo para todos los jueces.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9614"
  titulo: Nuevas reglas para el Centro Cívico de la Ciudad de Mendoza
  tema: Municipios
  resumen: Modifica la Ley 3401 sobre el Centro Cívico. Define cómo se construye en terrenos públicos y privados, da a la Municipalidad el control del tránsito y el estacionamiento medido, y prohíbe enajenar bienes públicos provinciales de la zona.
  puntos:
    - Los edificios públicos necesitan aprobación de la Municipalidad de Mendoza para proyecto, ejecución y destino.
    - En predios privados rigen las ordenanzas municipales de uso del suelo.
    - La Municipalidad controla el tránsito y hace las actas de infracción según la Ley 9024.
    - La Municipalidad establece el Estacionamiento Medido.
    - Se prohíbe vender o ceder bienes públicos provinciales del Centro Cívico, salvo para dependencias oficiales.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9613"
  titulo: Aprueba acuerdos salariales con gremios estatales
  tema: Trabajo y empleo público
  resumen: Aprueba el Decreto 2797 del 26 de diciembre de 2024, que homologó actas acuerdo firmadas en la Subsecretaría de Trabajo y Empleo entre el Poder Ejecutivo y gremios de distintos sectores de la Administración Pública. El contenido de las actas no está en el texto.
  puntos:
    - Aprueba el Decreto 2797/2024.
    - Las actas se firmaron entre el Poder Ejecutivo y entidades sindicales de la Administración Pública.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9612"
  titulo: Adicional por mayor responsabilidad para personal penitenciario
  tema: Trabajo y empleo público
  resumen: Modifica la Ley 7493. Fija una escala del adicional por Mayor Responsabilidad Penitenciaria para oficiales jefes y superiores y encargados generales con funciones de conducción. También cambia lo que cobra el personal retirado que es convocado.
  puntos:
    - El adicional se calcula como porcentaje de la asignación de clase de Jefe de la Policía.
    - "Escala: Dirección General 100%, Subdirección General 93%, Direcciones Regionales 80%."
    - El personal convocado cobra el haber de retiro, la mitad de la asignación de clase de su grado y los adicionales de prestación efectiva.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9611"
  titulo: Uso de celulares y tecnología en las escuelas
  tema: Educación
  resumen: Modifica la Ley 7861. Autoriza el uso de dispositivos móviles y otras tecnologías en escuelas públicas y privadas para actividades pedagógicas supervisadas por el docente, y en emergencias. Deroga los artículos 2 y 3 de esa ley.
  puntos:
    - Alcanza a docentes, personal no docente y alumnos, en todos los niveles y modalidades.
    - El uso pedagógico es supervisado por el docente; la autoridad puede autorizarlo diferenciado por nivel.
    - En emergencias se autoriza si es imprescindible, con permiso de la autoridad escolar.
    - El Ministerio de Educación y la DGE evalúan nuevas herramientas y hacen una campaña sobre uso responsable.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9610"
  titulo: Expropiación en Guaymallén para ensanchar calle Nicolás Avellaneda
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujeto a expropiación un inmueble de 225,41 m2 en calle Nicolás Avellaneda 3790, Guaymallén, para ensanchar la calle desde el Canal Lagunita hasta calle Mathus Hoyos, en Bermejo. La Municipalidad de Guaymallén expropia y paga los gastos.
  puntos:
    - Superficie de 225,41 m2, parte de una propiedad mayor, en Nicolás Avellaneda 3790.
    - "Destino: ensanche de calle Nicolás Avellaneda, distrito Bermejo."
    - Expropia la Municipalidad de Guaymallén según el Decreto-Ley 1447/75.
    - La Municipalidad paga los gastos.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9609"
  titulo: Notificaciones por mensajería y mediación en causas de familia
  tema: Seguridad y justicia
  resumen: Modifica el Código Procesal de Familia y Violencia Familiar (Ley 9120). Permite notificar por mensajería instantánea en ciertos casos, hace obligatoria la mediación previa en varias acciones de familia y ajusta plazos de audiencias y medidas.
  puntos:
    - Se notifica por mensajería instantánea medidas de protección, citaciones y autorizaciones de viaje, entre otros casos.
    - El juzgado usa telefonía celular oficial y envía un PDF de la resolución.
    - La mediación es previa en acciones de uniones convivenciales, parentesco, responsabilidad parental, guarda y tutela.
    - En esos casos las actuaciones de mediación son gratuitas.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9608"
  titulo: Cambios en el Código Procesal Penal sobre archivo y sobreseimiento
  tema: Seguridad y justicia
  resumen: Modifica 12 artículos del Código Procesal Penal (Ley 6730) y agrega el 362 bis. Cambia cómo se tramitan nulidades, archivos, oposiciones a decisiones del fiscal, elevación a juicio, apelaciones y recursos.
  puntos:
    - Las nulidades se pueden pedir solo en las oportunidades que fija la ley, bajo pena de caducidad.
    - El fiscal puede archivar por decreto fundado y el querellante puede oponerse ante el Juez de Garantías.
    - Si el juez no acepta un sobreseimiento pedido por el fiscal, interviene el Fiscal Adjunto Penal.
    - Se precisan qué resoluciones de los jueces de Garantías se pueden apelar.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9607"
  titulo: Aprueba otro convenio entre la Provincia y Las Heras
  tema: Convenios y ratificaciones
  resumen: Aprueba el Decreto 2504 del 29 de noviembre de 2024, que aprobó un convenio entre el Gobierno de Mendoza y la Municipalidad de Las Heras, firmado el 20 de noviembre de 2024. El detalle del convenio está en el anexo.
  puntos:
    - Aprueba el Decreto 2504/2024.
    - Convenio entre el Gobierno de Mendoza y la Municipalidad de Las Heras, del 20 de noviembre de 2024.
    - El contenido está en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9606"
  titulo: Docentes condenados por delitos graves no pueden enseñar
  tema: Educación
  resumen: Modifica el Estatuto del Docente (Ley 4934). Quien tenga condena a prisión, aunque sea en primera instancia y en suspenso, por ciertos delitos del Código Penal no puede ingresar como docente, celador ni personal administrativo. Crea un registro de sumarios y sanciones.
  puntos:
    - No se puede ingresar a la docencia con condena a prisión por los delitos indicados, aunque sea en primera instancia.
    - La exoneración por esos delitos implica inhabilitación permanente para enseñar.
    - La cesantía inhabilita 3 años y la exoneración 10 años, salvo esos delitos.
    - Rige también para docentes suplentes, celadores y personal administrativo.
    - Crea el Registro único de sumarios, sanciones e inhabilitaciones (RUSSI) en la DGE.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9605"
  titulo: Suspende hasta 2025 ejecuciones de deudas hipotecarias (Ley 8182)
  tema: Derechos y sociedad
  resumen: Suspende hasta el 31 de diciembre de 2025 los trámites de ejecución de sentencias por deudas hipotecarias de las personas comprendidas en el artículo 2 de la Ley 8182. Esos deudores no tienen que hacer trámites mientras el Poder Ejecutivo cumple lo que esa ley le encomienda.
  puntos:
    - Suspensión hasta el 31 de diciembre de 2025.
    - Alcanza a deudores comprendidos en el artículo 2 de la Ley 8182.
    - No deben hacer trámites ante el Ejecutivo ni la Justicia mientras tanto.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9604"
  titulo: Aprueba el Decreto 2096/24
  tema: Convenios y ratificaciones
  resumen: Aprueba el Decreto 2096 de 2024. Una copia certificada del decreto forma parte de la ley como anexo; el texto de la ley no dice de qué trata, el detalle está en el anexo.
  puntos:
    - Aprueba el Decreto 2096/24.
    - El contenido está en el anexo, en copia certificada.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9603"
  titulo: Se extiende hasta 2025 la suspensión de ciertos juicios
  tema: Derechos y sociedad
  resumen: Modifica el artículo 1 de la Ley 9297 y amplía hasta el 31 de diciembre de 2025 la suspensión de los procesos iniciados, incluso los que están en ejecución de sentencia, a los fines del artículo 39 de la Ley 6086.
  puntos:
    - "Nuevo plazo: hasta el 31 de diciembre de 2025."
    - Alcanza procesos en cualquier estado, también en ejecución de sentencia.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9602"
  titulo: Cambios en la regularización de viviendas por Ley 8475
  tema: Derechos y sociedad
  resumen: Modifica la Ley 8475, que aplica en Mendoza la Ley Nacional 24.374 de regularización de la propiedad. Cambia quiénes pueden pedirla, qué inmuebles entran y establece que los trámites no pagan tributos.
  puntos:
    - Puede pedirlo quien ocupa el inmueble como casa única y permanente, o como residencia y producción si es agricultor familiar.
    - Entran inmuebles de hasta 1.000 m2, salvo que el plan de ordenamiento municipal fije otra medida.
    - Los trámites están exentos de tributos nacionales, provinciales y, según ordenanza, municipales.
    - Se agrega el certificado de regularización dominial del IPV como documento.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9601"
  titulo: "Ley publicada con nota: el texto completo está en un anexo"
  tema: Otros
  resumen: El Boletín Oficial publicó solo una nota que dice que el texto de la ley se puede consultar completo en el expediente EX-2024-09619509-GDEMZA-HCS o en un anexo. Con lo publicado no se puede saber de qué trata.
  puntos:
    - "El texto no está en el Boletín: remite al expediente EX-2024-09619509-GDEMZA-HCS."
    - También se puede ver como anexo en el enlace indicado.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9600"
  titulo: Nuevos perfiles laborales para docentes con cambio de funciones
  tema: Trabajo y empleo público
  resumen: Regula el cambio de funciones de docentes titulares que cambiaron de tareas por razones de salud, excepto enfermedades psiquiátricas. Crea un registro de perfiles laborales a los que pueden optar de forma voluntaria.
  puntos:
    - "Es opcional: hace falta el consentimiento del docente."
    - La DGE evalúa las solicitudes en hasta 30 días hábiles.
    - Quienes sean aceptados deben hacer programas de recalificación laboral si se establece la necesidad.
    - Crea el perfil de Tutor/a de Apoyo Escolar, con grupos de hasta 5 alumnos.
    - Puede haber incentivos para perfiles críticos. La reglamentación, dentro de 90 días.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9599"
  titulo: Sistema de Gestión Educativa Integral obligatorio en escuelas
  tema: Educación
  resumen: Obliga a usar el Sistema de Gestión Educativa Integral (G.E.I.) en las escuelas de la Dirección General de Escuelas. Define quién lo controla, quién carga los datos y que se sanciona a quien omita o use mal la información.
  puntos:
    - La DGE aplica la ley y la Coordinación de Sistemas controla el sistema.
    - Cada Dirección de Línea designa un referente informático.
    - Cada escuela o dependencia designa un responsable de carga, que responde por la información.
    - Hay sanciones disciplinarias por no cargar, cargar incompleto o usar mal los perfiles.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9598"
  titulo: Incentivos y misiones especiales para docentes
  tema: Educación
  resumen: Crea los incentivos Dedicación Docente y Especialización Docente, un régimen de Misiones Especiales y reglas sobre especialidades prioritarias. Los pagos dependen de la reglamentación y del presupuesto. Tiene 90 días hábiles para implementarse.
  puntos:
    - "Dedicación Docente: adicional para quien trabaja 2 años o más en el mismo establecimiento, hasta el 60% de la asignación de clase, antigüedad y estado docente."
    - "Especialización Docente: por posgrado en su área, hasta el 40%, por un máximo de 5 años."
    - La DGE define cada año las Especialidades Prioritarias, con posible adicional y becas.
    - Crea el Registro de Misiones Especiales y una bonificación por función diferenciada.
    - Modifica los estatutos de las leyes 4934 y 6929.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9597"
  titulo: "Ley publicada con nota: el texto completo está en un anexo"
  tema: Otros
  resumen: El Boletín Oficial publicó solo una nota que dice que el texto de la ley se puede consultar completo en el expediente EX-2024-09323149-GDEMZA-HCS o en un anexo. Con lo publicado no se puede saber de qué trata.
  puntos:
    - "El texto no está en el Boletín: remite al expediente EX-2024-09323149-GDEMZA-HCS."
    - También se puede ver como anexo en el enlace indicado.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9596"
  titulo: "Ley publicada con nota: el texto completo está en un anexo"
  tema: Otros
  resumen: El Boletín Oficial publicó solo una nota que dice que el texto de la ley se puede consultar completo en el expediente EX-2024-09322413-GDEMZA-HCS o en un anexo. Con lo publicado no se puede saber de qué trata.
  puntos:
    - "El texto no está en el Boletín: remite al expediente EX-2024-09322413-GDEMZA-HCS."
    - También se puede ver como anexo en el enlace indicado.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9595"
  titulo: Multas de agua en Unidades Fiscales del Agua (UFA)
  tema: Ambiente y agua
  resumen: Pasa las multas de la Ley General de Aguas y de otras leyes de agua a la Unidad Fiscal del Agua (UFA), creada por la Ley 9589. En la mayoría de las infracciones, la multa queda entre 100 y 10.000 UFA.
  puntos:
    - Modifica artículos de la Ley General de Aguas y de las leyes 971, 368, 1920, 4035, 4306 y 5302.
    - "Usar el agua para un fin distinto al concedido: multa de 100 a 10.000 UFA."
    - "Hacer un pozo para sacar agua subterránea sin autorización: de 3.000 a 100.000 UFA."
    - "No votar en elecciones de irrigación: multa de 10 UFA."
    - Las multas las imponen el Departamento General de Irrigación y las Inspecciones de Cauces.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9594"
  titulo: Aprueba un convenio entre la Provincia y Las Heras
  tema: Convenios y ratificaciones
  resumen: Aprueba el Decreto 2250 del 1 de noviembre de 2024, que a su vez aprobó un convenio entre el Gobierno de Mendoza y la Municipalidad de Las Heras, firmado el 2 de julio de 2024. El texto del convenio está en el anexo.
  puntos:
    - Aprueba el Decreto 2250/2024.
    - El convenio es entre el Gobierno de Mendoza y la Municipalidad de Las Heras.
    - Fue firmado el 2 de julio de 2024.
    - El contenido del convenio está en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9593"
  titulo: Godoy Cruz dona un terreno al IPV para construir viviendas
  tema: Obras e infraestructura
  resumen: Autoriza a la Municipalidad de Godoy Cruz a donar al Instituto Provincial de la Vivienda un terreno de unas 6 ha. El IPV debe usarlo para construir o urbanizar y adjudicar viviendas a familias de Godoy Cruz.
  puntos:
    - "Terreno: Fracción 1, de 6 ha 2.196,02 m2."
    - Las obras deben empezar a los 2 años de aceptada la donación, como máximo.
    - Deben terminar dentro de los 48 meses desde que empiezan.
    - Si no se cumple, el inmueble vuelve a la Municipalidad sin indemnización.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9592"
  titulo: Reglas sobre celulares y pantallas al manejar
  tema: Transporte
  resumen: Modifica la Ley de Tránsito 9024 sobre el uso de dispositivos al conducir. Prohíbe el uso manual del celular, los mensajes y los auriculares, salvo con manos libres. No se pueden ver videos en el lugar del conductor.
  puntos:
    - Se prohíbe operar el celular con la mano, leer mensajes y usar auriculares, salvo manos libres que no interfieran.
    - Los videos solo pueden verse en pantallas de las plazas traseras.
    - En transporte o delivery, el celular puede usarse como GPS si está en un soporte que no tape la visión.
    - Quien lo use así debe acreditar que lo necesita para el servicio.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9591"
  titulo: Tunuyán tiene hasta 2030 para cumplir el objeto de la Ley 9446
  tema: Municipios
  resumen: Agrega un artículo a la Ley 9446 y fija el 31 de diciembre de 2030 como plazo para que la Municipalidad de Tunuyán haga las gestiones para cumplir lo que esa ley establece.
  puntos:
    - Agrega el artículo 2 bis a la Ley 9446.
    - "Plazo: hasta el 31 de diciembre de 2030."
    - Lo debe hacer la Municipalidad de Tunuyán.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9590"
  titulo: Donación de dos inmuebles de la Provincia a Malargüe
  tema: Tierras y expropiaciones
  resumen: Autoriza al Poder Ejecutivo a donar a la Municipalidad de Malargüe dos inmuebles que son de la Provincia, de unas 8 ha y 5 ha. La Escribanía General de Gobierno hace las escrituras.
  puntos:
    - "Primer inmueble: polígono 2 del plano 19-3089, de 8 ha 8.762,95 m2."
    - "Segundo inmueble: polígono 3 del mismo plano, de 5 ha 2.598,44 m2."
    - La Escribanía General de Gobierno hace los actos necesarios para las escrituras.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9589"
  titulo: Régimen de agua potable y saneamiento; Irrigación como ente regulador
  tema: Ambiente y agua
  resumen: Regula los servicios de agua potable y saneamiento. El Departamento General de Irrigación pasa a ser el Ente Regulador y se disuelve el Ente Provincial del Agua y de Saneamiento (EPAS), cuyo patrimonio pasa a la Provincia.
  puntos:
    - Irrigación controla inversiones, tarifas y calidad, y resuelve en primera instancia las controversias.
    - Se financia con tasas, multas y otros recursos.
    - Se convoca audiencia pública para mejorar la calidad del servicio.
    - El personal del EPAS puede incorporarse al Ente Regulador o a Agua y Saneamiento Mendoza SAPEM.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9588"
  titulo: Aprueba 34 impactos ambientales de permisos de exploración
  tema: Energía y minería
  resumen: Aprueba las Declaraciones de Impacto Ambiental emitidas por Resoluciones Conjuntas de la Dirección de Minería y la Dirección de Protección Ambiental para 34 permisos de exploración, como El Seguro, Campeones y Canillitas.
  puntos:
    - Cada permiso tiene su resolución conjunta DM y DPA.
    - Rige desde el día siguiente de su publicación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9587"
  titulo: Unidad Ejecutiva de Seguridad Vial y cambios a la Ley de Tránsito
  tema: Transporte
  resumen: Modifica las Leyes 9501 y 9024. La Dirección de Seguridad Vial y la Unidad Ejecutiva de Seguridad Vial, entre otros organismos, aplican la Ley de Tránsito.
  puntos:
    - Agrega la administración de la Unidad Ejecutiva de Seguridad Vial a las funciones del artículo 12 de la Ley 9501.
    - Cambia los artículos 5 y 22 de la Ley 9024 e incorpora los artículos 22 bis y 22 ter.
    - Rige desde que el Ejecutivo, mediante la Unidad Ejecutiva, la reglamente.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9586"
  titulo: Venta en subasta de un inmueble de Irrigación en Ciudad
  tema: Ambiente y agua
  resumen: Autoriza al Departamento General de Irrigación a vender en subasta pública su inmueble de calle 25 de Mayo 1245, Ciudad de Mendoza. Lo recaudado no puede usarse en gastos corrientes.
  puntos:
    - Los fondos se destinan a bienes de capital o inversiones.
    - Se vende libre de ocupantes, que tienen 30 días corridos para desalojar.
    - Vencido el plazo, la Justicia ordena el lanzamiento.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9585"
  titulo: Directrices para la política provincial de cambio climático
  tema: Ambiente y agua
  resumen: Establece directrices para la gestión del cambio climático en Mendoza, en línea con la Ley Nacional 27.520. La autoridad de aplicación es el Ministerio de Energía y Ambiente.
  puntos:
    - Debe hacer un Inventario de Gases de Efecto Invernadero, actualizado al menos cada 5 años.
    - Debe elaborar el Plan Provincial de Mitigación y Adaptación al Cambio Climático, con metas de carbono neutralidad.
    - El Ejecutivo puede dar incentivos a particulares que tomen acciones de adaptación y mitigación.
    - Debe reglamentarse en 180 días.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9584"
  titulo: Promoción de inversiones en zonas de montaña y Uspallata
  tema: Producción
  resumen: Crea un régimen de promoción de inversiones para unidades territoriales como Oasis Uspallata, Montañas y Piedemonte Uspallata. Busca dotar de servicios turísticos, comerciales y logísticos.
  puntos:
    - Alcanza nuevas inversiones en bienes de capital y edificaciones o adecuaciones de infraestructura.
    - Los proyectos los aprueba el Ministerio de Gobierno, Infraestructura y Desarrollo Territorial con EMETUR.
    - La actividad debe empezar dentro de los 2 años de aprobado el proyecto.
    - Crea un Fondo para Financiación de Obras Hídricas, administrado por Irrigación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9583"
  titulo: Expropiación de terrenos de Los Penitentes, en Uspallata
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujetos a expropiación tres polígonos de Los Penitentes Centro de Esquí S.A. en Uspallata, Las Heras, de 6 ha 8774,21 m2. La Provincia expropia para un polo de actividades de montaña.
  puntos:
    - El destino es la explotación turística, deportiva y comercial, sola o con terceros.
    - La Provincia puede compensar créditos que tenga contra los expropiados con el precio.
    - El Ejecutivo puede ceder sin cargo superficies para calles e infraestructura y dar opción de compra a concesionarios.
    - Los gastos salen del Presupuesto provincial.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9582"
  titulo: Aprueba decretos de aumentos y acuerdos con gremios estatales
  tema: Trabajo y empleo público
  resumen: Aprueba ocho decretos de 2024 que homologan acuerdos con gremios, entre ellos S.U.T.E., y otorgan incrementos salariales, incluidos los del personal policial y penitenciario.
  puntos:
    - El Decreto 332 dio un aumento al personal policial y penitenciario de noviembre de 2023 a marzo de 2024.
    - El Decreto 1421 fijó un aumento para el tercer trimestre de 2024.
    - Los Decretos 1326, 1419 y 1687 homologan acuerdos con gremios.
    - Incluye los Decretos 317, 332, 383, 1326, 1419, 1421, 1686 y 1687.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9581"
  titulo: Expropiación en Guaymallén para abrir y prolongar calles
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujetas a expropiación superficies de parcelas en el distrito Kilómetro 11, Guaymallén, para abrir y prolongar calles. El texto detalla las parcelas.
  puntos:
    - La Municipalidad de Guaymallén es quien expropia, según el Decreto-Ley 1447/75.
    - La Municipalidad paga los gastos.
    - La parcela 1 tiene unos 636,18 m2 afectados.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9580"
  titulo: Recursos y ejecución de multas de defensa del consumidor
  tema: Derechos y sociedad
  resumen: Modifica los artículos 41 y 42 de la Ley 9314 y el artículo 61 de la Ley 5547. Los recursos contra sanciones no suspenden las multas, y las impagas se cobran por apremio.
  puntos:
    - Los montos de multas y tasas se depositan en una cuenta especial.
    - Las multas impagas dan lugar a boleta de deuda y ejecución judicial por apremio.
    - Alcanza a multas de la Ley 5547 y de la Ley Nacional 24.240, entre otras.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9579"
  titulo: Recibos a productores primarios por materias primas
  tema: Producción
  resumen: Los establecimientos que reciben materias primas para industrializar, acopiar o transportar deben dar al productor un recibo con cantidades, calidades, precio y forma de pago. El Ministerio de Producción difunde información agropecuaria.
  puntos:
    - Los informes agropecuarios son de acceso general y gratuito.
    - La autoridad de aplicación es el Ministerio de Producción.
    - Deroga la Ley 9133.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9578"
  titulo: Regulación de la seguridad privada y su registro
  tema: Seguridad y justicia
  resumen: Regula los servicios de seguridad privada humana, interna y tecnológica en Mendoza. Crea un registro provincial a cargo del Ministerio de Seguridad y Justicia, que habilita y controla a las empresas.
  puntos:
    - Alcanza a vigilancia, custodias, seguridad interna y alarmas y videovigilancia.
    - Excluye el transporte de caudales y los sistemas de seguridad ciudadana del Estado.
    - Las empresas existentes tienen 90 días desde la reglamentación para adecuarse.
    - Deroga la Ley 6441.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9577"
  titulo: Nueva ley de Personas Jurídicas y Registro Público
  tema: Economía y finanzas
  resumen: Regula la Dirección de Personas Jurídicas y Registro Público, que controla sociedades, asociaciones civiles y fundaciones en Mendoza. Define su organización, deberes y funciones.
  puntos:
    - Está a cargo de un Director abogado, escribano o contador, con al menos 5 años de matrícula.
    - Rubrica los libros, incluso digitales, de las personas jurídicas.
    - Todas las personas jurídicas deben reempadronarse digitalmente; el primer año es sin tasa.
    - Deroga la Ley 9002.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9576"
  titulo: Transferencia de las acciones de IMPSA de la Provincia
  tema: Economía y finanzas
  resumen: Autoriza al Poder Ejecutivo a transferir las 454.300.000 acciones Clase C de IMPSA S.A. que tiene la Provincia. El proceso debe asegurar concurrencia, publicidad, igualdad y transparencia.
  puntos:
    - Son todas las acciones ordinarias nominativas no endosables Clase C de la Provincia.
    - El Ejecutivo realiza los actos necesarios para la transferencia.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9575"
  titulo: Adhesión provincial al Régimen de Regularización de Activos
  tema: Impuestos
  resumen: Adhiere Mendoza al Régimen de Regularización de Activos de la Ley Nacional 27.743 respecto de los tributos locales. Libera de sanciones y de tributos provinciales a los bienes declarados.
  puntos:
    - Alcanza a contribuyentes que al 31/12/2024 no tengan deudas anteriores al 30/09/2024.
    - Los depósitos del régimen no sufren retenciones ni percepciones provinciales.
    - Registrar los bienes a su nombre paga el Impuesto de Sellos.
    - La Administración Tributaria Mendoza conserva sus facultades de fiscalización.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9574"
  titulo: Expropiación de un callejón comunero en Tupungato
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujetos a expropiación dos inmuebles inscriptos como Callejón Comunero de Indivisión Forzosa, de 8.369,03 m2 y 3.232,14 m2, en Tupungato.
  puntos:
    - La Municipalidad de Tupungato es quien expropia, según el Decreto-Ley 1447/75.
    - Los gastos los paga la Municipalidad de Tupungato.
    - Los inmuebles son las matrículas 174.065/14 y 166.300/14.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9573"
  titulo: Duración y reelección de concejales e intendentes
  tema: Municipios
  resumen: Modifica la Ley 1079. Concejales e intendentes duran cuatro años y pueden ser reelectos por un solo período consecutivo. Deroga el artículo 47.
  puntos:
    - Los concejos se renuevan por mitades cada dos años.
    - Quien fue reelecto solo puede volver a ser elegido con un período de intervalo.
    - Los intendentes son elegidos por simple mayoría de votos válidos.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9572"
  titulo: Actas policiales y audiencias unilaterales en el Código Procesal Penal
  tema: Seguridad y justicia
  resumen: Modifica el Código Procesal Penal. Las actas policiales firmadas sirven como elemento de convicción sin citar al policía como testigo, salvo que haya controversia. En casos graves, allanamientos e intervenciones se piden en audiencia unilateral.
  puntos:
    - La audiencia por allanamiento debe fijarse dentro de 24 horas.
    - Para allanamientos en esos casos debe estar presente un Juez Penal.
    - La intervención de comunicaciones se resuelve en una audiencia unilateral, con registro audiovisual.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9571"
  titulo: Cancelación anticipada con descuentos de viviendas y créditos del IPV
  tema: Derechos y sociedad
  resumen: Modifica la Ley 9378. Permite cancelar en un solo pago viviendas o créditos con quitas de entre 40% y 60% según el monto y la fecha de otorgamiento, con 10% extra para quienes están al día.
  puntos:
    - "Deudas de hasta 2 SMVM: quita del 60%."
    - "Créditos hasta 2005: 50%; de 2006 a noviembre de 2017: 40%."
    - Saldos de hasta el 30% de un SMVM pueden darse por cancelados, con un arancel del 15% de un SMVM.
    - Se paga en un solo pago y en moneda de curso legal.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9570"
  titulo: Zonificación del Parque Provincial Aconcagua
  tema: Ambiente y agua
  resumen: Aprueba la zonificación del Parque Provincial Aconcagua (Anexo I) y lineamientos para planes de gestión de áreas naturales protegidas (Anexo II), orientados a conservar los ecosistemas y la biodiversidad.
  puntos:
    - Las revisiones de la zonificación deben seguir los lineamientos del Anexo II.
    - El canon de concesionarios y permisionarios se calcula con una fórmula que considera el volumen y tipo de servicios, la superficie y el valor ambiental.
    - Deroga el artículo 1 de la Ley 5463.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9569"
  titulo: Organización del Servicio Penitenciario Provincial
  tema: Seguridad y justicia
  resumen: Regula el Servicio Penitenciario Provincial, que custodia a personas procesadas o condenadas a penas de prisión y ejecuta esas penas. Depende del Ministerio de Seguridad y Justicia.
  puntos:
    - Está formado por la Dirección General, los establecimientos, el personal y el Instituto de Formación Penitenciaria.
    - El Director General es designado por el Poder Ejecutivo; un oficial debe ser Prefecto General con título universitario.
    - "Tiene direcciones principales y tres direcciones regionales: Centro, Oeste y Sur."
    - Deroga la Ley 7976 y partes de la Ley 8465.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9568"
  titulo: Agrupamiento de horas recreativas en el escalafón municipal
  tema: Municipios
  resumen: Agrega el inciso d) al artículo 5 de la Ley 5892, el escalafón de empleados municipales. Crea el agrupamiento de horas recreativas para tareas en horarios rotativos o discontinuos.
  puntos:
    - Incluye a quienes realizan tareas de deportes, actividades lúdicas, al aire libre o culturales.
    - No constituye categoría de cargo.
    - La única incompatibilidad es la superposición horaria con cargos administrativos u otras horas recreativas.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9567"
  titulo: Adhesión de Mendoza al Régimen de Incentivo para Grandes Inversiones
  tema: Economía y finanzas
  resumen: Adhiere la Provincia de Mendoza al Régimen de Incentivo para Grandes Inversiones (RIGI) del Título VII de la Ley Nacional 27.742, según el artículo 224 de esa ley.
  puntos:
    - Rige desde su publicación en el Boletín Oficial.
    - La adhesión es al Título VII de la Ley Nacional 27.742.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9566"
  titulo: Aprueba el Decreto 1085/24, cuyo texto está en el anexo
  tema: Otros
  resumen: "Aprueba el Decreto 1085 de 2024. El texto de la ley no dice de qué trata el decreto: su detalle está en la copia certificada que integra la ley como anexo."
  puntos:
    - La ley tiene un solo artículo.
    - El contenido del decreto figura solo en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9565"
  titulo: Dirección de Promoción y Control de Liberados
  tema: Seguridad y justicia
  resumen: Crea en el Ministerio de Seguridad y Justicia la Dirección de Promoción y Control de Liberados, parte del Sistema Penitenciario Provincial, para asistir y controlar a liberados de la Justicia Provincial.
  puntos:
    - Empieza el pre-egreso con al menos 6 meses de anticipación a una posible liberación.
    - Lleva un registro y legajo actualizado de liberados y orienta su capacitación e inserción laboral.
    - Prioriza sistemas de seguridad inteligente para el control.
    - Deroga la Ley 7503 y partes de la Ley 8465.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9564"
  titulo: Actividad física escolar sin electrocardiograma ni apto físico
  tema: Educación
  resumen: Busca resguardar la salud de niños y adolescentes y facilitar su actividad física. Quienes no tengan antecedentes y tengan su control de salud normal quedan exentos de presentar electrocardiograma y apto físico para la actividad escolar.
  puntos:
    - Hay una excepción para adolescentes con enfermedades cardíacas de origen genético sin electrocardiograma previo.
    - Se aplica a establecimientos públicos y privados de educación y salud.
    - El Estado promueve el control integral de salud periódico sin condicionar la educación física.
    - La aplican Educación y Salud en conjunto.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9563"
  titulo: Donación a Godoy Cruz de terrenos para abrir una calle
  tema: Tierras y expropiaciones
  resumen: Autoriza al Poder Ejecutivo a donar con cargo a la Municipalidad de Godoy Cruz dos franjas de terreno en San Francisco del Monte. Servirán para abrir una calle entre Valle Grande y Cubillos.
  puntos:
    - Las franjas son parte de fracciones de inmuebles de la Provincia de la ex Corporación Mixta de Fruticultores.
    - La Municipalidad tiene hasta 4 años para hacer las obras de apertura.
    - Los gastos y el plano de mensura los paga la Municipalidad.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9562"
  titulo: Regulación de videocámaras en lugares públicos
  tema: Seguridad y justicia
  resumen: Regula el uso de videocámaras, con o sin inteligencia artificial, para grabar en lugares públicos y el tratamiento de esas imágenes y datos. El fin es la seguridad pública y prevenir delitos y contravenciones.
  puntos:
    - Prohíbe grabar el interior de propiedades privadas sin consentimiento o autorización judicial.
    - Debe informarse a la ciudadanía de la existencia de cámaras, sin precisar su ubicación.
    - Los registros son confidenciales y solo los puede pedir una autoridad judicial o administrativa.
    - Las personas pueden pedir acceso y cancelación de las grabaciones. Deroga las Leyes 7924 y 8741.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9561"
  titulo: Ingreso directo a la Policía de personal en informática
  tema: Seguridad y justicia
  resumen: Agrega el artículo 48 bis a la Ley 6722. Permite ingresar directamente a grados intermedios de la Policía, hasta oficial jefe, a quienes acrediten idoneidad en tecnología, sistemas y bases de datos.
  puntos:
    - Deben aprobar antes un examen de aptitud.
    - Es excepcional y depende de necesidades del área informática del Ministerio de Seguridad y Justicia.
    - El Ministerio puede exceptuarlos del uso de arma de fuego.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9560"
  titulo: Modelo único para pedidos de captura y otras medidas judiciales
  tema: Seguridad y justicia
  resumen: Modifica la Ley 9019. La Justicia Penal y Contravencional y el Ministerio Público Fiscal deben usar un modelo único para pedidos de captura, comparendo, prohibiciones de acercamiento, inhabilitaciones para conducir y otras medidas.
  puntos:
    - La Subsecretaría de Tecnología Aplicada a la Seguridad fija los protocolos para cargarlos al sistema.
    - Los pedidos se hacen solo con los formularios de la reglamentación y por correo oficial o tecnología equivalente.
    - Deben comunicar cualquier modificación o baja de lo pedido.
    - Los registros caducan automáticamente pasados los plazos del artículo 4.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9559"
  titulo: "Cambios al Código de Contravenciones: alcohol y acoso callejero"
  tema: Seguridad y justicia
  resumen: Modifica la Ley 9099. Cambia los mínimos y máximos de sanciones, endurece las penas por alcoholemia de 1 gramo por litro o más y define el acoso sexual callejero con sanciones.
  puntos:
    - Arresto de 1 a 120 días; multa de 100 a 12.000 Unidades Fijas; trabajo comunitario de 4 a 80 días.
    - "Conducir con alcohol de 1 g/l o más: multa de 4000 a 11.000 U.F. o arresto y inhabilitación de 90 a 545 días."
    - "Acoso sexual callejero: multa de 200 a 2000 U.F. o 8 a 20 días de trabajo comunitario; se duplica si la víctima es menor o tiene discapacidad."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9558"
  titulo: "Cambios en la Ley de Tránsito: alcoholímetros y vehículos retenidos"
  tema: Transporte
  resumen: Modifica la Ley de Tránsito 9024. Permite firmar convenios para calibrar alcoholímetros, extiende la inhabilitación por reincidencia y cambia las reglas sobre vehículos retenidos.
  puntos:
    - Permite convenios con universidades y otras entidades para certificar la calibración de los alcoholímetros.
    - En la primera reincidencia del inciso 7 del artículo 52, la inhabilitación puede llegar a 365 días.
    - El juez puede ordenar cursos de capacitación y conducción responsable.
    - Los vehículos retenidos quedan a disposición del juez correspondiente.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9557"
  titulo: Aprueba decretos de acuerdos salariales con gremios estatales
  tema: Trabajo y empleo público
  resumen: Aprueba seis decretos de 2024 que homologan actas acuerdo entre el Poder Ejecutivo y los gremios de la administración pública, incluidos docentes. Fija adicionales de seguridad para policías y penitenciarios.
  puntos:
    - Desde el 1 de junio de 2024, el Adicional General por Función Fuerzas de Seguridad (Ítem 1629) es del 20%.
    - Desde esa fecha, el Adicional Personal de Seguridad (Ítem 1433) es del 19%.
    - Los decretos son los 306, 405, 433, 804, 964 y 1073 de 2024; el detalle está en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9556"
  titulo: Registro y control de compra y venta de bienes muebles usados
  tema: Seguridad y justicia
  resumen: Crea un sistema preventivo de control y sanción para la compra y venta de bienes muebles usados y un Registro público de Bienes Muebles Usados, a cargo del Ministerio de Seguridad y Justicia.
  puntos:
    - Quienes compran y venden usados de forma habitual deben registrarse, anotar sus operaciones y tener inventario.
    - Los agentes pueden inspeccionar, suspender actividades y secuestrar mercadería.
    - "Pone a la venta bienes sin origen lícito: multa de 1000 a 4000 Unidades Fijas o arresto de 40 a 60 días."
    - Deroga las Leyes 8124 y 9169; se reglamenta en 180 días.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9555"
  titulo: Recupero del costo de salud de conductores que causen accidentes
  tema: Salud
  resumen: Faculta al Ministerio de Salud y Deportes, a través del ente de la Ley 9535, a cobrar las prestaciones de salud al conductor que haya incurrido en las prohibiciones del artículo 52 incisos 7 y 8 de la Ley 9024 y cause o participe de un accidente.
  puntos:
    - El cobro depende de la responsabilidad que fije la autoridad competente.
    - Lo hace el ente REFORSAL, creado por la Ley 9535.
    - El Poder Ejecutivo reglamenta los procedimientos.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9554"
  titulo: Cambios en juicios por jurados populares
  tema: Seguridad y justicia
  resumen: Modifica la Ley 9106. Fija qué delitos se juzgan por jurados, quién dirige el proceso y permite cambiar la circunscripción de los jurados si el hecho conmocionó a una comunidad.
  puntos:
    - Los jurados juzgan delitos de los artículos 79, 80, 124, 165 y 166 inciso 1 del Código Penal consumados, y los concurrentes.
    - El juez puede disponer, a pedido del acusado, sortear jurados de otra circunscripción.
    - La OGAP determina qué juez tramita la causa y otro para impugnaciones.
    - Para los artículos 79 y 166 inciso 1, rige para casos elevados a juicio desde la vigencia.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9553"
  titulo: Funciones de los licenciados en Enfermería
  tema: Salud
  resumen: Define las funciones específicas de los Licenciados en Enfermería en Mendoza, que además pueden hacer las de enfermeros profesionales y auxiliares.
  puntos:
    - Gerencian servicios de enfermería y dirigen instituciones de salud, docencia e investigación.
    - Planifican y evalúan proyectos y programas de salud de su servicio.
    - Se acreditan con certificación de la Dirección de Recursos Humanos del Ministerio.
    - El Ministerio debe reglamentar en 60 días.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9552"
  titulo: Día del jugador de básquet mendocino el 28 de febrero
  tema: Otros
  resumen: Declara el 28 de febrero como Día del/la jugador/a de básquet mendocino/a. Recuerda el día de 1959 en que Mendoza fue campeón argentino de básquet en el campeonato jugado en Neuquén.
  puntos:
    - La fecha conmemora el título argentino de Mendoza del 28 de febrero de 1959.
    - El campeonato se jugó en la provincia de Neuquén.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9551"
  titulo: Donación del terreno de la Policía Rural en General Alvear
  tema: Seguridad y justicia
  resumen: Modifica el artículo 1 de la Ley 9440. Acepta la donación con cargo del inmueble donde funciona la Policía Rural, en Los Compartos, General Alvear, de 499,80 m2, a favor del Poder Ejecutivo.
  puntos:
    - El terreno está inscripto a nombre de Francisco Brosio y mide 499,80 m2.
    - Linda con una calle pública, con un Centro de Salud y con sucesores de Francisco Brosio.
    - La donación es con cargo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9550"
  titulo: "Reformas varias: Caja de Seguro Mutual, créditos del IPV y más"
  tema: Economía y finanzas
  resumen: Reúne reformas de varias leyes. Disuelve la Caja de Seguro Mutual, permite ceder carteras de crédito del IPV y del Fondo para la Transformación y autoriza la venta de bienes de ex bancos oficiales.
  puntos:
    - Disuelve y liquida la Caja de Seguro Mutual; el Estado asume sus deudas y se deroga la Ley 9121.
    - Autoriza al IPV y al Fondo para la Transformación a ceder sus carteras de créditos.
    - "Agrega causales de sanción a empleados públicos: certificado médico falso y quiebra."
    - Autoriza vender los activos del fideicomiso Acequia y bienes vía D.A.A.B.O.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9549"
  titulo: Aprueba adenda al acuerdo por la obra Portezuelo del Viento
  tema: Obras e infraestructura
  resumen: Aprueba el Decreto 883/2024, que aprobó una adenda al acuerdo de 2019 entre la Nación y Mendoza para la obra Aprovechamiento Hídrico Multipropósito Portezuelo del Viento. La adenda se firmó el 25 de abril de 2024 y está en el anexo.
  puntos:
    - La adenda modifica el acuerdo firmado el 19 de junio de 2019.
    - Los firmantes fueron ministros nacionales y el Gobernador.
    - El contenido de la adenda está en el anexo de la ley.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9548"
  titulo: Capacitación en género para clubes deportivos
  tema: Derechos y sociedad
  resumen: Obliga a capacitarse en género y violencia contra las mujeres a quienes integran la comisión directiva de asociaciones civiles deportivas de primer y segundo grado de Mendoza.
  puntos:
    - La autoridad de aplicación es el Ministerio de Gobierno, Infraestructura y Desarrollo Territorial.
    - Define los contenidos junto con la Dirección de Género y Diversidad.
    - Si no presentan el certificado, la asociación pierde el acceso a subsidios y programas del Ejecutivo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9547"
  titulo: Agencia Provincial de Evaluación de Tecnologías Sanitarias
  tema: Salud
  resumen: Crea la Agencia Provincial de Evaluación de Tecnologías Sanitarias (AGPET), un ente autárquico que evalúa medicamentos, equipos y procedimientos médicos. Sus dictámenes son obligatorios para los organismos de salud provinciales.
  puntos:
    - La dirige un Director designado por el Ejecutivo por 4 años, sin intereses en empresas de tecnologías de salud.
    - Crea un Comité Técnico Consultivo de carácter ad hoc y transitorio.
    - Recibe fondos del presupuesto, de su gestión y el 50% de lo generado en el registro de investigación científica patrocinada.
    - Debe procurar autofinanciarse.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9546"
  titulo: Emergencia del sistema sanitario público por 12 meses
  tema: Salud
  resumen: Declara la emergencia del sistema sanitario público por 12 meses, prorrogable por igual período. Permite reorganizar el Ministerio de Salud y Deportes y simplificar compras y contrataciones.
  puntos:
    - Los agentes pueden ser destinados a otras dependencias por necesidad del servicio.
    - Se permiten compras directas hasta 80 veces el Salario Mínimo Vital y Móvil.
    - El Ministerio puede hacer modificaciones presupuestarias entre partidas, avisando al Ministerio de Hacienda y Finanzas.
    - Alcanza a personal permanente, transitorio y contratado del Ministerio y de OSEP.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9545"
  titulo: Fondo Escolar Permanente para infraestructura de escuelas
  tema: Educación
  resumen: Crea el Fondo Escolar Permanente, con bienes de herencias vacantes y donaciones a nombre de la Dirección General de Escuelas. Se usa para terrenos, construcción, reparación y equipamiento de escuelas.
  puntos:
    - La Dirección General de Escuelas puede vender o alquilar bienes por licitación o subasta; el detalle de inmuebles está en el Anexo I.
    - Quien denuncia una herencia vacante cobra el 15% de lo obtenido por la venta.
    - Los ocupantes de los inmuebles tienen 5 días para desocupar.
    - Bancos y cajas de seguridad deben informar sobre titulares fallecidos con cuentas inactivas.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9544"
  titulo: Prohibición de fumar en casinos, incluidos balcones y patios
  tema: Salud
  resumen: Agrega el artículo 1 bis a la Ley 8382. La adhesión a la ley nacional antitabaco no incluye el inciso a) del artículo 24 para casinos, y Mendoza prohíbe fumar en esos lugares.
  puntos:
    - La prohibición abarca salas, balcones, patios, terrazas y áreas similares de los casinos de la Provincia.
    - Se aplica a los casinos ubicados en el territorio de Mendoza.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9543"
  titulo: Control de equipos que emiten radiaciones ionizantes
  tema: Salud
  resumen: Regula la instalación, habilitación y control de los dispositivos que emiten radiaciones ionizantes en Mendoza, junto con la Ley Nacional 17.557. La autoridad de aplicación es el Ministerio de Salud y Deportes.
  puntos:
    - El Ministerio habilita establecimientos, lleva el registro y sanciona incumplimientos.
    - Las multas van de 5 a 500 Unidades Fijas.
    - Los laboratorios de dosimetría personal deben hacer ejercicios de intercomparación al menos cada dos años.
    - Deroga la Ley 4966.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9542"
  titulo: Matriculación de profesionales sanitarios
  tema: Salud
  resumen: Establece un nuevo régimen de matriculación de profesionales sanitarios, a cargo del Ministerio de Salud y Deportes. La matrícula autoriza a ejercer en Mendoza y se emite una sola vez.
  puntos:
    - Fija quiénes pueden matricularse, incluso con títulos extranjeros, y los requisitos de la inscripción.
    - Ejercer sin matrícula se sanciona con multa; también define causas de suspensión y cancelación.
    - Permite una matrícula provisoria de un año en zonas con pocos profesionales.
    - Deroga artículos de la Ley 2636.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9541"
  titulo: Cambios a la Defensoría de las Personas con Discapacidad
  tema: Derechos y sociedad
  resumen: Modifica los artículos 1, 3, 4, 12 y 16 de la Ley 8345. La Defensoría es un órgano unipersonal e independiente que funciona en la Legislatura. Define cómo se designan el Defensor y su adjunto.
  puntos:
    - El Defensor se elige a partir de una terna; las organizaciones de personas con discapacidad con personería jurídica pueden postular.
    - El adjunto se designa del mismo modo y por el mismo período, con una terna del Ministerio de Salud y Deportes.
    - Si el Defensor muere, renuncia o es removido, el Ejecutivo debe iniciar la designación del nuevo en 10 días hábiles.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9540"
  titulo: Incompatibilidades de los farmacéuticos y bloqueo de título
  tema: Trabajo y empleo público
  resumen: Modifica los artículos 19 y 20 de la Ley 5411. Los farmacéuticos pueden ejercer en el ámbito estatal y privado, respetando las incompatibilidades. Limita el adicional por bloqueo de título.
  puntos:
    - Es incompatible ejercer en más de un cargo público a la vez.
    - La actividad docente no cuenta como incompatibilidad.
    - El adicional por bloqueo de título solo se da si hay incompatibilidad en el Ministerio de Salud y Deportes y el sector privado.
    - El Estado promueve la educación continua de los farmacéuticos de planta.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9539"
  titulo: Régimen especial voluntario para médicos del sistema público
  tema: Trabajo y empleo público
  resumen: Crea un régimen especial y voluntario de empleo para médicos del sistema público de salud, con ingreso por concurso. No deroga el régimen vigente. Fija derechos, deberes, prohibiciones y el valor de la Unidad Sanitaria.
  puntos:
    - Alcanza a médicos con título que presten servicios permanentes; deben optar por ingresar.
    - Garantiza estabilidad, retribución, capacitación y licencias.
    - Fija la Unidad Sanitaria en $130.000; luego la define el Poder Ejecutivo.
    - El Ejecutivo debe reglamentar en 120 días.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9538"
  titulo: Control de estudios de investigación en farmacología clínica
  tema: Salud
  resumen: Fija un marco para regular y controlar las investigaciones de farmacología clínica en personas, protegiendo sus derechos. Crea un registro de investigadores y exige la aprobación de un Comité de Ética.
  puntos:
    - Crea el Registro Provincial de Investigadores, Centros de Investigación y Comités de Ética de Investigación.
    - El dictamen del Comité de Ética es vinculante.
    - Los comités no pueden estar dirigidos por empresas interesadas en los resultados.
    - El Ministerio de Salud y Deportes es la autoridad de aplicación; se reglamenta en 180 días.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9537"
  titulo: Regulación de la venta y distribución de productos médicos
  tema: Salud
  resumen: Regula la selección, compra, almacenamiento, distribución y venta de productos médicos en Mendoza. Solo pueden hacerlo personas habilitadas por el Ministerio de Salud y Deportes.
  puntos:
    - Las distribuidoras necesitan habilitación previa y un profesional matriculado como Supervisor Técnico.
    - Distribuidora y Supervisor Técnico son responsables solidarios por el origen legal y la documentación de los productos.
    - En caso de reincidencia se puede inhabilitar de 1 mes a 5 años.
    - Deja sin efecto el Decreto 199/11.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9536"
  titulo: Habilitación y categorización de establecimientos de salud
  tema: Salud
  resumen: Regula cómo se habilitan y categorizan los establecimientos de salud públicos y privados de Mendoza. Exige factibilidad del proyecto edilicio y habilitación previa al funcionamiento.
  puntos:
    - La habilitación dura 5 años con internación y 10 años sin internación.
    - Los establecimientos públicos quedan habilitados sin plazo, pero los controla el Ministerio de Salud y Deportes.
    - Los privados sin habilitación que ya funcionan tienen 10 meses para pedir una habilitación provisoria.
    - Deroga la Ley 5532.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9535"
  titulo: Cobro a obras sociales y prepagas por atención en hospitales públicos
  tema: Salud
  resumen: Los hospitales públicos atienden gratis a quien no tiene cobertura. Si el paciente tiene obra social, PAMI, prepaga u otro tercero obligado, estos deben pagar la atención. Crea el ente REFORSAL para facturar y cobrar.
  puntos:
    - Toda persona atendida debe declarar su cobertura; las obras sociales deben informar sus padrones.
    - REFORSAL gestiona la cobranza judicial y extrajudicial; se financia con presupuesto y el 5% de lo cobrado.
    - Los gastos de extranjeros no residentes con cobertura en su país los cubre esa cobertura.
    - Modifica las Leyes 6015 y 8872 y deroga lo que se oponga; la Ley 5578 sigue solo para reclamos ya iniciados.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9534"
  titulo: 25% del impuesto a juegos de azar para salud mental y adicciones
  tema: Salud
  resumen: Destina cada mes el 25% de lo recaudado por Ingresos Brutos de los servicios de juegos de azar y apuestas, incluidas las online, a los programas de Salud mental y adicciones del Ministerio de Salud y Deportes.
  puntos:
    - Alcanza a las actividades con códigos 920009 (juegos de azar y apuestas) y 920004 (apuestas online).
    - Se aplica desde el ejercicio presupuestario 2025.
    - El Poder Ejecutivo debe reglamentarla en 90 días desde su publicación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9533"
  titulo: Entrega de bienes no subastados a la Dirección General de Escuelas
  tema: Seguridad y justicia
  resumen: Modifica el artículo 210 del Código Procesal Civil, Comercial y Tributario. Si el remate de bienes es muy poco conveniente o la primera subasta fracasa, el juez puede entregarlos a la Dirección General de Escuelas.
  puntos:
    - El juez decide con una resolución fundada.
    - La Dirección General de Escuelas tiene 90 días hábiles para informar al Tribunal el destino de cada bien.
    - Lo recaudado en una subasta, descontados los gastos, ingresa a Tesorería General de la Provincia.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9532"
  titulo: Destino de medicamentos decomisados por el Departamento de Farmacia
  tema: Salud
  resumen: Cambia el artículo 13 del Decreto 3857/69. Los productos de salud decomisados o bajo custodia del Departamento de Farmacia pasan a ser de la Provincia a los 60 días.
  puntos:
    - Alcanza a medicamentos, productos médicos, cosméticos y otros productos de uso en salud humana.
    - Cuentan 60 días desde el procedimiento.
    - El Ministerio de Salud y Deportes decide el destino de los productos.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9531"
  titulo: Cambios a la ley provincial de sangre y hemoterapia
  tema: Salud
  resumen: Modifica la Ley 8631 sobre sangre humana, sus componentes y derivados. Redefine los principios, el capítulo II y las funciones del Centro Regional de Hemoterapia, y suprime el Instituto Provincial de Medicina Transfusional.
  puntos:
    - Prohíbe la intermediación comercial y adhiere al Plan Nacional de Sangre, con donación voluntaria y altruista.
    - La sangre no usada antes de su vencimiento debe entregarse al establecimiento que fije la reglamentación.
    - El Centro Regional de Hemoterapia dicta las normas técnicas y administrativas del sistema.
    - Suprime el Capítulo III; las menciones al Instituto pasan a la autoridad de aplicación o al Centro.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9530"
  titulo: Registro Provincial de Financiadores de Salud
  tema: Salud
  resumen: Obliga al Ministerio de Salud y Deportes a controlar a los financiadores del sistema de salud, como obras sociales y prepagas, que prestan servicios en Mendoza. Crea un registro donde deben inscribirse.
  puntos:
    - Al inscribirse deben presentar sus programas de prestaciones, el listado de beneficiarios, las instituciones y los convenios.
    - El Ministerio puede hacer convenios con ellos y denunciar penal y administrativamente los incumplimientos.
    - El Ministerio debe reglamentar la ley en 120 días.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9529"
  titulo: Procedimiento minero provincial y Autoridad Minera
  tema: Energía y minería
  resumen: Establece el procedimiento para las actividades reguladas por el Código de Minería en Mendoza. La Autoridad Minera es la Dirección de Minería y, en segunda instancia, el Consejo de Minería, bajo el Ministerio de Energía y Ambiente.
  puntos:
    - La Dirección de Minería concede, deniega o declara caducos los derechos mineros.
    - Los expedientes son públicos y pueden tramitarse con firma digital y en formato electrónico.
    - Si el trámite se frena 90 días por culpa del interesado, se lo intima 10 días antes de declarar el abandono.
    - Deroga las Leyes 3790, 6654, 6913 y 8434.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9528"
  titulo: Multas por no llevar la guía de tránsito de minerales
  tema: Transporte
  resumen: Modifica la Ley de Tránsito 9024. Agrega como infracción conducir sin la guía de tránsito de minerales y la clasifica como falta gravísima.
  puntos:
    - "Incorpora el inciso g) al artículo 40 de la Ley 9024: el conductor que no acredite la guía de tránsito de minerales."
    - "Incorpora el inciso 53 al artículo 52: carecer de la guía conforme a la normativa vigente."
    - Reordena en el artículo 78 qué faltas son gravísimas, graves y leves; el inciso 53 es gravísimo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9527"
  titulo: Fiesta Provincial del Cordero en Malargüe
  tema: Producción
  resumen: Denomina Fiesta Provincial del Cordero a la fiesta que se hace cada abril en Malargüe y designa al departamento como sede permanente. La fiesta debe promover actividades relacionadas con el ganado ovino.
  puntos:
    - Malargüe es la sede permanente de la fiesta.
    - Debe incluir actividades gastronómicas, turísticas, culturales, tradicionales, seminarios, capacitaciones y exposiciones.
    - EMETUR la incorpora al calendario turístico y cultural de la Provincia.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9526"
  titulo: Sistema Provincial de Residencias de salud con beca formativa
  tema: Salud
  resumen: Regula las residencias, que son la formación de posgrado de profesionales de la salud en servicio, en la administración pública, OSEP y efectores privados. Define dos niveles, los requisitos de ingreso y una beca que no es sueldo.
  puntos:
    - Las residencias de primer nivel duran hasta 5 años; las de segundo nivel exigen haber completado una de primer nivel.
    - La beca se calcula en Unidades Formativas; cada una vale el 35% del sueldo bruto del Ministro de Salud y Deportes.
    - Los programas de formación se presentan al menos 6 meses antes del concurso de ingreso.
    - Rige desde su reglamentación, que el Ejecutivo debe hacer en 120 días.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9525"
  titulo: Promoción de la salud y prevención de enfermedades
  tema: Salud
  resumen: "Busca mejorar la salud de la población con hábitos saludables y menos enfermedades crónicas. El Ministerio de Salud y Deportes debe destinar un porcentaje creciente de su presupuesto a promoción y prevención: 3%, 5% y 8% según los años de vigencia. Prohíbe vender y publicitar en escuelas alimentos que superen los límites de la Ley 27.642."
  puntos:
    - "Presupuesto de promoción y prevención: 3% los primeros 5 años, 5% del año 5 al 9 y 8% desde el año 10."
    - En escuelas no se pueden vender ni publicitar alimentos con nutrientes críticos o calorías sobre lo que fija la Ley 27.642.
    - Se promueve que los comercios informen la composición nutricional de sus alimentos y que haya entornos escolares saludables.
    - La autoridad de aplicación manda un informe anual a las Cámaras. Reglamentación en 120 días.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9524"
  titulo: Reducción de la morbimortalidad materno infantil en maternidades
  tema: Salud
  resumen: Establece acciones para disminuir la morbimortalidad materno infantil en Mendoza. Se aplica a los establecimientos de salud públicos y privados que atienden partos o recién nacidos, bajo el Ministerio de Salud y Deportes.
  puntos:
    - Todo establecimiento donde nazcan bebés debe cumplir las Condiciones Obstétricas y Neonatales Esenciales (CONE).
    - Crea la Unidad Coordinadora de Derivaciones Perinatales para derivar rápido a las personas gestantes.
    - Las maternidades públicas y privadas se categorizan según lo que fije la reglamentación.
    - La autoridad de aplicación es el Ministerio de Salud y Deportes.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9523"
  titulo: Expropiación en Guaymallén para ensanchar calle Pedro Molina
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujeto a expropiación un inmueble de 300 m2 en calle Pedro Molina 1282, distrito General Belgrano, Guaymallén. El fin es ensanchar la calle Pedro Molina en la esquina con Mitre.
  puntos:
    - "Superficie afectada: 300 m2, con Padrón Municipal 14632."
    - La Municipalidad de Guaymallén es quien expropia, según el Decreto-Ley 1447/75.
    - Los gastos los paga la Municipalidad de Guaymallén.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9522"
  titulo: Unidad de medida JUS para la competencia judicial y los honorarios
  tema: Seguridad y justicia
  resumen: Modifica el artículo 7 del Código Procesal Civil, Comercial y Tributario y crea el JUS, una unidad de medida igual a un décimo de la asignación básica de un Juez de primera instancia. Se usa para determinar la competencia por monto y para regular honorarios.
  puntos:
    - La Suprema Corte comunica el valor del JUS cada diciembre y rige todo el año siguiente.
    - Para honorarios de abogados, procuradores y auxiliares de justicia, el valor se actualiza junto con el salario del Juez.
    - También se aplica al anticipo de honorarios del artículo 180 inciso V.
    - Rige desde su publicación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9521"
  titulo: Reglas para recetar psicofármacos y estupefacientes
  tema: Salud
  resumen: Fija reglas para prescribir y dispensar psicofármacos y estupefacientes. Las recetas deben llevar el tipo y número de documento del paciente. Si la dosis supera lo permitido, debe figurar la leyenda superdosis. Las farmacias no pueden dispensar recetas con más de 30 días desde su fecha.
  puntos:
    - La receta debe incluir tipo y número de documento del paciente. La farmacia registra los datos de quien retira el medicamento.
    - Si la dosis supera la indicada por la autoridad sanitaria nacional, se escribe superdosis.
    - Los médicos custodian los recetarios oficiales, los archivan 2 años y avisan si se pierden o se los roban.
    - Si alguien consulta a varios médicos por los mismos medicamentos, el Departamento de Farmacia avisa a los médicos y, si corresponde, a la Justicia.
    - Deroga la Ley 5152.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9520"
  titulo: Cooperadora del Hospital Central y fondos de un programa
  tema: Salud
  resumen: Modifica el artículo 3 de la Ley 5579. El Ministerio de Salud y Deportes administra el programa y puede delegar total o parcialmente la gestión de sus fondos en la Cooperadora del Hospital Central. La Cooperadora puede disponer de esos fondos con normas predominantemente del Derecho Privado.
  puntos:
    - El Ministerio puede delegar la gestión administrativa de los fondos en la Cooperadora del Hospital Central.
    - La reglamentación debe fijar un sistema contable y controles para seguir los ingresos y gastos.
    - La autoridad de aplicación envía un informe anual a las Cámaras de Senadores y Diputados.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9519"
  titulo: Nuevo régimen para droguerías
  tema: Salud
  resumen: "Regula la habilitación, funcionamiento y control de las droguerías de Mendoza, en tres tipos: farmacéuticas, de especialidades medicinales e industriales. El Ministerio de Salud y Deportes habilita, inspecciona y sanciona. Deroga la Ley 2577."
  puntos:
    - "Hay tres categorías: A (farmacéuticas y laboratorios de preparados), B (especialidades medicinales) y C (industriales)."
    - Para instalar una droguería hay que pedir habilitación previa al Ministerio, con director técnico y otros requisitos.
    - Las droguerías farmacéuticas venden solo al por mayor y deben seguir las Buenas Prácticas de Almacenamiento, Distribución y Transporte.
    - Las infracciones se sancionan con apercibimiento, multas o inhabilitación de 1 mes a 5 años en caso de reincidencia.
    - Deroga la Ley 2577.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9518"
  titulo: Cambios en el Consejo Provincial de Salud
  tema: Salud
  resumen: Modifica la Ley 8164. El Consejo Provincial de Salud, presidido por el Ministro de Salud y Deportes, es un espacio de diálogo y consenso sobre la política sanitaria. Define quiénes lo integran, cada cuánto se reúne y que sus cargos son ad honorem por 2 años.
  puntos:
    - Lo integran, entre otros, representantes del Ministerio, PAMI, OSEP, obras sociales y prepagas, clínicas, universidades, municipios y sindicatos.
    - Es un órgano consultivo permanente que no obliga al Ministerio.
    - Se reúne ordinariamente cada 30 días. Las reuniones extraordinarias pueden pedirlas al menos 4 miembros.
    - Los miembros trabajan ad honorem por 2 años.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9517"
  titulo: Planes estratégicos de salud cada cuatro años
  tema: Salud
  resumen: Obliga al Ministerio de Salud y Deportes a presentar planes estratégicos de salud pública con un horizonte de cuatro años. Los planes se presentan al Poder Ejecutivo, al Legislativo y a la comunidad para su debate. Cada año debe haber un informe de avances.
  puntos:
    - Los planes tienen horizonte de cuatro años y un proceso transparente y participativo.
    - Se presentan ante el Ejecutivo, el Legislativo y la comunidad.
    - Deben incluir análisis del entorno, análisis interno, problemas principales y objetivos estratégicos.
    - Se presenta un informe anual de avances.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9516"
  titulo: Tasa de interés por mora en deudas de dinero
  tema: Economía y finanzas
  resumen: Modifica el artículo 1 de la Ley 9041. Si las partes no acordaron otra cosa, las deudas de dinero pagan como interés moratorio la tasa nominal anual de préstamos de libre destino a hasta 72 meses para no clientes del Banco de la Nación, desde la mora hasta el pago.
  puntos:
    - Se aplica cuando no hay acuerdo entre las partes ni otra ley especial.
    - La tasa es la nominal anual de préstamos de libre destino hasta 72 meses para no clientes del Banco de la Nación Argentina.
    - Para ciertos casos del Código Civil y Comercial, rige la tasa de préstamos personales a más de 180 días que informa el Banco Central.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9515"
  titulo: Servidumbre de tránsito sobre un terreno fiscal en Luján de Cuyo
  tema: Tierras y expropiaciones
  resumen: Aprueba el Decreto 3094/2023, que ordena a la Escribanía General de Gobierno constituir una servidumbre de tránsito, gratuita y perpetua, sobre 258,71 m2 de un inmueble fiscal de Luján de Cuyo. Beneficia al inmueble de la empresa Sustenta Desarrollos S.A.
  puntos:
    - La servidumbre es forzosa, gratuita y perpetua.
    - Afecta una franja de 258,71 m2, parte de un inmueble a nombre de la Provincia en Luján de Cuyo.
    - El inmueble favorecido es de Sustenta Desarrollos S.A.
    - El plano de mensura figura como anexo de la ley.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9514"
  titulo: Aprueba dos donaciones de inmuebles para AySAM
  tema: Convenios y ratificaciones
  resumen: Aprueba los decretos 2780 y 3010 de 2023, que aceptan donaciones con cargo a la Provincia. Son un inmueble de la Municipalidad de San Martín y otro de la Municipalidad de San Rafael, afectados al servicio de la empresa AySAM S.A. Los decretos están en el anexo.
  puntos:
    - "Decreto 2780 del 30/11/2023: inmueble de la Municipalidad de San Martín."
    - "Decreto 3010 del 08/12/2023: inmueble de la Municipalidad de San Rafael."
    - Ambos se usan para la prestación del servicio de AySAM S.A.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9513"
  titulo: Adhesión a la ley nacional de cáncer infantil
  tema: Salud
  resumen: Agrega dos artículos a la Ley 9287 del Programa Provincial de Cuidado Integral de Niños, Niñas y Adolescentes con Cáncer. Mendoza adhiere a la Ley Nacional 27.674 y el Ministerio de Salud y Deportes puede firmar convenios con su autoridad de aplicación.
  puntos:
    - Mendoza adhiere a la Ley Nacional 27.674, según su artículo 15.
    - El Ministerio de Salud y Deportes puede firmar convenios de cooperación y coordinación con la autoridad nacional.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9512"
  titulo: Aprueba la concesión de residuos patogénicos y farmacéuticos
  tema: Ambiente y agua
  resumen: Aprueba el Decreto 2840 del 6 de diciembre de 2023, que adjudicó la licitación pública del servicio de recolección, transporte, tratamiento y disposición final de residuos patogénicos y farmacéuticos. También aprueba el contrato con la empresa Tecnologías y Servicios Ambientales S.A.
  puntos:
    - Aprueba el decreto que adjudica la licitación pública del servicio.
    - Aprueba el contrato de concesión entre la Provincia y Tecnologías y Servicios Ambientales S.A.
    - El servicio cubre recolección, transporte, tratamiento y disposición final. El detalle está en los anexos.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9511"
  titulo: Cambios en el régimen de notarios y registros notariales
  tema: Seguridad y justicia
  resumen: Modifica la Ley 3058 sobre el notariado. Cambia cuántos registros notariales hay, los requisitos para ser notario y las vías para ser titular de un registro. Cada registro puede tener hasta dos notarios adscriptos.
  puntos:
    - Un registro notarial por cada 5.000 habitantes, o fracción no menor de 2.500.
    - "Para ser notario: título de escribano o de abogado con materias de notariado, buena conducta y no estar concursado ni fallido."
    - Residencia de 5 años en Mendoza (2 años para quienes nacieron en la provincia) y examen psicofísico periódico.
    - "Para ser titular de un registro: ganar un concurso, o haber sido adscripto 10 años y autorizar al menos 200 escrituras de derechos reales."
    - Cada registro puede tener hasta 2 adscriptos, nombrados por la Suprema Corte sin concurso a propuesta del titular.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9510"
  titulo: Agente encubierto digital y pedidos de datos informáticos
  tema: Seguridad y justicia
  resumen: Modifica el Código Procesal Penal. Permite al fiscal pedir al juez la actuación de un agente encubierto digital en investigaciones de delitos, por hasta 180 días. También permite ordenar la entrega y el resguardo de datos informáticos.
  puntos:
    - El fiscal puede pedir fundadamente al Juez Penal Colegiado un agente encubierto digital, por hasta 180 días.
    - Los perfiles digitales no pueden usar imágenes de personas reales.
    - El fiscal puede ordenar a personas y proveedores de internet entregar datos de usuarios, y asegurar datos informáticos almacenados.
    - Con orden del juez, se pueden registrar y secuestrar computadoras y datos. También cambia cómo se guardan los bienes secuestrados.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9509"
  titulo: Expropiación en Tunuyán para un club deportivo
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujetas a expropiación dos fracciones de terreno en Tunuyán, de 9.683,79 m2 y 673,39 m2. Se expropian para donarlas al Club Deportivo Corredor Productivo Tunuyán, del distrito Villa Seca. La Municipalidad de Tunuyán expropia y paga.
  puntos:
    - "Dos fracciones: 9.683,79 m2 y 673,39 m2, partes de inmuebles mayores."
    - "Destino: donación al Club Deportivo Corredor Productivo Tunuyán, para sus actividades recreativas, culturales y deportivas."
    - La Municipalidad de Tunuyán expropia y soporta el gasto.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9508"
  titulo: Aprueba actas de aumentos salariales para empleados públicos
  tema: Trabajo y empleo público
  resumen: Aprueba el Decreto 2728 del 30 de noviembre de 2023. Ese decreto homologa actas acuerdo firmadas en la Subsecretaría de Trabajo y Empleo entre el Poder Ejecutivo y los sindicatos de agentes públicos provinciales, donde se acuerdan aumentos salariales. Las actas están en el anexo.
  puntos:
    - Aprueba el Decreto 2728 del 30 de noviembre de 2023.
    - Las actas acuerdan incrementos salariales para agentes públicos provinciales.
    - Los montos y fechas están en el anexo.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9507"
  titulo: Jubilados que pueden integrar cuerpos de magistrados y conjueces
  tema: Seguridad y justicia
  resumen: Modifica los artículos 3 y 12 de la Ley 7294. Pueden integrar el Cuerpo de Magistrados Subrogantes quienes se jubilaron como magistrados en los últimos 10 años, y el de Conjueces Especiales los abogados jubilados en ese plazo. Se excluye a quienes se jubilaron por incapacidad.
  puntos:
    - "Magistrados Subrogantes: jubilados como magistrados en los últimos 10 años."
    - "Conjueces Especiales: abogados jubilados en los últimos 10 años que no ejerzan otra actividad profesional, salvo la docencia."
    - Quedan excluidos quienes se jubilaron por incapacidad o razones similares.
    - Se inscriben en la Suprema Corte de Justicia, que arma las listas por fuero y circunscripción.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
