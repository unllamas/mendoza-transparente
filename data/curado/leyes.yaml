- numero: "9587"
  titulo: Nuevas duraciones y requisitos para renovar la licencia de conducir
  tema: Transporte
  resumen: Cambia la Ley de Tránsito. La licencia dura 10 años hasta los 65, 5 años de 66 a 75 y 3 años desde los 76. Al renovar hace falta libre deuda de infracciones y examen médico, sin nueva prueba de manejo.
  a_quien: Conductores de Mendoza, sobre todo mayores de 65
  municipios: []
  puntos:
    - La licencia dura 10 años hasta los 65, 5 años de 66 a 75 y 3 desde los 76. Dura 5 años si hubo condena o infracciones reiteradas al conducir.
    - Para renovar se pide libre deuda de infracciones, declaración jurada de salud y examen psicofísico. No se pide nueva prueba de manejo, salvo indicación médica.
    - Se puede renovar hasta 1 año después del vencimiento; después es un trámite de licencia nueva.
    - El arancel baja al menos 50% para mayores de 65. La licencia Clase D es desde los 21 años y la edad mínima general es 18.
  no_dice:
    - "Desde cuándo rige: depende de que el Poder Ejecutivo la reglamente, y el texto no fija fecha."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9586"
  titulo: Irrigación subastará su edificio de calle 25 de Mayo 1245 en Capital
  tema: Tierras y expropiaciones
  resumen: Autoriza al Departamento General de Irrigación a vender en subasta pública un inmueble de unos 842 m2 en 25 de Mayo 1245, Ciudad de Mendoza. Con lo recaudado solo puede comprar bienes de capital o hacer inversiones.
  a_quien: Departamento General de Irrigación y ocupantes del inmueble
  municipios:
    - Capital
  puntos:
    - Se vende por subasta pública un inmueble de 842,23 m2 según mensura (836,02 m2 según título) en calle 25 de Mayo 1245, Capital.
    - "El dinero obtenido no se puede usar en gastos corrientes: solo para comprar bienes de capital o hacer inversiones."
    - "Se vende libre de ocupantes: Irrigación les notifica y tienen 30 días corridos para irse."
    - Vencido el plazo, la Justicia ordena el desalojo, salvo que los ocupantes muestren un título suficiente.
  no_dice:
