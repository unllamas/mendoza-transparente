  titulo: Celulares en escuelas solo para uso pedagógico o emergencias
  tema: Educación
  resumen: "Modifica la ley de celulares en las escuelas: docentes, no docentes y alumnos pueden usarlos en clase solo para actividades pedagógicas supervisadas por el docente o en emergencias. Rige en escuelas públicas y privadas."
