- numero: "9550"
  titulo: "Ley ómnibus: Caja de Seguro Mutual, bienes del Estado y municipios"
  tema: Economía y finanzas
  resumen: Cambia reglas de empleados públicos, disuelve la Caja de Seguro Mutual, permite vender bienes de ex bancos oficiales y ceder carteras de créditos de vivienda, y redefine el reparto de fondos a los municipios.
  a_quien: Empleados públicos, municipios y toda la provincia
  municipios: []
  puntos:
    - Certificado médico falso o quiebra declarada pasan a ser faltas de empleados públicos; los ya quebrados tienen 2 años (ampliables a 5) para regularizar.
    - Si un empleado queda con incapacidad absoluta y permanente, cobra un mes de sueldo por año de servicio que le falte para jubilarse, con tope de 10 sueldos.
    - "La Caja de Seguro Mutual se disuelve: sigue igual hasta el 31/12/2024 y la Provincia asume sus deudas. Se contratará un servicio de seguro nuevo."
    - El Instituto de la Vivienda y el Fondo para la Transformación pueden ceder sus carteras de créditos para financiar viviendas e inversiones productivas.
  no_dice:
    - "Qué sanción corresponde por certificado falso o quiebra: el texto agrega las causales pero no la sanción."
    - "Cuánto cobra cada municipio en pesos: la ley fija solo un coeficiente de reparto de 10%, con una tabla por departamento."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9549"
  titulo: "Portezuelo del Viento: Mendoza aprueba la adenda con Nación"
  tema: Obras e infraestructura
  resumen: Aprueba el decreto que a su vez aprobó una adenda (ampliación) al acuerdo de 2019 entre Nación y Mendoza para la obra Aprovechamiento Hídrico Multipropósito Portezuelo del Viento.
  a_quien: Toda la provincia
  municipios: []
  puntos:
    - El acuerdo original entre el Estado Nacional y Mendoza es del 19 de junio de 2019 y se refiere a la obra Portezuelo del Viento.
    - La adenda se firmó el 25 de abril de 2024 entre el Gobierno nacional y el gobernador de Mendoza, y se aprobó por decreto el 9 de mayo de 2024.
  no_dice:
    - "Qué cambia la adenda respecto del acuerdo de 2019: el contenido está en un anexo que no se publicó."
    - Montos, plazos y quién paga cada parte de la obra.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9548"
  titulo: Capacitación obligatoria en género para clubes deportivos
  tema: Derechos y sociedad
  resumen: Las personas que integran las comisiones directivas de asociaciones civiles deportivas de Mendoza deberán hacer una capacitación sobre género y violencia contra las mujeres. Si no presentan el certificado, el club pierde acceso a subsidios.
  a_quien: Dirigentes y asociaciones civiles deportivas (clubes) de Mendoza
  municipios: []
  puntos:
    - Alcanza a quienes están en la comisión directiva de asociaciones deportivas de primer y segundo grado con sede en Mendoza.
    - Si no se presenta el certificado, la asociación no puede acceder a subsidios ni programas de beneficios del Ejecutivo provincial.
    - El Ministerio de Gobierno diseña los contenidos con la Dirección de Género y Diversidad, asesora a los clubes y hace un informe anual de cumplimiento.
  no_dice:
    - Cuántas horas dura la capacitación, quién la dicta y qué plazo hay para hacerla.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9547"
  titulo: Nueva agencia para evaluar medicamentos y tecnologías de salud
  tema: Salud
  resumen: Crea la Agencia Provincial de Evaluación de Tecnologías Sanitarias (AGPET), que estudia medicamentos, equipos y procedimientos médicos antes de incorporarlos o dejar de usarlos en el sistema de salud público.
  a_quien: Pacientes y organismos de salud públicos de Mendoza
  municipios: []
  puntos:
    - Evalúa eficacia, seguridad, costo e impacto en el presupuesto de medicamentos, equipos y procedimientos, y emite dictámenes y guías clínicas.
    - Sus dictámenes son obligatorios para los organismos del Ministerio de Salud y para los financiadores de salud de origen provincial.
    - El director dura 4 años y debe jurar que en los últimos 3 años no tuvo vínculos con empresas que fabriquen o vendan tecnologías de salud o medicamentos.
    - Se financia con presupuesto, ingresos propios y el 50% de lo recaudado por registrar y evaluar investigaciones científicas patrocinadas en el Ministerio.
  no_dice:
    - Cuánta plata y cuánto personal tendrá la Agencia.
    - "En qué plazo se comunicarán los dictámenes al público: lo fijará el reglamento."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9546"
  titulo: Emergencia del sistema de salud público por 12 meses
  tema: Salud
  resumen: Declara la emergencia del sistema sanitario público por 12 meses, prorrogables por otros 12. Durante ese tiempo el Ministerio de Salud puede reubicar personal, comprar sin licitación y mover partidas del presupuesto.
  a_quien: Pacientes y personal del sistema de salud público y de OSEP
  municipios: []
  puntos:
    - La emergencia dura 12 meses desde la promulgación y se puede prorrogar por 12 más si siguen las causas.
    - El Ministerio puede mandar a trabajar a su personal a otras dependencias, con razones fundadas por escrito.
    - Puede comprar de forma directa, incluso importando insumos, hasta el equivalente a 80 salarios mínimos, vitales y móviles por compra.
    - Puede modificar partidas del presupuesto entre gastos corrientes y de capital, avisando antes al Ministerio de Hacienda.
  no_dice:
    - "Qué causas originaron la emergencia: la ley no las detalla."
    - Cuánto dinero se mueve en el presupuesto.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9545"
  titulo: Fondo Escolar Permanente para obras y equipamiento de escuelas
  tema: Educación
  resumen: Crea el Fondo Escolar Permanente con la venta o alquiler de bienes de herencias vacantes, donaciones y otros inmuebles de la Dirección General de Escuelas. La plata se usa en terrenos, obras y mantenimiento de escuelas.
  a_quien: Comunidad educativa y ocupantes de inmuebles de la DGE
  municipios: []
  puntos:
    - La DGE puede vender o alquilar por licitación o subasta (incluso electrónica) bienes de herencias vacantes, donaciones e inmuebles de un anexo.
    - Los ocupantes de esos inmuebles tienen 5 días para desalojar; si no, la DGE inicia el juicio de desalojo.
    - Quien denuncie una herencia vacante cobra el 15% de lo que se obtenga por la venta del bien.
    - Los bancos deben informar cuentas de fallecidos sin movimiento por más de 6 meses y las cajas de seguridad deben avisar a la DGE.
  no_dice:
    - "Qué inmuebles se pueden vender: figuran en un anexo que no se publicó con la ley."
    - Cuánta plata se espera reunir.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9544"
  titulo: Prohibido fumar en salas y terrazas de los casinos
  tema: Salud
  resumen: Prohíbe fumar en las salas, balcones, patios, terrazas y áreas similares de los casinos de Mendoza. Se agrega a la ley de adhesión sobre el tabaco, que deja de aplicarse a casinos en un punto.
  a_quien: Clientes y trabajadores de los casinos
  municipios: []
  puntos:
    - Se prohíbe fumar en las salas de los casinos ubicados en la provincia.
    - La prohibición alcanza también balcones, patios, terrazas y cualquier área similar.
  no_dice:
    - "Qué permitía el inciso de la norma anterior que ya no se aplica a casinos: el texto no lo transcribe."
    - Multas o sanciones por incumplir.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9543"
  titulo: Control de equipos que emiten radiaciones ionizantes
  tema: Salud
  resumen: El Ministerio de Salud controla la instalación, habilitación y funcionamiento de los equipos que emiten radiaciones ionizantes (como los de diagnóstico por imágenes), y puede multar de 5 a 500 Unidades Fijas.
  a_quien: Centros que usan estos equipos, sus trabajadores y pacientes
  municipios: []
  puntos:
    - El Ministerio habilita establecimientos, lleva un registro, fija la dosimetría personal (medición de la radiación que recibe cada trabajador) y sanciona.
    - La trabajadora embarazada debe avisar de inmediato a su jefe o encargado para revisar sus condiciones de trabajo si la radiación supera los límites.
    - Los laboratorios que miden la dosis personal deben participar al menos cada 2 años en ejercicios de comparación con otros laboratorios.
    - Se deroga la ley 4966, que regulaba el tema antes.
  no_dice:
    - "Cuánto vale en pesos cada Unidad Fija: la fija cada año la Ley Impositiva."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9542"
  titulo: Nuevo régimen de matrícula para profesionales de la salud
  tema: Salud
  resumen: Regula cómo se matriculan los profesionales sanitarios para ejercer en Mendoza, cuándo se les suspende o cancela la matrícula y crea un Registro Único de Profesionales de la Salud consultable en la web del Ministerio.
  a_quien: Profesionales de la salud y pacientes
  municipios: []
  puntos:
    - Se emite una sola vez. Piden título universitario, documento, certificado psicofísico de menos de 30 días, antecedentes penales y pago de arancel.
    - Ejercer sin matrícula trae multa y no se puede seguir ejerciendo hasta matricularse.
    - Se cancela, por ejemplo, tras 5 años seguidos sin ejercer o 3 suspensiones de más de un mes. Se suspende por enfermedad que inhabilite o por sanción.
    - Con título extranjero sin revalidar se puede tener matrícula provisoria de 1 año, solo en zonas con pocos profesionales.
  no_dice:
    - "Cuánto cuestan el arancel y la multa: los fija el Ministerio o el reglamento."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9541"
  titulo: Cómo se elige al Defensor de las Personas con Discapacidad
  tema: Derechos y sociedad
  resumen: "Cambia cómo se elige y reemplaza a quien dirige la Defensoría de las Personas con Discapacidad: lo propone el Ejecutivo desde una terna del Ministerio de Salud y lo aprueba el Senado. Es una ley de organización interna."
  a_quien: Personas con discapacidad y sus organizaciones
  municipios: []
  puntos:
    - La Defensoría es independiente, no recibe instrucciones de ninguna autoridad y funciona en el ámbito de la Legislatura.
    - El Defensor lo designa el Poder Ejecutivo con acuerdo del Senado, a partir de una terna elegida por el Ministerio de Salud y Deportes.
    - Las organizaciones de la sociedad civil de personas con discapacidad con personería jurídica vigente pueden postular candidatos al Ministerio.
    - Si el cargo queda vacante por remoción, muerte o renuncia, el Ejecutivo tiene 10 días hábiles para iniciar la designación del reemplazo.
  no_dice:
    - "Cómo se arma la terna: lo fijará el reglamento."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9540"
  titulo: Reglas de trabajo y compatibilidad para farmacéuticos
  tema: Trabajo y empleo público
  resumen: Los farmacéuticos pueden trabajar en el Estado y en el sector privado, con límites de incompatibilidad, y solo cobran el adicional por bloqueo de título si hay incompatibilidad real en su cargo.
  a_quien: Farmacéuticos de la Provincia y de efectores públicos de salud
  municipios: []
  puntos:
    - No pueden tener más de un cargo público a la vez, ni trabajar en lo público y en lo privado si los horarios se superponen.
    - La docencia no cuenta como incompatibilidad.
    - El adicional por bloqueo de título (plus por no poder ejercer en otro lado) va solo si hay incompatibilidad con lo privado y el cargo exige el título.
    - Su jornada debe ajustarse a los turnos y a las necesidades de los hospitales y centros de salud públicos.
  no_dice:
    - "De cuánto es el adicional por bloqueo de título: no lo dice."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9539"
  titulo: Nuevo régimen voluntario de empleo para médicos públicos
  tema: Trabajo y empleo público
  resumen: Crea un régimen de empleo especial y voluntario para médicos del sistema público de salud, con sueldos calculados en Unidades Sanitarias, carrera por grados, ingreso por concurso y despido por incumplir objetivos.
  a_quien: Médicos del sistema público de salud de Mendoza
  municipios: []
  puntos:
    - "Es voluntario: quien opta pasa a planta permanente, no puede tener ambos regímenes y puede volver al convenio anterior después de 1 año, sin compensación."
    - "Sueldo en Unidades Sanitarias (inicial $130.000): guardia 10 por 36 h semanales, críticos 13 por 40 h, asistenciales 3 fijas y 3 por objetivos por 30 h."
    - Suma 2% del básico por año de antigüedad, grados cada 3 años y 50% del básico por bloqueo de título. La licencia anual va de 21 a 35 días según antigüedad.
    - "Pueden echarlos si no cumplen objetivos dos semestres seguidos, salvo causas ajenas. Sanciones: apercibimiento, suspensión hasta 30 días, cesantía, exoneración."
  no_dice:
    - "Cuáles son los objetivos y la unidad de productividad: los fijará el Ministerio de Salud."
    - "Cuánto valdrá la Unidad Sanitaria más adelante: lo fija el Poder Ejecutivo."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9538"
  titulo: Reglas para los estudios clínicos con medicamentos en personas
  tema: Salud
  resumen: "Regula las investigaciones de farmacología clínica en personas en Mendoza: aprobación de un comité de ética, consentimiento informado, seguro para los participantes y control del Ministerio de Salud."
  a_quien: Participantes de estudios clínicos, investigadores y laboratorios
  municipios: []
  puntos:
    - Todo estudio debe ser aprobado por un Comité de Ética acreditado en el Ministerio (dictamen obligatorio). Participar es voluntario, con consentimiento firmado.
    - No pueden participar embarazadas, mujeres que amamantan, menores ni personas con discapacidad mental, salvo beneficio directo o estudio de su dolencia.
    - Quien investiga debe contratar un seguro individual para cada participante.
    - Si el tratamiento mejoró la salud del participante, el patrocinador debe garantizarle acceso a la medicación después del estudio.
  no_dice:
    - "Qué multas se aplican: el Ministerio las fijará por reglamento, en un plazo de 180 días."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9537"
  titulo: Habilitación y control de distribuidoras de productos médicos
  tema: Salud
  resumen: Las empresas que venden o distribuyen productos médicos (equipos, reactivos, material descartable) y las áreas de hospitales y clínicas que los manejan necesitan habilitación del Ministerio de Salud y control de inspectores.
  a_quien: Distribuidoras de productos médicos, clínicas y hospitales
  municipios: []
  puntos:
    - Hace falta habilitación previa del Ministerio, con inspección del local. A quienes están instalándose se les da habilitación provisoria de hasta 90 días.
    - Toda actividad debe tener un profesional matriculado como supervisor técnico, responsable de que los productos sean legítimos y estén bien conservados.
    - Deben tener trazabilidad de los insumos, esterilización del material quirúrgico reutilizable y guardar las recetas por al menos 3 años.
    - Las sanciones van de apercibimiento a multas de 1.000 a 51.000 Unidades Fijas, clausura, inhabilitación de hasta 3 años y decomiso de productos.
  no_dice:
    - "Cuánto vale en pesos cada Unidad Fija: lo fija el Código Fiscal vigente al momento del pago."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9536"
  titulo: Nuevas reglas para habilitar clínicas y centros de salud
  tema: Salud
  resumen: Regula la habilitación y categorización de los establecimientos de salud públicos y privados. Las clínicas que funcionan sin habilitación tienen un plazo y beneficios impositivos para regularizarse.
  a_quien: Clínicas, sanatorios y otros establecimientos de salud, y sus pacientes
  municipios: []
  puntos:
    - Antes de abrir hay que aprobar la factibilidad del proyecto edilicio y obtener la habilitación. Dura 5 años con internación y 10 sin internación.
    - Los públicos se consideran habilitados sin plazo, pero los controla el Ministerio. Todos deben tener un director técnico con título universitario en salud.
    - Las sanciones son multas de 500 a 80.000 Unidades Tributarias y clausura total o parcial.
    - Clínicas con internación sin habilitar tienen 10 meses para pedir una provisoria (hasta 36), con 50% menos de Ingresos Brutos y hasta 100% de Inmobiliario.
  no_dice:
    - Cuánto vale en pesos cada Unidad Tributaria.
    - "Cómo se clasificarán los establecimientos: lo fijará el reglamento en 180 días."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9535"
  titulo: Cobro a obras sociales por la atención en hospitales públicos
  tema: Salud
  resumen: Los hospitales públicos atienden gratis a quien no tiene cobertura. Si el paciente tiene obra social, PAMI o prepaga, esa entidad paga la atención. Crea REFORSAL, un ente que factura y cobra esos gastos.
  a_quien: Pacientes de hospitales públicos y obras sociales, prepagas y PAMI
  municipios: []
  puntos:
    - Los hospitales públicos aseguran atención gratuita a pacientes sin cobertura. Quien se atiende debe declarar la cobertura que tiene.
    - Las entidades con cobertura deben pagar según aranceles dentro de los 30 días corridos de recibida la factura, con interés si se atrasan.
    - "Lo cobrado se reparte así: 70% al hospital donde se atendió, 10% a transformación digital, 15% a un fondo de recuperación y 5% al ente REFORSAL."
    - Los extranjeros no residentes con cobertura en su país pagan la atención por su cuenta, con cargo a su cobertura de origen.
  no_dice:
    - "Cuánto cuesta cada prestación: los aranceles los fija el Ministerio por resolución."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9534"
  titulo: Parte de lo que dejan las apuestas irá a salud mental y adicciones
  tema: Salud
  resumen: El 25% de lo que se recaude de Ingresos Brutos por juegos de azar y apuestas, incluidas las online, se destina cada mes a programas de salud mental y adicciones. Rige desde el presupuesto 2025.
  a_quien: Personas con problemas de salud mental o adicciones
  municipios: []
  puntos:
    - Se asigna todos los meses el 25% del Ingresos Brutos de los servicios de juegos de azar y apuestas, incluidas las apuestas online.
    - La plata va a los programas de salud mental y adicciones del Ministerio de Salud y Deportes.
    - Se aplica desde el ejercicio presupuestario 2025.
  no_dice:
    - "Cuánta plata representa: depende de la recaudación de cada mes."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9533"
  titulo: Bienes de juicios de ejecución podrán pasar a las escuelas
  tema: Seguridad y justicia
  resumen: Si la subasta de bienes en una ejecución de sentencia fracasa o resulta antieconómica, el juez puede entregar los bienes directamente a la Dirección General de Escuelas, que debe informar qué hizo con ellos.
  a_quien: Deudores y acreedores en juicios de ejecución, y escuelas
  municipios: []
  puntos:
    - Lo que se obtiene en una subasta, descontados los gastos de secuestro, administración y mantenimiento, ingresa a la Tesorería General de la Provincia.
    - Si el remate es manifiestamente antieconómico o la primera subasta fracasa por falta de oferentes, el juez puede entregar los bienes a la DGE.
    - La Dirección General de Escuelas tiene 90 días hábiles para informar al tribunal el destino final de cada bien.
  no_dice:
    - "Qué tipo de bienes alcanza: el texto habla de los bienes de la ejecución en general."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9532"
  titulo: Medicamentos decomisados pasan a ser de la Provincia a los 60 días
  tema: Salud
  resumen: Los medicamentos, productos médicos y cosméticos decomisados o bajo custodia del Departamento de Farmacia pasan a ser de la Provincia a los 60 días del procedimiento. El Ministerio de Salud decide qué hacer con ellos.
  a_quien: Comercios y personas a quienes se les decomisan productos de salud
  municipios: []
  puntos:
    - Alcanza a medicamentos, productos médicos, cosméticos y otros de uso en salud humana que se decomisen, intervengan o queden en custodia del Departamento.
    - Pasan a ser propiedad de la Provincia cuando pasan 60 días desde el procedimiento.
    - El Ministerio de Salud y Deportes determina el destino de esos productos.
  no_dice:
    - "Qué destino se les dará: venta, donación o destrucción; el texto no lo dice."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9531"
  titulo: "Cambios en la ley de sangre: Centro Regional de Hemoterapia"
  tema: Salud
  resumen: "Actualiza la ley provincial de sangre humana: se prohíbe el comercio con ella, el Centro Regional de Hemoterapia recibe las donaciones y distribuye a efectores públicos y privados, y se suprime el Instituto de Medicina Transfusional."
  a_quien: Donantes de sangre, pacientes que reciben transfusiones y servicios de salud
  municipios: []
  puntos:
