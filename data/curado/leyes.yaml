- numero: "9670"
  titulo: Lavalle puede expropiar 7 hectáreas en Villa Tulumaya para vivienda
  tema: Tierras y expropiaciones
  resumen: Se declara de utilidad pública un terreno de unos 70.997 m2 en Ruta 34, Barrio El Palmeral, Lavalle. La Municipalidad expropia para abrir calles, hacer obras de servicios y regularizar la situación de las familias que viven ahí.
