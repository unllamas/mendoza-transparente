- numero: "9683"
  titulo: Las Verbenas Españolas son la Fiesta de la Hispanidad en Mendoza
  tema: Derechos y sociedad
  resumen: Declara Fiesta de la Hispanidad a las Verbenas Españolas, que se hacen cada octubre con sede en Guaymallén, organizadas por la Agrupación de Entidades Españolas. La Subsecretaría de Cultura la difunde y EMETUR colabora en su promoción turística.
