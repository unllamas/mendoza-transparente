  resumen: Las actas firmadas por auxiliares policiales alcanzan como prueba para investigar y no hace falta citar a los policías a ratificarlas. En casos graves o complejos, el fiscal puede pedir allanamientos y escuchas en una audiencia sin la otra parte.
