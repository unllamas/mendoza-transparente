  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9585"
  titulo: Mendoza tendrá un plan provincial contra el cambio climático
  tema: Ambiente y agua
  resumen: Fija la política de cambio climático de Mendoza. El Ministerio de Energía y Ambiente debe hacer un inventario de gases de efecto invernadero y un plan de mitigación y adaptación, y actualizarlos al menos cada 5 años.
  a_quien: Toda la provincia, municipios y escuelas
  municipios: []
  puntos:
    - El Ministerio de Energía y Ambiente debe medir y publicar las emisiones de gases de efecto invernadero y actualizarlas cada 5 años.
    - Debe hacer el Plan Provincial de Mitigación y Adaptación, con medidas para reducir emisiones, sistemas de alertas tempranas y metas de carbono neutralidad.
    - Debe convocar a los gobiernos locales a una mesa de coordinación y llevar programas de educación sobre cambio climático a las escuelas.
    - El Ejecutivo puede dar incentivos económicos a particulares que hagan acciones de mitigación o adaptación.
  no_dice:
    - "Qué metas concretas de reducción de emisiones habrá, qué incentivos y cuánto presupuesto: la ley no los fija."
