- numero: "9519"
  titulo: Nuevas reglas para las droguerías de Mendoza
  tema: Salud
  resumen: Regula la habilitación y el funcionamiento de las droguerías que venden medicamentos y drogas al por mayor, con inspecciones, responsable técnico, sanciones y la derogación de la ley anterior.
  a_quien: Droguerías, farmacias que les compran y sus dueños y directores técnicos
  municipios: []
  puntos:
    - "Hay tres tipos: A (drogas y preparados), B (solo especialidades medicinales) y C (industriales). Necesitan habilitación previa del Ministerio de Salud."
    - Las A y B tienen un farmacéutico como director técnico, presente en el horario declarado. Venden solo por mayor a droguerías, farmacias y laboratorios.
    - El local no puede comunicarse con una farmacia, aunque el dueño sea el mismo.
    - "Sanciones: apercibimiento, multa, clausura y, si reinciden, inhabilitación de 1 mes a 5 años. Tres visitas sin respuesta en un año suspenden la habilitación."
  no_dice:
