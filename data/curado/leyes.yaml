- numero: "9706"
  titulo: Reglas y control para camiones que transportan líquidos cloacales
  tema: Ambiente y agua
  resumen: El Departamento General de Irrigación habilita y controla a las empresas de camiones atmosféricos que transportan efluentes cloacales e industriales. Deben inscribirse, pagar un canon, llevar un manifiesto de carga electrónico y descargar solo en puntos autorizados.
  a_quien: Empresas de camiones atmosféricos, plantas de tratamiento, industrias y vecinos con pozo
  municipios: []
  puntos:
    - Solo pueden operar transportistas inscriptos y habilitados por Irrigación, que pagan un canon y llevan geolocalización satelital en los camiones.
    - Cada viaje lleva un manifiesto electrónico firmado por quien genera el líquido, el transportista y la planta que lo recibe.
    - Prohibido mezclar efluentes, guardar la carga más de 48 horas o descargar fuera de lugares habilitados. Las industrias deben pretratar antes.
    - "Sanciones: apercibimiento, multa de 100 a 100.000 Unidades Fiscales de Agua, suspensión, clausura del punto de vuelco y decomiso. Hay que limpiar."
  no_dice:
    - Cuánto vale el canon y la Unidad Fiscal de Agua en pesos.
    - "Cuánto cobrarán las plantas por recibir el líquido: lo avala la autoridad."
