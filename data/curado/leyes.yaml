  tema: Tierras y expropiaciones
  resumen: Destina 117 hectáreas en Capital a actividades deportivas y recreativas. El Gobierno podrá darlas en concesión de 10 a 30 años a instituciones deportivas, que deben construir y mantener todo a su costa. Al terminar, las obras quedan para la Provincia.
