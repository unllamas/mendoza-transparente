- numero: "9503"
  titulo: Suspende ejecuciones de deudas hipotecarias hasta fin de 2024
  tema: Derechos y sociedad
  resumen: Suspende los trámites de ejecución de sentencias sobre deudas hipotecarias de los deudores comprendidos en el artículo 2 de la Ley 8.182, hasta el 31 de diciembre de 2024. Esos deudores no tienen que hacer trámites ante el Ejecutivo ni la Justicia mientras el Ejecutivo cumple con la Ley 8.182.
  puntos:
    - Suspensión hasta el 31 de diciembre de 2024.
    - Alcanza a los deudores hipotecarios comprendidos en el artículo 2 de la Ley 8.182.
    - No están obligados a hacer trámites administrativos, y su ausencia no se toma como abuso ni dilación.
    - La norma es de orden público y de cumplimiento obligatorio.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9502"
  titulo: Expropiación en Lavalle para un parque público municipal
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujeto a expropiación un terreno en Lavalle de 1 hectárea y 1.517,74 m2. La Municipalidad de Lavalle expropia y paga los gastos. El destino es un parque público municipal, un espacio verde y churrasqueras.
  puntos:
    - Terreno de 1 ha 1.517,74 m2 en Lavalle, con Nomenclatura Catastral 13-99-00-0900-560740-0000-9.
    - "Destino: parque público municipal, espacio verde y churrasqueras."
    - La Municipalidad de Lavalle expropia, según el Decreto-Ley 1.447/75, y paga los gastos.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9500"
  titulo: Aprueba decretos sobre profesionales críticos de salud
  tema: Salud
  resumen: Aprueba los decretos 1883 y 2291 de 2023. Ambos incorporan profesionales al anexo del Decreto 1006/23, que exceptuó de la Ley 8727 a quienes trabajan como recurso humano crítico en efectores de salud de la Provincia. Los decretos están en el anexo.
  puntos:
    - Decreto 1883 del 12 de septiembre de 2023.
    - Decreto 2291 del 1 de noviembre de 2023.
    - Amplían el anexo del Decreto 1006/23, que exceptúa de la Ley 8727 al recurso humano crítico de los efectores de salud.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9499"
  titulo: Expropiación en Lavalle para tratar escombros
  tema: Tierras y expropiaciones
  resumen: Declara de utilidad pública y sujeto a expropiación un terreno en Lavalle. La Municipalidad de Lavalle lo expropia para el vuelco y tratamiento de escombros de obras de construcción y demolición, y para resolver la situación del dominio del puestero que vive allí. Paga los gastos.
  puntos:
    - Terreno con Nomenclatura Catastral 13-99-00-0900-780860-0000-1.
    - "Destino: vuelco y tratamiento de escombros."
    - También busca solucionar la situación dominial del puestero que habita el terreno.
    - La Municipalidad de Lavalle expropia y soporta el gasto.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
- numero: "9498"
  titulo: Donación de inmueble a Inspecciones de Cauce del Río Diamante
  tema: Tierras y expropiaciones
  resumen: Autoriza donar a la Asociación de Inspecciones de Cauce del Río Diamante un inmueble de 34 hectáreas en La Llave, que es del Departamento General de Irrigación. La donación es con el cargo de venderlo en 3 años para construir o comprar la sede de la Asociación.
  puntos:
    - Inmueble en La Llave, en Sboccia y Candel, de 34 ha 1.923,87 m2, con derecho de riego y una perforación.
    - "Cargo: venderlo para conseguir fondos para construir o comprar la sede social."
    - "Plazo para cumplir el cargo: 3 años desde la aceptación."
    - Los gastos de escrituras los paga la Asociación.
  hecho_con: claude-sonnet
  fecha: 2026-10-12
