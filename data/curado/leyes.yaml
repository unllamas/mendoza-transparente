    - Producir, transportar, fabricar y vender cannabis medicinal o cáñamo requiere autorización del Registro. Se procesa en laboratorios inscriptos.
    - "Tasas: 25 Unidades Fiscales para personas, 300 para ONG y fundaciones, 450 para producción."
    - Multas de 100 a 1.000.000 de Unidades Fiscales, clausura y decomiso. El Registro tendrá un Consejo Asesor de 7 miembros ad honorem.
  no_dice:
