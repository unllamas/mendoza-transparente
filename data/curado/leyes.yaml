  titulo: Se aprueban 32 permisos de exploración minera en Malargüe
  tema: Energía y minería
  resumen: La Legislatura aprueba las Declaraciones de Impacto Ambiental de 32 permisos de exploración minera en Malargüe, con nombres como El Seguro, Campeones, Huemul y Los Galgos. Las resoluciones van como anexo.
