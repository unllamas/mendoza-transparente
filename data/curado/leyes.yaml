- numero: "9682"
  titulo: Multa a padres que no actúen ante el bullying de sus hijos
  tema: Educación
  resumen: Padres o tutores que, avisados por la escuela, no tomen medidas para frenar el acoso escolar de su hijo ni reparar el daño, pueden recibir multa de 1.500 a 3.000 UF o hasta 30 días de tareas educativas o comunitarias.
  a_quien: Padres, madres y tutores de chicos acusados de acoso escolar, y escuelas
  municipios: []
  puntos:
    - La sanción es multa de 1.500 a 3.000 UF, o tareas educativas o comunitarias de hasta 30 días, según la gravedad.
    - Solo se aplica después de que la escuela aplicó el protocolo de bullying de la DGE y los adultos no fueron, no cumplieron o no acordaron medidas.
    - Si fracasa, la escuela manda el caso con un informe al Juzgado Contravencional del domicilio del adulto responsable.
    - Quedan eximidos los padres sin responsabilidad parental, sin el cuidado personal del chico o con prohibición de acercamiento.
  no_dice:
    - Cuánto vale una UF en pesos.
