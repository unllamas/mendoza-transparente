- numero: "9708"
  titulo: Nuevo registro y mapa digital para apicultores de Mendoza
  tema: Producción
  resumen: Actualiza la ley apícola. Crea un Mapa Apícola provincial donde los apicultores registran y renuevan sus apiarios por internet, y exige un título de marca a quienes tienen más de 10 colmenas. Toda la miel debe ser trazable.
  a_quien: Apicultores, fijos o que trasladan colmenas
  municipios: []
  puntos:
    - Quien tenga más de 10 colmenas recibe un título de marca y propiedad, obligatorio en todas las alzas y necesario para vender o transferir.
    - Los apiarios se registran con latitud y longitud en el Mapa Apícola y los permanentes se renuevan cada año.
    - El registro debe presentarse en las barreras sanitarias del ISCAMEN. Los que trasladan colmenas deben acreditar destino y controles sanitarios.
    - La Dirección de Ganadería puede prohibir el ingreso de colmenas con enfermedades o plagas y hacer inspecciones.
  no_dice:
    - Cuánto cuesta el título de marca o el registro, y las multas por no tenerlos.
    - "Cuántos apiarios por zona se permitirán: lo determina la autoridad con criterios que no se detallan."
