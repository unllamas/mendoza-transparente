  resumen: Las Cámaras de apelaciones civiles de la Primera Circunscripción pasan a resolver apelaciones de causas de paz y tributarias de la Tercera y Cuarta. Se fijan sedes en San Martín y Tunuyán para cámaras del trabajo.
