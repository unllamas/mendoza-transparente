  titulo: Registro provincial de cannabis medicinal y cáñamo industrial
  tema: Salud
  resumen: Crea el Registro Provincial del Cannabis y Cáñamo Industrial. Personas y ONG podrán cultivar cannabis medicinal inscribiéndose, y los productores necesitarán autorización. Hay tasas de 25 a 450 Unidades Fiscales.
  a_quien: Pacientes, cultivadores, ONG, productores y laboratorios
  municipios: []
  puntos:
