  fecha: 2026-10-12
- numero: "9701"
  titulo: Los vecinos podrán mandar videos de infracciones viales por WhatsApp
  tema: Transporte
  resumen: "Cualquiera podrá enviar videos o fotos de posibles infracciones de tránsito a los municipios o al Ministerio de Seguridad por canales oficiales, como WhatsApp. No es una denuncia formal: un Juzgado Vial analiza y verifica el material."
  a_quien: Conductores y vecinos que quieran reportar infracciones
  municipios: []
  puntos:
    - Se puede mandar material audiovisual por enlaces web oficiales o mensajería como WhatsApp.
    - "Lo recibido es solo una comunicación ciudadana: no es denuncia formal ni prueba de que el contenido sea auténtico."
    - La autoridad puede no publicar lo que no parezca de su jurisdicción o tenga indicios fuertes de ser falso.
    - Si hay datos suficientes, se envía al Juzgado Vial con un informe preliminar. El juzgado decide cómo verificarlo.
  no_dice:
    - Cuáles serán los números o enlaces oficiales para enviar el material.
    - Si el vecino que envía el video queda identificado o se le comunica el resultado.
