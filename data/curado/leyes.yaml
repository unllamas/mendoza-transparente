- numero: "9608"
  titulo: Cambios en el trámite penal sobre archivos, nulidades y apelaciones
  tema: Seguridad y justicia
  resumen: Modifica el Código Procesal Penal. Define cuándo se puede apelar, cómo se plantean nulidades y qué pasa si el juez no acepta el pedido del fiscal de cerrar una causa.
  a_quien: Víctimas, querellantes, imputados, fiscales y jueces de causas penales
  municipios: []
  puntos:
    - Si el fiscal pide cerrar la causa (sobreseimiento) y el juez no está de acuerdo, el caso pasa al Fiscal Adjunto Penal, que decide si sigue a juicio.
    - Si el fiscal archiva una causa, el querellante puede oponerse ante el juez, que resuelve en audiencia oral.
    - Solo se apelan resoluciones de jueces de garantías sobre excepciones, nulidades, medidas cautelares, archivo y sobreseimiento.
    - Las nulidades se plantean en momentos fijos del proceso y con fundamentos, y el recurso ante la Suprema Corte tiene plazo de 10 días para las partes.
  no_dice: []
