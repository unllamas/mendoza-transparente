    - Solo lo cobra el personal que cuida directamente a niños y adolescentes en esos institutos. No se extiende a otras funciones.
    - No se paga durante licencias por salud mental de largo plazo, licencias gremiales, suspensiones o traslado por sumarios graves como motines o fugas.
    - Los directores deben mandar la lista de agentes a Contaduría del 1 al 10 de cada mes. Puede implementarse gradualmente según el presupuesto.
  no_dice:
    - Cuántos empleados cobrarán ni cuánto costará.
