- numero: "9677"
  titulo: Facturas y tickets deberán traer el teléfono de Defensa del Consumidor
  tema: Derechos y sociedad
  resumen: Las facturas y tickets a consumidor final emitidos en Mendoza deben llevar impreso, de forma legible y destacada, el teléfono gratuito o canal digital de denuncias de Defensa del Consumidor, con el texto que indique esa dirección.
  a_quien: Comercios que emiten facturas y tickets, y consumidores
  municipios: []
  puntos:
    - Toda factura o ticket a consumidor final debe traer el teléfono gratuito o el canal digital para denunciar de la Dirección de Defensa del Consumidor.
    - Debe verse bien, no en letra chica.
    - El texto lo indica Defensa del Consumidor y debe mantenerse actualizado con los canales vigentes.
