  fecha: 2026-10-12
- numero: "9707"
  titulo: Registro obligatorio de guardavidas en Mendoza
  tema: Seguridad y justicia
  resumen: Crea un Registro Provincial de Guardavidas. Quienes manejen piletas, balnearios u otros ambientes acuáticos, y los organismos públicos que necesiten guardavidas, solo pueden contratar a personas inscriptas.
  a_quien: Guardavidas y dueños de piletas, clubes y balnearios
  municipios: []
  puntos:
    - Para inscribirse hay que ser mayor de edad, tener título de guardavidas de una institución reconocida y certificado de antecedentes penales.
    - No pueden tener sanciones que los inhabiliten para la función.
    - Los titulares de instalaciones acuáticas y los organismos públicos que requieran guardavidas están obligados a contratar solo inscriptos.
    - El Ministerio de Salud y Deportes lleva el registro y puede firmar convenios con los municipios.
  no_dice:
