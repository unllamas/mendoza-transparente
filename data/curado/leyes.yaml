- numero: "9503"
  titulo: "Suspende ejecuciones de deudas hipotecarias hasta fin de 2024"
  tema: "Derechos y sociedad"
  resumen: "Suspende los trámites de ejecución de sentencias sobre deudas hipotecarias de los deudores comprendidos en el artículo 2 de la Ley 8.182, hasta el 31 de diciembre de 2024. Esos deudores no tienen que hacer trámites ante el Ejecutivo ni la Justicia mientras el Ejecutivo cumple con la Ley 8.182."
  puntos:
