    - En una emergencia se puede usar si es imprescindible, con permiso de la autoridad escolar a cargo del curso o de la dirección.
    - La Dirección General de Escuelas debe hacer una campaña para difundir la ley y dar formación a docentes, alumnos y padres.
    - La formación incluye seguridad en internet, privacidad, ciberacoso y prevención de consumos problemáticos en juegos online.
