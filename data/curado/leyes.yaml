    - Los deudores no tienen que hacer ningún trámite ante el Ejecutivo o la Justicia mientras el Ejecutivo cumple con lo que le encomendó la ley 8182.
    - Que los deudores no hagan trámites no se toma como abuso ni como demora del juicio.
