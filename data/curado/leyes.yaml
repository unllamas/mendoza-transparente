- numero: "9592"
  titulo: Prohibido usar el celular al manejar y ver videos frente al conductor
  tema: Transporte
  resumen: Modifica la ley de tránsito. En cualquier vehículo está prohibido manejar con celular en la mano, leer mensajes o usar auriculares, salvo con manos libres. Los videos solo pueden verse en pantallas de atrás.
  a_quien: Conductores de toda la provincia, incluidos repartidores y choferes
  municipios: []
  puntos:
