  titulo: Terreno en Godoy Cruz para viviendas sociales y uso comunitario
  tema: Obras e infraestructura
  resumen: El Instituto Provincial de la Vivienda puede aceptar una donación de 2.412 m2 en Godoy Cruz para hacer viviendas sociales. Además, un terreno de 3.942 m2 pasa a ser espacio público para el Barrio Arausal.
