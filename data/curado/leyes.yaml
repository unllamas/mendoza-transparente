    - Pueden dirigir y gestionar servicios de enfermería, instituciones de salud, docencia e investigación.
    - Planifican, ponen en marcha y evalúan proyectos y programas de salud dentro del servicio donde trabajan.
    - Asumen los cuidados de enfermería en servicios cerrados y de mayor complejidad, y también las funciones de enfermeros profesionales y auxiliares.
    - Sus funciones se acreditan con un certificado de la Dirección de Recursos Humanos del Ministerio, si cumplen al menos una de las funciones de la ley.
  no_dice:
    - "Si el certificado cambia el sueldo o el cargo: el texto no lo menciona."
  hecho_con: claude-sonnet
