  titulo: Se amplía el registro de huellas genéticas a detenidos y trámites
  tema: Seguridad y justicia
  resumen: "El registro provincial de huellas genéticas suma dos casos: huellas tomadas a personas aprehendidas o en investigaciones penales, y huellas de trámites administrativos con consentimiento."
