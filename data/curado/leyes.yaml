    - Para créditos de hasta el 31/12/2005, la quita es del 50%; para los otorgados entre el 1/1/2006 y el 30/11/2017, del 40%.
    - Sin mora, 10% más de quita. Si el saldo es de hasta 30% del salario mínimo, se da por cancelado y se paga al escriturar el 15% del salario mínimo.
    - Se puede pedir hasta el 31 de agosto de 2026, prorrogable hasta el 31 de agosto de 2027.
