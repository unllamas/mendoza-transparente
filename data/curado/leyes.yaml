- numero: "9556"
  titulo: Registro obligatorio para comercios de usados y desarmaderos
  tema: Seguridad y justicia
  resumen: Crea un registro público de bienes muebles usados para combatir el mercado de cosas robadas. Los comercios de usados y los de autopartes deben registrar el stock y cada compra y venta, o pagan multas desde 2.000 hasta 9.000 U.F.
