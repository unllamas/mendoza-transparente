- numero: "9609"
  titulo: Notificaciones por WhatsApp y mediación previa en juicios de familia
  tema: Seguridad y justicia
  resumen: Reforma el código de procedimientos de familia y violencia familiar. Permite notificar por mensajería instantánea, exige mediación gratuita antes de ciertos juicios y acorta plazos de apelación en adopciones.
  a_quien: Familias en juicios de familia, violencia familiar y adopción
  municipios: []
  puntos:
    - Medidas de protección, citaciones, autorizaciones de viaje y demandados de otra provincia se notifican por mensajería, con PDF y llamada previa.
    - Hay mediación previa gratuita antes de juicios por cese de convivencia, parentesco, responsabilidad parental (salvo permisos de viaje), guarda y tutela.
    - En violencia familiar, el juez puede fijar una audiencia dentro de 7 días para acordar cuota alimentaria, indemnización y cuidado de los hijos.
    - La sentencia de adopción se apela en 3 días, y la Cámara y la Suprema Corte tienen plazos fijos para audiencias y sentencia.
