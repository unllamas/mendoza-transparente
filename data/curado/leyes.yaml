- numero: "9589"
  titulo: Irrigación controla el agua potable y las cloacas; se disuelve el EPAS
  tema: Ambiente y agua
  resumen: El Departamento General de Irrigación pasa a ser el ente regulador del agua potable y las cloacas en Mendoza y se disuelve el Ente Provincial del Agua y de Saneamiento (EPAS). La ley fija cortes, tarifas, subsidios y multas.
  a_quien: Usuarios de agua potable y cloacas, operadores del servicio y personal del EPAS
  municipios: []
  puntos:
    - Se puede restringir el servicio doméstico con 2 facturas vencidas y cortarlo 15 días después con intimación; no se corta a quien no puede pagar.
    - El Poder Ejecutivo puede dar subsidios a jubilados y usuarios residenciales de escasos recursos, y la boleta debe mostrar el monto subsidiado.
    - Las tarifas duran un año y se fijan por decreto. No se puede escriturar un inmueble con deuda de servicios.
    - "Multas de 100 a 100.000 Unidades Fiscales del Agua ($1.000 cada una), suspensión o clausura. Personal del EPAS: reubicación o indemnización."
  no_dice:
    - "Cuánto cuestan las tarifas y qué porcentaje cubre el subsidio: se definen luego por decreto y reglamentación."
