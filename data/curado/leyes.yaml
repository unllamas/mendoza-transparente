  fecha: 2026-10-12
- numero: "9700"
  titulo: Cuándo puede la Policía usar armas de fuego
  tema: Seguridad y justicia
  resumen: Modifica la ley del personal policial. Detalla cuándo se pueden usar armas de fuego, qué se considera peligro inminente y cómo avisar antes. Mientras el uso parezca ajustado a la ley y no haya sentencia firme, no se toman medidas disciplinarias por ese hecho.
  a_quien: Policías, y personas que enfrenten un procedimiento policial
  municipios: []
  puntos:
    - Se pueden usar armas de fuego en defensa propia o de terceros, ante peligro inminente de muerte o lesiones graves, o para detener o frenar la fuga del agresor.
    - Hay peligro inminente, por ejemplo, si el agresor tiene un arma, aunque luego resulte réplica, o si porta un arma blanca y resiste.
    - El policía debe identificarse y advertir que usará el arma, salvo que corra riesgo. Si hay heridos, pide ayuda médica y avisa a la Justicia y a los familiares.
    - Policías retirados convocados con tareas de conducción cobran hasta el 100% de la asignación de su grado, y hasta el 80% en otras tareas.
  no_dice:
    - "Qué sanciones hay si el uso del arma no se ajustó a la ley: la Justicia lo resuelve caso por caso."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
