- numero: "9554"
  titulo: Cambios en los juicios por jurados populares
  tema: Seguridad y justicia
  resumen: "Cambia cómo funcionan los juicios por jurados: qué delitos juzgan, cómo se admite la prueba antes del sorteo del jurado y qué papel tiene el querellante. Rige para causas que lleguen a juicio desde que la ley entre en vigencia."
  a_quien: Acusados, víctimas y querellantes en juicios por jurados
  municipios: []
  puntos:
    - Los jurados juzgan solo homicidios, abuso sexual seguido de muerte y robos con muerte o lesiones graves consumados, y los delitos que se juzgan con ellos.
    - Si un hecho conmocionó tanto a la comunidad que no hay jurado imparcial, el juez puede sortear jurados de otra circunscripción, solo si lo pide el acusado.
    - Antes del sorteo, una audiencia decide qué pruebas se aceptan. El juez descarta las irrelevantes, repetidas o que puedan confundir o perjudicar al jurado.
    - El querellante (la víctima que acusa) solo participa para probar la culpa y, si no va a la audiencia notificado, se entiende que abandona. No hay reclamo civil.
  no_dice: []
