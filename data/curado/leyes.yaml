  fecha: 2026-10-12
- numero: "9581"
  titulo: Guaymallén expropia terrenos para calles en Kilómetro 11
  tema: Tierras y expropiaciones
  resumen: Seis parcelas del distrito Kilómetro 11, Guaymallén, quedan sujetas a expropiación para abrir y prolongar calles. Suman unos 4 ha. La Municipalidad de Guaymallén expropia y paga los gastos.
  a_quien: Vecinos de Kilómetro 11 y dueños de las parcelas
  municipios:
    - Guaymallén
  puntos:
    - Son seis parcelas, parte de propiedades mayores. Las superficies afectadas son 636,18, 10.749,79, 4.259,56, 3.689,64, 520,64 y 20.838,65 m2.
    - En total son unos 40.694 m2, algo más de 4 hectáreas.
    - El destino es la apertura y prolongación de calles del distrito.
    - La Municipalidad de Guaymallén es quien expropia y paga todos los gastos.
