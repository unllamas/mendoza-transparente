- numero: "9718"
  titulo: Beneficios a inversores y cierre de la Administradora del Fondo
  tema: Economía y finanzas
  resumen: Mendoza se suma al régimen nacional de incentivo a medianas inversiones y da a esas empresas 10 años de beneficios. Disuelve la Administradora del Fondo para la Transformación, reorganiza el Casino y ofrece retiro voluntario con 120% de indemnización.
  a_quien: Empresas que inviertan, empleados del Casino y de la Administradora, y deudores de ex bancos oficiales
  municipios: []
  puntos:
    - "Empresas adheridas al RIMI nacional: 10 años sin más impuestos provinciales, prioridad en subsidios de tasa y parques industriales, y Sellos en cuotas."
    - Disuelve la Administradora del Fondo para la Transformación y el Crecimiento; sus fideicomisos pasan a Mendoza Fiduciaria S.A.
    - El Casino puede suprimir o cambiar puestos por 1 año. El personal permanente elige retiro voluntario (120% de indemnización) o reubicación con igual sueldo.
    - Se dan de baja deudas incobrables de ex bancos oficiales. Sin Sellos las refinanciaciones de deudas del 30/6/2025 al 31/3/2026 firmadas antes del 31/12/2026.
  no_dice:
    - Cuánto pagan hoy las empresas y cuánto cuesta el beneficio para la Provincia.
    - "Cuántos empleados del Casino y de la Administradora quedan alcanzados y qué deudas incobrables se dan de baja: la lista está en anexos que no se publicaron."
    - "Cuánto financiará la Provincia con tasa bonificada: solo fija un tope de 50% de la tasa del Banco Nación."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
