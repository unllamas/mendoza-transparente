  fecha: 2026-10-12
- numero: "9705"
  titulo: Nuevas exigencias para jardines maternales privados
  tema: Educación
  resumen: Los jardines maternales privados, que cuidan chicos de 45 días a 3 años, deben inscribirse en un registro público de la DGE antes de abrir, cumplir un mínimo de personal por sala y requisitos de seguridad. Los que ya funcionan tienen 6 meses para adecuarse.
  a_quien: Jardines maternales privados, comunitarios y cooperativos, y las familias que los usan
  municipios: []
  puntos:
    - Inscripción obligatoria en el Registro Único de la DGE, de consulta pública y gratuita. El jardín pone en el frente un cartel con su número de inscripción.
    - "Adultos por sala: 1 cada 5 bebés hasta 12 meses, 1 cada 8 a 1 año y 1 cada 12 a 2 y 3 años. Hay una auxiliar itinerante cada 3 salas."
    - El director debe ser docente de Nivel Inicial. El personal de sala necesita capacitación en primera infancia, apto psicológico y antecedentes penales.
    - Debe tener habilitación municipal, seguro de responsabilidad civil, plan de evacuación y emergencia médica. Cada 30 de junio presenta su proyecto educativo.
  no_dice:
