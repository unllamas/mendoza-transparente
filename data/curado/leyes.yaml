- numero: "9595"
  titulo: Las multas de riego y agua se calculan en Unidades Fiscales del Agua
  tema: Ambiente y agua
  resumen: Las multas de la Ley de Aguas y otras normas de riego pasan a expresarse en Unidades Fiscales del Agua (UFA). La mayoría va de 100 a 10.000 UFA, y perforar un pozo sin permiso cuesta de 3.000 a 100.000 UFA.
  a_quien: Regantes, propietarios de inmuebles con riego y empresas perforadoras
  municipios: []
  puntos:
    - Desviar agua para otro uso, usarla fuera de turno u obstruir un desagüe se multa con 100 a 10.000 UFA; en algunos casos se duplica si reincide.
    - Perforar un pozo sin autorización se multa con 3.000 a 100.000 UFA, que se duplica si reincide. La misma multa va para la empresa que perfora.
    - Cultivar de forma clandestina con agua sustraída se multa con 3.000 UFA por hectárea al propietario; el doble si el infractor es autoridad de riego.
    - No votar en las elecciones de regantes se multa con 10 UFA, que se cobra junto con el tributo de riego siguiente.
  no_dice:
    - "Cuántos pesos vale hoy una UFA: la ley que la creó la fijó en $1.000 y la Ley Impositiva fija el valor cada año."
  hecho_con: claude-sonnet
  fecha: 2026-10-12
