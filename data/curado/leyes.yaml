  titulo: Más control en recetas de psicofármacos y estupefacientes
  tema: Salud
  resumen: "Fija reglas para recetar y vender psicofármacos y estupefacientes: la receta lleva el documento del paciente, la farmacia no la acepta pasados 30 días y los médicos deben informar casos de dependencia o intoxicación."
  a_quien: Pacientes, médicos y farmacias
  municipios: []
  puntos:
    - La receta debe llevar tipo y número de documento del paciente. Si la dosis supera la autorizada, debe decir «superdosis».
    - La farmacia no puede entregar el medicamento si pasaron más de 30 días desde la fecha de la receta.
    - Al retirar el medicamento se registran nombre, domicilio y documento de quien lo retira, y el parentesco si no es el paciente.
    - El médico debe informar de forma reservada, dentro de 48 horas, los casos de dependencia o intoxicación al Departamento de Farmacia del Ministerio.
