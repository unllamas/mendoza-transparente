# Qué publica cada municipio de las 9 cosas que le piden las leyes. Contenido editorial, revisado a mano.
# Criterios: docs/procesos/metodologia.md#transparencia-municipal. Cómo se actualiza: docs/procesos/relevamiento-municipal.md.
#
# estado: publica | no_accesible (existe pero no se puede descargar ni leer) | no_publica
# ultimo_dato: período del dato más reciente (fin del trimestre, 1 de enero del año del presupuesto, fecha de la última licitación)
# formato: planilla | pdf | pdf_escaneado | web | zip
# El personal y las declaraciones juradas se completan solos con municipios-personal y etica-publica.

