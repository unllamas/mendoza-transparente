# Índices de transparencia municipal hechos por otros, para mostrarlos al lado de lo que relevamos nosotros
# (data/curado/transparencia-municipal.yaml). Contenido editorial: cada cifra se copia de la fuente y se verifica a mano.
# Criterios: docs/procesos/metodologia.md#transparencia-municipal.
#
# escala: lo que acompaña a la cifra ("sobre 100", "de 82 municipios").
# resultados[].puntaje: la cifra que se muestra; si el índice se lee por puesto (menor es mejor), va vacío y se muestra puesto_pais.
# resultados[].detalle: una aclaración corta que se muestra debajo (el pilar de transparencia, el índice crudo).

