- id: tasas-municipales-recaudacion
  titulo: Cuánto cobra cada municipio por cada tasa
  categoria: municipios
  que_es: Lo que recauda cada municipio por la tasa de la propiedad, la de comercio e industria y las demás, y cuánto queda sin cobrar.
  por_que_importa: Sin esto no se puede comparar qué parte de cada tasa se cobra ni cuánta deuda acumulan los vecinos. La mayoría de los municipios solo informa unos pocos rubros juntos.
  organismo: Los 18 municipios de Mendoza
  marco_legal: Ley 7314 de Responsabilidad Fiscal y Ley 9070 de Acceso a la Información Pública
  estado: sin_publicar
  donde_buscamos:
    - https://ciudaddemendoza.gob.ar/area-municipal/informacion-fiscal/
    - https://www.sanrafael.gov.ar/
    - https://boe.mendoza.gov.ar/
  detalle_estado: Al 18/10/2026 ningún municipio publica la recaudación por tasa mes a mes. San Rafael y San Martín abren cada tasa en sus anexos trimestrales de Responsabilidad Fiscal; los demás traen unos 11 rubros.
  pedido: La recaudación trimestral de cada tasa y derecho municipal, y la deuda acumulada por tasa, desde 2023, en CSV o XLSX.
  pedidos: []

- id: ordenanzas-tarifarias
  titulo: Cuánto cuesta cada tasa municipal este año
  categoria: municipios
  que_es: La ordenanza tarifaria del año, con el valor de cada tasa, y el valor vigente de la Unidad Tributaria Municipal en la que están expresadas.
  por_que_importa: Es lo que dice cuánto paga cada vecino. Solo seis municipios la tienen en su sitio; el resto hay que buscarla en el Boletín Oficial, y la de Maipú, La Paz y San Carlos para 2026 no aparece en ningún lado.
  organismo: Maipú, La Paz, San Carlos, Junín, Malargüe, Godoy Cruz, Guaymallén, Luján de Cuyo, Rivadavia, Santa Rosa, Lavalle y San Martín
  marco_legal: Ley 1079 Orgánica de Municipalidades y Ley 9070 de Acceso a la Información Pública
  estado: parcial
  donde_buscamos:
    - https://boe.mendoza.gov.ar/
    - https://www.maipu.gob.ar/rentas/
    - https://www.juninmendoza.gov.ar/tarifaria/tarifaria2025.pdf
    - https://datos.lujandecuyo.gob.ar/
  detalle_estado: Al 18/10/2026 publican la tarifaria 2026 en su sitio Capital, Las Heras, San Rafael, General Alvear, Tupungato y Tunuyán.
  pedido: La ordenanza tarifaria 2026 con todos sus anexos y los decretos que fijan el valor de la Unidad Tributaria Municipal, publicados en el sitio oficial del municipio.
  pedidos: []

- id: utn-por-regional
  titulo: Cuántos estudiantes tiene y cuánto gasta la UTN en Mendoza
  categoria: presupuesto
  que_es: Los estudiantes, egresados, docentes, presupuesto y gasto de las facultades regionales de la UTN en Mendoza y en San Rafael, por separado.
  por_que_importa: La UTN informa como una sola universidad para todo el país. La Nación le transfiere la plata al Rectorado, en Buenos Aires, y el Anuario de Estadísticas Universitarias da una sola cifra para toda la UTN. Por eso no se puede saber cuánto de eso queda en Mendoza ni comparar sus facultades con la UNCuyo.
  organismo: Universidad Tecnológica Nacional (Rectorado)
  marco_legal: Ley 27.275 de Acceso a la Información Pública
  ley: "27275"
  formulario: https://forms.office.com/r/ePbdW5KjRK
  estado: sin_publicar
  donde_buscamos:
    - https://www.utn.edu.ar/es/la-universidad/unidad-de-visibilidad-y-transparencia
    - https://www.argentina.gob.ar/educacion/universidades/informacion/publicaciones/anuarios
    - https://www.presupuestoabierto.gob.ar/sici/datos-abiertos
    - https://frm.utn.edu.ar/
    - https://www.frsr.utn.edu.ar/
  detalle_estado: Al 18/10/2026 el dato más fino que se publica es la región «Nuevo Cuyo», que junta La Rioja, Mendoza, San Juan y San Luis. La UTN recibe los pedidos de acceso a la información en un formulario propio.
  pedido: Para las Facultades Regionales Mendoza y San Rafael, desde 2020 y por año, la cantidad de estudiantes, nuevos inscriptos, egresados, cargos docentes y no docentes, y el presupuesto asignado, transferido y ejecutado por inciso y fuente de financiamiento, en CSV o XLSX.
  pedidos: []

