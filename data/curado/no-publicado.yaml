- id: uncuyo-planta-y-costo
  titulo: Cuánta gente trabaja en la UNCuyo y cuánto cuesta
  categoria: personal
  que_es: Los cargos docentes y no docentes de la UNCuyo por categoría y por facultad, y cuánto cuestan por mes.
  por_que_importa: Casi todo lo que la Nación le gira a la UNCuyo es sueldo, pero solo se publican las escalas por categoría y un tablero con la dotación total, no cuántos cargos hay de cada categoría ni su costo.
