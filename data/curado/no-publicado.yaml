  por_que_importa: La UTN informa como una sola universidad para todo el país. La Nación le transfiere la plata al Rectorado, en Buenos Aires, y el Anuario de Estadísticas Universitarias da una sola cifra para toda la UTN. Por eso no se puede saber cuánto de eso queda en Mendoza ni comparar sus facultades con la UNCuyo.
  organismo: Universidad Tecnológica Nacional (Rectorado)
  marco_legal: Ley 27.275 de Acceso a la Información Pública
  ley: "27275"
  formulario: https://forms.office.com/r/ePbdW5KjRK
  estado: sin_publicar
  donde_buscamos:
    - https://www.utn.edu.ar/es/la-universidad/unidad-de-visibilidad-y-transparencia
    - https://www.argentina.gob.ar/educacion/universidades/informacion/publicaciones/anuarios
    - https://www.presupuestoabierto.gob.ar/sici/datos-abiertos
    - https://frm.utn.edu.ar/
    - https://www.frsr.utn.edu.ar/
