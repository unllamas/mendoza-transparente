- id: universidades-privadas-fondos-publicos
  titulo: Qué plata pública reciben las universidades privadas
  categoria: presupuesto
  que_es: Los convenios, becas, subsidios y aportes que la provincia les da a las universidades privadas con sede en Mendoza.
  por_que_importa: Las universidades privadas no están obligadas a publicar sus cuentas, así que solo el Estado que les transfiere fondos puede decir cuánto reciben.
