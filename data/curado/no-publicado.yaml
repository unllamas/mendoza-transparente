  pedidos: []

- id: rivadavia-habilitacion-comercio
  titulo: Cuánto tarda y qué exige la habilitación de un comercio en Rivadavia
  categoria: municipios
  que_es: Los plazos de la habilitación comercial, cómo se asigna la categoría de la tasa de comercio y qué comercios necesitan seguro y certificado CEMEPASI, en la Municipalidad de Rivadavia.
  por_que_importa: Quien quiere abrir un comercio sabe qué papeles llevar, pero no cuánto va a esperar ni en qué categoría de la tasa de comercio queda. La página de Comercio e Industria no se actualiza desde 2024 y no coincide con la tarifaria en el sellado (26 UTM contra 18 UTM).
  organismo: Municipalidad de Rivadavia (Departamento de Comercio e Industria)
  marco_legal: Ley 9070 de Acceso a la Información Pública
  estado: parcial
  donde_buscamos:
    - https://rivadaviamendoza.gob.ar/new/rentas/comercio-industria/
    - https://rivadaviamendoza.gob.ar/new/ciudadania/bromatologia/
    - https://rivadaviamendoza.gob.ar/transparencia/?page_id=8492
    - https://boe.mendoza.gov.ar/
  detalle_estado: Al 27/10/2026 la página lista los requisitos y los pasos, pero no dice el plazo de la resolución del Intendente, cómo se ponderan la superficie, la ubicación y los empleados para fijar la categoría (art. 35 de la tarifaria 5303), ni a qué rubros se les pide CEMEPASI y seguro. No hay decreto que reglamente la exención de los pequeños emprendedores (art. 44).
  pedido: El plazo de la habilitación comercial, el criterio con que se asigna la categoría de la tasa de comercio, los rubros que exigen CEMEPASI y seguro contra terceros, y la reglamentación de la exención del art. 44 de la Ordenanza 5303.
  pedidos: []

