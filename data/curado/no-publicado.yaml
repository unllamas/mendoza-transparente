  por_que_importa: Quien quiere abrir un comercio en San Martín no encuentra en el sitio municipal los requisitos ni el plazo, y la ordenanza tarifaria deja la categoría (1.ª a 3.ª) a criterio del municipio, así que no puede saber cuánto va a pagar de derechos de comercio.
  organismo: Municipalidad de General San Martín (Dirección de Recursos Municipales)
  marco_legal: Ley 9070 de Acceso a la Información Pública
  estado: sin_publicar
  donde_buscamos:
    - https://sanmartinmza.gob.ar
    - https://web.sanmartinmza.gob.ar
    - https://boe.mendoza.gov.ar/default/public/publico/verpdf/bd8bb8364c30e32a8d19dfdcc18d30f15f9bffa862/anexo
  detalle_estado: Revisado el 27 oct 2026. No hay ficha de habilitación comercial ni guía de trámites. La Ordenanza tarifaria 3189/2024 (modificada por la 3229) fija los importes en UT pero no dice si son anuales o bimestrales, ni a qué comercios corresponde la UT de $ 83 y a cuáles la de $ 156,60.
