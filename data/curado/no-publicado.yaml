  titulo: Qué calles son la zona 1 y la zona 2 de la tarifaria de Junín
  categoria: municipios
  que_es: La definición de las zonas con las que la tarifaria 2026 de Junín cobra distinto cada derecho de comercio, y la ordenanza en texto legible.
  por_que_importa: Sin saber qué zona le toca a su local, un comercio no puede calcular cuánto paga. Y la tarifaria solo está en el Boletín Oficial como imágenes escaneadas, que no se pueden buscar ni copiar; el link del sitio municipal a la de 2025 da 404.
  organismo: Municipalidad de Junín
  marco_legal: Ley 1079 Orgánica de Municipalidades y Ley 9070 de Acceso a la Información Pública
  estado: parcial
  donde_buscamos:
    - https://boe.mendoza.gov.ar/
    - https://www.juninmendoza.gov.ar/sellados/
    - https://www.juninmendoza.gov.ar/industria-y-comercio/
    - https://www.juninmendoza.gov.ar/mesa-de-entradas/
    - https://hcdjunin.gob.ar/
  detalle_estado: La Ordenanza 1020/2025 (tarifaria 2026) salió en el Boletín con su anexo escaneado; el sumario dice solo «Expediente». Trae montos por zona 1 y 2 y no define las zonas. La página «Trámites de habilitación» del sitio no abre.
  pedido: La definición de las zonas de la tarifaria 2026, la lista de documentos para habilitar un comercio, el monto del sellado de inicio y la ordenanza tarifaria en texto, publicados en el sitio oficial del municipio.
