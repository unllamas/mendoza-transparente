    - https://lavalle.mendoza.gov.ar
    - https://boe.mendoza.gov.ar/
  detalle_estado: Al 27/10/2026 los dominios probados no resuelven o están vacíos. El Boletín trae la Ordenanza tarifaria 1284 (2026), con la tasa por rubro en UTM, pero no los trámites. El monto de la UTM sale del art. 2 de la ordenanza, y no se encontró un ajuste posterior.
