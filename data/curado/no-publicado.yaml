  que_es: La ejecución del presupuesto de la Universidad Nacional de Cuyo por facultad, por tipo de gasto y por fuente de la plata.
  por_que_importa: La Nación publica cuánto le transfiere, pero no en qué lo gasta cada facultad. La UNCuyo muestra su ejecución en tableros que no se pueden descargar y su presupuesto en PDF de más de 30 MB.
  organismo: Universidad Nacional de Cuyo (Coordinación Legal y Técnica)
  marco_legal: Ley 27.275 de Acceso a la Información Pública
  ley: "27275"
  formulario: mailto:rec.cglyt@uncuyo.edu.ar
  estado: parcial
  donde_buscamos:
    - https://www.uncuyo.edu.ar/transparencia/informacion-presupuestaria
    - https://www.presupuestoabierto.gob.ar/sici/datos-abiertos
  detalle_estado: Al 18/10/2026 hay presupuesto anual en PDF y ejecución trimestral en tableros Power BI, sin CSV ni XLSX.
  pedido: La ejecución presupuestaria trimestral desde 2022, por unidad académica, inciso y fuente de financiamiento, en CSV o XLSX.
  pedidos: []

