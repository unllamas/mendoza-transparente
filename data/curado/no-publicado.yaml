  categoria: municipios
  que_es: El criterio con que la Dirección de Rentas asigna a cada comercio una categoría de la tasa de comercio (1 a 5, y en algunos rubros hasta 8), y la resolución que fija el valor de la Unidad Tributaria Municipal de cada semestre.
  por_que_importa: La ordenanza tarifaria publica el monto de cada rubro por categoría, pero no dice qué hace que un comercio sea de la 1 o de la 5, así que quien quiere abrir no puede saber cuánto va a pagar. Y como los montos están en UTM, ajustadas por IPC cada semestre, sin la resolución no se sabe cuántos pesos son.
  organismo: Municipalidad de General Alvear (Dirección de Rentas)
  marco_legal: Ley 1079 Orgánica de Municipalidades y Ley 9070 de Acceso a la Información Pública
  estado: sin_publicar
  donde_buscamos:
    - https://alvearmendoza.gob.ar/ordenanza-tarifaria/
    - https://alvearmendoza.gob.ar/wp-content/uploads/2026/08/IIIV-ORDENANZA-TARIFARIA-2026-2do.sem_.pdf
    - https://alvearmendoza.gob.ar/wp-content/uploads/2026/08/III-ORDENANZA-REGLAM.-2026-2do.sem_.pdf
    - http://tramites.alvearmendoza.gob.ar/rentas-alvear/
    - https://boletinoficial.mendoza.gov.ar/
