# Datos que deberían ser públicos y no encontramos publicados (relevamiento del 11/10/2026).
# Contenido editorial: cada entrada se revisa a mano antes de publicarse.
#
# categoria: personal | estructura | presupuesto | impuestos | compras | empresas | legislatura | elecciones | servicios | municipios
#   (definidas en apps/web/src/no-publicado-categories.ts)
# estado: sin_publicar | parcial | desactualizado
# pedido: lo que se solicita, en una o dos oraciones; la web arma el resto de la nota.
# pedidos: historial de pedidos de acceso a la información presentados por el proyecto
#   (fecha, tramite, estado: presentado | respondido | vencido | denegado, respuesta_url).

- id: cuenta-general
  titulo: La Cuenta General del Ejercicio
  categoria: presupuesto
  que_es: El balance oficial de cada año, en el que el Gobierno rinde cuentas de cuánto recaudó y en qué gastó realmente el presupuesto.
  por_que_importa: Es el documento que permite comparar lo que se prometió en el presupuesto con lo que efectivamente se hizo.
  organismo: Contaduría General de la Provincia
  marco_legal: Ley 8706 de Administración Financiera y Ley 9070 de Acceso a la Información Pública
  estado: sin_publicar
  donde_buscamos:
    - https://sitios.mendoza.gob.ar/haciendayfinanzas/
    - https://www.tribunaldecuentas.mendoza.gov.ar/
  pedido: Copia de la Cuenta General del Ejercicio de los años 2015 a 2025, con sus anexos, tal como fue presentada a la Legislatura y al Tribunal de Cuentas.
  pedidos: []

- id: nomina-sueldos
  titulo: La nómina de personal con sus sueldos
  categoria: personal
  que_es: La lista de cargos de la administración pública provincial con su categoría y las escalas salariales vigentes, incluidas las de funcionarios.
  por_que_importa: Sin ella no se puede saber cuánto gana un ministro, un director o un empleado, ni cuántos cargos hay en cada repartición.
  organismo: Ministerio de Hacienda y Finanzas
  marco_legal: Ley 9070 de Acceso a la Información Pública
  estado: parcial
  donde_buscamos:
    - https://datosabiertos.mendoza.gov.ar/
    - https://sitios.mendoza.gob.ar/haciendayfinanzas/ley-de-responsabilidad-fiscal/
  detalle_estado: Hay una planta de personal de noviembre de 2023 en datos abiertos y totales por repartición en los informes trimestrales, pero no las escalas salariales vigentes.
  pedido: Nómina actualizada de autoridades superiores (gobernador, vicegobernador, ministros, secretarios, subsecretarios y directores) con su remuneración bruta mensual, y las escalas salariales vigentes de la administración pública provincial.
  pedidos: []

- id: ejecucion-detallada
  titulo: La ejecución del presupuesto por programa
  categoria: presupuesto
  que_es: Cuánto gastó cada ministerio en cada programa y en qué (sueldos, bienes, obras), en formato de datos abiertos.
  por_que_importa: Permite ver si la plata asignada a un área, por ejemplo salud o seguridad, se gastó o quedó sin usar.
  organismo: Contaduría General de la Provincia
  marco_legal: Ley 8706 de Administración Financiera y Ley 9070 de Acceso a la Información Pública
  estado: desactualizado
  donde_buscamos:
    - https://datosabiertos.mendoza.gov.ar/
    - https://sitios.mendoza.gob.ar/haciendayfinanzas/668-2/ejecucion-presupuestaria/ejecuciones-presupuestarias-provinciales/
  detalle_estado: El portal de datos abiertos tiene la ejecución detallada hasta 2022-2023. Desde entonces solo se publican resúmenes en PDF.
  pedido: Ejecución presupuestaria de la administración pública provincial de 2023 a la fecha, por jurisdicción, programa, objeto del gasto y fuente de financiamiento, en formato CSV o XLSX.
  pedidos: []

- id: financiamiento-campanas
  titulo: Quién financia las campañas provinciales
  categoria: elecciones
  que_es: Los informes de ingresos y gastos que los partidos deben presentar por cada campaña electoral provincial, con sus aportantes.
  por_que_importa: Saber quién pone la plata de las campañas es clave para detectar conflictos de interés con quienes después gobiernan.
  organismo: Junta Electoral de la Provincia de Mendoza
  marco_legal: Ley 7005 de financiamiento de campañas y Ley 9070 de Acceso a la Información Pública
  estado: sin_publicar
  donde_buscamos:
    - https://jusmendoza.gob.ar/junta-electoral-de-mendoza/
    - https://elecciones.mendoza.gob.ar/
  pedido: Informes de financiamiento de campaña (ingresos, gastos y listado de aportantes) presentados por cada partido, alianza o frente en las elecciones provinciales de 2023 y 2025 y en las municipales de 2026.
  pedidos: []

- id: votaciones-nominales
  titulo: Cómo vota cada legislador
  categoria: legislatura
  que_es: El registro de cómo votó cada diputado y cada senador provincial en cada proyecto, y su asistencia a las sesiones.
  por_que_importa: Es la forma más directa de saber qué defiende cada legislador más allá de lo que dice en campaña.
  organismo: Cámara de Diputados y Cámara de Senadores de Mendoza
  marco_legal: Ley 9070 de Acceso a la Información Pública
  estado: sin_publicar
  donde_buscamos:
    - https://www.hcdmza.gob.ar/site/
    - https://www.senadomendoza.gob.ar/sesiones/
  detalle_estado: Se publican los diarios de sesiones, pero no las votaciones nominales ni la asistencia en formato de datos.
  pedido: Registro de votaciones nominales y de asistencia de cada legislador en todas las sesiones desde diciembre de 2023, en formato CSV o XLSX.
  pedidos: []

- id: dieta-legisladores
  titulo: Cuánto cobra cada legislador
  categoria: legislatura
  que_es: La dieta mensual de diputados y senadores provinciales, sus gastos de representación y las escalas salariales de la Legislatura.
  por_que_importa: Las cámaras publican viáticos y pasajes, pero no el sueldo de quienes votan las leyes y el presupuesto.
  organismo: Cámara de Diputados y Cámara de Senadores de Mendoza
  marco_legal: Ley 9070 de Acceso a la Información Pública
  estado: sin_publicar
  donde_buscamos:
    - https://www.hcdmza.gob.ar/site/informacion-publica/informacion-economica
    - https://www.senadomendoza.gob.ar/viaticos-pasajes-y-contratos/
  detalle_estado: Se publican viáticos y pasajes por legislador; la dieta y los gastos de representación, no.
  pedido: Monto bruto mensual de la dieta de diputados y senadores provinciales, gastos de representación y cualquier otro concepto que perciban por su cargo, desde diciembre de 2023 a la fecha.
  pedidos: []

- id: turnos-salud
  titulo: Turnos y esperas en la salud pública
  categoria: servicios
  que_es: Cuánto hay que esperar para conseguir un turno o una cirugía en los hospitales y centros de salud provinciales.
  por_que_importa: Es uno de los indicadores que más impactan en la vida cotidiana y no hay ningún dato público para medirlo.
  organismo: Ministerio de Salud y Deportes
  marco_legal: Ley 9070 de Acceso a la Información Pública
  estado: sin_publicar
  donde_buscamos:
    - https://www.mendoza.gob.ar/saludydeportes/
  pedido: Tiempos promedio de espera para turnos de consulta por especialidad y para cirugías programadas en cada hospital provincial, por mes, desde enero de 2023.
  pedidos: []

- id: mendoza-fiduciaria
  titulo: Los balances de Mendoza Fiduciaria
  categoria: empresas
  que_es: Los estados contables de la empresa estatal que administra fideicomisos públicos, y la lista de esos fideicomisos con sus saldos.
  por_que_importa: Por los fideicomisos pasan fondos públicos que no siempre aparecen en el presupuesto.
  organismo: Mendoza Fiduciaria S.A.
  marco_legal: Ley 9070 de Acceso a la Información Pública (alcanza a sociedades con participación estatal)
  estado: sin_publicar
  donde_buscamos:
    - https://mendozafiduciaria.com/
  pedido: Estados contables de Mendoza Fiduciaria S.A. de 2020 a 2025 y listado de fideicomisos administrados con su objeto, fiduciante y saldo al cierre de cada año.
  pedidos: []

- id: compras-2026
  titulo: Las compras del Estado de 2026
  categoria: compras
  que_es: Los datos abiertos de todas las contrataciones del sistema COMPR.AR Mendoza.
  por_que_importa: El último archivo publicado llega al 2 de enero de 2026; desde entonces no se puede analizar a quién le compra el Estado.
  organismo: Dirección General de Contrataciones Públicas y Gestión de Bienes
  marco_legal: Ley 9070 de Acceso a la Información Pública
  estado: desactualizado
  donde_buscamos:
    - https://datosabiertos-compras.mendoza.gov.ar/datasets/
  pedido: Actualización del conjunto de datos de contrataciones abiertas (estándar OCDS) de COMPR.AR Mendoza con los procesos desde el 2 de enero de 2026 a la fecha.
  pedidos: []

- id: recaudacion-atm
  titulo: La recaudación mes a mes de cada impuesto
  categoria: impuestos
  que_es: Cuánto recauda la provincia cada mes por Ingresos Brutos, Automotor, Inmobiliario y Sellos.
  por_que_importa: El informe mensual se reemplaza cada mes y no queda una serie para ver la evolución.
  organismo: Administración Tributaria Mendoza (ATM)
  marco_legal: Ley 9070 de Acceso a la Información Pública
  estado: parcial
  donde_buscamos:
    - https://sitios.mendoza.gob.ar/haciendayfinanzas/informes-de-recaudacion/
    - https://atm.mendoza.gov.ar/
  pedido: Serie mensual de recaudación por impuesto provincial desde enero de 2015, en formato CSV o XLSX.
  pedidos: []

- id: seguridad
  titulo: Las estadísticas de delitos de la provincia
  categoria: servicios
  que_es: Los delitos denunciados por tipo y por departamento, con datos propios del Ministerio de Seguridad.
  por_que_importa: Hoy solo hay datos nacionales anuales; la provincia no publica los suyos con más detalle.
  organismo: Ministerio de Seguridad y Justicia
  marco_legal: Ley 9070 de Acceso a la Información Pública
  estado: sin_publicar
  donde_buscamos:
    - https://www.mendoza.gob.ar/seguridadyjusticia/
  pedido: Cantidad mensual de delitos denunciados por tipo y por departamento desde enero de 2020, en formato CSV o XLSX.
  pedidos: []

- id: municipios-sin-datos
  titulo: Las cuentas de San Martín y Lavalle
  categoria: municipios
  que_es: Presupuesto, ejecución, sueldos y compras de los dos municipios que no publican información fiscal propia.
  por_que_importa: Son los únicos 2 de los 18 municipios sin un sitio con sus cuentas, como exige la Ley de Responsabilidad Fiscal.
  organismo: Municipalidades de San Martín y de Lavalle
  marco_legal: Ley 7314 de Responsabilidad Fiscal y Ley 9070 de Acceso a la Información Pública
  estado: sin_publicar
  donde_buscamos:
    - https://sanmartinmza.gob.ar
    - https://lavallemendoza.gob.ar/public/
  detalle_estado: Tampoco publican el anexo de personal (cargos de planta y contratos), que los otros 14 municipios con datos sí suben a su sitio.
  pedido: Presupuesto 2026, ejecución presupuestaria de 2024 a la fecha y anexos trimestrales de la Ley de Responsabilidad Fiscal del municipio, incluido el Anexo 19 de personal.
  pedidos: []

- id: personal-godoy-cruz-las-heras
  titulo: El personal de Godoy Cruz y Las Heras, en un formato que se pueda leer
  categoria: municipios
  que_es: El anexo trimestral con la cantidad de cargos de planta permanente, temporaria y contratos de locación de cada municipio (Anexo 19 de la Ley de Responsabilidad Fiscal).
  por_que_importa: Sin él no se puede saber cuánta gente trabaja en estos dos municipios ni compararlos con los otros 14 que sí lo publican.
  organismo: Municipalidades de Godoy Cruz y de Las Heras
  marco_legal: Ley 7314 de Responsabilidad Fiscal y Ley 9070 de Acceso a la Información Pública
  estado: parcial
  donde_buscamos:
    - https://webapps.godoycruz.gob.ar/responsabilidadfiscal
    - https://datos.godoycruz.gob.ar/
    - https://web6.lasheras.gob.ar/apex
  detalle_estado: Los dos los cargan en aplicaciones con formularios que no ofrecen un archivo para descargar, así que no se pueden leer ni archivar automáticamente.
  pedido: Los anexos 19 de personal de 2018 a la fecha en un archivo descargable (PDF o planilla), publicado en el sitio del municipio.
  pedidos: []

- id: organigrama-completo
  titulo: El organigrama del Gobierno con quién conduce cada área
  categoria: estructura
  que_es: La estructura completa de cada ministerio (subsecretarías, direcciones y departamentos) con el nombre de quien está a cargo de cada una.
  por_que_importa: Sin el organigrama no se sabe quién es responsable de cada área ni cuántos cargos políticos hay en cada ministerio.
  organismo: Gobernación de Mendoza
  marco_legal: Ley 9501 de Ministerios (art. 37) y Ley 9070 de Acceso a la Información Pública
  estado: sin_publicar
  donde_buscamos:
    - https://www.mendoza.gov.ar/
    - https://sitios.mendoza.gob.ar/haciendayfinanzas/
    - https://eticapublica.mendoza.gov.ar/
  detalle_estado: Solo se publica la lista de ministros. La Oficina de Ética Pública lista a quienes presentan declaración jurada, pero no la estructura.
  pedido: El organigrama vigente de cada ministerio y organismo del Poder Ejecutivo, con las subsecretarías, direcciones y departamentos, y el nombre y cargo de quien conduce cada una.
  pedidos: []

- id: misiones-funciones
  titulo: Qué hace cada dirección y subsecretaría
  categoria: estructura
  que_es: Los decretos de estructura orgánica que fijan las misiones y funciones de cada subsecretaría y dirección del Gobierno.
  por_que_importa: La Ley de Ministerios solo describe a los siete ministerios. Sin estos decretos no se sabe qué tiene que hacer cada área ni si hay áreas que se superponen.
  organismo: Gobernación de Mendoza
  marco_legal: Ley 9501 de Ministerios (art. 37) y Ley 9070 de Acceso a la Información Pública
  estado: sin_publicar
  donde_buscamos:
    - https://www.mendoza.gov.ar/
    - https://boe.mendoza.gov.ar/
  detalle_estado: En el Boletín Oficial aparecen decretos sueltos, pero no hay un listado de las estructuras vigentes.
  pedido: Copia de los decretos vigentes que aprueban la estructura orgánica, las misiones y las funciones de cada ministerio y organismo del Poder Ejecutivo desde diciembre de 2023.
  pedidos: []

- id: contratados
  titulo: Quiénes son los contratados del Estado
  categoria: personal
  que_es: La lista de contratos de locación de servicios del Estado provincial, con el nombre del contratado, el organismo, el objeto, el monto y la duración de cada contrato.
  por_que_importa: Los contratos no pasan por concurso. Sin la lista no se puede saber a quién se contrata, para qué ni por cuánto.
  organismo: Ministerio de Hacienda y Finanzas
  marco_legal: Ley 7314 de Responsabilidad Fiscal y Ley 9070 de Acceso a la Información Pública
  estado: parcial
  donde_buscamos:
    - https://sitios.mendoza.gob.ar/haciendayfinanzas/ley-de-responsabilidad-fiscal/
  detalle_estado: El anexo 20 del informe trimestral de Responsabilidad Fiscal publica cuántos contratos hay en cada organismo, las altas, las bajas y el importe total, pero no quiénes son ni qué hacen.
  pedido: La nómina de contratos de locación de servicios vigentes en el Poder Ejecutivo provincial, con el organismo, el nombre del contratado, el objeto del contrato, el monto mensual y las fechas de inicio y fin.
  pedidos: []

- id: gasto-personal-detallado
  titulo: El gasto en personal mes a mes y por concepto
  categoria: personal
  que_es: Cuánto se paga en sueldos cada mes en cada organismo y unidad (escuela, hospital, dirección), separado por sueldo básico, adicionales, horas extra y guardias.
  por_que_importa: Solo con este detalle se pueden ver las horas extra, los adicionales y las diferencias entre áreas, que es donde suelen aparecer los gastos difíciles de explicar.
  organismo: Ministerio de Hacienda y Finanzas
  marco_legal: Ley 7314 de Responsabilidad Fiscal y Ley 9070 de Acceso a la Información Pública
  estado: parcial
  donde_buscamos:
    - https://sitios.mendoza.gob.ar/haciendayfinanzas/ley-de-responsabilidad-fiscal/
    - https://datosabiertos.mendoza.gov.ar/
  detalle_estado: El anexo 19 publica, por trimestre, los cargos y el importe acumulado de cada organismo, sin desglose por concepto ni por unidad. El link del anexo 19 del segundo trimestre de 2024 está roto en el sitio oficial.
  pedido: El gasto mensual en personal de cada organismo y unidad organizativa del Poder Ejecutivo, desde enero de 2023, separado por concepto (básico, adicionales, horas extra, guardias y aportes patronales), en formato CSV o XLSX.
  pedidos: []

- id: designaciones-de-personal
  titulo: Todas las designaciones y bajas de personal
  categoria: personal
  que_es: El registro de todos los nombramientos, ascensos, pases y bajas de personal del Estado provincial, con nombre, cargo, organismo y fecha.
  por_que_importa: Solo una parte de los nombramientos se publica en el Boletín Oficial, y a veces con meses de atraso. Sin el registro completo no se pueden ver, por ejemplo, los nombramientos en masa antes de un cambio de gobierno.
  organismo: Ministerio de Hacienda y Finanzas
  marco_legal: Ley 9070 de Acceso a la Información Pública
  estado: parcial
  donde_buscamos:
    - https://boe.mendoza.gov.ar/
  detalle_estado: El Boletín publica los decretos y algunas resoluciones de designación. Muchas designaciones internas y las de planta transitoria no aparecen.
  pedido: El registro de altas, bajas, designaciones y cambios de situación del personal del Poder Ejecutivo provincial desde diciembre de 2023, con organismo, cargo, categoría y fecha, en formato CSV o XLSX.
  pedidos: []

- id: ddjj-montos
  titulo: Cuánta plata tienen los funcionarios en cuentas, efectivo e inversiones
  categoria: personal
  que_es: Los montos de las declaraciones juradas patrimoniales de los funcionarios provinciales que no se publican, como cuentas bancarias, dinero en efectivo, créditos y deudas, acciones, participaciones en sociedades e ingresos.
  por_que_importa: El sitio oficial solo muestra con monto los inmuebles y vehículos, y a valor fiscal. Sin el resto no se puede ver cómo cambia el patrimonio de un funcionario mientras ocupa el cargo.
  organismo: Oficina de Investigaciones Administrativas y Ética Pública
  marco_legal: Ley 8993 de Ética Pública y Ley 9070 de Acceso a la Información Pública
  estado: parcial
  donde_buscamos:
    - https://eticapublica.mendoza.gov.ar/declaraciones
  detalle_estado: La versión pública de cada declaración indica que la persona declara cuentas, efectivo, deudas o participaciones, pero deja esas secciones sin montos. De 2.135 declaraciones relevadas, 2.130 declaran cuentas bancarias y 1.181 dinero en efectivo.
  pedido: Los montos declarados en las secciones de productos bancarios, tenencia de dinero en efectivo, créditos y deudas, títulos y acciones, participación en sociedades e ingresos de las declaraciones juradas vigentes de gobernador, vicegobernadora, ministros, secretarios, subsecretarios, legisladores e intendentes, y de las presentadas al asumir el cargo.
  pedidos: []

- id: retratos-autoridades
  titulo: Quiénes son, con nombre y cara, las autoridades de cada organismo
  categoria: estructura
  que_es: La nómina de autoridades de cada organismo y municipio (titular, subsecretarios y directores) con su retrato oficial y su cargo.
  por_que_importa: Para reconocer a quien decide hay que saber quién es. Hoy muchos organismos no publican quién los conduce, o lo publican sin foto.
  organismo: Gobernación de Mendoza
  marco_legal: Ley 9070 de Acceso a la Información Pública
  estado: parcial
  donde_buscamos:
    - https://www.mendoza.gov.ar/
    - https://www.atm.mendoza.gov.ar/
    - https://www.aysam.com.ar/
    - https://www.osep.mendoza.gov.ar/
    - https://www.jus.mendoza.gov.ar/
  detalle_estado: Al 12/10/2026 no encontramos retrato oficial de 23 de los 37 titulares de organismos que relevamos (entre ellos ATM, OSEP, AYSAM, EMESA, Tesorería, IPV e ISCAMEN) ni de los intendentes de Tupungato, San Carlos y La Paz.
  pedido: La nómina vigente de autoridades de cada ministerio, organismo descentralizado y empresa del Estado provincial (titular, subsecretarios y directores), con su cargo, fecha de designación y retrato oficial.
  pedidos: []
