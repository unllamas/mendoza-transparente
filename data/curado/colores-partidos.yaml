# Color oficial de cada fuerza política, para el mapa de resultados de votacion.mendoza-transparente.com.
#
# Criterios (docs/procesos/metodologia.md, «Resultados electorales y auditoría»; docs/procesos/diseno.md):
# - El color sale de una fuente oficial: la boleta que publica el Estado (provincia o Nación) o el logo en el sitio
#   oficial de la fuerza. Nunca de un diario, de Wikipedia ni «por parecido».
# - Va por nombre tal como lo escriben las fuentes de resultados (mayúsculas, tildes y signos no importan), no por
#   partido: un frente no hereda el color de los partidos que lo forman, y el mismo nombre puede cambiar de color
#   de un año a otro (`anios`).
# - Lo que no figura acá se pinta con el azul o el naranja de la paleta y la leyenda dice «sin color oficial».
#
# Campos:
#   nombres  las formas en que las fuentes de resultados escriben esa fuerza
#   anios    opcional: solo esas elecciones (año). Sin `anios`, vale para todas
#   color    #rrggbb
#   fuente   URL oficial de donde salió (la boleta o el logo)
#   parte    qué parte del logo o de la boleta se midió
#   nota     opcional: aproximaciones o decisiones

- nombres: [Cambia Mendoza, Frente Cambia Mendoza, Alianza Cambia Mendoza]
  color: "#951b81"
  fuente: https://cambiamendoza.com/wp-content/uploads/2023/08/cropped-Cambia-Mendoza-marca-transparente.png
  parte: fondo del escudo del logo; es también el color primario de cambiamendoza.com y coincide con la columna de la boleta 2023

