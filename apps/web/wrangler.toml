# Cloudflare Pages: sitio estático (dist) + funciones en functions/ (API de participación).
# Despliegue y configuración: docs/procesos/web.md#publicar y docs/procesos/participacion.md.
name = "mendoza-transparente"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "mendoza-transparente"
# Base creada el 12/10/2026 (no es secreto: identifica la base, no da acceso).
database_id = "2ad5ebf5-df14-4843-b453-c9e8cb436ed5"
# Las migraciones viven en el paquete compartido con el panel.
migrations_dir = "../../packages/participation/migrations"

# Con wrangler.toml, Pages toma las variables de acá (no del panel). Los secretos (TURNSTILE_SECRET, IP_SALT)
# siguen en el panel. Las variables públicas del sitio están en .env.production.
[vars]
BUN_VERSION = "1.4.2"
# La instalación la hace el build command desde la raíz del monorepo; la automática usaría npm desde apps/web
# y falla con los workspaces de Bun.
SKIP_DEPENDENCY_INSTALL = "1"
# Asistente de la guía de trámites (docs/procesos/asistente.md): las claves y, si se quiere cambiar, el modelo y
# el orden de los proveedores son secretos del panel (`bun run asistente:claves`). No van acá: con este archivo,
# Pages ignora las variables comunes del panel, y un secreto con el mismo nombre que una variable choca.
