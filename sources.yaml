# Catálogo de fuentes. El `id` es el nombre de la carpeta en data/raw/<id>/.
# dificultad: facil | media | dificil   ·   estado: pendiente | activo | roto
# El detalle de cada fuente está en docs/relevamiento-fuentes.md.

- id: hacienda-deuda-stock
  nombre: Deuda pública provincial, stock vigente y tableros trimestrales
  descripcion: "Cuánto debe la Provincia, a quién y en qué moneda, deuda por deuda y trimestre a trimestre."
  organismo: Ministerio de Hacienda y Finanzas de Mendoza
  url: https://sitios.mendoza.gob.ar/haciendayfinanzas/stock-vigente/
  formato: xlsx
  frecuencia: trimestral
  dificultad: facil
  estado: activo

- id: hacienda-participacion-municipal
  nombre: Coparticipación de la provincia a los municipios
  descripcion: "Cuánta plata de coparticipación le gira la Provincia a cada municipio de Mendoza, mes a mes y año a año desde 1997."
  organismo: Ministerio de Hacienda y Finanzas de Mendoza
  url: https://sitios.mendoza.gob.ar/haciendayfinanzas/participacion-municipal/
  formato: xls
  frecuencia: mensual
  dificultad: facil
  estado: activo

- id: atm-recaudacion
  nombre: Recaudación mensual por impuesto provincial
  descripcion: "Cuánto recauda la provincia cada mes por Ingresos Brutos, Sellos, Automotor e Inmobiliario, desde el año 2000."
  organismo: Administración Tributaria Mendoza (ATM)
  url: https://atm.mendoza.gov.ar/portalatm/zoneBottom/datosInteres/recaudacion/recaudacion.jsp
  formato: html
  frecuencia: mensual
  dificultad: facil
  estado: activo

- id: tributos
  nombre: Impuestos y tasas que fijan la Provincia y los municipios
  descripcion: "Cuánto cobra cada nivel del Estado: la Ley Impositiva de la Provincia y las ordenanzas tarifarias de los municipios, con el derecho de comercio por rubro. Hoy, las tarifarias 2026 de los municipios relevados: seis con el anexo leído entero y el resto con los rubros más pedidos, cargados a mano porque el anexo está escaneado."
  organismo: Boletín Oficial de Mendoza (Legislatura y concejos deliberantes)
  url: https://boe.mendoza.gov.ar/
  formato: pdf
  frecuencia: anual
  dificultad: media
  estado: activo

- id: universidades-estadisticas
  nombre: Anuario de Estadísticas Universitarias (UNCuyo y UTN)
  descripcion: "Estudiantes, egresados, docentes, no docentes y presupuesto de la UNCuyo y la UTN, año a año. La UTN figura como una sola universidad para todo el país."
  organismo: Subsecretaría de Políticas Universitarias, Ministerio de Capital Humano
  url: https://www.argentina.gob.ar/educacion/universidades/informacion/publicaciones/anuarios
  formato: xlsx
  frecuencia: anual
  dificultad: media
  estado: activo

- id: universidades-presupuesto
  nombre: Transferencias de Nación a la UNCuyo y la UTN
  descripcion: "Cuánta plata del Tesoro nacional se presupuestó, devengó y pagó cada año para la UNCuyo y la UTN, por programa y actividad, desde 1996. La UTN figura como una sola universidad para todo el país."
  organismo: Ministerio de Economía de la Nación (Presupuesto Abierto)
  url: https://www.presupuestoabierto.gob.ar/sici/datos-abiertos
  formato: zip, csv
  frecuencia: mensual
  dificultad: facil
  estado: activo

- id: dnap-ron
  nombre: Recursos de origen nacional (transferencias automáticas de Nación a provincias)
  descripcion: "Cuánto dinero le transfiere Nación a cada provincia por coparticipación y otros regímenes, mes a mes."
  organismo: Dirección Nacional de Asuntos Provinciales
  url: https://www.argentina.gob.ar/economia/sechacienda/asuntosprovinciales/ron
  formato: xls, csv
  frecuencia: diaria
  dificultad: facil
  estado: activo

- id: boletin-oficial
  nombre: Boletín Oficial de Mendoza (índice y texto completo de normas)
  descripcion: "Qué decretos, resoluciones y leyes publica el Gobierno de Mendoza, con su texto completo."
  organismo: Gobierno de Mendoza
  url: https://portalgateway.mendoza.gov.ar/api/boe/
  formato: api (html en json)
  frecuencia: diaria
  dificultad: facil
  estado: activo

- id: designaciones
  nombre: Designaciones, renuncias y otros actos de personal
  descripcion: "A quién designó, aceptó la renuncia o dio de baja el Gobierno de Mendoza, y en qué cargo, según los decretos y resoluciones del Boletín Oficial. Solo nombre y cargo: nunca DNI ni CUIL."
  organismo: Gobierno de Mendoza (Boletín Oficial)
  url: https://portalgateway.mendoza.gov.ar/api/boe/
  formato: derivada de boletin-oficial (texto de las normas)
  frecuencia: diaria
  dificultad: media
  estado: activo

- id: etica-publica
  nombre: Declaraciones juradas patrimoniales y registro de sanciones
  descripcion: "Qué bienes declaran los funcionarios provinciales (inmuebles y vehículos, por su valor fiscal) y quiénes fueron sumariados o sancionados."
  organismo: Oficina de Investigaciones Administrativas y Ética Pública
  url: https://eticapublica.mendoza.gov.ar/declaraciones
  formato: api json
  frecuencia: continua
  dificultad: facil
  estado: activo

- id: compras-ocds
  nombre: Contrataciones abiertas de COMPR.AR Mendoza (OCDS)
  descripcion: "Qué compra el Estado provincial, a qué proveedores y por cuánta plata."
  organismo: Dirección General de Contrataciones Públicas
  url: https://datosabiertos-compras.mendoza.gov.ar/datasets/
  formato: json ocds
  frecuencia: irregular (último corte 04/01/2026)
  dificultad: facil
  estado: activo

- id: energia-regalias
  nombre: Regalías de petróleo y gas por provincia
  descripcion: "Cuánto cobran Mendoza y las demás provincias por regalías de petróleo y gas."
  organismo: Secretaría de Energía de la Nación
  url: http://datos.energia.gob.ar/dataset/regalias-de-petroleo-crudo-gas-natural-glp-gasolina-y-condensado
  formato: zip, csv
  frecuencia: mensual
  dificultad: facil
  estado: activo

- id: deie-ipc
  nombre: IPC Gran Mendoza y canasta básica
  descripcion: "Cuánto suben los precios en el Gran Mendoza y cuánto cuesta la canasta básica."
  organismo: DEIE Mendoza
  url: https://sitios.mendoza.gob.ar/deie/category/economia/precios-e-indices/ipc/feed/
  formato: rss, pdf
  frecuencia: mensual
  dificultad: facil
  estado: activo

- id: dnap-aif
  nombre: Ejecución presupuestaria de las 24 provincias (esquema ahorro-inversión-financiamiento)
  descripcion: "En qué gastan y de dónde sacan la plata las 24 provincias, y cómo les cierra el resultado."
  organismo: Dirección Nacional de Asuntos Provinciales
  url: https://www.argentina.gob.ar/economia/sechacienda/coordinacion-fiscal-provincial/ejecucion-presupuestaria-provincial/ejecuciones
  formato: xlsx
  frecuencia: trimestral
  dificultad: facil
  estado: activo

- id: dnap-deuda
  nombre: Deuda pública de las 24 provincias
  descripcion: "Cuánto debe cada provincia y a qué tipo de acreedor, para comparar a Mendoza con el resto."
  organismo: Dirección Nacional de Asuntos Provinciales
  url: https://www.argentina.gob.ar/economia/sechacienda/coordinacion-fiscal-provincial/deuda-publica-provincial/evolucion-de-stock
  formato: xlsx
  frecuencia: trimestral
  dificultad: facil
  estado: activo

- id: dnap-ocupacion
  nombre: Empleo público y salarios de las 24 provincias
  descripcion: "Cuántos empleados públicos tiene cada provincia y cuánto gasta en sueldos."
  organismo: Dirección Nacional de Asuntos Provinciales
  url: https://www.argentina.gob.ar/economia/sechacienda/coordinacion-fiscal-provincial/ejecucion-presupuestaria-provincial/ocupacion-y
  formato: xlsx
  frecuencia: anual
  dificultad: facil
  estado: activo

- id: poblacion
  nombre: Población por departamento y por provincia (censos y proyecciones)
  descripcion: "Cuántos habitantes tiene cada departamento de Mendoza y cada provincia, para comparar por habitante."
  organismo: INDEC
  url: https://censo.gob.ar/
  formato: xlsx, pdf
  frecuencia: anual
  dificultad: facil
  estado: activo

- id: indices
  nombre: Inflación (IPC nacional y Cuyo, empalmado desde 1997) y tipo de cambio oficial
  descripcion: "Cómo subieron los precios y el dólar desde 1997, para pasar cualquier monto a pesos de hoy o a dólares."
  organismo: INDEC y Banco Central
  url: https://www.indec.gob.ar/indec/web/Nivel4-Tema-3-5-31
  formato: csv, xls, api
  frecuencia: mensual
  dificultad: facil
  estado: activo

- id: geo
  nombre: Límites de los departamentos de Mendoza
  organismo: Instituto Geográfico Nacional
  url: https://www.ign.gob.ar/
  descripcion: El mapa oficial de los 18 departamentos, que usamos para mostrar los datos de cada municipio.
  formato: geojson (wfs)
  frecuencia: eventual
  dificultad: facil
  estado: activo

- id: legislatura
  nombre: Legisladores provinciales (diputados y senadores) y sus viáticos
  organismo: Cámara de Diputados y Cámara de Senadores de Mendoza
  url: https://www.hcdmza.gob.ar/site/
  descripcion: Quiénes son los 48 diputados y 38 senadores provinciales, a qué bloque pertenecen, por qué sección fueron electos y hasta cuándo dura su mandato.
  formato: html, api wordpress, pdf
  frecuencia: eventual
  dificultad: media
  estado: activo

- id: proveedores
  nombre: Datos de las empresas proveedoras del Estado
  organismo: Ministerio de Justicia de la Nación (Registro Nacional de Sociedades, con datos de ARCA)
  url: https://datos.jus.gob.ar/dataset/registro-nacional-de-sociedades
