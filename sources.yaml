  formato: csv (zip)
  frecuencia: mensual
  dificultad: media
  estado: activo

- id: autoridades
  nombre: Gobierno provincial, intendentes y legisladores nacionales por Mendoza
  organismo: Gobierno de Mendoza, Junta Electoral, Cámara de Diputados y Senado de la Nación
  url: https://www.mendoza.gob.ar/
  descripcion: Quiénes integran el gabinete provincial, quién gobierna cada municipio y quiénes representan a Mendoza en el Congreso, con su partido y mandato.
  formato: html, pdf, csv
  frecuencia: eventual
  dificultad: media
  estado: activo

- id: fotos
  nombre: Fotos oficiales de funcionarios
  organismo: Legislatura, Congreso de la Nación, Gobierno de Mendoza y municipios
  url: https://www.hcdmza.gob.ar/site/
  descripcion: Retratos publicados por cada organismo, para reconocer a quienes nos representan.
  formato: jpg
  frecuencia: eventual
  dificultad: media
  estado: activo

- id: lrf-personal
  nombre: Personal y costo por organismo (Ley de Responsabilidad Fiscal)
  organismo: Ministerio de Hacienda y Finanzas de Mendoza
  url: https://sitios.mendoza.gob.ar/haciendayfinanzas/ley-de-responsabilidad-fiscal/
  descripcion: "Cuántos cargos de planta permanente, planta temporaria y contratos de locación tiene cada organismo de la Provincia y cuánto se liquidó, trimestre a trimestre desde 2018."
  formato: pdf (zip)
  frecuencia: trimestral
  dificultad: media
  estado: activo

- id: presupuesto-planta
  nombre: Cargos de la planta del Estado en la Ley de Presupuesto
  organismo: Ministerio de Hacienda y Finanzas de Mendoza
  url: https://sitios.mendoza.gob.ar/haciendayfinanzas/ley-de-presupuesto/
  descripcion: "Cuántos cargos ocupados (permanentes y temporarios) y cuántas horas cátedra fija la Ley de Presupuesto para cada organismo, por escalafón y clase, y cuántos cargos están retenidos o vacantes; de 2020 al proyecto 2027."
  formato: pdf
  frecuencia: anual
  dificultad: dificil
  estado: activo

- id: municipios-personal
  nombre: Personal de los municipios (Ley de Responsabilidad Fiscal)
  organismo: Municipios de Mendoza
  url: https://www.tribunaldecuentas.mendoza.gov.ar/ley-de-resp-fiscal
  descripcion: "Cuántos cargos de planta permanente, planta temporaria y contratos de locación tiene cada municipio y cuánto se liquidó, trimestre a trimestre, según el Anexo 19 que cada uno publica en su sitio. Godoy Cruz y Las Heras no lo publican de forma que se pueda archivar. La Ciudad de Mendoza suma una serie mensual."
  formato: pdf (zip, planillas)
  frecuencia: trimestral
  dificultad: dificil
  estado: activo

- id: municipios-lrf
  nombre: Presupuesto y gasto de los municipios (Ley de Responsabilidad Fiscal)
  organismo: Municipios de Mendoza
  url: https://www.tribunaldecuentas.mendoza.gov.ar/ley-de-resp-fiscal
  descripcion: "Cuánto aprobó cada municipio en su presupuesto, cuánto modificó y cuánto gastó y pagó, partida por partida y trimestre a trimestre, según el Anexo 2 que cada uno publica en su sitio; lo calculado e ingresado de cada recurso (Anexo 3) y la deuda préstamo por préstamo (Anexo 5). También archiva los anexos 1, 2 bis y 4, que todavía no se interpretan. Desde 2023; se van sumando municipios (cobertura en documentos.csv)."
  formato: pdf (planillas)
  frecuencia: trimestral
  dificultad: dificil
  estado: activo

- id: junta-electoral
  nombre: Cargos electos según las actas de proclamación de la Junta Electoral
  organismo: H. Junta Electoral de la Provincia de Mendoza (Poder Judicial)
  url: https://jusmendoza.gob.ar/actas-de-proclamacion/
  descripcion: "Quién fue proclamado gobernador, vicegobernador, senador o diputado provincial, intendente y concejal, y por qué partido, frente o alianza, en las elecciones de 2015, 2017, 2019, 2021 y 2023, según cada acta de proclamación. No dice quién ejerció el cargo (licencias, renuncias, suplentes) ni el mandato. Son escaneos con texto por OCR; las letras corregidas se marcan en el CSV. La página también publica actas de 1983 a 2014, todavía sin procesar."
  formato: pdf (escaneado con texto)
  frecuencia: cada elección (cada dos años)
  dificultad: media
  estado: activo

- id: elecciones-datos-abiertos
  nombre: Resultados electorales provinciales por mesa (datos abiertos)
  organismo: Gobierno de Mendoza (portal de datos abiertos)
  url: https://datosabiertos.mendoza.gov.ar/dataset/?q=elecciones
  descripcion: "Votos por lista, en blanco, nulos, recurridos e impugnados, mesa por mesa, de las generales de 2015 (definitivo), las PASO de concejales de 2017, las PASO de 2019 (provisorio y definitivo), las municipales de septiembre de 2019 y las generales de 2019 (provisorio). Totales por departamento, sección y provincia en resultados.csv; el detalle por mesa, comprimido, en mesas.csv.gz. Las legislativas de octubre de 2017 traen solo códigos sin leyenda y no se procesan."
  formato: zip con xls y csv
  frecuencia: cada elección (el portal no se actualiza desde 2019)
  dificultad: media
  estado: activo

- id: resultados-provisorios
  nombre: Resultados provisorios de las elecciones provinciales
  organismo: Gobierno de Mendoza (Dirección General de Informática y Comunicaciones)
  url: https://resultados.mendoza.gov.ar/
  descripcion: "El conteo provisorio de la noche de cada elección, tal como lo publica el sitio oficial de resultados: gobernador por provincia, senadores y diputados por sección, intendente, concejales y convencionales por departamento. Elecciones de 2019, 2023, 2025 y 2026 (el sitio no tiene 2021). No trae circuitos ni mesas."
  formato: html
  frecuencia: cada elección
  dificultad: media
  estado: activo

- id: escrutinios-definitivos
  nombre: Escrutinios definitivos de la Junta Electoral
  organismo: H. Junta Electoral de la Provincia de Mendoza (Poder Judicial)
  url: https://jusmendoza.gob.ar/escrutinios-definitivos-elecciones-generales-de-mendoza/
  descripcion: "El resultado oficial de cada cargo por departamento, sección y provincia, según los escrutinios definitivos de la Junta Electoral: PASO y generales de 2023, municipales de abril y septiembre de 2023 y concejales de febrero de 2026. Son PDF escaneados con texto (OCR): cada corrección de lectura está en el código con su motivo. El de 2025 no se puede leer (páginas en imagen)."
  formato: pdf (escaneado con texto)
  frecuencia: cada elección
  dificultad: alta
  estado: activo
