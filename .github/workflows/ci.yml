# Comprueba en cada push y pull request que el código compila y que la web se genera.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Formato y lint (Biome)
        run: bunx biome ci .
      - name: Reglas de arquitectura (dependency-cruiser)
        run: bun run lint:arch
      - name: Tipos
        run: bunx turbo run typecheck
      - name: Pruebas
        run: bun test
      - name: Web
        working-directory: apps/web
        run: |
          bun run data
          bunx vite build
          bun scripts/seo.ts
      - name: Verificación visual (scroll horizontal, consola, menú, 44 px, alertas)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          MT_NO_DATA_WATCH: "1"
        run: bun scripts/verificar-web.ts
