# Actualización automática de los datos.
#
# - Semanal (lunes): Boletín Oficial (últimos 10 días, para solaparse con la semana anterior si una
#   corrida falló), compras, transferencias de Nación (DNAP), Ética Pública, índices e IPC.
# - Mensual (día 3): Hacienda, energía, población, Legislatura, autoridades y proveedores.
#
# El Boletín Oficial no responde a la red de GitHub y el Senado de Mendoza solo responde a IPs de
# Argentina. Esos pedidos salen por un proxy con IP argentina si existe el secreto PROXY_AR
# (Settings → Secrets and variables → Actions). Sin el secreto, el Boletín se saltea sin abrir issues
# y de la Legislatura se actualiza Diputados (el Senado conserva sus datos anteriores).
#
# Cada fuente corre en su propio job. Al final, un único commit con todo lo nuevo, después de
# comprobar que la web compila. Si una fuente falla se abre un issue «Scraper roto: <fuente>»,
# que se cierra solo cuando vuelve a funcionar. También se puede correr a mano desde Actions.
#
# Las fotos de funcionarios no se actualizan acá: usan `sips` (macOS) y cambian poco.

name: Actualizar datos

on:
  schedule:
    - cron: "0 11 * * 1" # lunes, 08:00 en Mendoza
    - cron: "0 12 3 * *" # día 3 de cada mes, 09:00 en Mendoza
  workflow_dispatch:
    inputs:
      fuentes:
        description: "Fuentes separadas por coma (por ejemplo: boletin-oficial,compras-ocds). Vacío = todas."
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

env:
  SEMANAL: "boletin-oficial,compras-ocds,dnap,etica-publica,indices,deie-ipc"
  MENSUAL: "hacienda-deuda-stock,hacienda-participacion-municipal,energia-regalias,poblacion,legislatura,autoridades,proveedores,lrf-personal,presupuesto-planta,municipios-personal"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      fuentes: ${{ steps.plan.outputs.fuentes }}
    steps:
      - id: plan
        env:
          ENTRADA: ${{ inputs.fuentes }}
          CRON: ${{ github.event.schedule }}
        run: |
          case "$CRON" in
            "0 11 * * 1") F="$SEMANAL" ;;
            "0 12 3 * *") F="$MENSUAL" ;;
            *) F="${ENTRADA:-$SEMANAL,$MENSUAL}" ;;
          esac
          echo "Fuentes: $F"
          echo "fuentes=$(echo "$F" | tr -d ' ' | jq -R -c 'split(",") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  frescura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controlar que el Boletín Oficial no quede viejo
        env:
          GH_TOKEN: ${{ github.token }}
          PROXY_AR: ${{ secrets.PROXY_AR }}
        run: |
          if [ -z "$PROXY_AR" ]; then echo "Sin PROXY_AR: el Boletín Oficial no se actualiza automáticamente todavía."; exit 0; fi
          gh label create datos-viejos --color FBCA04 --description "Una fuente no se actualiza hace demasiado" --force || true
          ultima=$(tail -1 data/raw/boletin-oficial/manifest.jsonl | jq -r .fetched_at | cut -c1-10)
          dias=$(( ( $(date -u +%s) - $(date -u -d "$ultima" +%s) ) / 86400 ))
          titulo="Datos sin actualizar: boletin-oficial"
          n=$(gh issue list --state open --label datos-viejos --json number,title -q ".[] | select(.title == \"$titulo\") | .number" | head -1)
          echo "Boletín Oficial: última descarga $ultima ($dias días)"
          if (( dias > 10 )); then
            [ -n "$n" ] || gh issue create --label datos-viejos --title "$titulo" --body "La última descarga del Boletín Oficial es del $ultima ($dias días). Revisá el registro de «Actualizar datos» y que el proxy (secreto PROXY_AR) siga activo y con saldo."
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Actualizado: última descarga $ultima."
          fi

  scrape:
    needs: plan
    if: ${{ needs.plan.outputs.fuentes != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        fuente: ${{ fromJson(needs.plan.outputs.fuentes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile

      - name: Correr scraper
        env:
          FUENTE: ${{ matrix.fuente }}
          PROXY_AR: ${{ secrets.PROXY_AR }}
        run: |
          if [ "$FUENTE" = "boletin-oficial" ] && [ -z "$PROXY_AR" ]; then
            echo "::notice title=Boletín Oficial::Se saltea: el Boletín no responde a GitHub y falta el secreto PROXY_AR (proxy con IP argentina)."
            exit 0
          fi
          case "$FUENTE" in
            boletin-oficial) ARGS="--desde $(date -u -d '10 days ago' +%F) --hasta $(date -u +%F)" ;;
            dnap) ARGS="--refresh" ;;
            etica-publica) ARGS="--refresh" ;;
            *) ARGS="" ;;
          esac
          bun run scrape "$FUENTE" $ARGS

      - name: Empaquetar cambios
        id: cambios
        env:
          FUENTE: ${{ matrix.fuente }}
        run: |
          git add -A data
          if git diff --cached --quiet; then
            echo "Sin cambios en $FUENTE"
            echo "hay=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --name-only -z | tar --null -czf "/tmp/$FUENTE.tgz" -T -
            git diff --cached --stat | tail -1
            echo "hay=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cambios.outputs.hay == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: datos-${{ matrix.fuente }}
          path: /tmp/${{ matrix.fuente }}.tgz
          retention-days: 3

      - name: Avisar falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FUENTE: ${{ matrix.fuente }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create scraper-roto --color B60205 --description "Una fuente dejó de actualizarse" --force || true
          TITULO="Scraper roto: $FUENTE"
          N=$(gh issue list --state open --label scraper-roto --json number,title -q ".[] | select(.title == \"$TITULO\") | .number" | head -1)
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "Volvió a fallar el $(date -u +%F): $RUN"
          else
            gh issue create --label scraper-roto --title "$TITULO" --body "La actualización automática de **$FUENTE** falló el $(date -u +%F).

          Registro: $RUN

          Causas habituales: el organismo cambió la página o el formato del archivo, el sitio estuvo caído o limitó los pedidos. Si se repite, hay que ajustar \`packages/scrapers/src/sources/$FUENTE.ts\`. Este issue se cierra solo cuando la fuente vuelve a funcionar."
          fi

      - name: Cerrar aviso si volvió a funcionar
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          FUENTE: ${{ matrix.fuente }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITULO="Scraper roto: $FUENTE"
          N=$(gh issue list --state open --label scraper-roto --json number,title -q ".[] | select(.title == \"$TITULO\") | .number" 2>/dev/null | head -1)
          if [ -n "$N" ]; then gh issue close "$N" --comment "Volvió a funcionar el $(date -u +%F): $RUN"; fi

  commit:
    needs: [plan, scrape]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/download-artifact@v4
        with:
          pattern: datos-*
          path: /tmp/datos
          merge-multiple: true

      - name: Aplicar cambios
        id: aplicar
        run: |
          shopt -s nullglob
          PAQUETES=(/tmp/datos/*.tgz)
          if [ ${#PAQUETES[@]} -eq 0 ]; then echo "No hay datos nuevos."; echo "hay=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          for f in "${PAQUETES[@]}"; do echo "Aplicando $(basename "$f")"; tar -xzf "$f"; done
          echo "fuentes=$(for f in "${PAQUETES[@]}"; do basename "$f" .tgz; done | paste -sd ', ' -)" >> "$GITHUB_OUTPUT"
          echo "hay=true" >> "$GITHUB_OUTPUT"

      - name: Extraer designaciones de las normas nuevas del Boletín
        # Fuente derivada: lee data/processed/boletin-oficial (no descarga nada), por eso corre después de aplicar los cambios.
        if: steps.aplicar.outputs.hay == 'true' && contains(steps.aplicar.outputs.fuentes, 'boletin-oficial')
        run: |
          bun install --frozen-lockfile
          bun run scrape designaciones

      - name: Resumir leyes nuevas en lenguaje simple
        # Opcional: sin el secreto ANTHROPIC_API_KEY las leyes se muestran sin resumen. Si falla, no frena la publicación.
        if: steps.aplicar.outputs.hay == 'true' && contains(steps.aplicar.outputs.fuentes, 'boletin-oficial')
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bun install --frozen-lockfile
          (cd apps/web && bun run data)
          bun apps/web/scripts/resumir-leyes.ts

      - name: Comprobar que la web compila con los datos nuevos
        if: steps.aplicar.outputs.hay == 'true'
        run: |
          bun install --frozen-lockfile
          cd apps/web
          bun run data
          bunx tsc --noEmit
          bunx vite build
          bun scripts/seo.ts

      - name: Commit y push
        if: steps.aplicar.outputs.hay == 'true'
        env:
          FUENTES: ${{ steps.aplicar.outputs.fuentes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "Datos: actualización automática ($FUENTES)" -m "$(date -u +%F)"
          for intento in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((intento * 10))
          done
          exit 1

      - name: Avisar si la web no compila
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create scraper-roto --color B60205 --description "Una fuente dejó de actualizarse" --force || true
          gh issue create --label scraper-roto --title "Actualización de datos sin publicar ($(date -u +%F))" --body "Los scrapers trajeron datos nuevos pero la web no compiló con ellos, así que no se publicaron. Registro: $RUN"
