# Valida que el título del PR siga Conventional Commits: con squash, el título es el commit que queda en dev.
# Ver docs/procesos/ramas-y-releases.md#mensajes-de-commit-y-títulos-de-pr.
name: Título del PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Para el PR de datos que abre el bot (ver ci.yml): el título llega como entrada.
  workflow_dispatch:
    inputs:
      titulo:
        description: "Título del PR"
        required: true

jobs:
  titulo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Conventional Commits (commitlint)
        env:
          TITLE: ${{ github.event.pull_request.title || inputs.titulo }}
        run: printf '%s\n' "$TITLE" | bunx commitlint --verbose
