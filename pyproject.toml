[project]
name = "mendoza-transparente"
version = "0.1.0"
description = "Datos públicos de la provincia de Mendoza, recopilados, normalizados y curados."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
]

[tool.setuptools]
packages = ["mt"]
